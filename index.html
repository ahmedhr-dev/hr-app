<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR System Pro</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}

.header{
 display:flex;
 justify-content:space-between;
 padding:15px;
 background:#020617;
}

.page{padding:15px}

.card{
 background:#1e293b;
 padding:15px;
 margin:10px 0;
 border-radius:15px;
}

button{
 background:#facc15;
 border:none;
 padding:10px;
 border-radius:10px;
 margin-top:10px;
 width:100%;
 cursor:pointer;
}

input{
 width:100%;
 padding:10px;
 margin:5px 0;
 border-radius:10px;
 border:none;
}
</style>

</head>

<body>

<div id="app"></div>

<script>

let currentUser = JSON.parse(localStorage.getItem("user")) || null;
let page = "home";

// ================= USERS =================
function initUsers(){
 if(!localStorage.getItem("users")){
  let users = {
   "admin": {email:"admin",pass:"1234",role:"admin",name:"Admin"},
   "ahmed": {email:"ahmed",pass:"1234",role:"employee",name:"Ahmed"}
  };
  localStorage.setItem("users",JSON.stringify(users));
 }
}

// ================= LOGIN =================
function loginPage(){
 app.innerHTML=`
 <div class="page">
 <h2>تسجيل الدخول</h2>
 <input id="email" placeholder="username">
 <input id="pass" type="password">
 <button onclick="login()">دخول</button>
 </div>`;
}

function login(){
 let users = JSON.parse(localStorage.getItem("users"));
 let email = document.getElementById("email").value;
 let pass = document.getElementById("pass").value;

 if(users[email] && users[email].pass === pass){
  localStorage.setItem("user",JSON.stringify(users[email]));
  location.reload();
 }else{
  alert("بيانات غلط");
 }
}

// ================= MAIN =================
function render(){

 if(!currentUser){
  loginPage();
  return;
 }

 app.innerHTML=`
 <div class="header">
 <div>👤 ${currentUser.name}</div>
 <div onclick="logout()">🚪</div>
 </div>

 <div class="page">

 ${homePage()}

 </div>`;
}

// ================= HOME =================
function homePage(){
 return `
 <div class="card" onclick="go('employees')">👥 الموظفين</div>
 <div class="card" onclick="go('profile')">👤 حسابي</div>
 <div class="card" onclick="go('notifications')">🔔 الإشعارات</div>
 `;
}

// ================= NAV =================
function go(p){
 page = p;
 renderPage();
}

function renderPage(){

 if(page==="employees"){
  app.innerHTML=`
  <div class="header">
   <button onclick="render()">⬅</button>
   <div>الموظفين</div>
  </div>

  <div class="page">
   <div id="list"></div>
   ${currentUser.role==="admin" ? `<button onclick="addEmp()">➕ إضافة</button>` : ""}
  </div>
  `;
  loadEmp();
 }

 if(page==="profile"){
  app.innerHTML=`
  <div class="header">
   <button onclick="render()">⬅</button>
   <div>حسابي</div>
  </div>

  <div class="page">
   <div class="card">
    الاسم: ${currentUser.name}<br>
    الدور: ${currentUser.role}
   </div>
   <button onclick="logout()">تسجيل خروج</button>
  </div>
  `;
 }

 if(page==="notifications"){
  let noti = JSON.parse(localStorage.getItem("noti")||"[]");

  let html="";
  noti.forEach(n=>{
   html+=`<div class="card">${n}</div>`;
  });

  app.innerHTML=`
  <div class="header">
   <button onclick="render()">⬅</button>
   <div>الإشعارات</div>
  </div>

  <div class="page">
   ${html || "لا يوجد"}
  </div>
  `;
 }

}

// ================= EMP =================
function loadEmp(){
 let data = JSON.parse(localStorage.getItem("employees")||"{}");
 let html="";

 Object.keys(data).forEach(id=>{
  let e=data[id];

  html+=`
  <div class="card">
   ${e.name} - ${e.job}
   ${currentUser.role==="admin" ? `<button onclick="del('${id}')">🗑</button>` : ""}
  </div>`;
 });

 list.innerHTML=html||"لا يوجد";
}

function addEmp(){
 let n=prompt("اسم الموظف");
 let j=prompt("الوظيفة");

 let data = JSON.parse(localStorage.getItem("employees")||"{}");
 data[Date.now()]={name:n,job:j};

 localStorage.setItem("employees",JSON.stringify(data));

 addNoti("تم إضافة موظف: "+n);

 loadEmp();
}

function del(id){
 let data = JSON.parse(localStorage.getItem("employees")||"{}");
 delete data[id];

 localStorage.setItem("employees",JSON.stringify(data));

 addNoti("تم حذف موظف");

 loadEmp();
}

// ================= NOTI =================
function addNoti(msg){
 let n = JSON.parse(localStorage.getItem("noti")||"[]");
 n.unshift(msg);
 localStorage.setItem("noti",JSON.stringify(n));
}

// ================= LOGOUT =================
function logout(){
 localStorage.removeItem("user");
 location.reload();
}

// ================= START =================
initUsers();
render();

</script>

</body>
</html>
