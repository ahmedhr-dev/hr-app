<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HR Pro</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white}

.header{
 display:flex;justify-content:space-between;
 padding:15px;background:#020617
}

.page{padding:15px;padding-bottom:80px}

.card{
 background:#1e293b;
 margin:12px 0;
 padding:15px;
 border-radius:16px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 cursor:pointer;
}

.nav{
 position:fixed;bottom:0;width:100%;
 display:flex;justify-content:space-around;
 background:#020617;padding:10px
}

.nav button{
 background:none;border:none;color:white;font-size:20px
}

input{
 width:100%;padding:10px;margin:5px 0;
 border-radius:10px;border:none
}

button{
 width:100%;padding:10px;
 border:none;border-radius:10px;
 background:#facc15;margin-top:5px
}

.profile{text-align:center}
.profile img{
 width:90px;height:90px;
 border-radius:50%;margin:10px
}
</style>

</head>

<body>

<div id="app"></div>

<script>

// Firebase
firebase.initializeApp({
 apiKey:"AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
 authDomain:"hr-app-710f3.firebaseapp.com"
});

const auth=firebase.auth();
let user;

// بيانات محلية
let files=JSON.parse(localStorage.getItem("files")||"[]");
let notify=localStorage.getItem("notify")||"";
let profile=JSON.parse(localStorage.getItem("profile")||"{}");

// ================= LOGIN =================
function loginPage(){
 app.innerHTML=`
 <div class="page">
 <h2>تسجيل الدخول</h2>
 <input id="email" placeholder="Email">
 <input id="pass" type="password" placeholder="Password">
 <button onclick="login()">دخول</button>
 <button onclick="register()">إنشاء حساب</button>
 </div>`;
}

function login(){
 auth.signInWithEmailAndPassword(val("email"),val("pass"));
}

function register(){
 auth.createUserWithEmailAndPassword(val("email"),val("pass"));
}

// ================= HOME =================
function home(){
 app.innerHTML=`
 <div class="header">
 <div>👋 ${user.email}</div>
 <div onclick="profilePage()">👤</div>
 </div>

 <div class="page">

 ${notify?`<div style="background:green;padding:10px">${notify}</div>`:""}

 <div class="card" onclick="section('guide')">
 <span>دليل الموظف</span>
 <i class="fa-solid fa-book"></i>
 </div>

 <div class="card" onclick="section('policy')">
 <span>السياسات</span>
 <i class="fa-solid fa-file"></i>
 </div>

 <div class="card" onclick="section('faq')">
 <span>سؤال وجواب</span>
 <i class="fa-solid fa-comments"></i>
 </div>

 </div>

 <div class="nav">
 <button onclick="home()">🏠</button>
 <button onclick="profilePage()">👤</button>
 <button onclick="admin()">👑</button>
 </div>`;
}

// ================= SECTION =================
function section(type){
 let list=files.filter(f=>f.type==type);

 let html=`
 <div class="header">
 <div onclick="home()">⬅</div>
 <div>المحتوى</div>
 </div>

 <div class="page">`;

 list.forEach((f,i)=>{
  html+=`
  <div class="card">
  <div onclick="window.open('${f.link}')">${f.name}</div>
  <div>
  <button onclick="edit(${i})">✏</button>
  <button onclick="del(${i})">🗑</button>
  </div>
  </div>`;
 });

 html+=`</div>`;
 app.innerHTML=html;
}

// ================= ADMIN =================
function admin(){
 app.innerHTML=`
 <div class="header">
 <div onclick="home()">⬅</div>
 <div>لوحة التحكم</div>
 </div>

 <div class="page">

 <input id="name" placeholder="اسم">
 <input id="link" placeholder="رابط">
 <select id="type">
 <option value="guide">دليل</option>
 <option value="policy">سياسات</option>
 <option value="faq">أسئلة</option>
 </select>

 <button onclick="add()">إضافة</button>

 <hr>

 <input id="msg" placeholder="إشعار">
 <button onclick="send()">إرسال إشعار</button>

 </div>`;
}

// ================= ACTIONS =================
function add(){
 files.push({
  name:val("name"),
  link:val("link"),
  type:val("type")
 });

 localStorage.setItem("files",JSON.stringify(files));
 home();
}

function edit(i){
 let n=prompt("تعديل",files[i].name);
 if(n){files[i].name=n;save();}
}

function del(i){
 files.splice(i,1);
 save();
}

function save(){
 localStorage.setItem("files",JSON.stringify(files));
 home();
}

function send(){
 notify=val("msg");
 localStorage.setItem("notify",notify);
 home();
}

// ================= PROFILE =================
function profilePage(){
 app.innerHTML=`
 <div class="header">
 <div onclick="home()">⬅</div>
 <div>حسابي</div>
 </div>

 <div class="page profile">
 <img src="${profile.img||'https://i.imgur.com/6VBx3io.png'}">

 <input id="name" placeholder="اسم" value="${profile.name||''}">
 <input id="job" placeholder="وظيفة" value="${profile.job||''}">
 <input id="dept" placeholder="قسم" value="${profile.dept||''}">
 <input id="img" placeholder="صورة" value="${profile.img||''}">

 <button onclick="saveProfile()">حفظ</button>
 <button onclick="logout()">🚪 خروج</button>
 </div>`;
}

function saveProfile(){
 profile={
  name:val("name"),
  job:val("job"),
  dept:val("dept"),
  img:val("img")
 };

 localStorage.setItem("profile",JSON.stringify(profile));
 home();
}

// ================= HELP =================
function val(id){return document.getElementById(id).value}
function logout(){auth.signOut()}

// ================= AUTH =================
auth.onAuthStateChanged(u=>{
 if(u){user=u;home()}else{loginPage()}
});

</script>

</body>
</html>
