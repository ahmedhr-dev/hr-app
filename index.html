<!DOCTYPE html>

<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR App</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.header{display:flex;justify-content:space-between;padding:15px;background:#020617}
.page{padding:15px;padding-bottom:80px}
.card{background:#1e293b;margin:10px 0;padding:15px;border-radius:12px}
.nav{position:fixed;bottom:0;width:100%;display:flex;justify-content:space-around;background:#020617;padding:10px 0}
.nav button{background:none;border:none;color:white;font-size:18px}
button.main{width:100%;padding:12px;border:none;border-radius:10px;background:#facc15;margin-top:10px}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none}
</style>

</head>

<body>

<div id="app"></div>

<script>

// 🔥 Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
  authDomain: "hr-app-710f3.firebaseapp.com",
  projectId: "hr-app-710f3",
  storageBucket: "hr-app-710f3.firebasestorage.app",
  messagingSenderId: "324936659395",
  appId: "1:324936659395:web:bb5d491b52be3013c00d76"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const app = document.getElementById("app");
let currentUser = null;

/* LOGIN PAGE */
function loginPage(){
 app.innerHTML = `
 <div class="page">
 <h2>تسجيل الدخول</h2>
 <input id="email" placeholder="Email">
 <input id="pass" type="password" placeholder="Password">
 <button class="main" onclick="login()">دخول</button>
 <button class="main" onclick="register()">تسجيل حساب</button>
 </div>`;
}

/* REGISTER */
function register(){
 let email = document.getElementById("email").value;
 let pass = document.getElementById("pass").value;

 auth.createUserWithEmailAndPassword(email, pass)
 .then(()=>{
  alert("تم إنشاء الحساب");
 })
 .catch(e=>alert(e.message));
}

/* LOGIN */
function login(){
 let email = document.getElementById("email").value;
 let pass = document.getElementById("pass").value;

 auth.signInWithEmailAndPassword(email, pass)
 .catch(e=>alert(e.message));
}

/* HOME */
function homePage(user){
 app.innerHTML = `
 <div class="header">
 <div>👋 ${user.email}</div>
 <div onclick="logout()">🚪</div>
 </div>

 <div class="page">
 <div class="card">📘 دليل الموظف</div>
 <div class="card">📄 السياسات</div>
 <div class="card">❓ الأسئلة</div>
 </div>

 <div class="nav">
 <button onclick="homePage(currentUser)">🏠</button>
 <button onclick="profile()">👤</button>
 <button onclick="admin()">👑</button>
 </div>
 `;
}

/* PROFILE */
function profile(){
 app.innerHTML = `
 <div class="header">
 <div>👤 حسابي</div>
 <div onclick="logout()">🚪</div>
 </div>

 <div class="page">
 <div class="card">${currentUser.email}</div>
 </div>

 <div class="nav">
 <button onclick="homePage(currentUser)">🏠</button>
 <button onclick="profile()">👤</button>
 <button onclick="admin()">👑</button>
 </div>
 `;
}

/* ADMIN */
function admin(){
 app.innerHTML = `
 <div class="header">
 <div>👑 لوحة التحكم</div>
 <div onclick="logout()">🚪</div>
 </div>

 <div class="page">
 <input id="text" placeholder="اكتب محتوى">
 <button class="main" onclick="addData()">إضافة</button>
 <div id="data"></div>
 </div>

 <div class="nav">
 <button onclick="homePage(currentUser)">🏠</button>
 <button onclick="profile()">👤</button>
 <button onclick="admin()">👑</button>
 </div>
 `;

 loadData();
}

/* ADD DATA */
function addData(){
 let text = document.getElementById("text").value;

 db.collection("posts").add({text:text})
 .then(()=>loadData());
}

/* LOAD DATA */
function loadData(){
 let box = document.getElementById("data");
 box.innerHTML = "";

 db.collection("posts").get().then(snapshot=>{
  snapshot.forEach(doc=>{
   box.innerHTML += `<div class="card">${doc.data().text}</div>`;
  });
 });
}

/* LOGOUT */
function logout(){
 auth.signOut();
}

/* AUTH STATE */
auth.onAuthStateChanged(user=>{
 if(user){
  currentUser = user;
  homePage(user);
 }else{
  loginPage();
 }
});

</script>

</body>
</html>
