<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>HR System</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// 🔥 Firebase Config
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "YOUR_DB_URL",
    projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ==========================
// 🧠 البيانات
// ==========================
let users = [];
let currentUser = null;
let jobs = [];
let policies = [];

// ==========================
// ☁️ حفظ
// ==========================
async function saveAll() {
    await set(ref(db, "hr-data"), {
        users,
        jobs,
        policies
    });
    console.log("✅ Saved to Firebase");
}

// ==========================
// 🔄 مزامنة فورية
// ==========================
function startRealtimeSync() {
    onValue(ref(db, "hr-data"), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        users = data.users || [];
        jobs = data.jobs || [];
        policies = data.policies || [];

        if (currentUser) {
            const updated = users.find(u => u.email === currentUser.email);
            if (updated) currentUser = updated;
        }

        renderApp();
        console.log("🔄 Sync updated");
    });
}

// ==========================
// 🔐 تسجيل دخول
// ==========================
function login(email, password) {
    const user = users.find(u => u.email === email && u.password === password);
    if (user) {
        currentUser = user;
        renderApp();
    } else {
        alert("❌ بيانات غلط");
    }
}

// ==========================
// 📝 تسجيل
// ==========================
async function register(name, email, password) {
    if (users.find(u => u.email === email)) {
        alert("البريد موجود");
        return;
    }

    users.push({
        id: Date.now(),
        name,
        email,
        password,
        role: "employee"
    });

    await saveAll();
    alert("✅ تم التسجيل");
}

// ==========================
// 🎨 واجهة
// ==========================
function renderLogin() {
    document.body.innerHTML = `
        <h2>تسجيل الدخول</h2>
        <input id="email" placeholder="email"><br>
        <input id="pass" placeholder="password"><br>
        <button onclick="doLogin()">دخول</button>

        <h3>إنشاء حساب</h3>
        <input id="name"><br>
        <input id="email2"><br>
        <input id="pass2"><br>
        <button onclick="doRegister()">تسجيل</button>
    `;
}

function renderApp() {
    if (!currentUser) {
        renderLogin();
        return;
    }

    document.body.innerHTML = `
        <h2>مرحباً ${currentUser.name}</h2>

        <button onclick="addJob()">إضافة وظيفة</button>

        <h3>الوظائف</h3>
        ${jobs.map(j => `<div>${j.title}</div>`).join("")}

        <br>
        <button onclick="logout()">خروج</button>
    `;
}

// ==========================
// ⚙️ Actions
// ==========================
window.doLogin = function () {
    login(
        document.getElementById("email").value,
        document.getElementById("pass").value
    );
};

window.doRegister = function () {
    register(
        document.getElementById("name").value,
        document.getElementById("email2").value,
        document.getElementById("pass2").value
    );
};

window.addJob = async function () {
    const title = prompt("اسم الوظيفة");
    jobs.push({ id: Date.now(), title });
    await saveAll();
};

window.logout = function () {
    currentUser = null;
    renderApp();
};

// ==========================
// 🚀 تشغيل
// ==========================
startRealtimeSync();
renderApp();

</script>
</head>
<body></body>
</html>
