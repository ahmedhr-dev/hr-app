<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HR Pro System</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white}
.header{display:flex;justify-content:space-between;padding:15px;background:#020617}
.page{padding:15px;padding-bottom:80px}
.card{background:#1e293b;margin:10px 0;padding:15px;border-radius:14px;display:flex;justify-content:space-between;align-items:center}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:none}
button{width:100%;padding:10px;margin-top:5px;border:none;border-radius:10px;background:#facc15}
.nav{position:fixed;bottom:0;width:100%;display:flex;justify-content:space-around;background:#020617;padding:10px}
.avatar{width:45px;height:45px;border-radius:50%}
</style>

</head>

<body>
<div id="app"></div>

<script>

// 🔥 Firebase Config
firebase.initializeApp({
 apiKey:"AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
 authDomain:"hr-app-710f3.firebaseapp.com",
 databaseURL:"https://hr-app-710f3-default-rtdb.firebaseio.com"
});

const auth = firebase.auth();
const db = firebase.database();

let user;

// ================= LOGIN =================
function loginPage(){
 app.innerHTML=`
 <div class="page">
 <h2>تسجيل الدخول</h2>
 <input id="email" placeholder="Email">
 <input id="pass" type="password" placeholder="Password">
 <button onclick="login()">دخول</button>
 <button onclick="register()">إنشاء حساب</button>
 </div>`;
}

function login(){
 auth.signInWithEmailAndPassword(val("email"),val("pass"));
}

function register(){
 auth.createUserWithEmailAndPassword(val("email"),val("pass"));
}

// ================= HOME =================
function home(){
 app.innerHTML=`
 <div class="header">
 <div>👋 ${user.email}</div>
 <div onclick="profile()">👤</div>
 </div>

 <div class="page">

 <div class="card" onclick="orgPage()">
 <span>الهيكل التنظيمي</span>
 <i class="fa-solid fa-sitemap"></i>
 </div>

 <div class="card" onclick="admin()">
 <span>لوحة التحكم</span>
 <i class="fa-solid fa-crown"></i>
 </div>

 </div>

 <div class="nav">
 <button onclick="home()">🏠</button>
 <button onclick="profile()">👤</button>
 </div>`;
}

// ================= ORG =================
function orgPage(){
 db.ref("employees").on("value",snap=>{
  let data=snap.val()||{};
  let arr=Object.values(data);

  let html=`
  <div class="header">
  <div onclick="home()">⬅</div>
  <div>الهيكل</div>
  </div>
  <div class="page">`;

  arr.forEach(e=>{
   html+=`
   <div class="card">
    <div>
     <b>${e.name}</b><br>
     ${e.job}<br>
     مدير: ${e.manager}
    </div>
    <img class="avatar" src="${e.img||'https://i.imgur.com/6VBx3io.png'}">
   </div>`;
  });

  html+=`</div>`;
  app.innerHTML=html;
 });
}

// ================= ADMIN =================
function admin(){
 app.innerHTML=`
 <div class="header">
 <div onclick="home()">⬅</div>
 <div>لوحة التحكم</div>
 </div>

 <div class="page">

 <input id="name" placeholder="اسم">
 <input id="job" placeholder="وظيفة">
 <input id="manager" placeholder="مدير">
 <input id="img" placeholder="صورة">

 <button onclick="addEmployee()">إضافة موظف</button>

 </div>`;
}

function addEmployee(){
 let id = Date.now();

 db.ref("employees/"+id).set({
  name:val("name"),
  job:val("job"),
  manager:val("manager"),
  img:val("img")
 });

 db.ref("notify").set("تم إضافة موظف جديد");
 home();
}

// ================= PROFILE =================
function profile(){
 app.innerHTML=`
 <div class="header">
 <div onclick="home()">⬅</div>
 <div>حسابي</div>
 </div>

 <div class="page">
 <div class="card">${user.email}</div>
 <button onclick="logout()">🚪 خروج</button>
 </div>`;
}

// ================= HELP =================
function val(id){return document.getElementById(id).value}
function logout(){auth.signOut()}

// ================= AUTH =================
auth.onAuthStateChanged(u=>{
 if(u){user=u;home()}else{loginPage()}
});

</script>

</body>
</html>
