<!-- نسخة مختصرة احترافية - بداية النظام الحقيقي -->

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<div id="app"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
  authDomain: "hr-app-710f3.firebaseapp.com",
  projectId: "hr-app-710f3",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let userData = JSON.parse(localStorage.getItem("userData")||"{}");
let files = JSON.parse(localStorage.getItem("files")||"[]");
let notify = localStorage.getItem("notify")||"";

function loginPage(){
 app.innerHTML=`
 <h2>Login</h2>
 <input id="email" placeholder="Email">
 <input id="pass" placeholder="Password">
 <button onclick="login()">Login</button>
 <button onclick="register()">Register</button>
 <button onclick="resetPass()">Forgot Password</button>
 `;
}

function login(){
 auth.signInWithEmailAndPassword(val("email"),val("pass"));
}

function register(){
 auth.createUserWithEmailAndPassword(val("email"),val("pass"))
 .then(()=>{
  userData.email=val("email");
  save();
 });
}

function resetPass(){
 auth.sendPasswordResetEmail(val("email"));
 alert("تم إرسال رابط إعادة تعيين");
}

function home(){
 app.innerHTML=`
 <h3>${auth.currentUser.email}</h3>
 <div>${notify}</div>
 <button onclick="filesPage()">📂 الملفات</button>
 <button onclick="profile()">👤 حسابي</button>
 <button onclick="admin()">👑</button>
 `;
}

function filesPage(){
 let html="";
 files.forEach((f,i)=>{
  html+=`
  <div>
  ${f.name}
  <button onclick="edit(${i})">✏</button>
  <button onclick="del(${i})">🗑</button>
  </div>`;
 });
 html+=`<button onclick="home()">رجوع</button>`;
 app.innerHTML=html;
}

function admin(){
 app.innerHTML=`
 <input id="name" placeholder="اسم">
 <input id="link" placeholder="رابط">
 <button onclick="add()">إضافة</button>
 <button onclick="home()">رجوع</button>
 `;
}

function add(){
 let f={name:val("name"),link:val("link")};
 files.push(f);
 notify="📢 تم إضافة: "+f.name;
 save();
 home();
}

function edit(i){
 let n=prompt("تعديل الاسم",files[i].name);
 if(n){files[i].name=n;save();home();}
}

function del(i){
 files.splice(i,1);
 save();
 home();
}

function profile(){
 app.innerHTML=`
 <input id="name" placeholder="اسم" value="${userData.name||""}">
 <input id="job" placeholder="وظيفة" value="${userData.job||""}">
 <button onclick="saveProfile()">حفظ</button>
 `;
}

function saveProfile(){
 userData.name=val("name");
 userData.job=val("job");
 save();
 home();
}

function save(){
 localStorage.setItem("files",JSON.stringify(files));
 localStorage.setItem("userData",JSON.stringify(userData));
 localStorage.setItem("notify",notify);
}

function val(id){return document.getElementById(id).value}

auth.onAuthStateChanged(u=>{
 if(u){home()}else{loginPage()}
});
</script>
