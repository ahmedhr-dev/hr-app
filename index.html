<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HR System | نظام الموارد البشرية المتكامل</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #0a1a2f, #061220);
            direction: rtl;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Login Page */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(145deg, #0a1a2f, #061220);
        }
        .login-card {
            background: rgba(10, 26, 47, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 35px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .quran-quote {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 20px;
        }
        .quote-arabic { font-size: 18px; font-family: 'Amiri', serif; }
        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }
        .login-card h2 { text-align: center; font-size: 22px; color: #d4af37; }
        .login-card input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 30px;
            color: white;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            color: #0a1a2f;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
        .register-link { text-align: center; margin-top: 15px; font-size: 13px; }
        .register-link span { color: #d4af37; cursor: pointer; }
        .register-form { display: none; margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(212,175,55,0.2); }
        .register-form.show { display: block; }
        .avatar-preview {
            width: 80px;
            height: 80px;
            background: rgba(212,175,55,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            cursor: pointer;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: #0a1a2f;
            border-left: 1px solid rgba(212,175,55,0.2);
            z-index: 200;
            transition: all 0.4s;
            overflow-y: auto;
        }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid rgba(212,175,55,0.2); }
        .logo-area { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .company-logo {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo { font-size: 20px; font-weight: 800; color: #d4af37; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            margin: 6px 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            color: #a0aec0;
        }
        .nav-item:hover { background: rgba(212,175,55,0.15); color: #d4af37; }
        .nav-item.active { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; }
        .nav-item i { width: 24px; }

        .main-content { margin-right: 280px; min-height: 100vh; padding: 0 25px 25px 25px; }
        .top-bar {
            background: rgba(10, 26, 47, 0.95);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 99;
            margin-bottom: 20px;
            border-radius: 0 0 25px 25px;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .page-title { font-size: 24px; font-weight: 800; color: #d4af37; }
        .avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }

        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #0a1a2f; padding: 10px; justify-content: space-around; z-index: 150; border-top: 1px solid rgba(212,175,55,0.2); }
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #94a3b8; cursor: pointer; padding: 8px; }
        .bottom-nav-item.active { color: #d4af37; }

        .card { background: rgba(10, 26, 47, 0.9); border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(212,175,55,0.2); transition: all 0.3s; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: rgba(10, 26, 47, 0.9); border-radius: 20px; padding: 18px; text-align: center; }
        .stat-number { font-size: 32px; font-weight: 800; color: #d4af37; }

        /* ============ المساعد الذكي الجديد ============ */
        .assistant-wrapper {
            background: rgba(10, 26, 47, 0.9);
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .assistant-header {
            background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(10,26,47,0.9));
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .assistant-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
        }
        .assistant-icon i { font-size: 30px; color: #0a1a2f; }
        .assistant-header h3 { color: #d4af37; margin-bottom: 5px; }
        .assistant-header p { font-size: 12px; opacity: 0.7; }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
        }
        .question-btn {
            background: rgba(212,175,55,0.1);
            padding: 10px 15px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .question-btn:hover { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; }
        
        .chat-messages { height: 400px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .user-bubble {
            background: linear-gradient(135deg, #d4af37, #b8960c);
            color: #0a1a2f;
            padding: 12px 18px;
            border-radius: 25px 25px 8px 25px;
            align-self: flex-end;
            max-width: 85%;
            font-weight: 500;
        }
        .typing-indicator {
            background: rgba(212,175,55,0.1);
            padding: 12px 18px;
            border-radius: 25px 25px 25px 8px;
            align-self: flex-start;
            display: flex;
            gap: 6px;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #d4af37;
            border-radius: 50%;
            animation: typingAnim 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingAnim { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
        
        .response-card {
            background: rgba(212,175,55,0.08);
            border-radius: 20px;
            padding: 18px;
            align-self: flex-start;
            max-width: 85%;
            border-right: 3px solid #d4af37;
        }
        .response-title {
            font-size: 18px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(212,175,55,0.3);
        }
        .response-content {
            line-height: 1.7;
            font-size: 14px;
        }
        .response-content p { margin-bottom: 10px; }
        .response-content ul, .response-content ol { padding-right: 20px; margin: 8px 0; }
        .response-content li { margin: 5px 0; }
        
        .chat-input-area {
            display: flex;
            padding: 15px;
            gap: 10px;
            border-top: 1px solid rgba(212,175,55,0.2);
            background: rgba(0,0,0,0.2);
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 30px;
            color: white;
        }
        .send-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border: none;
            border-radius: 30px;
            color: #0a1a2f;
            cursor: pointer;
            font-weight: bold;
        }

        /* Org Chart - Hierarchical قابل للتعديل */
        .org-builder {
            background: rgba(0,0,0,0.2);
            border-radius: 30px;
            padding: 25px;
            overflow-x: auto;
        }
        .org-tree {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 700px;
        }
        .org-ceo-card {
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 20px;
            padding: 15px 35px;
            text-align: center;
            margin-bottom: 35px;
            color: #0a1a2f;
            position: relative;
            cursor: pointer;
        }
        .org-ceo-card::after {
            content: '';
            position: absolute;
            bottom: -25px;
            left: 50%;
            width: 2px;
            height: 25px;
            background: #d4af37;
        }
        .org-level {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .org-dept-card {
            background: rgba(10, 26, 47, 0.9);
            border-radius: 18px;
            padding: 15px;
            min-width: 160px;
            text-align: center;
            border: 1px solid rgba(212,175,55,0.3);
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }
        .org-dept-card:hover { transform: translateY(-3px); border-color: #d4af37; }
        .org-dept-card::before {
            content: '';
            position: absolute;
            top: -25px;
            left: 50%;
            width: 2px;
            height: 25px;
            background: #d4af37;
        }
        .org-dept-card i { font-size: 28px; color: #d4af37; margin-bottom: 8px; }
        .org-jobs-list { font-size: 10px; opacity: 0.7; margin-top: 8px; }
        .add-org-btn {
            background: rgba(212,175,55,0.2);
            border: 1px dashed #d4af37;
            border-radius: 18px;
            padding: 15px;
            min-width: 160px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .add-org-btn:hover { background: rgba(212,175,55,0.3); }

        /* Performance */
        .criteria-item { background: rgba(10, 26, 47, 0.7); border-radius: 16px; padding: 15px; margin-bottom: 12px; }
        .criteria-header { display: flex; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; }
        .criteria-name { font-weight: bold; color: #d4af37; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 8px 0; }
        .progress-fill { height: 8px; border-radius: 10px; background: linear-gradient(90deg, #d4af37, #b8960c); }

        /* Admin */
        .admin-section { margin-bottom: 25px; background: rgba(0,0,0,0.2); border-radius: 20px; padding: 18px; }
        .admin-section h4 { margin-bottom: 15px; color: #d4af37; border-right: 3px solid #d4af37; padding-right: 10px; }
        .jobs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .job-card { background: rgba(10, 26, 47, 0.7); border-radius: 18px; padding: 15px; text-align: center; }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: linear-gradient(145deg, #0a1a2f, #061220);
            border-radius: 30px;
            padding: 25px;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #d4af37; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 15px;
            color: white;
        }

        .menu-toggle { display: none; background: none; border: none; font-size: 24px; color: white; cursor: pointer; }
        @media (max-width: 992px) {
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; }
            .bottom-nav { display: flex; }
            .menu-toggle { display: block; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div id="appRoot"></div>

<script>
    // ==================== بيانات النظام ====================
    const workQuotes = [
        { text: "خير الناس أنفعهم للناس", author: "الحديث الشريف" },
        { text: "من جد وجد ومن زرع حصد", author: "حكمة عربية" },
        { text: "اتقن عملك يُتقن لك", author: "حكمة" }
    ];
    const dailyQuotes = [
        { text: "وَقُل رَّبِّ زِدْنِي عِلْمًا", author: "سورة طه" },
        { text: "إِنَّ اللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّى يُغَيِّرُوا مَا بِأَنفُسِهِمْ", author: "سورة الرعد" }
    ];
    function getRandomWorkQuote() { return workQuotes[Math.floor(Math.random() * workQuotes.length)]; }
    function getDailyIslamicQuote() { return dailyQuotes[Math.floor(Math.random() * dailyQuotes.length)]; }

    // ==================== المستخدمين ====================
    let usersDatabase = JSON.parse(localStorage.getItem('hr_users')) || [
        { id: 1, email: "admin@hr.com", password: "admin123", name: "أحمد المدير", role: "admin", avatar: null, jobTitle: "مدير الموارد البشرية", department: "الموارد البشرية" }
    ];
    let currentSession = JSON.parse(sessionStorage.getItem('hr_session')) || null;
    let showRegister = false;

    // ==================== الهيكل التنظيمي (قابل للتعديل من المدير) ====================
    let orgStructure = JSON.parse(localStorage.getItem('hr_org_structure')) || {
        ceo: { id: "ceo1", name: "مجلس الإدارة", head: "أحمد الراشد", members: 5 },
        departments: [
            { id: "dept1", name: "الموارد البشرية", head: "سارة العتيبي", members: 12, jobs: ["مدير الموارد البشرية", "أخصائي موارد بشرية"] },
            { id: "dept2", name: "المالية", head: "ليلى الحربي", members: 15, jobs: ["محاسب", "مدير مالي", "محلل مالي"] },
            { id: "dept3", name: "التقنية", head: "عمر القحطاني", members: 45, jobs: ["مبرمج", "مهندس برمجيات", "محلل أنظمة"] },
            { id: "dept4", name: "التسويق", head: "نور الشمري", members: 20, jobs: ["مسوق رقمي", "مدير تسويق"] }
        ]
    };

    // ==================== المسميات الوظيفية ====================
    let globalJobsList = JSON.parse(localStorage.getItem('hr_global_jobs')) || [
        { id: 1, title: "مدير الموارد البشرية", department: "الموارد البشرية", level: "إداري" },
        { id: 2, title: "محاسب", department: "المالية", level: "تنفيذي" },
        { id: 3, title: "مبرمج", department: "التقنية", level: "متخصص" },
        { id: 4, title: "مدير مالي", department: "المالية", level: "إداري" },
        { id: 5, title: "محلل مالي", department: "المالية", level: "متخصص" },
        { id: 6, title: "مهندس برمجيات", department: "التقنية", level: "متقدم" },
        { id: 7, title: "مسوق رقمي", department: "التسويق", level: "متخصص" },
        { id: 8, title: "مدير تسويق", department: "التسويق", level: "إداري" },
        { id: 9, title: "أخصائي موارد بشرية", department: "الموارد البشرية", level: "متخصص" },
        { id: 10, title: "محلل أنظمة", department: "التقنية", level: "متخصص" }
    ];

    // ==================== معايير التقييم لكل وظيفة (تلقائي حسب الوظيفة) ====================
    let performanceCriteria = JSON.parse(localStorage.getItem('hr_performance_criteria')) || {
        "مدير الموارد البشرية": {
            criteria: [
                { name: "الإنتاجية", weight: 25, current: 90, target: 100, points: 90 },
                { name: "الحضور والانضباط", weight: 15, current: 95, target: 100, points: 95 },
                { name: "السلوك المهني", weight: 20, current: 88, target: 100, points: 88 },
                { name: "التطوير الذاتي", weight: 20, current: 80, target: 100, points: 80 },
                { name: "الالتزام بالسياسات", weight: 20, current: 92, target: 100, points: 92 }
            ]
        },
        "محاسب": {
            criteria: [
                { name: "دقة التقارير", weight: 35, current: 98, target: 100, points: 98 },
                { name: "الالتزام", weight: 25, current: 95, target: 100, points: 95 },
                { name: "السلوك المهني", weight: 15, current: 85, target: 100, points: 85 },
                { name: "التطوير", weight: 15, current: 75, target: 100, points: 75 },
                { name: "السرعة", weight: 10, current: 90, target: 100, points: 90 }
            ]
        },
        "مبرمج": {
            criteria: [
                { name: "جودة الكود", weight: 30, current: 88, target: 100, points: 88 },
                { name: "الالتزام بالمهل", weight: 25, current: 90, target: 100, points: 90 },
                { name: "حل المشكلات", weight: 20, current: 85, target: 100, points: 85 },
                { name: "السلوك", weight: 15, current: 82, target: 100, points: 82 },
                { name: "التوثيق", weight: 10, current: 80, target: 100, points: 80 }
            ]
        }
    };

    // توليد تقييم تلقائي لكل وظيفة جديدة
    function generateDefaultCriteria(jobTitle) {
        return {
            criteria: [
                { name: "الإنتاجية", weight: 25, current: 85, target: 100, points: 85 },
                { name: "الحضور والانضباط", weight: 20, current: 90, target: 100, points: 90 },
                { name: "السلوك المهني", weight: 20, current: 85, target: 100, points: 85 },
                { name: "التطوير الذاتي", weight: 20, current: 75, target: 100, points: 75 },
                { name: "الالتزام", weight: 15, current: 85, target: 100, points: 85 }
            ]
        };
    }

    function getPerformanceForJob(jobTitle) {
        if(performanceCriteria[jobTitle]) return performanceCriteria[jobTitle];
        let newCriteria = generateDefaultCriteria(jobTitle);
        performanceCriteria[jobTitle] = newCriteria;
        saveAll();
        return newCriteria;
    }

    function calculateOverallScore(criteria) {
        let total = criteria.reduce((sum, c) => sum + c.points, 0);
        let max = criteria.length * 100;
        return Math.round((total / max) * 100);
    }

    // ==================== بيانات أخرى ====================
    let companyData = JSON.parse(localStorage.getItem('hr_company')) || {
        name: "شركة التميز للاستشارات",
        vision: "الريادة في تقديم حلول الموارد البشرية",
        mission: "تمكين المؤسسات من خلال خدمات مبتكرة",
        values: [
            { name: "النزاهة", icon: "fas fa-handshake", desc: "نلتزم بأعلى المعايير الأخلاقية" },
            { name: "الابتكار", icon: "fas fa-lightbulb", desc: "نتبنى الإبداع" },
            { name: "التميز", icon: "fas fa-trophy", desc: "نطمح لأعلى جودة" }
        ]
    };

    let policiesList = JSON.parse(localStorage.getItem('hr_policies')) || [
        { id: 1, title: "سياسة الإجازة السنوية", category: "إجازات", content: "21 يوم عمل إجازة سنوية مدفوعة الأجر" },
        { id: 2, title: "سياسة سلفة الراتب", category: "مالية", content: "بعد 6 أشهر عمل، بحد أقصى 50% من الراتب" }
    ];

    let behaviorsList = JSON.parse(localStorage.getItem('hr_behaviors')) || [
        { id: 1, title: "الاحترافية", desc: "الحفاظ على سلوك محترم مع الجميع" },

    function getCurrentUser() { return currentSession ? usersDatabase.find(u => u.id === currentSession.userId) : null; }

    // تحديث الأقسام بناءً على المسميات الوظيفية
    function updateOrgDepartmentsFromJobs() {
        let departmentsMap = {};
        globalJobsList.forEach(job => {
            if(!departmentsMap[job.department]) {
                departmentsMap[job.department] = { jobs: [], count: 0 };
            }
            departmentsMap[job.department].jobs.push(job.title);
            departmentsMap[job.department].count++;
        });
        
        let existingDepts = orgStructure.departments.map(d => d.name);
        for(let deptName in departmentsMap) {
            if(!existingDepts.includes(deptName)) {
                orgStructure.departments.push({
                    id: "dept_" + Date.now() + "_" + deptName,
                    name: deptName,
                    head: "مدير القسم",
                    members: departmentsMap[deptName].count,
                    jobs: departmentsMap[deptName].jobs
                });
            } else {
                let dept = orgStructure.departments.find(d => d.name === deptName);
                if(dept) {
                    dept.jobs = departmentsMap[deptName].jobs;
                    dept.members = departmentsMap[deptName].count;
                }
            }
        }
        saveAll();
    }

    // ==================== المساعد الذكي مع تأثير الكتابة ====================
    let assistantChatHistory = [];

    async function typeText(element, text, speed = 20) {
        element.innerHTML = '';
        for(let i = 0; i < text.length; i++) {
            element.innerHTML += text[i];
            await new Promise(resolve => setTimeout(resolve, speed));
        }
    }

    async function formatAndDisplayResponse(question, answer) {
        let messagesDiv = document.getElementById('chatMessages');
        
        // إضافة فقاعة السؤال
        let userBubble = document.createElement('div');
        userBubble.className = 'user-bubble';
        userBubble.innerText = question;
        messagesDiv.appendChild(userBubble);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        
        // إضافة مؤشر الكتابة
        let typingDiv = document.createElement('div');
        typingDiv.className = 'typing-indicator';
        typingDiv.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
        messagesDiv.appendChild(typingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        
        await new Promise(resolve => setTimeout(resolve, 1500));
        typingDiv.remove();
        
        // إنشاء بطاقة الرد
        let responseCard = document.createElement('div');
        responseCard.className = 'response-card';
        
        // استخراج عنوان من السؤال
        let title = question.replace("ما هي ", "").replace("كيف ", "").replace("؟", "");
        
        let responseHtml = `
            <div class="response-title"><i class="fas fa-info-circle"></i> ${title}</div>
            <div class="response-content" id="responseContent-${Date.now()}"></div>
        `;
        responseCard.innerHTML = responseHtml;
        messagesDiv.appendChild(responseCard);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        
        // تأثير الكتابة التدريجي
        let contentDiv = responseCard.querySelector('.response-content');
        await typeText(contentDiv, answer, 15);
        
        assistantChatHistory.push({ question, answer });
    }

    async function quickQuestion(q) {
        let answer = getAnswer(q);
        await formatAndDisplayResponse(q, answer);
    }

    async function sendManualMessage() {
        let input = document.getElementById('chatInput');
        if(!input) return;
        let q = input.value.trim();
        if(!q) return;
        let answer = getAnswer(q);
        await formatAndDisplayResponse(q, answer);
        input.value = '';
    }

    function getAnswer(question) {
        let found = faqList.find(f => question.includes(f.question.substring(0, 15)));
        if(found) return found.answer;
        
        // إجابات موسعة للأسئلة الشائعة
        if(question.includes("إجازة") || question.includes("سنوية")) {
            return "📋 **سياسة الإجازة السنوية**\n\n• 21 يوم عمل إجازة سنوية مدفوعة الأجر\n• يتم احتساب الإجازة بعد إتمام 6 أشهر عمل\n• يجب تقديم الطلب قبل أسبوعين من تاريخ الإجازة\n• يمكن ترحيل الإجازات غير المستخدمة لمدة سنة واحدة\n• في حالة الاستقالة، يتم تعويض الإجازات المتبقية مالياً";
        }
        if(question.includes("سلفة") || question.includes("راتب")) {
            return "💰 **سياسة سلفة الراتب**\n\n• يشترط إتمام 6 أشهر عمل على الأقل\n• الحد الأقصى للسلفة: 50% من الراتب الشهري\n• تسدد السلفة على 6 دفعات شهرية متساوية\n• يمكن تقديم طلب سلفة واحدة كل 6 أشهر\n• يتم الرد على الطلب خلال 3 أيام عمل";
        }
        if(question.includes("ساعات العمل")) {
            return "⏰ **ساعات العمل الرسمية**\n\n• من الأحد إلى الخميس: 8:00 صباحاً حتى 5:00 مساءً\n• استراحة الظهر: ساعة واحدة (12:30 - 1:30)\n• يومي الجمعة والسبت: إجازة أسبوعية\n• في شهر رمضان: 9:00 صباحاً حتى 3:00 مساءً";
        }
        return "❌ لم يتم العثور على إجابة لهذا السؤال. الرجاء التواصل مع قسم الموارد البشرية.";
    }

    // ==================== دوال تسجيل الدخول ====================
    function login(email, password, remember) {
        let user = usersDatabase.find(u => u.email === email && u.password === password);
        if(user) {
            currentSession = { userId: user.id, email: user.email, role: user.role };
            sessionStorage.setItem('hr_session', JSON.stringify(currentSession));
            if(remember) localStorage.setItem('hr_remember', JSON.stringify({ email, password }));
            else localStorage.removeItem('hr_remember');
            renderApp();
            return true;
        }
        return false;
    }

    function register(name, email, password, confirm, avatar, jobTitle, dept) {
        if(password !== confirm) { alert("كلمة المرور غير متطابقة"); return false; }
        if(usersDatabase.find(u => u.email === email)) { alert("البريد موجود بالفعل"); return false; }
        usersDatabase.push({ id: Date.now(), name, email, password, role: "employee", avatar, jobTitle: jobTitle || "موظف", department: dept || "غير محدد" });
        saveAll();
        updateOrgDepartmentsFromJobs();
        return true;
    }

    function logout() {
        sessionStorage.removeItem('hr_session');
        currentSession = null;
        renderApp();
    }

    window.doLogin = function() {
        let email = document.getElementById('loginEmail').value;
        let pass = document.getElementById('loginPassword').value;
        let remember = document.getElementById('rememberCheckbox').checked;
        if(login(email, pass, remember)) alert('تم تسجيل الدخول بنجاح ✅');
        else alert('البريد أو كلمة المرور غير صحيحة ❌');
    };
    window.doRegister = function() {
        let name = document.getElementById('regName').value;
        let email = document.getElementById('regEmail').value;
        let job = document.getElementById('regJob').value;
        let dept = document.getElementById('regDept').value;
        let pass = document.getElementById('regPassword').value;
        let confirm = document.getElementById('regConfirm').value;
        if(!name || !email || !pass) { alert("الرجاء ملء الحقول الأساسية"); return; }
        if(register(name, email, pass, confirm, tempAvatar, job, dept)) {
            alert('تم إنشاء الحساب بنجاح ✅');
            toggleRegister();
        }
    };
    window.toggleRegister = function() {
        let form = document.getElementById('registerForm');
        form.classList.toggle('show');
        tempAvatar = null;
        document.getElementById('avatarPreview').innerHTML = '<i class="fas fa-camera"></i>';
    };
    window.forgotPassword = function() {
        let email = prompt("أدخل بريدك الإلكتروني:");
        if(email) {
            let user = usersDatabase.find(u => u.email === email);
            if(user) {
                let newPass = prompt("أدخل كلمة المرور الجديدة:");
                if(newPass) { user.password = newPass; saveAll(); alert("تم تغيير كلمة المرور ✅"); }
            } else alert("لم يتم العثور على الحساب ❌");
        }
    };
    let tempAvatar = null;
    window.handleAvatarUpload = function(input) {
        if(input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = e => {
                document.getElementById('avatarPreview').innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;">`;
                tempAvatar = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    };

    window.editOrgDept = function(deptId) {
        let dept = orgStructure.departments.find(d => d.id === deptId);
        if(!dept) return;
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h3>تعديل القسم</h3>
                <div class="form-group"><label>اسم القسم</label><input id="deptName" value="${dept.name}"></div>
                <div class="form-group"><label>رئيس القسم</label><input id="deptHead" value="${dept.head}"></div>
                <div class="form-group"><label>عدد الأعضاء</label><input id="deptMembers" value="${dept.members}" type="number"></div>
                <div style="display:flex; gap:10px;">
                    <button class="btn" onclick="saveDeptEdit(this, '${deptId}')">حفظ</button>
                    <button class="btn" style="background:#ef4444;" onclick="deleteDept('${deptId}')">حذف</button>
                    <button class="btn" style="background:#6b7280;" onclick="this.closest('.modal').remove()">إلغاء</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        window.saveDeptEdit = function(btn, id) {
            let d = orgStructure.departments.find(d => d.id === id);
            if(d) {
                d.name = document.getElementById('deptName').value;
                d.head = document.getElementById('deptHead').value;
                d.members = parseInt(document.getElementById('deptMembers').value);
                saveAll();
                btn.closest('.modal').remove();
                renderApp();
                showNotification("تم التعديل", "تم تعديل بيانات القسم");
            }
        };
        window.deleteDept = function(id) {
            if(confirm('هل أنت متأكد من حذف هذا القسم؟')) {
                orgStructure.departments = orgStructure.departments.filter(d => d.id !== id);
                saveAll();
                document.querySelector('.modal')?.remove();
                renderApp();
                showNotification("تم الحذف", "تم حذف القسم");
            }
        };
    };

    function showNotification(title, message) {
        let toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;top:20px;left:20px;background:linear-gradient(135deg,#d4af37,#b8960c);color:#0a1a2f;padding:12px 20px;border-radius:30px;z-index:1000;animation:slideIn 0.3s ease;';
        toast.innerHTML = `<i class="fas fa-bell"></i> <strong>${title}</strong><br><small>${message}</small>`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

    function renderCompany() {
        return `<div class="card"><h2 style="color:#d4af37; text-align:center;">${companyData.name}</h2></div>
        <div class="card"><h3>رؤيتنا</h3><p>${companyData.vision}</p></div>
        <div class="card"><h3>رسالتنا</h3><p>${companyData.mission}</p></div>
        <div class="card"><h3>قيمنا</h3>${companyData.values.map(v => `<div style="padding:8px;"><i class="${v.icon}"></i> <strong>${v.name}</strong><br>${v.desc}</div>`).join('')}</div>`;
    }

    function renderPerformance() {
        let user = getCurrentUser();
        let job = globalJobsList.find(j => j.title === user?.jobTitle);
        if(!job) return `<div class="card"><h3>تقييم الأداء</h3><p>الرجاء تحديث المسمى الوظيفي من حسابي</p></div>`;
        
        let perf = getPerformanceForJob(user.jobTitle);
        let overall = calculateOverallScore(perf.criteria);
        
        return `
        <div class="card"><h3><i class="fas fa-chart-line"></i> تقييم الأداء - ${user.jobTitle}</h3>
        <div class="stat-number" style="font-size:42px;">${overall}%</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${overall}%"></div></div>
        </div>
        <div class="card"><h3>📊 معايير التقييم (100 نقطة لكل معيار)</h3>
        ${perf.criteria.map(c => `
            <div class="criteria-item">
                <div class="criteria-header">
                    <span class="criteria-name">${c.name}</span>
                    <span>${c.points} / ${c.target}</span>
                </div>
                <div class="progress-bar"><div class="progress-fill" style="width:${(c.points/100)*100}%"></div></div>
                <div style="font-size:12px;">الوزن: ${c.weight}% | الإنجاز: ${c.current}%</div>
            </div>
        `).join('')}
        </div>`;
    }

    function renderNotifications() {
        return `<div class="card"><h3><i class="fas fa-bell"></i> الإشعارات</h3>${announcementsList.map(a => `<div style="padding:12px; border-bottom:1px solid rgba(212,175,55,0.1);"><strong>${a.title}</strong><br>${a.content}<br><small>📅 ${a.date}</small></div>`).join('')}</div>`;
    }

    function renderProfile() {
        let user = getCurrentUser();
        let allJobs = getAllJobs();
        return `
        <div class="card">
            <h3><i class="fas fa-user-circle"></i> حسابي</h3>
            <div class="avatar" style="width:100px;height:100px;margin:0 auto 20px;" onclick="document.getElementById('profileAvatar').click()">
                ${user?.avatar ? `<img src="${user.avatar}" style="width:100%;height:100%;object-fit:cover;">` : '<i class="fas fa-user" style="font-size:50px;"></i>'}
            </div>
            <input type="file" id="profileAvatar" style="display:none" onchange="uploadProfileAvatar(this)">
            <div class="form-group"><label>الاسم</label><input id="profileName" value="${user?.name || ''}"></div>
            <div class="form-group"><label>البريد</label><input id="profileEmail" value="${user?.email || ''}"></div>
            <div class="form-group"><label>الجوال</label><input id="profilePhone" value="${user?.phone || ''}"></div>
            <div class="form-group"><label>المسمى الوظيفي</label><select id="profileJob">${allJobs.map(j => `<option ${user?.jobTitle === j.title ? 'selected' : ''}>${j.title}</option>`).join('')}</select></div>
            <div class="form-group"><label>القسم</label><input id="profileDept" value="${user?.department || ''}"></div>
            <button class="btn" onclick="saveUserProfile()">حفظ التغييرات</button>
        </div>`;
    }

    function saveUserProfile() {
        let user = getCurrentUser();
        user.name = document.getElementById('profileName').value;
        user.email = document.getElementById('profileEmail').value;
        user.phone = document.getElementById('profilePhone').value;
        user.jobTitle = document.getElementById('profileJob').value;
        user.department = document.getElementById('profileDept').value;
        let idx = usersDatabase.findIndex(u => u.id === user.id);
        if(idx !== -1) usersDatabase[idx] = user;
        saveAll();
        updateOrgDepartmentsFromJobs();
        alert('تم حفظ البيانات ✅');
        renderApp();
    }

    function uploadProfileAvatar(input) {
        if(input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = e => {
                let user = getCurrentUser();
                user.avatar = e.target.result;
                let idx = usersDatabase.findIndex(u => u.id === user.id);
                if(idx !== -1) usersDatabase[idx] = user;
                saveAll();
                renderApp();
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // ==================== لوحة التحكم ====================
    function renderAdminPanel() {
        let user = getCurrentUser();
        if(user?.role !== 'admin') return '<div class="card">🔒 هذه الصفحة للمدير فقط</div>';
        return `
        <div class="card"><h3><i class="fas fa-crown"></i> لوحة تحكم المدير</h3>
        <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px;">
            <button class="btn" onclick="showAddJobModal()"><i class="fas fa-plus"></i> إضافة مسمى</button>
            <button class="btn" onclick="showAddPolicyModal()"><i class="fas fa-plus"></i> إضافة سياسة</button>
            <button class="btn" onclick="showAddFaqModal()"><i class="fas fa-plus"></i> إضافة سؤال</button>
            <button class="btn" onclick="showAddBehaviorModal()"><i class="fas fa-plus"></i> إضافة سلوك</button>
            <button class="btn" onclick="showAddProcedureModal()"><i class="fas fa-plus"></i> إضافة إجراء</button>
            <button class="btn" onclick="showAddAnnouncementModal()"><i class="fas fa-plus"></i> إضافة إعلان</button>
        </div></div>
        <div class="admin-section"><h4>📋 المسميات الوظيفية</h4><div class="jobs-grid">${globalJobsList.map(j => `<div class="job-card"><i class="fas fa-briefcase"></i><h4>${j.title}</h4><p>${j.department}</p><button class="btn" style="margin-top:8px; background:#f59e0b;" onclick="editJob(${j.id})">تعديل</button> <button class="btn" style="margin-top:8px; background:#ef4444;" onclick="deleteJob(${j.id})">حذف</button></div>`).join('')}</div></div>`;
    }

    // دوال الإدارة
    function showModal(title, html, onSave) {
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3>${title}</h3>${html}<div style="margin-top:15px;"><button class="btn" onclick="saveModal(this)">حفظ</button><button class="btn" style="background:#ef4444;" onclick="this.closest('.modal').remove()">إلغاء</button></div></div>`;
        document.body.appendChild(modal);
        window.saveModal = (btn) => { onSave(); btn.closest('.modal').remove(); };
    }

    window.showAddJobModal = () => showModal('إضافة مسمى وظيفي', `<input id="title" placeholder="المسمى"><input id="dept" placeholder="القسم" style="margin-top:10px;"><select id="level" style="margin-top:10px;"><option>إداري</option><option>تنفيذي</option><option>متخصص</option></select>`, () => {
        let newId = Date.now();
        let newTitle = document.getElementById('title').value;
        let newDept = document.getElementById('dept').value;
        globalJobsList.push({ id: newId, title: newTitle, department: newDept, level: document.getElementById('level').value });
        updateOrgDepartmentsFromJobs();
        saveAll();
        showNotification("تم الإضافة", "تم إضافة مسمى وظيفي جديد");
        renderApp();
    });
    window.editJob = (id) => { let j = globalJobsList.find(j => j.id === id); showModal('تعديل', `<input id="title" value="${j.title}"><input id="dept" value="${j.department}" style="margin-top:10px;">`, () => { j.title = document.getElementById('title').value; j.department = document.getElementById('dept').value; saveAll(); updateOrgDepartmentsFromJobs(); showNotification("تم التعديل", "تم تعديل المسمى"); renderApp(); }); };
    window.deleteJob = (id) => { if(confirm('حذف؟')) { globalJobsList = globalJobsList.filter(j => j.id !== id); saveAll(); updateOrgDepartmentsFromJobs(); showNotification("تم الحذف", "تم حذف المسمى"); renderApp(); } };
    window.showAddPolicyModal = () => showModal('إضافة سياسة', `<input id="title" placeholder="العنوان"><textarea id="content" rows="3" placeholder="المحتوى" style="margin-top:10px;"></textarea><select id="cat" style="margin-top:10px;"><option>إجازات</option><option>مالية</option></select>`, () => { policiesList.push({ id: Date.now(), title: document.getElementById('title').value, content: document.getElementById('content').value, category: document.getElementById('cat').value }); saveAll(); showNotification("تم الإضافة", "تم إضافة سياسة جديدة"); renderApp(); });
    window.showAddFaqModal = () => showModal('إضافة سؤال', `<input id="q" placeholder="السؤال"><textarea id="a" rows="3" placeholder="الإجابة" style="margin-top:10px;"></textarea>`, () => { faqList.push({ id: Date.now(), question: document.getElementById('q').value, answer: document.getElementById('a').value }); saveAll(); showNotification("تم الإضافة", "تم إضافة سؤال جديد"); renderApp(); });
    window.showAddBehaviorModal = () => showModal('إضافة سلوك', `<input id="title" placeholder="العنوان"><textarea id="desc" placeholder="الوصف" style="margin-top:10px;"></textarea>`, () => { behaviorsList.push({ id: Date.now(), title: document.getElementById('title').value, desc: document.getElementById('desc').value }); saveAll(); showNotification("تم الإضافة", "تم إضافة سلوك جديد"); renderApp(); });
    window.showAddProcedureModal = () => showModal('إضافة إجراء', `<input id="title" placeholder="العنوان"><textarea id="desc" placeholder="الوصف" style="margin-top:10px;"></textarea>`, () => { proceduresList.push({ id: Date.now(), step: proceduresList.length+1, title: document.getElementById('title').value, desc: document.getElementById('desc').value }); saveAll(); showNotification("تم الإضافة", "تم إضافة إجراء جديد"); renderApp(); });
    window.showAddAnnouncementModal = () => showModal('إضافة إعلان', `<input id="title" placeholder="العنوان"><textarea id="content" placeholder="المحتوى" style="margin-top:10px;"></textarea>`, () => { announcementsList.push({ id: Date.now(), title: document.getElementById('title').value, content: document.getElementById('content').value, date: new Date().toLocaleDateString('ar') }); saveAll(); showNotification("إعلان جديد", document.getElementById('title').value); renderApp(); });

    // ==================== التطبيق الرئيسي ====================
    let currentPage = "home";

    function renderApp() {
        let user = getCurrentUser();
        let root = document.getElementById('appRoot');
        if(!user) { root.innerHTML = renderLoginRegister(); return; }
        let isAdmin = user.role === 'admin';
        root.innerHTML = `
        <div class="app-container">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header"><div class="logo-area"><div class="company-logo"><i class="fas fa-crown"></i></div><div class="logo">HR<span>SYSTEM</span></div></div><div style="font-size:10px;">نظام متكامل</div></div>
                <div class="nav-item ${currentPage === 'home' ? 'active' : ''}" data-page="home"><i class="fas fa-home"></i> الرئيسية</div>
                <div class="nav-item ${currentPage === 'assistant' ? 'active' : ''}" data-page="assistant"><i class="fas fa-robot"></i> المساعد الذكي</div>
                <div class="nav-item ${currentPage === 'guide' ? 'active' : ''}" data-page="guide"><i class="fas fa-book-open"></i> دليل الموظف</div>
                <div class="nav-item ${currentPage === 'org' ? 'active' : ''}" data-page="org"><i class="fas fa-project-diagram"></i> الهيكل التنظيمي</div>
                <div class="nav-item ${currentPage === 'company' ? 'active' : ''}" data-page="company"><i class="fas fa-flag-checkered"></i> عن الشركة</div>
                <div class="nav-item ${currentPage === 'performance' ? 'active' : ''}" data-page="performance"><i class="fas fa-chart-line"></i> تقييم الأداء</div>
                <div class="nav-item ${currentPage === 'notifications' ? 'active' : ''}" data-page="notifications"><i class="fas fa-bell"></i> الإشعارات</div>
                <div class="nav-item ${currentPage === 'profile' ? 'active' : ''}" data-page="profile"><i class="fas fa-user-circle"></i> حسابي</div>
                ${isAdmin ? `<div class="nav-item ${currentPage === 'admin' ? 'active' : ''}" data-page="admin"><i class="fas fa-crown"></i> لوحة التحكم</div>` : ''}
                <div style="margin-top:30px;"><div class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</div></div>
            </div>
            <div class="bottom-nav">
                <div class="bottom-nav-item ${currentPage === 'home' ? 'active' : ''}" data-page="home"><i class="fas fa-home"></i></div>
                <div class="bottom-nav-item ${currentPage === 'assistant' ? 'active' : ''}" data-page="assistant"><i class="fas fa-robot"></i></div>
                <div class="bottom-nav-item ${currentPage === 'profile' ? 'active' : ''}" data-page="profile"><i class="fas fa-user"></i></div>
                <div class="bottom-nav-item ${currentPage === 'notifications' ? 'active' : ''}" data-page="notifications"><i class="fas fa-bell"></i></div>
                ${isAdmin ? `<div class="bottom-nav-item ${currentPage === 'admin' ? 'active' : ''}" data-page="admin"><i class="fas fa-cog"></i></div>` : ''}
            </div>
            <div class="main-content">
                <div class="top-bar"><button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div class="page-title">${getPageTitle()}</div><div class="avatar">${user?.avatar ? `<img src="${user.avatar}">` : '<i class="fas fa-user"></i>'}</div></div>
                <div id="pageContent"></div>
            </div>
        </div>`;
        renderPageContent();
        attachEvents();
    }

    function getPageTitle() {
        let titles = { home:"الرئيسية", assistant:"المساعد الذكي", guide:"دليل الموظف", org:"الهيكل التنظيمي", company:"عن الشركة", performance:"تقييم الأداء", notifications:"الإشعارات", profile:"حسابي", admin:"لوحة التحكم" };
        return titles[currentPage] || "الرئيسية";
    }

    function renderPageContent() {
        const pages = { home: renderHome, assistant: renderAssistant, guide: renderEmployeeGuide, org: renderOrg, company: renderCompany, performance: renderPerformance, notifications: renderNotifications, profile: renderProfile, admin: renderAdminPanel };
        document.getElementById('pageContent').innerHTML = (pages[currentPage] || renderHome)();
        if(currentPage === 'assistant') setTimeout(() => { document.getElementById('chatMessages') && (document.getElementById('chatMessages').innerHTML = ''); }, 50);
    }

    function attachEvents() {
        document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(el => {
            if(el.id === 'logoutBtn') return;
            let page = el.dataset.page;
            if(page) el.onclick = () => { currentPage = page; renderApp(); };
        });
        document.getElementById('logoutBtn')?.addEventListener('click', () => { logout(); });
    }

    window.sendManualMessage = sendManualMessage;
    window.quickQuestion = quickQuestion;

    renderApp();
    saveAll();
</script>
</body>
</html>
