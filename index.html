<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HR System | نظام الموارد البشرية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(145deg, #0a1a2f, #061220);
            direction: rtl;
            color: #fff;
            min-height: 100vh;
        }
        /* تسجيل الدخول */
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card {
            background: rgba(10, 26, 47, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 35px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .login-card h2 { text-align: center; color: #d4af37; margin-bottom: 20px; }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(255,255,255,0.08); border: 1px solid rgba(212,175,55,0.3); border-radius: 30px; color: white; }
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; font-weight: bold; border: none; border-radius: 30px; cursor: pointer; }
        .register-link { text-align: center; margin-top: 15px; font-size: 13px; }
        .register-link span { color: #d4af37; cursor: pointer; }
        .register-form { display: none; margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(212,175,55,0.2); }
        .register-form.show { display: block; }
        
        /* القائمة الجانبية */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 270px;
            height: 100vh;
            background: #0a1a2f;
            border-left: 1px solid rgba(212,175,55,0.2);
            z-index: 200;
            transition: all 0.3s;
            overflow-y: auto;
        }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid rgba(212,175,55,0.2); }
        .logo { font-size: 24px; color: #d4af37; font-weight: bold; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 20px; margin: 5px 15px;
            border-radius: 12px; cursor: pointer; color: #a0aec0; transition: all 0.2s;
        }
        .nav-item:hover { background: rgba(212,175,55,0.15); color: #d4af37; }
        .nav-item.active { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; }
        .nav-item i { width: 25px; }
        
        .main-content { margin-right: 270px; padding: 20px; }
        .top-bar {
            background: rgba(10, 26, 47, 0.9); padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-radius: 20px; margin-bottom: 20px;
        }
        .page-title { font-size: 22px; color: #d4af37; font-weight: bold; }
        .avatar { width: 40px; height: 40px; background: linear-gradient(135deg, #d4af37, #b8960c); border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        .bottom-nav {
            display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #0a1a2f;
            padding: 10px 12px 25px; justify-content: space-around; z-index: 150;
            border-top: 1px solid rgba(212,175,55,0.2);
        }
        .bottom-nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            font-size: 11px; color: #94a3b8; cursor: pointer; padding: 5px 10px; border-radius: 25px;
        }
        .bottom-nav-item.active { color: #d4af37; background: rgba(212,175,55,0.15); }
        .bottom-nav-item i { font-size: 22px; }
        
        .card { background: rgba(10, 26, 47, 0.9); border-radius: 20px; padding: 18px; margin-bottom: 18px; border: 1px solid rgba(212,175,55,0.2); }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
        .stat-card { background: rgba(10, 26, 47, 0.9); border-radius: 16px; padding: 15px; text-align: center; }
        .stat-number { font-size: 28px; font-weight: bold; color: #d4af37; }
        
        .hero-section {
            background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(10,26,47,0.9));
            border-radius: 25px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
        }
        .hero-image { width: 70px; height: 70px; background: linear-gradient(135deg, #d4af37, #b8960c); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .hero-image i { font-size: 35px; color: #0a1a2f; }
        
        /* دليل الموظف */
        .guide-tabs { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .guide-tab { padding: 6px 15px; border-radius: 30px; cursor: pointer; background: rgba(212,175,55,0.1); }
        .guide-tab.active { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; }
        .guide-item {
            background: rgba(10, 26, 47, 0.7);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .guide-item:hover { border-color: #d4af37; }
        
        /* نافذة منبثقة */
        .modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: linear-gradient(145deg, #0a1a2f, #061220);
            border-radius: 24px; padding: 22px; width: 90%; max-width: 500px;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .form-group { margin-bottom: 12px; }
        .form-group label { color: #d4af37; display: block; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.3); border-radius: 12px; color: white;
        }
        
        /* لوحة التحكم */
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .admin-card {
            background: rgba(10, 26, 47, 0.7);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .admin-card:hover { background: rgba(212,175,55,0.15); transform: translateY(-2px); }
        .admin-card i { font-size: 26px; color: #d4af37; margin-bottom: 6px; }
        
        /* تقييم الأداء - 10 معايير */
        .performance-score { font-size: 48px; font-weight: bold; color: #d4af37; text-align: center; }
        .score-bar { width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .score-fill { height: 100%; background: linear-gradient(90deg, #d4af37, #b8960c); }
        .criteria-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }
        .criteria-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 14px;
        }
        .criteria-name { font-size: 14px; font-weight: bold; color: #d4af37; margin-bottom: 8px; }
        .criteria-progress { width: 100%; height: 5px; background: rgba(255,255,255,0.1); border-radius: 5px; margin: 8px 0; overflow: hidden; }
        .criteria-progress-fill { height: 100%; background: linear-gradient(90deg, #d4af37, #b8960c); }
        
        /* الهيكل التنظيمي */
        .org-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .org-ceo {
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 18px;
            padding: 15px 30px;
            text-align: center;
            color: #0a1a2f;
            cursor: pointer;
        }
        .org-departments {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .org-dept {
            background: rgba(10, 26, 47, 0.8);
            border-radius: 14px;
            padding: 12px;
            min-width: 140px;
            text-align: center;
            border: 1px solid rgba(212,175,55,0.3);
            cursor: pointer;
        }
        
        .menu-toggle { display: none; background: none; border: none; font-size: 24px; color: white; cursor: pointer; }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; padding-bottom: 70px; }
            .bottom-nav { display: flex; }
            .menu-toggle { display: block; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .admin-grid { grid-template-columns: repeat(2, 1fr); }
            .criteria-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    // ========== بيانات النظام ==========
    let users = [{ id: 1, email: "admin@hr.com", password: "admin123", name: "أحمد المدير", role: "admin", jobTitle: "مدير الموارد البشرية" }];
    let currentUser = null;
    
    // المسميات الوظيفية
    let jobs = [
        { id: 1, title: "مدير الموارد البشرية", department: "الموارد البشرية" },
        { id: 2, title: "محاسب", department: "المالية" },
        { id: 3, title: "مبرمج", department: "التقنية" },
        { id: 4, title: "مسوق رقمي", department: "التسويق" }
    ];
    
    // السياسات
    let policies = [
        { id: 1, title: "سياسة الإجازة السنوية", description: "21 يوم إجازة سنوية مدفوعة", content: "جميع الموظفين يحق لهم 21 يوم إجازة سنوية مدفوعة الأجر بعد إتمام 6 أشهر." },
        { id: 2, title: "سياسة سلفة الراتب", description: "سلفة تصل 50% من الراتب", content: "بعد 6 أشهر عمل، يحق للموظف طلب سلفة تصل 50% من الراتب، تسدد على 6 دفعات." }
    ];
    
    // السلوكيات
    let behaviors = [
        { id: 1, title: "الاحترافية", desc: "الحفاظ على سلوك محترم مع جميع الزملاء والعملاء" },
        { id: 2, title: "الالتزام بالمواعيد", desc: "الحضور في الوقت المحدد وإخطار المدير عند التأخر" },
        { id: 3, title: "السرية", desc: "الحفاظ على سرية معلومات الشركة والموظفين" },
        { id: 4, title: "الابتكار", desc: "اقتراح التحسينات وتطوير أساليب العمل" }
    ];
    
    // الإجراءات
    let procedures = [
        { id: 1, step: 1, title: "تقديم طلب إجازة", desc: "سجل الدخول → اختار الإجازات → حدد التواريخ → أرسل للمدير" },
        { id: 2, step: 2, title: "تقديم طلب سلفة", desc: "الراتب والسلف → طلب سلفة → حدد المبلغ → انتظر الموافقة" },
        { id: 3, step: 3, title: "تقديم شكوى", desc: "قسم الشكاوى → اكتب الشكوى → اختر التصنيف → إرسال" }
    ];
    
    // الأسئلة الشائعة
    let faq = [
        { id: 1, question: "ما هي سياسة الإجازة السنوية?", answer: "21 يوم إجازة سنوية مدفوعة الأجر." },
        { id: 2, question: "كيف أطلب سلفة راتب?", answer: "بعد 6 أشهر عمل، بحد أقصى 50% من الراتب." }
    ];
    
    // الإعلانات
    let announcements = [
        { id: 1, title: "تحديث السياسات", content: "تم تحديث سياسة الإجازات", date: new Date().toLocaleDateString() }
    ];
    
    // الهيكل التنظيمي
    let orgStructure = {
        ceo: { name: "مجلس الإدارة", head: "أحمد الراشد", members: 5 },
        departments: [
            { id: 1, name: "الموارد البشرية", head: "سارة العتيبي", members: 12 },
            { id: 2, name: "المالية", head: "ليلى الحربي", members: 15 },
            { id: 3, name: "التقنية", head: "عمر القحطاني", members: 45 },
            { id: 4, name: "التسويق", head: "نور الشمري", members: 20 }
        ]
    };
    
    // تقييم الأداء - 10 معايير لكل وظيفة (100 نقطة)
    let performance = {
        "مدير الموارد البشرية": {
            criteria: [
                { name: "التخطيط الاستراتيجي", value: 88, max: 100, weight: 10 },
                { name: "إدارة الموارد البشرية", value: 92, max: 100, weight: 10 },
                { name: "التواصل الفعال", value: 90, max: 100, weight: 10 },
                { name: "القيادة", value: 85, max: 100, weight: 10 },
                { name: "حل المشكلات", value: 90, max: 100, weight: 10 },
                { name: "الالتزام بالسياسات", value: 95, max: 100, weight: 10 },
                { name: "تطوير الفريق", value: 80, max: 100, weight: 10 },
                { name: "الإنتاجية", value: 92, max: 100, weight: 10 },
                { name: "الابتكار", value: 85, max: 100, weight: 10 },
                { name: "الحضور والانضباط", value: 98, max: 100, weight: 10 }
            ]
        },
        "محاسب": {
            criteria: [
                { name: "دقة التقارير", value: 98, max: 100, weight: 10 },
                { name: "الالتزام بالمعايير", value: 95, max: 100, weight: 10 },
                { name: "سرعة الإنجاز", value: 90, max: 100, weight: 10 },
                { name: "السرية المالية", value: 100, max: 100, weight: 10 },
                { name: "التسويات البنكية", value: 92, max: 100, weight: 10 },
                { name: "الميزانية", value: 88, max: 100, weight: 10 },
                { name: "التقارير الضريبية", value: 95, max: 100, weight: 10 },
                { name: "التعاون", value: 90, max: 100, weight: 10 },
                { name: "التطوير الذاتي", value: 85, max: 100, weight: 10 },
                { name: "الانضباط", value: 98, max: 100, weight: 10 }
            ]
        },
        "مبرمج": {
            criteria: [
                { name: "جودة الكود", value: 88, max: 100, weight: 10 },
                { name: "الالتزام بالمهل", value: 90, max: 100, weight: 10 },
                { name: "حل المشكلات", value: 85, max: 100, weight: 10 },
                { name: "التوثيق", value: 80, max: 100, weight: 10 },
                { name: "التعاون", value: 88, max: 100, weight: 10 },
                { name: "الإبداع التقني", value: 85, max: 100, weight: 10 },
                { name: "الاختبارات", value: 90, max: 100, weight: 10 },
                { name: "الأمان", value: 92, max: 100, weight: 10 },
                { name: "التحديث المستمر", value: 85, max: 100, weight: 10 },
                { name: "الحضور", value: 95, max: 100, weight: 10 }
            ]
        }
    };
    
    function saveAll() {
        localStorage.setItem('hr_users', JSON.stringify(users));
        localStorage.setItem('hr_jobs', JSON.stringify(jobs));
        localStorage.setItem('hr_policies', JSON.stringify(policies));
        localStorage.setItem('hr_behaviors', JSON.stringify(behaviors));
        localStorage.setItem('hr_procedures', JSON.stringify(procedures));
        localStorage.setItem('hr_faq', JSON.stringify(faq));
        localStorage.setItem('hr_announcements', JSON.stringify(announcements));
        localStorage.setItem('hr_org_structure', JSON.stringify(orgStructure));
        localStorage.setItem('hr_performance', JSON.stringify(performance));
    }
    
    // تسجيل الدخول
    function login(email, pass) {
        let u = users.find(u => u.email === email && u.password === pass);
        if(u) { currentUser = u; sessionStorage.setItem('user', JSON.stringify(u)); renderApp(); return true; }
        return false;
    }
    
    function register(name, email, pass, confirm) {
        if(pass !== confirm) { alert("كلمة المرور غير متطابقة"); return false; }
        if(users.find(u => u.email === email)) { alert("البريد موجود"); return false; }
        users.push({ id: Date.now(), name, email, password: pass, role: "employee", jobTitle: "موظف" });
        saveAll();
        return true;
    }
    
    function logout() { currentUser = null; sessionStorage.removeItem('user'); renderApp(); }
    
    // شاشة تسجيل الدخول
    function renderLogin() {
        return `
        <div class="login-container">
            <div class="login-card">
                <div style="text-align:center; margin-bottom:20px;"><div style="width:60px;height:60px;background:linear-gradient(135deg,#d4af37,#b8960c);border-radius:20px;margin:0 auto;display:flex;align-items:center;justify-content:center;"><i class="fas fa-crown"></i></div><h2>HR SYSTEM</h2></div>
                <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" value="admin@hr.com">
                <input type="password" id="loginPass" placeholder="كلمة المرور" value="admin123">
                <button class="btn" onclick="doLogin()">دخول</button>
                <div class="register-link">ليس لديك حساب؟ <span onclick="toggleReg()">إنشاء حساب</span></div>
                <div id="regForm" class="register-form">
                    <input type="text" id="regName" placeholder="الاسم الكامل">
                    <input type="email" id="regEmail" placeholder="البريد">
                    <input type="password" id="regPass" placeholder="كلمة المرور">
                    <input type="password" id="regConfirm" placeholder="تأكيد كلمة المرور">
                    <button class="btn" onclick="doRegister()">تسجيل</button>
                </div>
            </div>
        </div>`;
    }
    
    window.doLogin = function() {
        let email = document.getElementById('loginEmail').value;
        let pass = document.getElementById('loginPass').value;
        if(login(email, pass)) alert('تم الدخول ✅');
        else alert('بيانات غير صحيحة ❌');
    };
    window.doRegister = function() {
        let name = document.getElementById('regName').value;
        let email = document.getElementById('regEmail').value;
        let pass = document.getElementById('regPass').value;
        let confirm = document.getElementById('regConfirm').value;
        if(register(name, email, pass, confirm)) { alert('تم التسجيل ✅'); toggleReg(); }
    };
    window.toggleReg = function() {
        let f = document.getElementById('regForm');
        f.classList.toggle('show');
    };
    
    // عرض التفاصيل في نافذة منبثقة
    function showDetail(title, content) {
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3 style="color:#d4af37;">${title}</h3><div style="margin:15px 0;">${content}</div><button class="btn" onclick="this.closest('.modal').remove()">إغلاق</button></div>`;
        document.body.appendChild(modal);
    }
    
    // دليل الموظف - تبويبات
    let guideTab = "policies";
    function renderGuide() {
        let items = [];
        if(guideTab === 'policies') {
            items = policies.map(p => `<div class="guide-item" onclick="showDetail('${p.title}', '<strong>الوصف:</strong><br>${p.description}<br><br><strong>المحتوى:</strong><br>${p.content}')"><div><strong>${p.title}</strong><br><small>${p.description.substring(0,40)}</small></div><i class="fas fa-chevron-left"></i></div>`);
        } else if(guideTab === 'procedures') {
            items = procedures.map(p => `<div class="guide-item" onclick="showDetail('${p.title}', '<strong>الوصف:</strong><br>${p.desc}')"><div><strong>${p.title}</strong><br><small>${p.desc.substring(0,40)}</small></div><i class="fas fa-chevron-left"></i></div>`);
        } else {
            items = behaviors.map(b => `<div class="guide-item" onclick="showDetail('${b.title}', '<strong>الوصف:</strong><br>${b.desc}')"><div><strong>${b.title}</strong><br><small>${b.desc.substring(0,40)}</small></div><i class="fas fa-chevron-left"></i></div>`);
        }
        return `
        <div class="card">
            <div class="guide-tabs">
                <div class="guide-tab ${guideTab === 'policies' ? 'active' : ''}" onclick="setGuideTab('policies')">📜 السياسات</div>
                <div class="guide-tab ${guideTab === 'procedures' ? 'active' : ''}" onclick="setGuideTab('procedures')">📋 الإجراءات</div>
                <div class="guide-tab ${guideTab === 'behaviors' ? 'active' : ''}" onclick="setGuideTab('behaviors')">🤝 السلوكيات</div>
            </div>
            ${items.join('')}
        </div>`;
    }
    window.setGuideTab = function(tab) { guideTab = tab; renderApp(); };
    
    // الصفحات
    let currentPage = "home";
    
    function getGreeting() {
        let h = new Date().getHours();
        if(h < 12) return "صباح الخير";
        if(h < 17) return "مساء الخير";
        return "مساء النور";
    }
    
    function renderHome() {
        return `
        <div class="hero-section">
            <div class="hero-text">
                <div style="font-size:24px; font-weight:bold; color:#d4af37;">${getGreeting()}، ${currentUser?.name?.split(' ')[0] || 'موظف'} 👋</div>
                <div style="margin:8px 0;"><i class="fas fa-briefcase"></i> ${currentUser?.jobTitle || 'موظف'}</div>
                <div><i class="fas fa-lightbulb"></i> "خير الناس أنفعهم للناس"</div>
            </div>
            <div class="hero-image"><i class="fas fa-users"></i></div>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number">${jobs.length}</div><div>المسميات</div></div>
            <div class="stat-card"><div class="stat-number">${policies.length}</div><div>سياسات</div></div>

    // ========== دوال الإدارة ==========
    function showModal(title, html, onSave) {
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3>${title}</h3>${html}<div style="margin-top:15px;"><button class="btn" onclick="saveModal(this)">حفظ</button><button class="btn" style="background:#ef4444;" onclick="this.closest('.modal').remove()">إلغاء</button></div></div>`;
        document.body.appendChild(modal);
        window.saveModal = (btn) => { onSave(); btn.closest('.modal').remove(); };
    }
    
    window.showAddModal = function(type) {
        let fields = {
            job: '<div class="form-group"><label>المسمى</label><input id="title"></div><div class="form-group"><label>القسم</label><input id="dept"></div>',
            policy: '<div class="form-group"><label>العنوان</label><input id="title"></div><div class="form-group"><label>الوصف</label><input id="desc"></div><div class="form-group"><label>المحتوى</label><textarea id="content" rows="3"></textarea></div>',
            behavior: '<div class="form-group"><label>العنوان</label><input id="title"></div><div class="form-group"><label>الوصف</label><textarea id="desc" rows="2"></textarea></div>',
            procedure: '<div class="form-group"><label>العنوان</label><input id="title"></div><div class="form-group"><label>الوصف</label><textarea id="desc" rows="2"></textarea></div>',
            faq: '<div class="form-group"><label>السؤال</label><input id="q"></div><div class="form-group"><label>الإجابة</label><textarea id="a" rows="3"></textarea></div>',
            announcement: '<div class="form-group"><label>العنوان</label><input id="title"></div><div class="form-group"><label>المحتوى</label><textarea id="content" rows="2"></textarea></div>',
            dept: '<div class="form-group"><label>اسم القسم</label><input id="name"></div><div class="form-group"><label>رئيس القسم</label><input id="head"></div><div class="form-group"><label>عدد الأعضاء</label><input id="members" type="number"></div>'
        };
        showModal('إضافة', fields[type], () => {
            if(type === 'job') jobs.push({ id: Date.now(), title: document.getElementById('title').value, department: document.getElementById('dept').value });
            else if(type === 'policy') policies.push({ id: Date.now(), title: document.getElementById('title').value, description: document.getElementById('desc').value, content: document.getElementById('content').value });
            else if(type === 'behavior') behaviors.push({ id: Date.now(), title: document.getElementById('title').value, desc: document.getElementById('desc').value });
            else if(type === 'procedure') procedures.push({ id: Date.now(), step: procedures.length+1, title: document.getElementById('title').value, desc: document.getElementById('desc').value });
            else if(type === 'faq') faq.push({ id: Date.now(), question: document.getElementById('q').value, answer: document.getElementById('a').value });
            else if(type === 'announcement') announcements.push({ id: Date.now(), title: document.getElementById('title').value, content: document.getElementById('content').value, date: new Date().toLocaleDateString() });
            else if(type === 'dept') orgStructure.departments.push({ id: Date.now(), name: document.getElementById('name').value, head: document.getElementById('head').value, members: parseInt(document.getElementById('members').value) });
            saveAll(); renderApp(); alert('تم الإضافة ✅');
        });
    };
    
    window.editItem = function(type, id) {
        let item, fields;
        if(type === 'job') { item = jobs.find(i => i.id === id); fields = `<div class="form-group"><label>المسمى</label><input id="title" value="${item.title}"></div><div class="form-group"><label>القسم</label><input id="dept" value="${item.department}"></div>`; }
        else if(type === 'policy') { item = policies.find(i => i.id === id); fields = `<div class="form-group"><label>العنوان</label><input id="title" value="${item.title}"></div><div class="form-group"><label>الوصف</label><input id="desc" value="${item.description}"></div><div class="form-group"><label>المحتوى</label><textarea id="content">${item.content}</textarea></div>`; }
        else if(type === 'behavior') { item = behaviors.find(i => i.id === id); fields = `<div class="form-group"><label>العنوان</label><input id="title" value="${item.title}"></div><div class="form-group"><label>الوصف</label><textarea id="desc">${item.desc}</textarea></div>`; }
        else if(type === 'procedure') { item = procedures.find(i => i.id === id); fields = `<div class="form-group"><label>العنوان</label><input id="title" value="${item.title}"></div><div class="form-group"><label>الوصف</label><textarea id="desc">${item.desc}</textarea></div>`; }
        else if(type === 'faq') { item = faq.find(i => i.id === id); fields = `<div class="form-group"><label>السؤال</label><input id="q" value="${item.question}"></div><div class="form-group"><label>الإجابة</label><textarea id="a">${item.answer}</textarea></div>`; }
        else if(type === 'announcement') { item = announcements.find(i => i.id === id); fields = `<div class="form-group"><label>العنوان</label><input id="title" value="${item.title}"></div><div class="form-group"><label>المحتوى</label><textarea id="content">${item.content}</textarea></div>`; }
        showModal('تعديل', fields, () => {
            if(type === 'job') { item.title = document.getElementById('title').value; item.department = document.getElementById('dept').value; }
            else if(type === 'policy') { item.title = document.getElementById('title').value; item.description = document.getElementById('desc').value; item.content = document.getElementById('content').value; }
            else if(type === 'behavior') { item.title = document.getElementById('title').value; item.desc = document.getElementById('desc').value; }
            else if(type === 'procedure') { item.title = document.getElementById('title').value; item.desc = document.getElementById('desc').value; }
            else if(type === 'faq') { item.question = document.getElementById('q').value; item.answer = document.getElementById('a').value; }
            else if(type === 'announcement') { item.title = document.getElementById('title').value; item.content = document.getElementById('content').value; item.date = new Date().toLocaleDateString(); }
            saveAll(); renderApp(); alert('تم التعديل ✅');
        });
    };
    
    window.deleteItem = function(type, id) {
        if(confirm('حذف؟')) {
            if(type === 'job') jobs = jobs.filter(i => i.id !== id);
            else if(type === 'policy') policies = policies.filter(i => i.id !== id);
            else if(type === 'behavior') behaviors = behaviors.filter(i => i.id !== id);
            else if(type === 'procedure') procedures = procedures.filter(i => i.id !== id);
            else if(type === 'faq') faq = faq.filter(i => i.id !== id);
            else if(type === 'announcement') announcements = announcements.filter(i => i.id !== id);
            saveAll(); renderApp(); alert('تم الحذف ✅');
        }
    };

    // تعديل معايير التقييم
    window.editPerformance = function(jobTitle) {
        let perf = performance[jobTitle];
        let criteriaHtml = perf.criteria.map((c, idx) => `
            <div style="margin-bottom:10px; padding:10px; background:rgba(255,255,255,0.05); border-radius:10px;">
                <div class="form-group"><label>اسم المعيار</label><input id="cName${idx}" value="${c.name}"></div>
                <div style="display:flex; gap:10px;">
                    <div class="form-group" style="flex:1"><label>الدرجة الحالية</label><input id="cValue${idx}" type="number" value="${c.value}"></div>
                    <div class="form-group" style="flex:1"><label>الدرجة القصوى</label><input id="cMax${idx}" type="number" value="${c.max}"></div>
                    <div class="form-group" style="flex:1"><label>الوزن %</label><input id="cWeight${idx}" type="number" value="${c.weight}"></div>
                </div>
            </div>
        `).join('');
        
        showModal(`تعديل معايير التقييم - ${jobTitle}`, `
            ${criteriaHtml}
            <button class="btn" style="margin-top:5px;" onclick="addPerformanceCriteria()">+ إضافة معيار</button>
        `, () => {
            let newCriteria = [];
            for(let i = 0; i < perf.criteria.length; i++) {
                if(document.getElementById(`cName${i}`)) {
                    newCriteria.push({
                        name: document.getElementById(`cName${i}`).value,
                        value: parseInt(document.getElementById(`cValue${i}`).value),
                        max: parseInt(document.getElementById(`cMax${i}`).value),
                        weight: parseInt(document.getElementById(`cWeight${i}`).value)
                    });
                }
            }
            performance[jobTitle].criteria = newCriteria;
            saveAll(); renderApp(); alert('تم تعديل معايير التقييم ✅');
        });
    };
    
    window.addPerformanceCriteria = function() {
        let container = document.querySelector('.modal-content');
        let idx = Date.now();
        let div = document.createElement('div');
        div.style.cssText = 'margin-bottom:10px; padding:10px; background:rgba(255,255,255,0.05); border-radius:10px;';
        div.innerHTML = `
            <div class="form-group"><label>اسم المعيار</label><input id="cName${idx}" placeholder="اسم المعيار"></div>
            <div style="display:flex; gap:10px;">
                <div class="form-group" style="flex:1"><label>الدرجة الحالية</label><input id="cValue${idx}" type="number" value="80"></div>
                <div class="form-group" style="flex:1"><label>الدرجة القصوى</label><input id="cMax${idx}" type="number" value="100"></div>
                <div class="form-group" style="flex:1"><label>الوزن %</label><input id="cWeight${idx}" type="number" value="10"></div>
            </div>
        `;
        container.insertBefore(div, container.querySelector('.btn-primary'));
    };

            <div class="nav-item ${currentPage === 'notifications' ? 'active' : ''}" data-page="notifications"><i class="fas fa-bell"></i> الإشعارات</div>
            <div class="nav-item ${currentPage === 'profile' ? 'active' : ''}" data-page="profile"><i class="fas fa-user"></i> حسابي</div>
            ${isAdmin ? `<div class="nav-item ${currentPage === 'admin' ? 'active' : ''}" data-page="admin"><i class="fas fa-cog"></i> لوحة التحكم</div>` : ''}
            <div class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</div>
        </div>
        <div class="main-content">
            <div class="top-bar"><button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div class="page-title">${getTitle()}</div><div class="avatar"><i class="fas fa-user"></i></div></div>
            <div id="pageContent"></div>
        </div>
        <div class="bottom-nav">
            <div class="bottom-nav-item ${currentPage === 'home' ? 'active' : ''}" data-page="home"><i class="fas fa-home"></i><span>الرئيسية</span></div>
            <div class="bottom-nav-item ${currentPage === 'guide' ? 'active' : ''}" data-page="guide"><i class="fas fa-book"></i><span>الدليل</span></div>
            <div class="bottom-nav-item ${currentPage === 'profile' ? 'active' : ''}" data-page="profile"><i class="fas fa-user"></i><span>حسابي</span></div>
            <div class="bottom-nav-item ${currentPage === 'notifications' ? 'active' : ''}" data-page="notifications"><i class="fas fa-bell"></i><span>إشعارات</span></div>
        </div>`;
        renderPage();
        attachEvents();
    }
    
    function getTitle() {
        let titles = { home:"الرئيسية", guide:"دليل الموظف", org:"الهيكل التنظيمي", performance:"تقييم الأداء", notifications:"الإشعارات", profile:"حسابي", admin:"لوحة التحكم" };
        return titles[currentPage] || "الرئيسية";
    }
    
    function renderPage() {
        let pages = { home: renderHome, guide: renderGuide, org: renderOrg, performance: renderPerformance, notifications: renderNotifications, profile: renderProfile, admin: renderAdmin };
        document.getElementById('pageContent').innerHTML = (pages[currentPage] || renderHome)();
    }
    
    function attachEvents() {
        document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(el => {
            let page = el.dataset.page;
            if(page) el.onclick = () => { currentPage = page; renderApp(); };
        });
    }
    
    let savedUser = sessionStorage.getItem('user');
    if(savedUser) currentUser = JSON.parse(savedUser);
    renderApp();
    saveAll();
</script>
</body>
</html>
