<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>دليل الموظف | HR Guide</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(145deg, #0a1a2f, #061220);
            direction: rtl;
            color: #fff;
            min-height: 100vh;
        }
        
        /* شاشة الدخول */
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card {
            background: rgba(10, 26, 47, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 35px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .login-card h2 { text-align: center; color: #d4af37; margin-bottom: 20px; }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(255,255,255,0.08); border: 1px solid rgba(212,175,55,0.3); border-radius: 30px; color: white; font-size: 16px; }
        .login-card input::placeholder { color: rgba(255,255,255,0.5); }
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; font-weight: bold; border: none; border-radius: 30px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn:hover { transform: scale(1.02); opacity: 0.9; }
        .register-link { text-align: center; margin-top: 15px; font-size: 13px; }
        .register-link span { color: #d4af37; cursor: pointer; }
        .register-form { display: none; margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(212,175,55,0.2); }
        .register-form.show { display: block; }
        
        /* القائمة الجانبية */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 270px;
            height: 100vh;
            background: #0a1a2f;
            border-left: 1px solid rgba(212,175,55,0.2);
            z-index: 200;
            transition: all 0.3s;
            overflow-y: auto;
        }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid rgba(212,175,55,0.2); }
        .logo { font-size: 24px; color: #d4af37; font-weight: bold; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 20px; margin: 5px 15px;
            border-radius: 12px; cursor: pointer; color: #a0aec0; transition: 0.2s;
        }
        .nav-item:hover { background: rgba(212,175,55,0.15); color: #d4af37; }
        .nav-item.active { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; }
        .nav-item i { width: 25px; font-size: 18px; }
        
        /* المحتوى الرئيسي */
        .main-content { margin-right: 270px; padding: 20px; }
        .top-bar {
            background: rgba(10, 26, 47, 0.9); padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-radius: 20px; margin-bottom: 20px;
        }
        .page-title { font-size: 22px; color: #d4af37; font-weight: bold; }
        .avatar { width: 40px; height: 40px; background: linear-gradient(135deg, #d4af37, #b8960c); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .avatar i { font-size: 20px; color: #0a1a2f; }
        
        .bottom-nav {
            display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #0a1a2f;
            padding: 10px 12px 25px; justify-content: space-around; z-index: 150;
            border-top: 1px solid rgba(212,175,55,0.2);
        }
        .bottom-nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            font-size: 11px; color: #94a3b8; cursor: pointer; padding: 5px 10px; border-radius: 25px;
        }
        .bottom-nav-item.active { color: #d4af37; background: rgba(212,175,55,0.15); }
        .bottom-nav-item i { font-size: 22px; }
        
        .card { background: rgba(10, 26, 47, 0.9); border-radius: 20px; padding: 18px; margin-bottom: 18px; border: 1px solid rgba(212,175,55,0.2); }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
        .stat-card { background: rgba(10, 26, 47, 0.9); border-radius: 16px; padding: 15px; text-align: center; }
        .stat-number { font-size: 28px; font-weight: bold; color: #d4af37; }
        .stat-card i { font-size: 24px; margin-bottom: 8px; color: #d4af37; }
        
        .hero-section {
            background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(10,26,47,0.9));
            border-radius: 25px; padding: 20px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .hero-image { width: 70px; height: 70px; background: linear-gradient(135deg, #d4af37, #b8960c); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .hero-image i { font-size: 35px; color: #0a1a2f; }
        
        .guide-tabs { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .guide-tab { padding: 6px 15px; border-radius: 30px; cursor: pointer; background: rgba(212,175,55,0.1); }
        .guide-tab.active { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; }
        .guide-item {
            background: rgba(10, 26, 47, 0.7);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .guide-item:hover { border-color: #d4af37; }
        
        .modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: linear-gradient(145deg, #0a1a2f, #061220);
            border-radius: 24px; padding: 22px; width: 90%; max-width: 500px;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .form-group { margin-bottom: 12px; }
        .form-group label { color: #d4af37; display: block; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.3); border-radius: 12px; color: white;
        }
        
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .admin-card {
            background: rgba(10, 26, 47, 0.7);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .admin-card:hover { background: rgba(212,175,55,0.15); transform: translateY(-2px); }
        .admin-card i { font-size: 26px; color: #d4af37; margin-bottom: 6px; display: block; }
        
        .org-ceo {
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 18px;
            padding: 15px;
            text-align: center;
            color: #0a1a2f;
            cursor: pointer;
        }
        .org-dept {
            background: rgba(10, 26, 47, 0.8);
            border-radius: 14px;
            padding: 12px;
            min-width: 140px;
            text-align: center;
            border: 1px solid rgba(212,175,55,0.3);
            cursor: pointer;
        }
        
        .menu-toggle { display: none; background: none; border: none; font-size: 24px; color: white; cursor: pointer; }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            left: 20px;
            max-width: 350px;
            margin: 0 auto;
            background: #4caf50;
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            z-index: 10000;
            text-align: center;
            transform: translateY(100px);
            transition: 0.3s ease;
        }
        .toast.show { transform: translateY(0); }
        .toast.error { background: #ef4444; }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; padding-bottom: 70px; }
            .bottom-nav { display: flex; }
            .menu-toggle { display: block; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .admin-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    // بيانات أولية بسيطة
    let users = [{ id: 1, email: "admin@hr.com", password: "admin123", name: "المدير", role: "admin", jobTitle: "مدير" }];
    let currentUser = null;
    let currentPage = "home";
    let guideTab = "policies";
    
    let policies = [
        { id: 1, title: "سياسة الإجازة السنوية", description: "21 يوم إجازة مدفوعة", content: "يحق للموظف 21 يوم إجازة سنوية مدفوعة الأجر" },
        { id: 2, title: "سياسة سلفة الراتب", description: "سلفة تصل 50%", content: "بعد 6 أشهر يحق للموظف طلب سلفة" }
    ];
    
    let behaviors = [
        { id: 1, title: "الاحترافية", desc: "الحفاظ على سلوك محترم مع الزملاء" },
        { id: 2, title: "الالتزام بالمواعيد", desc: "الحضور في الوقت المحدد" }
    ];
    
    let procedures = [
        { id: 1, title: "تقديم إجازة", desc: "سجل الدخول واختر الإجازات" },
        { id: 2, title: "تقديم شكوى", desc: "اكتب الشكوى في قسم الشكاوى" }
    ];
    
    let faq = [
        { id: 1, question: "ما هي سياسة الإجازة؟", answer: "21 يوم إجازة سنوية" }
    ];
    
    let announcements = [
        { id: 1, title: "مرحباً", content: "مرحباً بكم في دليل الموظف", date: new Date().toLocaleDateString() }
    ];
    
    let companyData = {
        name: "شركة التميز للاستشارات",
        vision: "الريادة في تقديم الحلول المتميزة",
        mission: "تقديم خدمات مبتكرة لعملائنا"
    };
    
    let orgStructure = {
        ceo: { name: "مجلس الإدارة", head: "المدير التنفيذي", members: 5 },
        departments: [
            { id: 1, name: "الموارد البشرية", head: "مدير الموارد", members: 12 }
        ]
    };
    
    // دوال مساعدة
    function showToast(msg, isError = false) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        if (isError) toast.classList.add('error');
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 100);
        setTimeout(() => { toast.remove(); }, 3000);
    }
    
    function login(email, pass) {
        let user = users.find(u => u.email === email && u.password === pass);
        if (user) {
            currentUser = user;
            sessionStorage.setItem('user', JSON.stringify(user));
            renderApp();
            return true;
        }
        return false;
    }
    
    function register(name, email, pass, confirm) {
        if (pass !== confirm) { showToast("كلمة المرور غير متطابقة", true); return false; }
        if (users.find(u => u.email === email)) { showToast("البريد موجود", true); return false; }
        users.push({ id: Date.now(), name, email, password: pass, role: "employee", jobTitle: "موظف" });
        showToast("تم التسجيل");
        return true;
    }
    
    function logout() { currentUser = null; sessionStorage.removeItem('user'); renderApp(); }
    
    function showDetail(title, content) {
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3 style="color:#d4af37;">${title}</h3><div style="margin:15px 0;">${content}</div><button class="btn" onclick="this.closest('.modal').remove()">إغلاق</button></div>`;
        document.body.appendChild(modal);
    }
    
    // دوال العرض
    function renderLogin() {
        return `<div class="login-container"><div class="login-card">
            <div style="text-align:center;"><div style="width:60px;height:60px;background:linear-gradient(135deg,#d4af37,#b8960c);border-radius:20px;margin:0 auto;display:flex;align-items:center;justify-content:center;"><i class="fas fa-book" style="font-size:28px;color:#0a1a2f;"></i></div><h2>دليل الموظف</h2><p style="font-size:12px;">نظام متزامن مع السحابة ☁️</p></div>
            <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" value="admin@hr.com">
            <input type="password" id="loginPass" placeholder="كلمة المرور" value="admin123">
            <button class="btn" onclick="doLogin()">دخول</button>
            <div class="register-link">حساب جديد؟ <span onclick="toggleReg()">إنشاء حساب</span></div>
            <div id="regForm" class="register-form">
                <input type="text" id="regName" placeholder="الاسم الكامل">
                <input type="email" id="regEmail" placeholder="البريد">
                <input type="password" id="regPass" placeholder="كلمة المرور">
                <input type="password" id="regConfirm" placeholder="تأكيد">
                <button class="btn" onclick="doRegister()">تسجيل</button>
            </div>
        </div></div>`;
    }
    
    window.doLogin = function() {
        let email = document.getElementById('loginEmail').value;
        let pass = document.getElementById('loginPass').value;
        if (!login(email, pass)) showToast("بيانات غير صحيحة", true);
    };
    
    window.doRegister = function() {
        let n = document.getElementById('regName').value;
        let e = document.getElementById('regEmail').value;
        let p = document.getElementById('regPass').value;
        let c = document.getElementById('regConfirm').value;
        if (register(n, e, p, c)) toggleReg();
    };
    
    window.toggleReg = function() {
        document.getElementById('regForm').classList.toggle('show');
    };
    
    function renderGuide() {
        let items = [];
        if (guideTab === 'policies') {
            items = policies.map(p => `<div class="guide-item" onclick="showDetail('${p.title}','<strong>${p.description}</strong><br><br>${p.content}')"><div><strong>${p.title}</strong><br><small>${p.description.substring(0,40)}</small></div><i class="fas fa-chevron-left"></i></div>`);
        } else if (guideTab === 'procedures') {
            items = procedures.map(p => `<div class="guide-item" onclick="showDetail('${p.title}','${p.desc}')"><div><strong>${p.title}</strong><br><small>${p.desc.substring(0,40)}</small></div><i class="fas fa-chevron-left"></i></div>`);
        } else {
            items = behaviors.map(b => `<div class="guide-item" onclick="showDetail('${b.title}','${b.desc}')"><div><strong>${b.title}</strong><br><small>${b.desc.substring(0,40)}</small></div><i class="fas fa-chevron-left"></i></div>`);
        }
        return `<div class="card"><div class="guide-tabs"><div class="guide-tab ${guideTab==='policies'?'active':''}" onclick="setGuideTab('policies')">📜 السياسات</div><div class="guide-tab ${guideTab==='procedures'?'active':''}" onclick="setGuideTab('procedures')">📋 الإجراءات</div><div class="guide-tab ${guideTab==='behaviors'?'active':''}" onclick="setGuideTab('behaviors')">🤝 السلوكيات</div></div>${items.join('')}</div>
        <div class="card"><h3>❓ أسئلة شائعة</h3>${faq.map(f=>`<div style="padding:10px;"><strong>${f.question}</strong><br>${f.answer}</div>`).join('')}</div>`;
    }
    
    window.setGuideTab = function(tab) { guideTab = tab; renderApp(); };
    
    function getGreeting() {
        let h = new Date().getHours();
        if (h < 12) return "صباح الخير";
        if (h < 17) return "مساء الخير";
        return "مساء النور";
    }
    
    function renderHome() {
        return `<div class="hero-section"><div><div style="font-size:24px;font-weight:bold;color:#d4af37;">${getGreeting()}، ${currentUser?.name || 'موظف'} 👋</div><div><i class="fas fa-briefcase"></i> ${currentUser?.jobTitle || 'موظف'}</div><div><i class="fas fa-cloud"></i> مرحباً بك في دليل الموظف</div></div><div class="hero-image"><i class="fas fa-book"></i></div></div>
        <div class="stats-grid"><div class="stat-card"><i class="fas fa-file-alt"></i><div class="stat-number">${policies.length}</div><div>سياسات</div></div><div class="stat-card"><i class="fas fa-handshake"></i><div class="stat-number">${behaviors.length}</div><div>سلوكيات</div></div><div class="stat-card"><i class="fas fa-list-ol"></i><div class="stat-number">${procedures.length}</div><div>إجراءات</div></div><div class="stat-card"><i class="fas fa-question-circle"></i><div class="stat-number">${faq.length}</div><div>أسئلة</div></div></div>`;
    }
    
    function renderCompany() {
        return `<div class="card"><h2 style="color:#d4af37; text-align:center;">${companyData.name}</h2></div>
        <div class="card"><h3>الرؤية</h3><p>${companyData.vision}</p></div>
        <div class="card"><h3>الرسالة</h3><p>${companyData.mission}</p></div>`;
    }
    
    function renderOrg() {
        return `<div class="card"><div class="org-ceo" style="margin-bottom:15px;"><i class="fas fa-crown"></i><h3>${orgStructure.ceo.name}</h3><p>${orgStructure.ceo.head}</p></div><div style="display:flex;flex-wrap:wrap;gap:15px;">${orgStructure.departments.map(d=>`<div class="org-dept"><i class="fas fa-building"></i><h4>${d.name}</h4><p>${d.head}</p></div>`).join('')}</div></div>`;
    }
    
    function renderNotifications() {
        return `<div class="card"><h3>📢 الإعلانات</h3>${announcements.map(a=>`<div style="padding:10px;"><strong>${a.title}</strong><br>${a.content}<br><small>${a.date}</small></div>`).join('')}</div>`;
    }
    
    function renderProfile() {
        return `<div class="card"><h3>👤 حسابي</h3><div class="form-group"><label>الاسم</label><input id="pName" value="${currentUser?.name||''}"></div><div class="form-group"><label>البريد</label><input id="pEmail" value="${currentUser?.email||''}"></div><button class="btn" onclick="updateProfile()">💾 حفظ</button><button class="btn" style="margin-top:10px;background:#ef4444;" onclick="logout()">🚪 خروج</button></div>`;
    }
    
    function updateProfile() {
        currentUser.name = document.getElementById('pName').value;
        currentUser.email = document.getElementById('pEmail').value;
        let idx = users.findIndex(u => u.id === currentUser.id);
        if (idx !== -1) users[idx] = currentUser;
        showToast("تم حفظ البيانات");
        renderApp();
    }
    
    function renderAdmin() {
        if (currentUser?.role !== 'admin') return '<div class="card">🔒 للمدير فقط</div>';
        return `<div class="card"><h3>⚙️ لوحة التحكم</h3><div class="admin-grid">
            <div class="admin-card" onclick="showAddModal('policy')"><i class="fas fa-file-alt"></i><div>إضافة سياسة</div></div>
            <div class="admin-card" onclick="showAddModal('behavior')"><i class="fas fa-handshake"></i><div>إضافة سلوك</div></div>
            <div class="admin-card" onclick="showAddModal('procedure')"><i class="fas fa-list-ol"></i><div>إضافة إجراء</div></div>
            <div class="admin-card" onclick="showAddModal('faq')"><i class="fas fa-question"></i><div>إضافة سؤال</div></div>
            <div class="admin-card" onclick="showAddModal('announcement')"><i class="fas fa-bell"></i><div>إضافة إعلان</div></div>
        </div></div>
        <div class="card"><h4>📜 السياسات</h4>${policies.map(p=>`<div style="display:flex;justify-content:space-between;padding:10px;"><span><strong>${p.title}</strong></span><span><button class="btn" style="width:auto;padding:3px 10px;" onclick="editItem('policy',${p.id})">✏️</button> <button class="btn" style="width:auto;padding:3px 10px;background:#ef4444;" onclick="deleteItem('policy',${p.id})">🗑️</button></span></div>`).join('')}</div>
        <div class="card"><h4>🤝 السلوكيات</h4>${behaviors.map(b=>`<div style="display:flex;justify-content:space-between;padding:10px;"><span><strong>${b.title}</strong></span><span><button class="btn" style="width:auto;padding:3px 10px;" onclick="editItem('behavior',${b.id})">✏️</button> <button class="btn" style="width:auto;padding:3px 10px;background:#ef4444;" onclick="deleteItem('behavior',${b.id})">🗑️</button></span></div>`).join('')}</div>
        <div class="card"><h4>📋 الإجراءات</h4>${procedures.map(p=>`<div style="display:flex;justify-content:space-between;padding:10px;"><span><strong>${p.title}</strong></span><span><button class="btn" style="width:auto;padding:3px 10px;" onclick="editItem('procedure',${p.id})">✏️</button> <button class="btn" style="width:auto;padding:3px 10px;background:#ef4444;" onclick="deleteItem('procedure',${p.id})">🗑️</button></span></div>`).join('')}</div>`;
    }
    
    function showModal(title, html, onSave) {
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3>${title}</h3>${html}<div style="margin-top:15px;"><button class="btn" onclick="saveModal(this)">حفظ</button><button class="btn" style="background:#ef4444;" onclick="this.closest('.modal').remove()">إلغاء</button></div></div>`;
        document.body.appendChild(modal);
        window.saveModal = async (btn) => { await onSave(); btn.closest('.modal').remove(); };
    }
    
    window.showAddModal = function(type) {
        let fields = {
            policy: '<div class="form-group"><label>العنوان</label><input id="title"></div><div class="form-group"><label>الوصف</label><input id="desc"></div><div class="form-group"><label>المحتوى</label><textarea id="content" rows="3"></textarea></div>',
            behavior: '<div class="form-group"><label>العنوان</label><input id="title"></div><div class="form-group"><label>الوصف</label><textarea id="desc" rows="2"></textarea></div>',
            procedure: '<div class="form-group"><label>العنوان</label><input id="title"></div><div class="form-group"><label>الوصف</label><textarea id="desc" rows="2"></textarea></div>',
            faq: '<div class="form-group"><label>السؤال</label><input id="q"></div><div class="form-group"><label>الإجابة</label><textarea id="a" rows="3"></textarea></div>',
            announcement: '<div class="form-group"><label>العنوان</label><input id="title"></div><div class="form-group"><label>المحتوى</label><textarea id="content" rows="2"></textarea></div>'
        };
        showModal('إضافة', fields[type], async () => {
            if (type === 'policy') policies.push({ id: Date.now(), title: document.getElementById('title').value, description: document.getElementById('desc').value, content: document.getElementById('content').value });
            else if (type === 'behavior') behaviors.push({ id: Date.now(), title: document.getElementById('title').value, desc: document.getElementById('desc').value });
            else if (type === 'procedure') procedures.push({ id: Date.now(), title: document.getElementById('title').value, desc: document.getElementById('desc').value });
            else if (type === 'faq') faq.push({ id: Date.now(), question: document.getElementById('q').value, answer: document.getElementById('a').value });
            else if (type === 'announcement') announcements.push({ id: Date.now(), title: document.getElementById('title').value, content: document.getElementById('content').value, date: new Date().toLocaleDateString() });
            renderApp();
            showToast("تمت الإضافة");
        });
    };
    
    window.editItem = function(type, id) {
        let item, html;
        if (type === 'policy') { 
            item = policies.find(i => i.id === id); 
            html = `<div class="form-group"><label>العنوان</label><input id="title" value="${item.title}"></div><div class="form-group"><label>الوصف</label><input id="desc" value="${item.description}"></div><div class="form-group"><label>المحتوى</label><textarea id="content">${item.content}</textarea></div>`; 
        } else if (type === 'behavior') { 
            item = behaviors.find(i => i.id === id); 
            html = `<div class="form-group"><label>العنوان</label><input id="title" value="${item.title}"></div><div class="form-group"><label>الوصف</label><textarea id="desc">${item.desc}</textarea></div>`; 
        } else { 
            item = procedures.find(i => i.id === id); 
            html = `<div class="form-group"><label>العنوان</label><input id="title" value="${item.title}"></div><div class="form-group"><label>الوصف</label><textarea id="desc">${item.desc}</textarea></div>`; 
        }
        showModal('تعديل', html, async () => {
            if (type === 'policy') { item.title = document.getElementById('title').value; item.description = document.getElementById('desc').value; item.content = document.getElementById('content').value; }
            else if (type === 'behavior') { item.title = document.getElementById('title').value; item.desc = document.getElementById('desc').value; }
            else { item.title = document.getElementById('title').value; item.desc = document.getElementById('desc').value; }
            renderApp();
            showToast("تم التعديل");
        });
    };
    
    window.deleteItem = function(type, id) {
        if (confirm('حذف؟')) {
            if (type === 'policy') policies = policies.filter(i => i.id !== id);
            else if (type === 'behavior') behaviors = behaviors.filter(i => i.id !== id);
            else procedures = procedures.filter(i => i.id !== id);
            renderApp();
            showToast("تم الحذف");
        }
    };
    
    // العرض الرئيسي
    function renderApp() {
        if (!currentUser) {
            document.getElementById('app').innerHTML = renderLogin();
            return;
        }
        let isAdmin = currentUser.role === 'admin';
        document.getElementById('app').innerHTML = `
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header"><div class="logo"><i class="fas fa-book"></i> دليل الموظف</div></div>
            <div class="nav-item ${currentPage === 'home' ? 'active' : ''}" data-page="home"><i class="fas fa-home"></i> الرئيسية</div>
            <div class="nav-item ${currentPage === 'guide' ? 'active' : ''}" data-page="guide"><i class="fas fa-book"></i> الدليل</div>
            <div class="nav-item ${currentPage === 'company' ? 'active' : ''}" data-page="company"><i class="fas fa-building"></i> عن الشركة</div>
            <div class="nav-item ${currentPage === 'org' ? 'active' : ''}" data-page="org"><i class="fas fa-sitemap"></i> الهيكل التنظيمي</div>
            <div class="nav-item ${currentPage === 'notifications' ? 'active' : ''}" data-page="notifications"><i class="fas fa-bell"></i> الإشعارات</div>
            <div class="nav-item ${currentPage === 'profile' ? 'active' : ''}" data-page="profile"><i class="fas fa-user"></i> حسابي</div>
            ${isAdmin ? `<div class="nav-item ${currentPage === 'admin' ? 'active' : ''}" data-page="admin"><i class="fas fa-cog"></i> لوحة التحكم</div>` : ''}
            <div class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</div>
        </div>
        <div class="main-content">
            <div class="top-bar"><button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button><div class="page-title">${getTitle()}</div><div class="avatar"><i class="fas fa-user"></i></div></div>
            <div id="pageContent"></div>
        </div>
        <div class="bottom-nav">
            <div class="bottom-nav-item ${currentPage === 'home' ? 'active' : ''}" data-page="home"><i class="fas fa-home"></i><span>الرئيسية</span></div>
            <div class="bottom-nav-item ${currentPage === 'guide' ? 'active' : ''}" data-page="guide"><i class="fas fa-book"></i><span>الدليل</span></div>
            <div class="bottom-nav-item ${currentPage === 'profile' ? 'active' : ''}" data-page="profile"><i class="fas fa-user"></i><span>حسابي</span></div>
        </div>`;
        renderPage();
        attachEvents();
    }
    
    function getTitle() {
        let titles = { home: "الرئيسية", guide: "الدليل", company: "عن الشركة", org: "الهيكل التنظيمي", notifications: "الإشعارات", profile: "حسابي", admin: "لوحة التحكم" };
        return titles[currentPage] || "الرئيسية";
    }
    
    function renderPage() {
        let pages = { home: renderHome, guide: renderGuide, company: renderCompany, org: renderOrg, notifications: renderNotifications, profile: renderProfile, admin: renderAdmin };
        document.getElementById('pageContent').innerHTML = (pages[currentPage] || renderHome)();
    }
    
    function attachEvents() {
        document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(el => {
            let page = el.dataset.page;
            if (page) el.onclick = () => { currentPage = page; renderApp(); };
        });
    }
    
    // بدء التشغيل
    let savedUser = sessionStorage.getItem('user');
    if (savedUser) currentUser = JSON.parse(savedUser);
    renderApp();
</script>
</body>
</html>
