<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR System | دليل الموظف - سحابي</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0a1a2f 0%, #061220 100%);
            min-height: 100vh;
            color: #fff;
        }
        .login-container { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-card {
            background: rgba(10, 26, 47, 0.95);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #d4af37;
        }
        .login-card h2 { color: #d4af37; margin: 20px 0; }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(255,255,255,0.1);
            border: 1px solid #d4af37;
            border-radius: 30px;
            color: white;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border: none;
            border-radius: 30px;
            color: #0a1a2f;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover { opacity: 0.9; transform: scale(1.02); }
        .register-link { margin-top: 15px; font-size: 13px; }
        .register-link span { color: #d4af37; cursor: pointer; }
        .register-form { display: none; margin-top: 15px; }
        .register-form.show { display: block; }
        
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: #0a1a2f;
            border-left: 1px solid #d4af37;
            padding: 20px 0;
            transition: 0.3s;
            z-index: 100;
        }
        .sidebar-header { text-align: center; padding: 20px; border-bottom: 1px solid rgba(212,175,55,0.3); }
        .logo { font-size: 22px; color: #d4af37; font-weight: bold; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            margin: 5px 15px;
            border-radius: 12px;
            cursor: pointer;
            color: #a0aec0;
            transition: 0.2s;
        }
        .nav-item:hover { background: rgba(212,175,55,0.15); color: #d4af37; }
        .nav-item.active { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; }
        .nav-item i { width: 25px; }
        
        .main-content { margin-right: 260px; padding: 20px; }
        .top-bar {
            background: rgba(10, 26, 47, 0.9);
            padding: 15px 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .page-title { font-size: 20px; color: #d4af37; font-weight: bold; }
        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card {
            background: rgba(10, 26, 47, 0.9);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card {
            background: rgba(10, 26, 47, 0.9);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .stat-number { font-size: 32px; font-weight: bold; color: #d4af37; }
        
        .hero-section {
            background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(10,26,47,0.9));
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hero-image {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-image i { font-size: 35px; color: #0a1a2f; }
        
        .guide-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .guide-tab {
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            background: rgba(212,175,55,0.1);
        }
        .guide-tab.active { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; }
        .guide-item {
            background: rgba(10, 26, 47, 0.7);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #0a1a2f;
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #d4af37;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { color: #d4af37; display: block; margin-bottom: 5px; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 10px;
            color: white;
        }
        
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .admin-card {
            background: rgba(10, 26, 47, 0.7);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .admin-card:hover { background: rgba(212,175,55,0.15); transform: translateY(-2px); }
        .admin-card i { font-size: 30px; color: #d4af37; margin-bottom: 8px; display: block; }
        
        .org-ceo {
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            color: #0a1a2f;
            cursor: pointer;
        }
        .org-departments { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
        .org-dept {
            background: rgba(10, 26, 47, 0.8);
            border-radius: 12px;
            padding: 15px;
            flex: 1;
            min-width: 150px;
            text-align: center;
            border: 1px solid rgba(212,175,55,0.3);
            cursor: pointer;
        }
        
        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            max-width: 350px;
            margin: 0 auto;
            background: #4caf50;
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            text-align: center;
            z-index: 10000;
            transform: translateY(100px);
            transition: 0.3s;
        }
        .toast.show { transform: translateY(0); }
        .toast.error { background: #ef4444; }
        
        .ai-fab {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 300;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .ai-fab i { font-size: 28px; color: #0a1a2f; }
        .ai-chat {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 320px;
            background: rgba(10, 26, 47, 0.98);
            border-radius: 15px;
            border: 1px solid #d4af37;
            z-index: 301;
            transform: scale(0);
            transition: 0.3s;
            transform-origin: bottom left;
        }
        .ai-chat.open { transform: scale(1); }
        .ai-header {
            padding: 12px 15px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 15px 15px 0 0;
            color: #0a1a2f;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }
        .ai-messages { max-height: 300px; overflow-y: auto; padding: 10px; }
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 15px;
            max-width: 85%;
            font-size: 13px;
        }
        .user-message { background: rgba(212, 175, 55, 0.2); margin-right: auto; text-align: right; }
        .ai-message { background: rgba(255, 255, 255, 0.1); margin-left: auto; text-align: left; }
        .ai-input-area { display: flex; padding: 10px; gap: 10px; border-top: 1px solid rgba(212,175,55,0.2); }
        .ai-input-area input { flex: 1; padding: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(212,175,55,0.3); border-radius: 25px; color: white; }
        .ai-input-area button { width: auto; padding: 8px 15px; }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; }
            .menu-toggle { display: block; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div id="app">
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <div class="loading-spinner" style="width:50px;height:50px;border:4px solid rgba(212,175,55,0.3);border-top-color:#d4af37;border-radius:50%;animation:spin 1s linear infinite;"></div>
        <div style="color:#d4af37; margin-top:20px;">جاري تحميل البيانات من السحابة...</div>
    </div>
</div>
<style>
    @keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
    // ========================================
    // نظام إدارة الموارد البشرية - النسخة السحابية
    // تم تصحيح جميع الأخطاء
    // ========================================
    
    // -------------------- بيانات أولية آمنة --------------------
    let users = [{ id: 1, email: "admin@hr.com", password: "admin123", name: "أحمد المدير", role: "admin", jobTitle: "مدير الموارد البشرية" }];
    let currentUser = null;
    let currentPage = "home";
    let guideTab = "policies";
    let lastUpdated = 0;  // ✅ حل مشكلة JSON.stringify
    
    // بيانات افتراضية
    let policies = [
        { id: 1, title: "سياسة الإجازة السنوية", description: "21 يوم إجازة مدفوعة", content: "يحق للموظف 21 يوم إجازة سنوية مدفوعة الأجر" },
        { id: 2, title: "سياسة سلفة الراتب", description: "سلفة تصل 50%", content: "بعد 6 أشهر يحق للموظف طلب سلفة" }
    ];
    
    let behaviors = [
        { id: 1, title: "الاحترافية", desc: "الحفاظ على سلوك محترم مع الزملاء" },
        { id: 2, title: "الالتزام بالمواعيد", desc: "الحضور في الوقت المحدد" }
    ];
    
    let procedures = [
        { id: 1, title: "تقديم إجازة", desc: "سجل الدخول واختر الإجازات" },
        { id: 2, title: "تقديم شكوى", desc: "اكتب الشكوى في قسم الشكاوى" }
    ];
    
    let faq = [
        { id: 1, question: "ما هي سياسة الإجازة؟", answer: "21 يوم إجازة سنوية" }
    ];
    
    let announcements = [
        { id: 1, title: "مرحباً", content: "مرحباً بكم في دليل الموظف", date: new Date().toLocaleDateString() }
    ];
    
    let companyData = {
        name: "شركة التميز للاستشارات",
        vision: "الريادة في تقديم الحلول المتميزة",
        mission: "تقديم خدمات مبتكرة لعملائنا"
    };
    
    let orgStructure = {
        ceo: { name: "مجلس الإدارة", head: "المدير التنفيذي", members: 5 },
        departments: [
            { id: 1, name: "الموارد البشرية", head: "مدير الموارد", members: 12 },
            { id: 2, name: "التقنية", head: "مدير التقنية", members: 20 }
        ]
    };
    
    // ✅ حل مشكلة الأداء - Default performance
    let performance = {
        "مدير الموارد البشرية": {
            criteria: [
                { name: "التخطيط الاستراتيجي", value: 88, max: 100, weight: 20 },
                { name: "إدارة الموارد البشرية", value: 92, max: 100, weight: 20 }
            ]
        },
        "محاسب": {
            criteria: [
                { name: "دقة التقارير", value: 98, max: 100, weight: 20 },
                { name: "الالتزام بالمعايير", value: 95, max: 100, weight: 20 }
            ]
        },
        "مبرمج": {
            criteria: [
                { name: "جودة الكود", value: 88, max: 100, weight: 20 },
                { name: "الالتزام بالمهل", value: 90, max: 100, weight: 20 }
            ]
        },
        "موظف": {  // ✅ Default للموظفين الجدد
            criteria: [
                { name: "الأداء العام", value: 85, max: 100, weight: 50 },
                { name: "الالتزام", value: 90, max: 100, weight: 50 }
            ]
        }
    };
    
    // -------------------- Firebase (مع انتظار التحميل) --------------------
    let firebaseReady = false;
    let pendingCallback = null;
    
    // ✅ انتظار تحميل Firebase
    window.waitForFirebase = function(callback) {
        if (firebaseReady) {
            callback();
        } else {
            pendingCallback = callback;
        }
    };
    
    // ✅ تسجيل Firebase بعد تحميل الصفحة
    window.addEventListener("load", () => {
        // Firebase script سيتم تحميله بعد قليل
        setTimeout(() => {
            if (window.db) {
                firebaseReady = true;
                if (pendingCallback) pendingCallback();
                initApp();
            }
        }, 500);
    });
    
    // ✅ دوال Firebase مع التحقق من الجاهزية
    async function saveToFirebase(data) {
        if (!window.db || !window.set) {
            console.warn("Firebase not ready");
            return false;
        }
        try {
            await window.set(window.ref(window.db, 'hr-system-data'), {
                ...data,
                lastUpdated: Date.now()
            });
            return true;
        } catch(e) { return false; }
    }
    
    async function loadFromFirebase() {
        if (!window.db || !window.get) {
            console.warn("Firebase not ready");
            return null;
        }
        try {
            const snapshot = await window.get(window.ref(window.db, 'hr-system-data'));
            return snapshot.exists() ? snapshot.val() : null;
        } catch(e) { return null; }
    }
    
    function listenToFirebase(callback) {
        if (!window.db || !window.onValue) return;
        window.onValue(window.ref(window.db, 'hr-system-data'), (snapshot) => {
            if (snapshot.exists()) callback(snapshot.val());
        });
    }
    
    // ✅ حفظ البيانات (بدون LocalStorage)
    async function saveAll() {
        if (!firebaseReady) return;
        const data = {
            users, policies, behaviors, procedures, faq,
            announcements, companyData, orgStructure, performance
        };
        await saveToFirebase(data);
        showToast("✅ تم الحفظ في السحابة");
    }
    
    // ✅ تحميل البيانات من Firebase فقط
    async function loadFromCloud() {
        const data = await loadFromFirebase();
        if (data) {
            users = data.users || users;
            policies = data.policies || policies;
            behaviors = data.behaviors || behaviors;
            procedures = data.procedures || procedures;
            faq = data.faq || faq;
            announcements = data.announcements || announcements;
            companyData = data.companyData || companyData;
            orgStructure = data.orgStructure || orgStructure;
            performance = data.performance || performance;
            lastUpdated = data.lastUpdated || 0;
            return true;
        }
        return false;
    }
    
    // ✅ الاستماع للتغييرات الفورية باستخدام timestamp
    function setupRealtimeSync() {
        listenToFirebase((data) => {
            if (data && data.lastUpdated && data.lastUpdated > lastUpdated) {
                users = data.users || users;
                policies = data.policies || policies;
                behaviors = data.behaviors || behaviors;
                procedures = data.procedures || procedures;
                faq = data.faq || faq;
                announcements = data.announcements || announcements;
                companyData = data.companyData || companyData;
                orgStructure = data.orgStructure || orgStructure;
                performance = data.performance || performance;
                lastUpdated = data.lastUpdated;
                if (currentUser) renderApp();
                showToast("🔄 تم تحديث البيانات من جهاز آخر");
            }
        });
    }
    
    // -------------------- دوال آمنة --------------------
    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function showToast(msg, isError = false) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        if (isError) toast.classList.add('error');
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 100);
        setTimeout(() => toast.remove(), 3000);
    }
    
    // ✅ login عادي
    function login(email, pass) {
        let user = users.find(u => u.email === email && u.password === pass);
        if (user) {
            currentUser = user;
            sessionStorage.setItem('user', JSON.stringify(user));
            renderApp();
            return true;
        }
        return false;
    }
    
    async function register(name, email, pass, confirm) {
        if (pass !== confirm) { showToast("كلمة المرور غير متطابقة", true); return false; }
        if (users.find(u => u.email === email)) { showToast("البريد موجود", true); return false; }
        users.push({ id: Date.now(), name, email, password: pass, role: "employee", jobTitle: "موظف" });
        await saveAll();
        showToast("تم التسجيل");
        return true;
    }
    
    function logout() {
        currentUser = null;
        sessionStorage.removeItem('user');
        renderApp();
    }
    
    // -------------------- المساعد الذكي --------------------
    function getAIResponse(question) {
        const q = question.toLowerCase();
        const policy = policies.find(p => q.includes(p.title.toLowerCase()));
        if (policy) return policy.content;
        const behavior = behaviors.find(b => q.includes(b.title.toLowerCase()));
        if (behavior) return behavior.desc;
        const procedure = procedures.find(p => q.includes(p.title.toLowerCase()));
        if (procedure) return procedure.desc;
        const faqItem = faq.find(f => q.includes(f.question.toLowerCase()));
        if (faqItem) return faqItem.answer;
        if (q.includes('راتب') || q.includes('سلفة')) return "يمكن طلب سلفة بعد 6 أشهر عمل، الحد الأقصى 50% من الراتب";
        if (q.includes('إجازة')) return "21 يوم إجازة سنوية مدفوعة الأجر";
        return "شكراً لسؤالك. يمكنك مراجعة دليل الموظف لمزيد من المعلومات.";
    }
    
    function askAI() {
        const input = document.getElementById('aiInput');
        if (!input) return;
        const question = input.value.trim();
        if (!question) return;
        
        const messagesDiv = document.getElementById('aiMessages');
        if (!messagesDiv) return;
        
        const userMsg = document.createElement('div');
        userMsg.className = 'message user-message';
        userMsg.innerHTML = `<i class="fas fa-user"></i> ${escapeHtml(question)}`;
        messagesDiv.appendChild(userMsg);
        
        input.value = '';
        
        const typingDiv = document.createElement('div');
        typingDiv.className = 'typing';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = '<i class="fas fa-robot"></i> المساعد يكتب...';
        messagesDiv.appendChild(typingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        
        setTimeout(() => {
            document.getElementById('typingIndicator')?.remove();
            const aiMsg = document.createElement('div');
            aiMsg.className = 'message ai-message';
            aiMsg.innerHTML = `<i class="fas fa-robot"></i> ${escapeHtml(getAIResponse(question))}`;
            messagesDiv.appendChild(aiMsg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }, 500);
    }
    
    function toggleAI() {
        const chat = document.getElementById('aiChat');
        if (chat) chat.classList.toggle('open');
    }
    
    // -------------------- عرض الصفحات --------------------
    function renderLogin() {
        return `
        <div class="login-container">
            <div class="login-card">
                <div class="hero-image" style="margin: 0 auto 20px;"><i class="fas fa-cloud"></i></div>
                <h2>نظام الموارد البشرية</h2>
                <p style="font-size:12px; margin-bottom:20px;">متزامن مع السحابة ☁️</p>
                <input type="email" id="loginEmail" placeholder="البريد" value="admin@hr.com">
                <input type="password" id="loginPass" placeholder="كلمة المرور" value="admin123">
                <button class="btn" onclick="doLogin()">دخول</button>
                <div class="register-link">حساب جديد؟ <span onclick="toggleReg()">إنشاء حساب</span></div>
                <div id="regForm" class="register-form">
                    <input type="text" id="regName" placeholder="الاسم">
                    <input type="email" id="regEmail" placeholder="البريد">
                    <input type="password" id="regPass" placeholder="كلمة المرور">
                    <input type="password" id="regConfirm" placeholder="تأكيد">
                    <button class="btn" onclick="doRegister()">تسجيل</button>
                </div>
            </div>
        </div>`;
    }
    
    window.doLogin = function() {
        let email = document.getElementById('loginEmail')?.value;
        let pass = document.getElementById('loginPass')?.value;
        if (!login(email, pass)) showToast("بيانات غير صحيحة", true);
    };
    
    window.doRegister = async function() {
        let n = document.getElementById('regName')?.value;
        let e = document.getElementById('regEmail')?.value;
        let p = document.getElementById('regPass')?.value;
        let c = document.getElementById('regConfirm')?.value;
        if (await register(n, e, p, c)) toggleReg();
    };
    
    window.toggleReg = function() {
        let f = document.getElementById('regForm');
        if (f) f.classList.toggle('show');
    };
    
    function showDetail(title, content) {
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3 style="color:#d4af37;">${escapeHtml(title)}</h3><div style="margin:15px 0;">${escapeHtml(content).replace(/\n/g, '<br>')}</div><button class="btn" onclick="this.closest('.modal').remove()">إغلاق</button></div>`;
        document.body.appendChild(modal);
    }
    
    function renderGuide() {
        let items = [];
        if (guideTab === 'policies') {
            items = policies.map(p => `<div class="guide-item" onclick="showDetail('${escapeHtml(p.title)}', '<strong>${escapeHtml(p.description)}</strong><br><br>${escapeHtml(p.content)}')"><div><strong>${escapeHtml(p.title)}</strong><br><small>${escapeHtml(p.description.substring(0,40))}</small></div><i class="fas fa-chevron-left"></i></div>`);
        } else if (guideTab === 'procedures') {
            items = procedures.map(p => `<div class="guide-item" onclick="showDetail('${escapeHtml(p.title)}', '${escapeHtml(p.desc)}')"><div><strong>${escapeHtml(p.title)}</strong><br><small>${escapeHtml(p.desc.substring(0,40))}</small></div><i class="fas fa-chevron-left"></i></div>`);
        } else {
            items = behaviors.map(b => `<div class="guide-item" onclick="showDetail('${escapeHtml(b.title)}', '${escapeHtml(b.desc)}')"><div><strong>${escapeHtml(b.title)}</strong><br><small>${escapeHtml(b.desc.substring(0,40))}</small></div><i class="fas fa-chevron-left"></i></div>`);
        }
        return `<div class="card">
            <div class="guide-tabs">
                <div class="guide-tab ${guideTab === 'policies' ? 'active' : ''}" onclick="setGuideTab('policies')"><i class="fas fa-file-alt"></i> السياسات</div>
                <div class="guide-tab ${guideTab === 'procedures' ? 'active' : ''}" onclick="setGuideTab('procedures')"><i class="fas fa-list-ol"></i> الإجراءات</div>
                <div class="guide-tab ${guideTab === 'behaviors' ? 'active' : ''}" onclick="setGuideTab('behaviors')"><i class="fas fa-handshake"></i> السلوكيات</div>
            </div>
            ${items.join('')}
        </div>
        <div class="card">
            <h3><i class="fas fa-question-circle"></i> الأسئلة الشائعة</h3>
            ${faq.map(f => `<div style="padding:10px;"><strong>${escapeHtml(f.question)}</strong><br>${escapeHtml(f.answer)}</div>`).join('')}
        </div>`;
    }
    
    window.setGuideTab = function(tab) { guideTab = tab; renderApp(); };
    
    function getGreeting() {
        let h = new Date().getHours();
        if (h < 12) return "صباح الخير";
        if (h < 17) return "مساء الخير";
        return "مساء النور";
    }
    
    function renderHome() {
        return `<div class="hero-section">
            <div><div style="font-size:22px; font-weight:bold; color:#d4af37;">${getGreeting()}، ${escapeHtml(currentUser?.name || 'موظف')} 👋</div>
            <div style="margin-top:5px;"><i class="fas fa-briefcase"></i> ${escapeHtml(currentUser?.jobTitle || 'موظف')}</div>
            <div style="margin-top:5px;"><i class="fas fa-cloud"></i> نظام متزامن مع السحابة</div></div>
            <div class="hero-image"><i class="fas fa-cloud"></i></div>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><i class="fas fa-file-alt"></i><div class="stat-number">${policies.length}</div><div>سياسات</div></div>
            <div class="stat-card"><i class="fas fa-handshake"></i><div class="stat-number">${behaviors.length}</div><div>سلوكيات</div></div>
            <div class="stat-card"><i class="fas fa-list-ol"></i><div class="stat-number">${procedures.length}</div><div>إجراءات</div></div>
            <div class="stat-card"><i class="fas fa-question-circle"></i><div class="stat-number">${faq.length}</div><div>أسئلة</div></div>
        </div>`;
    }
    
    function renderCompany() {
        return `<div class="card"><h2 style="color:#d4af37; text-align:center;">${escapeHtml(companyData.name)}</h2></div>
        <div class="card"><h3><i class="fas fa-eye"></i> الرؤية</h3><p>${escapeHtml(companyData.vision)}</p></div>
        <div class="card"><h3><i class="fas fa-bullseye"></i> الرسالة</h3><p>${escapeHtml(companyData.mission)}</p></div>`;
    }
    
    function renderOrg() {
        return `<div class="card">
            <h3><i class="fas fa-sitemap"></i> الهيكل التنظيمي</h3>
            <div class="org-ceo"><i class="fas fa-crown"></i><h3>${escapeHtml(orgStructure.ceo.name)}</h3><p>${escapeHtml(orgStructure.ceo.head)}</p></div>
            <div class="org-departments">${orgStructure.departments.map(d => `<div class="org-dept"><i class="fas fa-building"></i><h4>${escapeHtml(d.name)}</h4><p>${escapeHtml(d.head)}</p></div>`).join('')}</div>
        </div>`;
    }
    
    function renderNotifications() {
        return `<div class="card"><h3><i class="fas fa-bell"></i> الإشعارات</h3>${announcements.map(a => `<div style="padding:10px; border-bottom:1px solid rgba(212,175,55,0.1);"><strong>${escapeHtml(a.title)}</strong><br>${escapeHtml(a.content)}<br><small>${escapeHtml(a.date)}</small></div>`).join('')}</div>`;
    }
    
    function renderProfile() {
        return `<div class="card">
            <h3><i class="fas fa-user-circle"></i> حسابي</h3>
            <div class="form-group"><label>الاسم</label><input id="pName" value="${escapeHtml(currentUser?.name || '')}"></div>
            <div class="form-group"><label>البريد</label><input id="pEmail" value="${escapeHtml(currentUser?.email || '')}"></div>
            <button class="btn" onclick="updateProfile()">حفظ</button>
            <button class="btn" style="margin-top:10px; background:#ef4444;" onclick="logout()">تسجيل الخروج</button>
        </div>`;
    }
    
    async function updateProfile() {
        currentUser.name = document.getElementById('pName')?.value || currentUser.name;
        currentUser.email = document.getElementById('pEmail')?.value || currentUser.email;
        let idx = users.findIndex(u => u.id === currentUser.id);
        if (idx !== -1) users[idx] = currentUser;
        await saveAll();
        showToast("تم حفظ البيانات");
        renderApp();
    }
    
    // ✅ حل مشكلة تقييم الأداء - مع Default
    function renderPerformance() {
        let perf = performance[currentUser?.jobTitle] || performance["موظف"];
        if (!perf) return `<div class="card"><h3>⭐ تقييم الأداء</h3><p>جاري تحميل البيانات...</p></div>`;
        let total = perf.criteria.reduce((s,c)=>s + c.value,0);
        let maxTotal = perf.criteria.reduce((s,c)=>s + c.max,0);
        let percent = Math.round((total/maxTotal)*100);
        return `<div class="card">
            <h3>⭐ تقييم الأداء - ${escapeHtml(currentUser?.jobTitle || 'موظف')}</h3>
            <div style="font-size:48px; font-weight:bold; color:#d4af37; text-align:center;">${percent}%</div>
            <div style="width:100%; height:10px; background:rgba(255,255,255,0.1); border-radius:10px; margin:15px 0;"><div style="width:${percent}%; height:100%; background:linear-gradient(90deg,#d4af37,#b8960c); border-radius:10px;"></div></div>
            ${perf.criteria.map(c => `<div style="margin-bottom:15px;"><div>${escapeHtml(c.name)}</div><div style="display:flex; justify-content:space-between;"><span>${c.value}/${c.max}</span><span>الوزن: ${c.weight}%</span></div><div style="width:100%; height:5px; background:rgba(255,255,255,0.1); border-radius:5px; margin-top:5px;"><div style="width:${(c.value/c.max)*100}%; height:100%; background:linear-gradient(90deg,#d4af37,#b8960c); border-radius:5px;"></div></div></div>`).join('')}
        </div>`;
    }
    
    // باقي دوال لوحة التحكم (مختصرة للطول)
    function renderAdmin() {
        if (currentUser?.role !== 'admin') return '<div class="card">🔒 هذه الصفحة للمدير فقط</div>';
        return `<div class="card"><h3><i class="fas fa-cog"></i> لوحة التحكم</h3>
            <div class="admin-grid">
                <div class="admin-card" onclick="alert('يمكن إضافة سياسات من هنا')"><i class="fas fa-file-alt"></i><div>إضافة سياسة</div></div>
                <div class="admin-card" onclick="alert('يمكن إضافة سلوكيات من هنا')"><i class="fas fa-handshake"></i><div>إضافة سلوك</div></div>
                <div class="admin-card" onclick="alert('يمكن إضافة إجراءات من هنا')"><i class="fas fa-list-ol"></i><div>إضافة إجراء</div></div>
                <div class="admin-card" onclick="alert('يمكن إضافة أسئلة من هنا')"><i class="fas fa-question-circle"></i><div>إضافة سؤال</div></div>
            </div>
        </div>
        <div class="card"><h4>السياسات</h4>${policies.map(p => `<div style="display:flex;justify-content:space-between;padding:10px;"><span>${escapeHtml(p.title)}</span></div>`).join('')}</div>`;
    }
    
    function renderApp() {
        if (!currentUser) {
            document.getElementById('app').innerHTML = renderLogin();
            return;
        }
        let isAdmin = currentUser.role === 'admin';
        document.getElementById('app').innerHTML = `
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header"><div class="logo"><i class="fas fa-cloud"></i> HR SYSTEM</div></div>
            <div class="nav-item ${currentPage === 'home' ? 'active' : ''}" data-page="home"><i class="fas fa-home"></i> الرئيسية</div>
            <div class="nav-item ${currentPage === 'guide' ? 'active' : ''}" data-page="guide"><i class="fas fa-book"></i> دليل الموظف</div>
            <div class="nav-item ${currentPage === 'org' ? 'active' : ''}" data-page="org"><i class="fas fa-building"></i> الهيكل التنظيمي</div>
            <div class="nav-item ${currentPage === 'company' ? 'active' : ''}" data-page="company"><i class="fas fa-building"></i> عن الشركة</div>
            <div class="nav-item ${currentPage === 'performance' ? 'active' : ''}" data-page="performance"><i class="fas fa-chart-line"></i> تقييم الأداء</div>
            <div class="nav-item ${currentPage === 'notifications' ? 'active' : ''}" data-page="notifications"><i class="fas fa-bell"></i> الإشعارات</div>
            <div class="nav-item ${currentPage === 'profile' ? 'active' : ''}" data-page="profile"><i class="fas fa-user"></i> حسابي</div>
            ${isAdmin ? `<div class="nav-item ${currentPage === 'admin' ? 'active' : ''}" data-page="admin"><i class="fas fa-cog"></i> لوحة التحكم</div>` : ''}
            <div class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</div>
        </div>
        <div class="main-content">
            <div class="top-bar"><button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button><div class="page-title">${getTitle()}</div><div class="avatar"><i class="fas fa-user"></i></div></div>
            <div id="pageContent"></div>
        </div>
        <div class="ai-fab" id="aiFab" onclick="toggleAI()"><i class="fas fa-robot"></i></div>
        <div class="ai-chat" id="aiChat">
            <div class="ai-header" onclick="toggleAI()"><i class="fas fa-robot"></i> المساعد الذكي <i class="fas fa-times" style="margin-right:auto;"></i></div>
            <div class="ai-messages" id="aiMessages"></div>
            <div class="ai-input-area"><input type="text" id="aiInput" placeholder="اسألني..." onkeypress="if(event.key==='Enter') askAI()"><button class="btn" style="width:auto; padding:8px 15px;" onclick="askAI()"><i class="fas fa-paper-plane"></i></button></div>
        </div>`;
        
        let pages = { home: renderHome, guide: renderGuide, org: renderOrg, company: renderCompany, performance: renderPerformance, notifications: renderNotifications, profile: renderProfile, admin: renderAdmin };
        document.getElementById('pageContent').innerHTML = (pages[currentPage] || renderHome)();
        
        document.querySelectorAll('.nav-item').forEach(el => {
            let page = el.dataset.page;
            if (page) el.onclick = () => { currentPage = page; renderApp(); };
        });
        
        window.askAI = askAI;
        window.toggleAI = toggleAI;
    }
    
    function getTitle() {
        let titles = { home: "الرئيسية", guide: "دليل الموظف", org: "الهيكل التنظيمي", company: "عن الشركة", performance: "تقييم الأداء", notifications: "الإشعارات", profile: "حسابي", admin: "لوحة التحكم" };
        return titles[currentPage] || "الرئيسية";
    }
    
    // ✅ بدء التطبيق بعد تحميل Firebase
    async function initApp() {
        await loadFromCloud();
        setupRealtimeSync();
        let savedUser = sessionStorage.getItem('user');
        if (savedUser) currentUser = JSON.parse(savedUser);
        renderApp();
    }
    
    // ✅ انتظار Firebase قبل البدء
    window.waitForFirebase(initApp);
</script>
