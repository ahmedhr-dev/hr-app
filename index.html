<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR System Pro</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.header{display:flex;justify-content:space-between;padding:15px;background:#020617}
.page{padding:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{
 background:#1e293b;
 padding:20px;
 border-radius:15px;
 cursor:pointer;
 text-align:center;
 font-size:18px
}
button{
 background:#facc15;border:none;padding:10px;
 border-radius:10px;margin-top:10px;width:100%
}
input{
 width:100%;padding:10px;margin:5px 0;border-radius:10px;border:none
}
</style>

</head>

<body>

<div id="app"></div>

<script>

// 🔥 Firebase
firebase.initializeApp({
 apiKey:"AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
 authDomain:"hr-app-710f3.firebaseapp.com",
 databaseURL:"https://hr-app-710f3-default-rtdb.firebaseio.com"
});

const auth = firebase.auth();
const db = firebase.database();

let user=null;
let role="user";
let allFAQ={};

// ================= LOGIN =================
function loginPage(){
 app.innerHTML=`
 <div class="page">
 <h2>HR Login</h2>
 <input id="email" placeholder="Email">
 <input id="pass" type="password">
 <button onclick="login()">Login</button>
 </div>`;
}

function login(){
 auth.signInWithEmailAndPassword(
  email.value, pass.value
 ).catch(e=>alert(e.message));
}

// ================= MAIN =================
function dashboard(){
 app.innerHTML=`
 <div class="header">
 <div>${user.email}</div>
 <div onclick="logout()">🚪</div>
 </div>

 <div class="page">
 <div class="grid">
  <div class="card" onclick="openPage('guide')">📘 دليل</div>
  <div class="card" onclick="openPage('policies')">📄 سياسات</div>
  <div class="card" onclick="openPage('faq')">❓ FAQ</div>
  <div class="card" onclick="openPage('ai')">🤖 مساعد</div>
 </div>
 </div>`;
}

// ================= NAV =================
function openPage(p){

 if(p==="guide"){
  app.innerHTML=backBtn("الدليل")+`
  <div id="guide"></div>
  ${adminBtn("guide")}
  `;
  loadData("guide","guide");
 }

 if(p==="policies"){
  app.innerHTML=backBtn("السياسات")+`
  <div id="policies"></div>
  ${adminBtn("policies")}
  `;
  loadData("policies","policies");
 }

 if(p==="faq"){
  app.innerHTML=backBtn("FAQ")+`
  <div id="faq"></div>
  ${role==="admin"?'<button onclick="addFAQ()">➕</button>':""}
  `;
  loadFAQ();
 }

 if(p==="ai"){
  app.innerHTML=backBtn("المساعد")+`
  <input id="q" placeholder="اسأل HR">
  <button onclick="ask()">اسأل</button>
  <div id="answer"></div>`;
 }

}

// ================= UI =================
function backBtn(title){
 return `<div class="header">
 <button onclick="dashboard()">⬅</button>
 <div>${title}</div>
 </div><div class="page">`;
}

function adminBtn(type){
 return role==="admin"
 ? `<button onclick="add('${type}')">➕ إضافة</button>`
 : "";
}

// ================= LOAD =================
function loadData(path,el){
 db.ref(path).on("value",snap=>{
  let data=snap.val()||{};
  let html="";

  Object.keys(data).forEach(id=>{
   html+=`
   <div class="card">
   ${data[id].text}
   ${role==="admin"?`<button onclick="del('${path}','${id}')">🗑</button>`:""}
   </div>`;
  });

  document.getElementById(el).innerHTML=html||"لا يوجد";
 });
}

function add(type){
 let t=prompt("اكتب");
 if(!t)return;
 db.ref(type+"/"+Date.now()).set({text:t});
}

// ================= FAQ =================
function loadFAQ(){
 db.ref("faq").on("value",snap=>{
  allFAQ=snap.val()||{};
  let html="";

  Object.keys(allFAQ).forEach(id=>{
   let f=allFAQ[id];
   html+=`
   <div class="card">
   <b>${f.q}</b><br>${f.a}
   ${role==="admin"?`<button onclick="del('faq','${id}')">🗑</button>`:""}
   </div>`;
  });

  faq.innerHTML=html||"لا يوجد";
 });
}

function addFAQ(){
 let q=prompt("السؤال");
 let a=prompt("الإجابة");
 db.ref("faq/"+Date.now()).set({q:q,a:a});
}

// ================= AI =================
function ask(){
 let q=document.getElementById("q").value.toLowerCase();
 let answer="❗ تواصل مع HR";

 Object.values(allFAQ).forEach(f=>{
  if(q.includes(f.q.toLowerCase())){
   answer=f.a;
  }
 });

 answer.innerHTML=`<div class="card">${answer}</div>`;
 document.getElementById("answer").innerHTML=
 `<div class="card">${answer}</div>`;
}

// ================= DELETE =================
function del(type,id){
 db.ref(type+"/"+id).remove();
}

// ================= LOGOUT =================
function logout(){
 auth.signOut();
}

// ================= ROLE =================
function loadRole(uid){
 db.ref("users/"+uid+"/role").once("value").then(s=>{
  role = s.val() || "user";
  dashboard();
 });
}

// ================= AUTH =================
auth.onAuthStateChanged(u=>{
 if(u){
  user=u;
  loadRole(u.uid);
 }else{
  loginPage();
 }
});

</script>

</body>
</html>
