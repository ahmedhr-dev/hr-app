<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>نظام إدارة الموارد البشرية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #0a1a2f, #061220);
            direction: rtl;
            color: #fff;
            min-height: 100vh;
        }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(10, 26, 47, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 35px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .login-card h2 { text-align: center; margin-bottom: 20px; color: #d4af37; font-size: 24px; }
        .login-card input, .login-card select {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 30px;
            color: white;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            color: #0a1a2f;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        .btn:hover { transform: scale(1.02); }
        .demo-users { margin-top: 20px; text-align: center; font-size: 12px; opacity: 0.7; }
        .switch-link { text-align: center; margin-top: 15px; cursor: pointer; color: #d4af37; font-size: 14px; }
        
        /* الصورة الشخصية */
        .profile-upload {
            text-align: center;
            margin-bottom: 20px;
        }
        .avatar-preview {
            width: 100px;
            height: 100px;
            background: rgba(212,175,55,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            cursor: pointer;
            overflow: hidden;
            border: 2px solid #d4af37;
        }
        .avatar-preview i { font-size: 50px; color: #d4af37; }
        .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
        
        /* الاقتباس */
        .quote-wrapper {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(212,175,55,0.1);
            border-radius: 20px;
            border-right: 3px solid #d4af37;
        }
        .quote-text {
            font-size: 16px;
            line-height: 1.6;
            color: #e2e8f0;
        }
        .quote-author {
            font-size: 12px;
            color: #d4af37;
            margin-top: 8px;
        }

        /* باقي التصميم مثل السابق */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: #0a1a2f;
            padding: 20px;
            border-left: 1px solid rgba(212,175,55,0.2);
            transition: all 0.3s;
            z-index: 200;
        }
        .logo { color: #d4af37; font-size: 24px; margin-bottom: 30px; text-align: center; }
        .nav-item {
            padding: 12px 20px;
            margin: 5px 0;
            border-radius: 12px;
            cursor: pointer;
            color: #a0aec0;
            transition: all 0.3s;
        }
        .nav-item:hover, .nav-item.active {
            background: linear-gradient(135deg, #d4af37, #b8960c);
            color: #0a1a2f;
        }
        .main-content { margin-right: 260px; padding: 20px; }
        .card {
            background: rgba(10, 26, 47, 0.9);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(10, 26, 47, 0.9);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .stat-number { font-size: 32px; font-weight: bold; color: #d4af37; }
        .quote-card {
            background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(10,26,47,0.9));
            border-radius: 28px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
        }
        .greeting { font-size: 22px; font-weight: bold; color: #d4af37; margin-bottom: 10px; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .menu-toggle { display: block; }
        }
        .menu-toggle { display: none; background: none; border: none; font-size: 24px; color: white; cursor: pointer; margin-bottom: 15px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .avatar-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }
        .avatar-icon img { width: 100%; height: 100%; object-fit: cover; }
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0a1a2f;
            padding: 10px;
            justify-content: space-around;
            border-top: 1px solid rgba(212,175,55,0.2);
            z-index: 100;
        }
        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #94a3b8;
            cursor: pointer;
            padding: 8px;
        }
        .bottom-nav-item.active { color: #d4af37; }
        @media (max-width: 768px) { .bottom-nav { display: flex; } }
        
        .job-card {
            background: rgba(10, 26, 47, 0.9);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .jobs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    // ==================== الاقتباسات الجميلة ====================
    const beautifulQuotes = [
        { text: "وَقُل رَّبِّ زِدْنِي عِلْمًا", author: "سورة طه (114)" },
        { text: "إِنَّ اللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّى يُغَيِّرُوا مَا بِأَنفُسِهِمْ", author: "سورة الرعد (11)" },
        { text: "فَإِنَّ مَعَ الْعُسْرِ يُسْرًا * إِنَّ مَعَ الْعُسْرِ يُسْرًا", author: "سورة الشرح (5-6)" },
        { text: "وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ", author: "سورة النجم (39)" },
        { text: "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَقُولُوا قَوْلًا سَدِيدًا", author: "سورة الأحزاب (70)" },
        { text: "خَيْرُ النَّاسِ أَنْفَعُهُمْ لِلنَّاسِ", author: "الحديث الشريف" },
        { text: "رَبِّ اشْرَحْ لِي صَدْرِي * وَيَسِّرْ لِي أَمْرِي", author: "سورة طه (25-26)" },
        { text: "وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ", author: "سورة العصر (3)" }
    ];
    
    function getRandomQuote() {
        return beautifulQuotes[Math.floor(Math.random() * beautifulQuotes.length)];
    }

    // ==================== قاعدة بيانات المستخدمين ====================
    let usersDatabase = JSON.parse(localStorage.getItem('hr_users')) || [
        { id: 1, email: "admin@hr.com", password: "admin123", name: "أحمد المدير", role: "admin", avatar: null, phone: "0560798698", jobTitle: "مدير الموارد البشرية", department: "الموارد البشرية" }
    ];

    let currentUser = JSON.parse(sessionStorage.getItem('hr_current_user')) || null;
    let showRegister = false;
    let currentPage = "home";

    // ==================== دوال مساعدة ====================
    function saveUsers() {
        localStorage.setItem('hr_users', JSON.stringify(usersDatabase));
    }

    function login(email, password) {
        let user = usersDatabase.find(u => u.email === email && u.password === password);
        if(user) {
            currentUser = user;
            sessionStorage.setItem('hr_current_user', JSON.stringify(currentUser));
            return true;
        }
        return false;
    }

    function register(name, email, password, confirmPassword, avatar, jobTitle, department, phone) {
        if(password !== confirmPassword) {
            alert("كلمة المرور غير متطابقة ❌");
            return false;
        }
        if(usersDatabase.find(u => u.email === email)) {
            alert("البريد الإلكتروني موجود بالفعل ❌");
            return false;
        }
        let newUser = {
            id: Date.now(),
            name: name,
            email: email,
            password: password,
            role: "employee",
            avatar: avatar,
            phone: phone || "",
            jobTitle: jobTitle || "موظف",
            department: department || "غير محدد"
        };
        usersDatabase.push(newUser);
        saveUsers();
        return true;
    }

    function logout() {
        currentUser = null;
        sessionStorage.removeItem('hr_current_user');
        showRegister = false;
        renderApp();
    }

    function getGreeting() {
        let h = new Date().getHours();
        if(h < 12) return "🌅 صباح الخير";
        if(h < 17) return "🌤️ مساء الخير";
        return "🌙 مساء النور";
    }

    // رفع الصورة
    function handleAvatarUpload(input) {
        if(input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = function(e) {
                let preview = document.getElementById('avatarPreview');
                if(preview) {
                    preview.innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;">`;
                }
                window.tempAvatar = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // ==================== شاشة تسجيل الدخول والتسجيل ====================
    function renderLoginRegister() {
        let quote = getRandomQuote();
        
        if(!showRegister) {
            // شاشة تسجيل الدخول (بدون إظهار اليوزر والرقم السري)
            return `
                <div class="login-container">
                    <div class="login-card">
                        <div class="quote-wrapper">
                            <div class="quote-text">"${quote.text}"</div>
                            <div class="quote-author">— ${quote.author}</div>
                        </div>
                        <div style="text-align:center; margin-bottom:15px;">
                            <div style="width:70px;height:70px;background:linear-gradient(135deg,#d4af37,#b8960c);border-radius:25px;margin:0 auto;display:flex;align-items:center;justify-content:center;">
                                <i class="fas fa-users" style="font-size:35px; color:#0a1a2f;"></i>
                            </div>
                            <h2 style="margin-top:15px;">مرحباً بك</h2>
                            <p style="font-size:12px; opacity:0.7;">سجل دخولك إلى نظام الموارد البشرية</p>
                        </div>
                        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
                        <input type="password" id="loginPassword" placeholder="كلمة المرور">
                        <button class="btn" onclick="doLogin()">دخول</button>
                        <div class="switch-link" onclick="toggleRegister()">ليس لديك حساب؟ سجل الآن</div>
                    </div>
                </div>
            `;
        } else {
            // شاشة إنشاء حساب جديد
            return `
                <div class="login-container">
                    <div class="login-card">
                        <div class="quote-wrapper">
                            <div class="quote-text">"${quote.text}"</div>
                            <div class="quote-author">— ${quote.author}</div>
                        </div>
                        <div style="text-align:center; margin-bottom:15px;">
                            <div style="width:70px;height:70px;background:linear-gradient(135deg,#d4af37,#b8960c);border-radius:25px;margin:0 auto;display:flex;align-items:center;justify-content:center;">
                                <i class="fas fa-user-plus" style="font-size:35px; color:#0a1a2f;"></i>
                            </div>
                            <h2 style="margin-top:15px;">إنشاء حساب جديد</h2>
                        </div>
                        
                        <div class="profile-upload">
                            <div class="avatar-preview" id="avatarPreview" onclick="document.getElementById('avatarInput').click()">
                                <i class="fas fa-camera"></i>
                            </div>
                            <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(this)">
                            <p style="font-size:11px; opacity:0.6;">اضغط لإضافة صورة شخصية</p>
                        </div>
                        
                        <input type="text" id="regName" placeholder="الاسم الكامل">
                        <input type="email" id="regEmail" placeholder="البريد الإلكتروني">
                        <input type="tel" id="regPhone" placeholder="رقم الجوال (اختياري)">
                        <input type="text" id="regJobTitle" placeholder="المسمى الوظيفي (اختياري)">
                        <input type="text" id="regDept" placeholder="القسم (اختياري)">
                        <input type="password" id="regPassword" placeholder="كلمة المرور">
                        <input type="password" id="regConfirmPassword" placeholder="تأكيد كلمة المرور">
                        
                        <button class="btn" onclick="doRegister()">إنشاء حساب</button>
                        <div class="switch-link" onclick="toggleRegister()">لديك حساب بالفعل؟ سجل دخول</div>
                    </div>
                </div>
            `;
        }
    }

    window.doLogin = function() {
        let email = document.getElementById('loginEmail').value;
        let password = document.getElementById('loginPassword').value;
        if(login(email, password)) {
            alert('تم تسجيل الدخول بنجاح ✅');
            renderApp();
        } else {
            alert('البريد الإلكتروني أو كلمة المرور غير صحيحة ❌');
        }
    };

    window.doRegister = function() {
        let name = document.getElementById('regName').value;
        let email = document.getElementById('regEmail').value;
        let phone = document.getElementById('regPhone').value;
        let jobTitle = document.getElementById('regJobTitle').value;
        let dept = document.getElementById('regDept').value;
        let password = document.getElementById('regPassword').value;
        let confirm = document.getElementById('regConfirmPassword').value;
        let avatar = window.tempAvatar || null;
        
        if(!name || !email || !password) {
            alert("الرجاء ملء جميع الحقول الأساسية ❌");
            return;
        }
        
        if(register(name, email, password, confirm, avatar, jobTitle, dept, phone)) {
            alert('تم إنشاء الحساب بنجاح ✅ يمكنك الآن تسجيل الدخول');
            toggleRegister();
            renderApp();
        }
    };

    window.toggleRegister = function() {
        showRegister = !showRegister;
        window.tempAvatar = null;
        renderApp();
    };
    
    window.handleAvatarUpload = handleAvatarUpload;

    // ==================== صفحات التطبيق بعد الدخول ====================
    function renderHome() {
        let quote = getRandomQuote();
        return `
            <div class="quote-card">
                <div class="greeting">${getGreeting()}، ${currentUser?.name} 👋</div>
                <div class="quote-text" style="font-size:16px;">"${quote.text}"</div>
                <div style="font-size:12px; color:#d4af37;">— ${quote.author}</div>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-number">${usersDatabase.length}</div><div>موظفين</div></div>
                <div class="stat-card"><div class="stat-number">3</div><div>سياسات</div></div>
                <div class="stat-card"><div class="stat-number">${currentUser?.role === 'admin' ? 'مدير' : 'موظف'}</div><div>الصلاحية</div></div>
                <div class="stat-card"><div class="stat-number">⭐</div><div>تقييم</div></div>
            </div>
            <div class="card">
                <h3>📢 آخر الإعلانات</h3>
                <p>تم تحديث سياسة الإجازات - راجع دليل الموظف للتفاصيل</p>
            </div>
        `;
    }

    function renderProfile() {
        return `
            <div class="card">
                <h3>👤 حسابي الشخصي</h3>
                <div style="text-align:center; margin-bottom:20px;">
                    <div class="avatar-preview" style="width:100px;height:100px;margin:0 auto;">
                        ${currentUser?.avatar ? `<img src="${currentUser.avatar}" style="width:100%;height:100%;object-fit:cover;">` : '<i class="fas fa-user-circle" style="font-size:70px; color:#d4af37;"></i>'}
                    </div>
                </div>
                <p><strong>📛 الاسم:</strong> ${currentUser?.name}</p>
                <p><strong>📧 البريد:</strong> ${currentUser?.email}</p>
                <p><strong>📞 الجوال:</strong> ${currentUser?.phone || 'غير مدخل'}</p>
                <p><strong>💼 المسمى:</strong> ${currentUser?.jobTitle || 'موظف'}</p>
                <p><strong>🏢 القسم:</strong> ${currentUser?.department || 'غير محدد'}</p>
                <p><strong>🔑 الصلاحية:</strong> ${currentUser?.role === 'admin' ? 'مدير كامل' : 'موظف'}</p>
                <button class="btn" style="margin-top:20px; background:linear-gradient(135deg,#ef4444,#dc2626);" onclick="logout()">🚪 تسجيل الخروج</button>
            </div>
        `;
    }

    function renderAdmin() {
        if(currentUser?.role !== 'admin') {
            return '<div class="card">🔒 هذه الصفحة للمدير فقط. صلاحياتك حالياً: موظف</div>';
        }
        return `
            <div class="card">
                <h3>⚙️ لوحة تحكم المدير</h3>
                <p>يمكنك من هنا إدارة:</p>
                <ul style="margin:15px 0 15px 20px;">
                    <li>✅ الموظفين (${usersDatabase.length} موظف)</li>
                    <li>✅ السياسات والإجراءات</li>
                    <li>✅ طلبات الموظفين</li>
                    <li>✅ التقارير والإحصائيات</li>
                </ul>
                <button class="btn" onclick="alert('واجهة إدارة النظام قيد التطوير')">إدارة النظام</button>
            </div>
            <div class="card">
                <h3>📋 قائمة الموظفين المسجلين</h3>
                ${usersDatabase.filter(u => u.role !== 'admin').map(u => `
                    <div class="job-card">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <div style="width:40px;height:40px;background:rgba(212,175,55,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;">
                                ${u.avatar ? `<img src="${u.avatar}" style="width:100%;height:100%;object-fit:cover;">` : '<i class="fas fa-user"></i>'}
                            </div>
                            <div><strong>${u.name}</strong><br><small>${u.email}</small><br><small>${u.jobTitle || 'موظف'}</small></div>
                        </div>
                    </div>
                `).join('')}
                ${usersDatabase.filter(u => u.role !== 'admin').length === 0 ? '<p>لا يوجد موظفين مسجلين بعد</p>' : ''}
            </div>
        `;
    }

    function renderEmployeeGuide() {
        return `
            <div class="card">
                <h3>📘 دليل الموظف</h3>
                <div class="job-card"><strong>📜 سياسة الإجازة السنوية:</strong> 21 يوم عمل إجازة سنوية مدفوعة الأجر.</div>
                <div class="job-card"><strong>💰 سياسة سلفة الراتب:</strong> بعد 6 أشهر عمل، بحد أقصى 50% من الراتب.</div>
                <div class="job-card"><strong>🏠 سياسة العمل عن بعد:</strong> يومان عمل عن بعد أسبوعياً بعد موافقة المدير.</div>
                <div class="job-card"><strong>🤝 السلوكيات المهنية:</strong> الاحترافية، الالتزام، السرية، الابتكار.</div>
            </div>
        `;
    }

    function renderContent() {
        if(currentPage === 'home') return renderHome();
        if(currentPage === 'profile') return renderProfile();
        if(currentPage === 'admin') return renderAdmin();
        if(currentPage === 'guide') return renderEmployeeGuide();
        return renderHome();
    }

    // ==================== واجهة التطبيق الرئيسية ====================
    function renderApp() {
        if(!currentUser) {
            document.getElementById('app').innerHTML = renderLoginRegister();
            return;
        }

        let isAdmin = currentUser.role === 'admin';
        
        document.getElementById('app').innerHTML = `
            <div class="sidebar" id="sidebar">
                <div class="logo">🏢 HR SYSTEM</div>
                <div class="nav-item ${currentPage === 'home' ? 'active' : ''}" onclick="switchPage('home')">🏠 الرئيسية</div>
                <div class="nav-item ${currentPage === 'profile' ? 'active' : ''}" onclick="switchPage('profile')">👤 حسابي</div>
                <div class="nav-item ${currentPage === 'guide' ? 'active' : ''}" onclick="switchPage('guide')">📘 الدليل</div>
                ${isAdmin ? `<div class="nav-item ${currentPage === 'admin' ? 'active' : ''}" onclick="switchPage('admin')">⚙️ الإدارة</div>` : ''}
                <div class="nav-item" onclick="logout()">🚪 خروج</div>
            </div>
            <div class="main-content">
                <div class="top-bar">
                    <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
                    <div class="avatar-icon">
                        ${currentUser?.avatar ? `<img src="${currentUser.avatar}">` : '<i class="fas fa-user"></i>'}
                    </div>
                </div>
                <div id="pageContent">${renderContent()}</div>
            </div>
            <div class="bottom-nav">
                <div class="bottom-nav-item ${currentPage === 'home' ? 'active' : ''}" onclick="switchPage('home')">🏠 الرئيسية</div>
                <div class="bottom-nav-item ${currentPage === 'profile' ? 'active' : ''}" onclick="switchPage('profile')">👤 حسابي</div>
                <div class="bottom-nav-item ${currentPage === 'guide' ? 'active' : ''}" onclick="switchPage('guide')">📘 الدليل</div>
                ${isAdmin ? `<div class="bottom-nav-item ${currentPage === 'admin' ? 'active' : ''}" onclick="switchPage('admin')">⚙️ تحكم</div>` : ''}
            </div>
        `;
    }

    window.switchPage = function(page) {
        currentPage = page;
        renderApp();
    };

    renderApp();
</script>
</body>
</html>
