    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
            authDomain: "hr-app-710f3.firebaseapp.com",
            databaseURL: "https://hr-app-710f3-default-rtdb.firebaseio.com",
            projectId: "hr-app-710f3",
            storageBucket: "hr-app-710f3.firebasestorage.app",
            messagingSenderId: "324936659395",
            appId: "1:324936659395:web:bb5d491b52be3013c00d76",
            measurementId: "G-6K3SCQTFW7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.firebaseDB = db;
        window.firebaseRef = ref;
        
        window.saveToFirebase = async function(data) {
            try {
                await set(ref(db, "hr-data"), {
                    users: data.users,
                    companyData: data.companyData,
                    jobs: data.jobs,
                    policies: data.policies,
                    behaviors: data.behaviors,
                    procedures: data.procedures,
                    faq: data.faq,
                    announcements: data.announcements,
                    orgStructure: data.orgStructure,
                    performance: data.performance,
                    lastUpdated: new Date().toISOString()
                });
                console.log('✅ تم الحفظ في Firebase');
                return true;
            } catch (error) {
                console.error('❌ خطأ في الحفظ:', error);
                return false;
            }
        }
        
        window.loadFromFirebase = async function() {
            try {
                const dataRef = ref(db, "hr-data");
                const snapshot = await get(dataRef);
                if (snapshot.exists()) {
                    console.log('✅ تم تحميل البيانات من Firebase');
                    return snapshot.val();
                } else {
                    console.log('📭 لا توجد بيانات في Firebase');
                    return null;
                }
            } catch (error) {
                console.error('❌ خطأ في التحميل:', error);
                return null;
            }
        }
        
        window.listenToFirebase = function(callback) {
            const dataRef = ref(db, "hr-data");
            onValue(dataRef, (snapshot) => {
                if (snapshot.exists()) {
                    console.log('🔄 تحديث فوري من Firebase');
                    callback(snapshot.val());
                }
            });
        }
        
        console.log('🔥 Firebase initialized successfully');
    </script>

    let isDataLoaded = false;
    
    // ========== دوال Firebase ==========
    
    function showToast(message, isError = false) {
        let toast = document.createElement('div');
        toast.className = 'sync-toast';
        if (isError) toast.classList.add('error');
        toast.innerHTML = `
            <i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i>
            <span style="flex: 1;">${message}</span>
        `;
        document.body.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 100);
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 500);
        }, 3000);
    }
    
    // حفظ جميع البيانات في Firebase (بدون استثناء!)
    async function saveAllToFirebase() {
        // حفظ في localStorage أولاً
        localStorage.setItem('hr_users', JSON.stringify(users));
        localStorage.setItem('hr_company', JSON.stringify(companyData));
        localStorage.setItem('hr_jobs', JSON.stringify(jobs));
        localStorage.setItem('hr_policies', JSON.stringify(policies));
        localStorage.setItem('hr_behaviors', JSON.stringify(behaviors));
        localStorage.setItem('hr_procedures', JSON.stringify(procedures));
        localStorage.setItem('hr_faq', JSON.stringify(faq));
        localStorage.setItem('hr_announcements', JSON.stringify(announcements));
        localStorage.setItem('hr_org_structure', JSON.stringify(orgStructure));
        localStorage.setItem('hr_performance', JSON.stringify(performance));
        localStorage.setItem('hr_last_sync', new Date().toISOString());
        
        // حفظ في Firebase
        if (window.saveToFirebase) {
            const firebaseData = {
                users: users,
                companyData: companyData,
                jobs: jobs,
                policies: policies,
                behaviors: behaviors,
                procedures: procedures,
                faq: faq,
                announcements: announcements,
                orgStructure: orgStructure,
                performance: performance
            };
            const success = await window.saveToFirebase(firebaseData);
            if (success) {
                console.log('✅ تم حفظ البيانات في Firebase');
                showToast('☁️ تم حفظ التغييرات في السحابة');
            } else {

                // استخدام البيانات من Firebase
                users = firebaseData.users;
                companyData = firebaseData.companyData;
                jobs = firebaseData.jobs;

                behaviors = firebaseData.behaviors;
                procedures = firebaseData.procedures;
                faq = firebaseData.faq;
                announcements = firebaseData.announcements;
                orgStructure = firebaseData.orgStructure;
                performance = firebaseData.performance;
                
                // حفظ في localStorage
                localStorage.setItem('hr_users', JSON.stringify(users));
                localStorage.setItem('hr_company', JSON.stringify(companyData));
                localStorage.setItem('hr_jobs', JSON.stringify(jobs));
                localStorage.setItem('hr_policies', JSON.stringify(policies));
                localStorage.setItem('hr_behaviors', JSON.stringify(behaviors));
                localStorage.setItem('hr_procedures', JSON.stringify(procedures));
                localStorage.setItem('hr_faq', JSON.stringify(faq));
                localStorage.setItem('hr_announcements', JSON.stringify(announcements));

                localStorage.setItem('hr_performance', JSON.stringify(performance));
                
                console.log('✅ تم تحميل البيانات من Firebase');
                return true;
            } else {
                // أول مرة: حفظ البيانات الافتراضية في Firebase
                console.log('📭 لا توجد بيانات في Firebase، جاري حفظ البيانات الافتراضية...');
                await saveAllToFirebase();
                return true;
            }
        } catch (error) {
            console.error('❌ خطأ في التحميل من Firebase:', error);
            // محاولة تحميل من localStorage
            const savedUsers = localStorage.getItem('hr_users');
            if (savedUsers) {
                users = JSON.parse(savedUsers);
                companyData = JSON.parse(localStorage.getItem('hr_company') || '{}');
                jobs = JSON.parse(localStorage.getItem('hr_jobs') || '[]');
                policies = JSON.parse(localStorage.getItem('hr_policies') || '[]');

                orgStructure = JSON.parse(localStorage.getItem('hr_org_structure') || '{}');
                performance = JSON.parse(localStorage.getItem('hr_performance') || '{}');
                console.log('📱 تم تحميل البيانات من localStorage');
            }

        }

            let hasChanges = false;
            
            if (firebaseData.users && JSON.stringify(users) !== JSON.stringify(firebaseData.users)) {
                users = firebaseData.users;
                hasChanges = true;
            }
            if (firebaseData.companyData && JSON.stringify(companyData) !== JSON.stringify(firebaseData.companyData)) {
                companyData = firebaseData.companyData;
                hasChanges = true;
            }
            if (firebaseData.jobs && JSON.stringify(jobs) !== JSON.stringify(firebaseData.jobs)) {
                jobs = firebaseData.jobs;
                hasChanges = true;
            }
            if (firebaseData.policies && JSON.stringify(policies) !== JSON.stringify(firebaseData.policies)) {
                policies = firebaseData.policies;
                hasChanges = true;
            }
            if (firebaseData.behaviors && JSON.stringify(behaviors) !== JSON.stringify(firebaseData.behaviors)) {
                behaviors = firebaseData.behaviors;
                hasChanges = true;
            }
            if (firebaseData.procedures && JSON.stringify(procedures) !== JSON.stringify(firebaseData.procedures)) {
                procedures = firebaseData.procedures;
                hasChanges = true;
            }
            if (firebaseData.faq && JSON.stringify(faq) !== JSON.stringify(firebaseData.faq)) {
                faq = firebaseData.faq;

            }
            if (firebaseData.announcements && JSON.stringify(announcements) !== JSON.stringify(firebaseData.announcements)) {
                announcements = firebaseData.announcements;
                hasChanges = true;
            }
            if (firebaseData.orgStructure && JSON.stringify(orgStructure) !== JSON.stringify(firebaseData.orgStructure)) {
                orgStructure = firebaseData.orgStructure;
                hasChanges = true;
            }
            if (firebaseData.performance && JSON.stringify(performance) !== JSON.stringify(firebaseData.performance)) {
                performance = firebaseData.performance;
                hasChanges = true;
            }
            
            if (hasChanges) {
                // تحديث localStorage
                localStorage.setItem('hr_users', JSON.stringify(users));
                localStorage.setItem('hr_company', JSON.stringify(companyData));
                localStorage.setItem('hr_jobs', JSON.stringify(jobs));
                localStorage.setItem('hr_policies', JSON.stringify(policies));
                localStorage.setItem('hr_behaviors', JSON.stringify(behaviors));
                localStorage.setItem('hr_procedures', JSON.stringify(procedures));
                localStorage.setItem('hr_faq', JSON.stringify(faq));
                localStorage.setItem('hr_announcements', JSON.stringify(announcements));
                localStorage.setItem('hr_org_structure', JSON.stringify(orgStructure));
                localStorage.setItem('hr_performance', JSON.stringify(performance));
                
                // تحديث المستخدم الحالي
                if (currentUser) {
                    const updatedUser = users.find(u => u.email === currentUser.email);
                    if (updatedUser) {

                console.log('✅ تم تحديث البيانات من Firebase');
            }
        });

    function login(email, pass) {
        let u = users.find(u => u.email === email && u.password === pass);
        if(u) { currentUser = u; sessionStorage.setItem('user', JSON.stringify(u)); renderApp(); return true; }
        return false;
    }
    
    async function register(name, email, pass, confirm) {
        if(pass !== confirm) { alert("كلمة المرور غير متطابقة"); return false; }
        if(users.find(u => u.email === email)) { alert("البريد موجود"); return false; }
        users.push({ id: Date.now(), name, email, password: pass, role: "employee", jobTitle: "موظف" });
        await saveAllToFirebase();
        return true;
    }

        <div class="card"><h4>🏢 الأقسام</h4><div class="org-departments" style="display:flex;flex-direction:column;">${orgStructure.departments.map(d => `<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid rgba(212,175,55,0.1);"><span><strong>${d.name}</strong> - المدير: ${d.head} (${d.members} عضو)</span><div><button class="btn" style="width:auto;padding:3px 10px;" onclick="editOrgDept(${d.id})">✏️</button> <button class="btn" style="width:auto;padding:3px 10px;background:#ef4444;" onclick="deleteOrgDept(${d.id})">🗑️</button></div></div>`).join('')}</div>
        <button class="btn" style="margin-top:10px;" onclick="showAddDeptModal()">+ إضافة قسم جديد</button></div>
        
        <div class="card"><h4>🔔 الإعلانات</h4>${announcements.map(a => `<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid rgba(212,175,55,0.1);"><span><strong>${a.title}</strong><br><small>${a.content}</small></span><div><button class="btn" style="width:auto;padding:3px 10px;" onclick="editItem('announcement',${a.id})">✏️</button> <button class="btn" style="width:auto;padding:3px 10px;background:#ef4444;" onclick="deleteItem('announcement',${a.id})">🗑️</button></div></div>`).join('')}</div>
        
        <div class="card"><h4>⭐ تقييم الأداء</h4>
        ${Object.keys(performance).map(jobTitle => `
            <div style="margin-bottom:15px; padding:10px; background:rgba(212,175,55,0.1); border-radius:12px;">
                <strong>${jobTitle}</strong>
                <button class="btn" style="width:auto;padding:3px 10px;margin-right:10px;" onclick="editPerformance('${jobTitle}')">تعديل المعايير</button>
            </div>
        `).join('')}</div>`;
    }
    
    window.editCompanyData = function() {
        let logoPreview = companyData.logo ? `<img src="${companyData.logo}" style="width:80px;height:80px;border-radius:50%;margin-bottom:10px;">` : '<div style="width:80px;height:80px;background:rgba(212,175,55,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;"><i class="fas fa-building" style="font-size:40px;"></i></div>';
        
        showModal('تعديل بيانات الشركة', `
            <div style="text-align:center; margin-bottom:15px;">
                ${logoPreview}
                <div class="form-group"><label>شعار الشركة (رابط الصورة)</label><input id="compLogo" placeholder="أدخل رابط الصورة" value="${companyData.logo || ''}"></div>
                <button class="btn" style="margin-top:5px; width:auto; padding:5px 15px;" onclick="uploadCompanyLogo()">اختيار صورة</button>
                <input type="file" id="logoFileInput" accept="image/*" style="display:none" onchange="handleCompanyLogoUpload(this)">
            </div>
            <div class="form-group"><label>اسم الشركة</label><input id="compName" value="${companyData.name}"></div>
            <div class="form-group"><label>الرؤية</label><textarea id="compVision" rows="2">${companyData.vision}</textarea></div>
            <div class="form-group"><label>الرسالة</label><textarea id="compMission" rows="2">${companyData.mission}</textarea></div>
        `, async () => {
            companyData.name = document.getElementById('compName').value;
            companyData.vision = document.getElementById('compVision').value;
            companyData.mission = document.getElementById('compMission').value;
            if(document.getElementById('compLogo').value) companyData.logo = document.getElementById('compLogo').value;
            await saveAllToFirebase();
            renderApp();
            alert('تم تحديث بيانات الشركة ✅');
        });
    };
    
    window.handleCompanyLogoUpload = function(input) {
        if(input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('compLogo').value = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    };
    
    window.uploadCompanyLogo = function() {
        document.getElementById('logoFileInput').click();
    };
    
    function showModal(title, html, onSave) {
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3>${title}</h3>${html}<div style="margin-top:15px;"><button class="btn" onclick="saveModal(this)">حفظ</button><button class="btn" style="background:#ef4444;" onclick="this.closest('.modal').remove()">إلغاء</button></div></div>`;
        document.body.appendChild(modal);
        window.saveModal = async (btn) => {
            await onSave();
            btn.closest('.modal').remove();
        };
    }
    
    window.showAddModal = function(type) {
        let fields = {
            job: '<div class="form-group"><label>المسمى</label><input id="title"></div><div class="form-group"><label>القسم</label><input id="dept"></div>',
            policy: '<div class="form-group"><label>العنوان</label><input id="title"></div><div class="form-group"><label>الوصف</label><input id="desc"></div><div class="form-group"><label>المحتوى</label><textarea id="content" rows="3"></textarea></div>',
            behavior: '<div class="form-group"><label>العنوان</label><input id="title"></div><div class="form-group"><label>الوصف</label><textarea id="desc" rows="2"></textarea></div>',
            procedure: '<div class="form-group"><label>العنوان</label><input id="title"></div><div class="form-group"><label>الوصف</label><textarea id="desc" rows="2"></textarea></div>',
            faq: '<div class="form-group"><label>السؤال</label><input id="q"></div><div class="form-group"><label>الإجابة</label><textarea id="a" rows="3"></textarea></div>',
            announcement: '<div class="form-group"><label>العنوان</label><input id="title"></div><div class="form-group"><label>المحتوى</label><textarea id="content" rows="2"></textarea></div>',
            dept: '<div class="form-group"><label>اسم القسم</label><input id="name"></div><div class="form-group"><label>رئيس القسم</label><input id="head"></div><div class="form-group"><label>عدد الأعضاء</label><input id="members" type="number"></div>'
        };
        showModal('إضافة', fields[type], async () => {
            if(type === 'job') jobs.push({ id: Date.now(), title: document.getElementById('title').value, department: document.getElementById('dept').value });
            else if(type === 'policy') policies.push({ id: Date.now(), title: document.getElementById('title').value, description: document.getElementById('desc').value, content: document.getElementById('content').value });
            else if(type === 'behavior') behaviors.push({ id: Date.now(), title: document.getElementById('title').value, desc: document.getElementById('desc').value });
            else if(type === 'procedure') procedures.push({ id: Date.now(), step: procedures.length+1, title: document.getElementById('title').value, desc: document.getElementById('desc').value });
            else if(type === 'faq') faq.push({ id: Date.now(), question: document.getElementById('q').value, answer: document.getElementById('a').value });
            else if(type === 'announcement') announcements.push({ id: Date.now(), title: document.getElementById('title').value, content: document.getElementById('content').value, date: new Date().toLocaleDateString() });
            else if(type === 'dept') orgStructure.departments.push({ id: Date.now(), name: document.getElementById('name').value, head: document.getElementById('head').value, members: parseInt(document.getElementById('members').value) });
            await saveAllToFirebase();
            renderApp();
            alert('تم الإضافة ✅');
        });
    };
    
    window.editItem = function(type, id) {
        let item, fields;
        if(type === 'job') { item = jobs.find(i => i.id === id); fields = `<div class="form-group"><label>المسمى</label><input id="title" value="${item.title}"></div><div class="form-group"><label>القسم</label><input id="dept" value="${item.department}"></div>`; }
        else if(type === 'policy') { item = policies.find(i => i.id === id); fields = `<div class="form-group"><label>العنوان</label><input id="title" value="${item.title}"></div><div class="form-group"><label>الوصف</label><input id="desc" value="${item.description}"></div><div class="form-group"><label>المحتوى</label><textarea id="content">${item.content}</textarea></div>`; }
        else if(type === 'behavior') { item = behaviors.find(i => i.id === id); fields = `<div class="form-group"><label>العنوان</label><input id="title" value="${item.title}"></div><div class="form-group"><label>الوصف</label><textarea id="desc">${item.desc}</textarea></div>`; }
        else if(type === 'procedure') { item = procedures.find(i => i.id === id); fields = `<div class="form-group"><label>العنوان</label><input id="title" value="${item.title}"></div><div class="form-group"><label>الوصف</label><textarea id="desc">${item.desc}</textarea></div>`; }
        else if(type === 'faq') { item = faq.find(i => i.id === id); fields = `<div class="form-group"><label>السؤال</label><input id="q" value="${item.question}"></div><div class="form-group"><label>الإجابة</label><textarea id="a">${item.answer}</textarea></div>`; }
        else if(type === 'announcement') { item = announcements.find(i => i.id === id); fields = `<div class="form-group"><label>العنوان</label><input id="title" value="${item.title}"></div><div class="form-group"><label>المحتوى</label><textarea id="content">${item.content}</textarea></div>`; }
        showModal('تعديل', fields, async () => {
            if(type === 'job') { item.title = document.getElementById('title').value; item.department = document.getElementById('dept').value; }
            else if(type === 'policy') { item.title = document.getElementById('title').value; item.description = document.getElementById('desc').value; item.content = document.getElementById('content').value; }
            else if(type === 'behavior') { item.title = document.getElementById('title').value; item.desc = document.getElementById('desc').value; }
            else if(type === 'procedure') { item.title = document.getElementById('title').value; item.desc = document.getElementById('desc').value; }
            else if(type === 'faq') { item.question = document.getElementById('q').value; item.answer = document.getElementById('a').value; }
            else if(type === 'announcement') { item.title = document.getElementById('title').value; item.content = document.getElementById('content').value; item.date = new Date().toLocaleDateString(); }
            await saveAllToFirebase();
            renderApp();
            alert('تم التعديل ✅');
        });
    };
    
    window.deleteItem = async function(type, id) {
        if(confirm('حذف؟')) {
            if(type === 'job') jobs = jobs.filter(i => i.id !== id);
            else if(type === 'policy') policies = policies.filter(i => i.id !== id);
            else if(type === 'behavior') behaviors = behaviors.filter(i => i.id !== id);
            else if(type === 'procedure') procedures = procedures.filter(i => i.id !== id);
            else if(type === 'faq') faq = faq.filter(i => i.id !== id);
            else if(type === 'announcement') announcements = announcements.filter(i => i.id !== id);
            await saveAllToFirebase();
            renderApp();
            alert('تم الحذف ✅');
        }
    };
    
    window.editOrgDept = function(id) {
        let dept = orgStructure.departments.find(d => d.id === id);
        showModal('تعديل القسم', `
            <div class="form-group"><label>اسم القسم</label><input id="name" value="${dept.name}"></div>
            <div class="form-group"><label>رئيس القسم</label><input id="head" value="${dept.head}"></div>
            <div class="form-group"><label>عدد الأعضاء</label><input id="members" value="${dept.members}" type="number"></div>
        `, async () => {
            dept.name = document.getElementById('name').value;
            dept.head = document.getElementById('head').value;
            dept.members = parseInt(document.getElementById('members').value);
            await saveAllToFirebase();
            renderApp();
            alert('تم تعديل القسم ✅');
        });
    };
    
    window.deleteOrgDept = async function(id) {
        if(confirm('حذف القسم؟')) {
            orgStructure.departments = orgStructure.departments.filter(d => d.id !== id);
            await saveAllToFirebase();
            renderApp();
            alert('تم الحذف ✅');
        }
    };
    
    window.showAddDeptModal = function() {
        showModal('إضافة قسم جديد', `
            <div class="form-group"><label>اسم القسم</label><input id="name"></div>
            <div class="form-group"><label>رئيس القسم</label><input id="head"></div>
            <div class="form-group"><label>عدد الأعضاء</label><input id="members" type="number" value="1"></div>
        `, async () => {
            orgStructure.departments.push({ id: Date.now(), name: document.getElementById('name').value, head: document.getElementById('head').value, members: parseInt(document.getElementById('members').value) });
            await saveAllToFirebase();
            renderApp();
            alert('تم إضافة القسم ✅');
        });
    };
    
    window.editOrgItem = function(type) {
        if(type === 'ceo') {
            showModal('تعديل الإدارة العليا', `
                <div class="form-group"><label>الاسم</label><input id="name" value="${orgStructure.ceo.name}"></div>
                <div class="form-group"><label>رئيس الإدارة</label><input id="head" value="${orgStructure.ceo.head}"></div>
                <div class="form-group"><label>عدد الأعضاء</label><input id="members" value="${orgStructure.ceo.members}" type="number"></div>
            `, async () => {
                orgStructure.ceo.name = document.getElementById('name').value;
                orgStructure.ceo.head = document.getElementById('head').value;
                orgStructure.ceo.members = parseInt(document.getElementById('members').value);
                await saveAllToFirebase();
                renderApp();
                alert('تم التعديل ✅');
            });
        }
    };
    
    window.editPerformance = function(jobTitle) {
        let perf = performance[jobTitle];
        let criteriaHtml = perf.criteria.map((c, idx) => `
            <div style="margin-bottom:10px; padding:10px; background:rgba(255,255,255,0.05); border-radius:10px;">
                <div class="form-group"><label>اسم المعيار</label><input id="cName${idx}" value="${c.name}"></div>
                <div style="display:flex; gap:10px;">
                    <div class="form-group" style="flex:1"><label>الدرجة الحالية</label><input id="cValue${idx}" type="number" value="${c.value}"></div>
                    <div class="form-group" style="flex:1"><label>الدرجة القصوى</label><input id="cMax${idx}" type="number" value="${c.max}"></div>
                    <div class="form-group" style="flex:1"><label>الوزن %</label><input id="cWeight${idx}" type="number" value="${c.weight}"></div>
                </div>
            </div>
        `).join('');
        
        showModal(`تعديل معايير التقييم - ${jobTitle} (5 معايير)`, `
            ${criteriaHtml}
        `, async () => {
            let newCriteria = [];
            for(let i = 0; i < perf.criteria.length; i++) {
                if(document.getElementById(`cName${i}`)) {
                    newCriteria.push({
                        name: document.getElementById(`cName${i}`).value,
                        value: parseInt(document.getElementById(`cValue${i}`).value),
                        max: parseInt(document.getElementById(`cMax${i}`).value),
                        weight: parseInt(document.getElementById(`cWeight${i}`).value)
                    });
                }
            }
            performance[jobTitle].criteria = newCriteria;
            await saveAllToFirebase();
            renderApp();
            alert('تم تعديل معايير التقييم ✅');
        });
    };
    
    function renderApp() {
        if(!currentUser) { document.getElementById('app').innerHTML = renderLogin(); return; }
        let isAdmin = currentUser.role === 'admin';
        document.getElementById('app').innerHTML = `
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header"><div class="logo">🏢 HR SYSTEM</div><div style="font-size:10px; opacity:0.6;">متزامن مع السحابة ☁️</div></div>
            <div class="nav-item ${currentPageVar === 'home' ? 'active' : ''}" data-page="home"><i class="fas fa-home"></i> الرئيسية</div>
            <div class="nav-item ${currentPageVar === 'guide' ? 'active' : ''}" data-page="guide"><i class="fas fa-book"></i> دليل الموظف</div>
            <div class="nav-item ${currentPageVar === 'org' ? 'active' : ''}" data-page="org"><i class="fas fa-building"></i> الهيكل التنظيمي</div>
            <div class="nav-item ${currentPageVar === 'company' ? 'active' : ''}" data-page="company"><i class="fas fa-flag-checkered"></i> عن الشركة</div>
            <div class="nav-item ${currentPageVar === 'performance' ? 'active' : ''}" data-page="performance"><i class="fas fa-chart-line"></i> تقييم الأداء</div>
            <div class="nav-item ${currentPageVar === 'notifications' ? 'active' : ''}" data-page="notifications"><i class="fas fa-bell"></i> الإشعارات</div>
            <div class="nav-item ${currentPageVar === 'profile' ? 'active' : ''}" data-page="profile"><i class="fas fa-user"></i> حسابي</div>
            ${isAdmin ? `<div class="nav-item ${currentPageVar === 'admin' ? 'active' : ''}" data-page="admin"><i class="fas fa-cog"></i> لوحة التحكم</div>` : ''}
            <div class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</div>
        </div>
        <div class="main-content">
            <div class="top-bar"><button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div class="page-title">${getTitle()}</div><div class="avatar"><i class="fas fa-user"></i></div></div>
            <div id="pageContent"></div>
        </div>
        <div class="bottom-nav">
            <div class="bottom-nav-item ${currentPageVar === 'home' ? 'active' : ''}" data-page="home"><i class="fas fa-home"></i><span>الرئيسية</span></div>
            <div class="bottom-nav-item ${currentPageVar === 'guide' ? 'active' : ''}" data-page="guide"><i class="fas fa-book"></i><span>الدليل</span></div>
            <div class="bottom-nav-item ${currentPageVar === 'profile' ? 'active' : ''}" data-page="profile"><i class="fas fa-user"></i><span>حسابي</span></div>
            <div class="bottom-nav-item ${currentPageVar === 'notifications' ? 'active' : ''}" data-page="notifications"><i class="fas fa-bell"></i><span>إشعارات</span></div>
        </div>`;
        renderPage();
        attachEvents();
    }
    
    function getTitle() {
        let titles = { home:"الرئيسية", guide:"دليل الموظف", org:"الهيكل التنظيمي", company:"عن الشركة", performance:"تقييم الأداء", notifications:"الإشعارات", profile:"حسابي", admin:"لوحة التحكم" };
        return titles[currentPageVar] || "الرئيسية";
    }
    
    function renderPage() {
        let pages = { home: renderHome, guide: renderGuide, org: renderOrg, company: renderCompany, performance: renderPerformance, notifications: renderNotifications, profile: renderProfile, admin: renderAdmin };
        document.getElementById('pageContent').innerHTML = (pages[currentPageVar] || renderHome)();
    }
    
    function attachEvents() {
        document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(el => {
            let page = el.dataset.page;
            if(page) el.onclick = () => { currentPageVar = page; renderApp(); };
        });
    }
    
    // بدء التطبيق
    async function initApp() {
        // إخفاء شاشة التحميل بعد ثانية
        setTimeout(() => {
            const loadingScreen = document.getElementById('loadingScreen');
            if(loadingScreen) loadingScreen.style.display = 'none';
        }, 1500);
        
        // تحميل البيانات من Firebase
        await loadFromFirebase();
        
        // إعداد الاستماع للتحديثات الفورية
        setupRealtimeSync();
        
        // استعادة جلسة المستخدم
        let savedUser = sessionStorage.getItem('user');
        if(savedUser) currentUser = JSON.parse(savedUser);
        
        renderApp();
    }
    
    initApp();
</script>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
        .then(() => console.log('✅ Service Worker Registered'))
        .catch(err => console.log('❌ Service Worker Error:', err));
}
</script>
</body>
</html>
