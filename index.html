<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>HR System | نظام الموارد البشرية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #0a1a2f, #061220);
            direction: rtl;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Login Page */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(145deg, #0a1a2f, #061220);
        }
        .login-card {
            background: rgba(10, 26, 47, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 35px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .quran-quote { text-align: center; margin-bottom: 20px; padding: 15px; background: rgba(212,175,55,0.1); border-radius: 20px; }
        .quote-arabic { font-size: 18px; font-family: 'Amiri', serif; }
        .logo-icon { width: 70px; height: 70px; background: linear-gradient(135deg, #d4af37, #b8960c); border-radius: 25px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; }
        .login-card h2 { text-align: center; font-size: 22px; color: #d4af37; }
        .login-card input { width: 100%; padding: 14px; margin-bottom: 15px; background: rgba(255,255,255,0.08); border: 1px solid rgba(212,175,55,0.3); border-radius: 30px; color: white; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; font-weight: bold; border: none; border-radius: 30px; cursor: pointer; }
        .register-link { text-align: center; margin-top: 15px; font-size: 13px; }
        .register-link span { color: #d4af37; cursor: pointer; }
        .register-form { display: none; margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(212,175,55,0.2); }
        .register-form.show { display: block; }
        .avatar-preview { width: 80px; height: 80px; background: rgba(212,175,55,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; cursor: pointer; overflow: hidden; }

        /* Sidebar */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: #0a1a2f;
            border-left: 1px solid rgba(212,175,55,0.2);
            z-index: 200;
            transition: all 0.4s;
            overflow-y: auto;
        }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid rgba(212,175,55,0.2); }
        .logo-area { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .company-logo { width: 45px; height: 45px; background: linear-gradient(135deg, #d4af37, #b8960c); border-radius: 15px; display: flex; align-items: center; justify-content: center; }
        .logo { font-size: 20px; font-weight: 800; color: #d4af37; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 20px; margin: 6px 12px;
            border-radius: 14px; cursor: pointer; transition: all 0.3s; color: #a0aec0;
        }
        .nav-item:hover { background: rgba(212,175,55,0.15); color: #d4af37; }
        .nav-item.active { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; }
        .nav-item i { width: 24px; }

        .main-content { margin-right: 280px; min-height: 100vh; padding: 0 25px 25px 25px; }
        .top-bar {
            background: rgba(10, 26, 47, 0.95); padding: 12px 20px; display: flex;
            justify-content: space-between; align-items: center; position: sticky; top: 0;
            z-index: 99; margin-bottom: 15px; border-radius: 0 0 20px 20px;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .page-title { font-size: 22px; font-weight: 800; color: #d4af37; }
        .avatar { width: 45px; height: 45px; background: linear-gradient(135deg, #d4af37, #b8960c); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }

        .bottom-nav {
            display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #0a1a2f;
            padding: 8px 12px 20px; justify-content: space-around; z-index: 150;
            border-top: 1px solid rgba(212,175,55,0.2);
        }
        .bottom-nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            font-size: 11px; color: #94a3b8; cursor: pointer; padding: 6px 10px; border-radius: 25px;
        }
        .bottom-nav-item i { font-size: 20px; }
        .bottom-nav-item.active { color: #d4af37; background: rgba(212,175,55,0.15); }

        /* الرئيسية */
        .hero-section {
            background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(10,26,47,0.95));
            border-radius: 28px;
            padding: 25px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .hero-text { flex: 2; }
        .hero-text .greeting { font-size: 28px; font-weight: 800; color: #d4af37; margin-bottom: 12px; }
        .hero-text .job-info { font-size: 16px; margin: 12px 0; background: rgba(212,175,55,0.1); display: inline-block; padding: 6px 15px; border-radius: 30px; }
        .hero-text .quote { font-size: 15px; opacity: 0.9; font-style: italic; margin: 12px 0; }
        .hero-text .hadith { font-size: 14px; opacity: 0.8; margin-top: 8px; color: #c4b5fd; }
        .hero-image { width: 85px; height: 85px; background: linear-gradient(135deg, #d4af37, #b8960c); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .hero-image i { font-size: 45px; color: #0a1a2f; }

        .card { background: rgba(10, 26, 47, 0.9); border-radius: 22px; padding: 18px; margin-bottom: 18px; border: 1px solid rgba(212,175,55,0.2); transition: all 0.3s; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
        .stat-card { background: rgba(10, 26, 47, 0.9); border-radius: 18px; padding: 15px; text-align: center; }
        .stat-number { font-size: 32px; font-weight: 800; color: #d4af37; }

        /* الإشعارات المنبثقة */
        .notification-toast {
            position: fixed; top: 20px; left: 20px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            color: #0a1a2f; padding: 12px 20px; border-radius: 30px;
            display: flex; align-items: center; gap: 12px; z-index: 1100;
            animation: slideInRight 0.3s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* دليل الموظف */
        .guide-tabs {
            display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 5px;
        }
        .guide-tab { padding: 8px 18px; border-radius: 30px; cursor: pointer; transition: all 0.2s; }
        .guide-tab:hover { background: rgba(212,175,55,0.1); }
        .guide-tab.active { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; }
        
        .guide-content-list { display: flex; flex-direction: column; gap: 12px; }
        .guide-item {
            background: rgba(10, 26, 47, 0.7); border: 1px solid rgba(212,175,55,0.2);
            border-radius: 18px; padding: 15px; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: space-between;
        }
        .guide-item:hover { transform: translateX(-5px); border-color: #d4af37; background: rgba(212,175,55,0.1); }
        .guide-item-info { flex: 1; }
        .guide-item-title { font-size: 16px; font-weight: bold; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .guide-item-desc { font-size: 13px; opacity: 0.7; line-height: 1.5; }
        .guide-item-arrow { color: #d4af37; font-size: 18px; }

        /* نافذة عرض التفاصيل */
        .detail-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .detail-modal {
            background: linear-gradient(145deg, #0f1a2e, #0a1220);
            border-radius: 28px; width: 90%; max-width: 500px; max-height: 80vh;
            overflow-y: auto; border: 1px solid rgba(212,175,55,0.3);
        }
        .detail-modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .detail-modal-header h3 { color: #d4af37; font-size: 18px; }
        .close-modal { width: 32px; height: 32px; background: rgba(212,175,55,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .detail-modal-body { padding: 20px; line-height: 1.7; font-size: 15px; }

        /* المساعد الذكي */
        .assistant-wrapper {
            background: rgba(10, 26, 47, 0.95);
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .assistant-header {
            background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(10,26,47,0.9));
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .assistant-icon { width: 50px; height: 50px; background: linear-gradient(135deg, #d4af37, #b8960c); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .assistant-icon i { font-size: 24px; color: #0a1a2f; }
        .assistant-header-text h3 { color: #d4af37; font-size: 18px; }
        .assistant-header-text p { font-size: 12px; opacity: 0.7; }
        
        .questions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; padding: 15px; background: rgba(0,0,0,0.2); }
        .question-btn { background: rgba(212,175,55,0.1); padding: 8px 12px; border-radius: 40px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .question-btn:hover { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; }
        
        .chat-area { padding: 15px; min-height: 280px; display: flex; flex-direction: column; gap: 12px; }
        .user-bubble { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; padding: 10px 15px; border-radius: 20px 20px 8px 20px; align-self: flex-end; max-width: 85%; font-size: 13px; }
        .typing-indicator { background: rgba(212,175,55,0.1); padding: 10px 15px; border-radius: 20px; align-self: flex-start; display: flex; gap: 5px; }
        .typing-dot { width: 7px; height: 7px; background: #d4af37; border-radius: 50%; animation: typingAnim 1.4s infinite; }
        @keyframes typingAnim { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
        
        .response-card { background: rgba(212,175,55,0.08); border-radius: 18px; padding: 15px; align-self: flex-start; max-width: 90%; border-right: 3px solid #d4af37; }
        .response-title { font-size: 14px; font-weight: bold; color: #d4af37; margin-bottom: 8px; }
        .response-content { line-height: 1.6; font-size: 13px; white-space: pre-line; }
        .chat-input-area { display: flex; padding: 12px; gap: 8px; border-top: 1px solid rgba(212,175,55,0.2); }
        .chat-input-area input { flex: 1; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(212,175,55,0.3); border-radius: 30px; color: white; }
        .send-btn { padding: 10px 20px; width: auto; }

        /* الهيكل التنظيمي */
        .org-builder { background: rgba(0,0,0,0.2); border-radius: 25px; padding: 20px; overflow-x: auto; }
        .org-tree { display: flex; flex-direction: column; align-items: center; min-width: 650px; }
        .org-ceo-card { background: linear-gradient(135deg, #d4af37, #b8960c); border-radius: 18px; padding: 12px 25px; text-align: center; margin-bottom: 30px; color: #0a1a2f; cursor: pointer; }
        .org-level { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .org-dept-card { background: rgba(10, 26, 47, 0.9); border-radius: 15px; padding: 12px; min-width: 140px; text-align: center; border: 1px solid rgba(212,175,55,0.3); }

        /* تقييم الأداء */
        .performance-card { background: rgba(10, 26, 47, 0.7); border-radius: 22px; padding: 18px; margin-bottom: 18px; }
        .overall-score { font-size: 48px; font-weight: 800; color: #d4af37; text-align: center; }
        .score-bar { width: 100%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 12px 0; overflow: hidden; }
        .score-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, #d4af37, #b8960c); }
        .criteria-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-top: 15px; }
        .criteria-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 14px; }
        .criteria-name { font-size: 14px; font-weight: bold; color: #d4af37; margin-bottom: 8px; }
        .criteria-progress { width: 100%; height: 5px; background: rgba(255,255,255,0.1); border-radius: 5px; margin: 8px 0; overflow: hidden; }
        .criteria-progress-fill { height: 100%; background: linear-gradient(90deg, #d4af37, #b8960c); }

        /* لوحة التحكم */
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .admin-card { background: rgba(10, 26, 47, 0.7); border-radius: 16px; padding: 12px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .admin-card:hover { transform: translateY(-3px); background: rgba(212,175,55,0.15); }
        .admin-card i { font-size: 28px; color: #d4af37; margin-bottom: 6px; }
        
        .admin-table { width: 100%; border-collapse: collapse; }
        .admin-table th, .admin-table td { padding: 10px 6px; text-align: right; border-bottom: 1px solid rgba(212,175,55,0.15); }
        .admin-table th { color: #d4af37; }
        .admin-actions { display: flex; gap: 6px; justify-content: center; }
        .admin-btn { background: rgba(212,175,55,0.15); border: none; border-radius: 6px; padding: 4px 10px; cursor: pointer; color: #d4af37; font-size: 11px; }
        .admin-btn.danger { color: #ef4444; }

        .modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: linear-gradient(145deg, #0a1a2f, #061220);
            border-radius: 28px; padding: 22px; width: 90%; max-width: 500px;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; color: #d4af37; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.3); border-radius: 12px; color: white;
        }

        .menu-toggle { display: none; background: none; border: none; font-size: 22px; color: white; cursor: pointer; }
        @media (max-width: 992px) {
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; }
            .bottom-nav { display: flex; }
            .menu-toggle { display: block; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .hero-section { padding: 18px; }
            .hero-image { width: 60px; height: 60px; }
            .hero-image i { font-size: 30px; }
            .hero-text .greeting { font-size: 22px; }
            .admin-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div id="appRoot"></div>

<script>
    // ==================== نصوص متغيرة للرئيسية ====================
    const workQuotes = [
        { text: "خير الناس أنفعهم للناس", author: "الحديث الشريف" },
        { text: "من جد وجد ومن زرع حصد", author: "حكمة عربية" },
        { text: "اتقن عملك يُتقن لك", author: "حكمة" }
    ];
    const quranVerses = [
        { text: "وَقُل رَّبِّ زِدْنِي عِلْمًا", author: "سورة طه (114)" },
        { text: "إِنَّ اللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّى يُغَيِّرُوا مَا بِأَنفُسِهِمْ", author: "سورة الرعد (11)" },
        { text: "فَإِنَّ مَعَ الْعُسْرِ يُسْرًا", author: "سورة الشرح (5)" }
    ];
    const hadiths = [
        { text: "إنما الأعمال بالنيات", author: "رواه البخاري" },
        { text: "لا ضرر ولا ضرار", author: "رواه ابن ماجه" },
        { text: "المؤمن للمؤمن كالبنيان", author: "رواه البخاري" }
    ];

    function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function getRandomWorkQuote() { return getRandomItem(workQuotes); }
    function getRandomQuranVerse() { return getRandomItem(quranVerses); }
    function getRandomHadith() { return getRandomItem(hadiths); }

    function showNotification(title, message) {
        let toast = document.createElement('div');
        toast.className = 'notification-toast';
        toast.innerHTML = `<i class="fas fa-bell"></i><div><strong>${title}</strong><br><small>${message}</small></div>`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

    // ==================== المستخدمين ====================
    let usersDatabase = JSON.parse(localStorage.getItem('hr_users')) || [
        { id: 1, email: "admin@hr.com", password: "admin123", name: "أحمد المدير", role: "admin", avatar: null, jobTitle: "مدير الموارد البشرية", department: "الموارد البشرية" }
    ];
    let currentSession = JSON.parse(sessionStorage.getItem('hr_session')) || null;
    let showRegister = false;

    // ==================== الهيكل التنظيمي ====================
    let orgStructure = JSON.parse(localStorage.getItem('hr_org_structure')) || {
        ceo: { name: "مجلس الإدارة", head: "أحمد الراشد", members: 5 },
        departments: [
            { id: "dept1", name: "الموارد البشرية", head: "سارة العتيبي", members: 12 },
            { id: "dept2", name: "المالية", head: "ليلى الحربي", members: 15 },
            { id: "dept3", name: "التقنية", head: "عمر القحطاني", members: 45 },
            { id: "dept4", name: "التسويق", head: "نور الشمري", members: 20 }
        ]
    };

    // ==================== المسميات الوظيفية ====================
    let globalJobsList = JSON.parse(localStorage.getItem('hr_global_jobs')) || [
        { id: 1, title: "مدير الموارد البشرية", department: "الموارد البشرية", level: "إداري" },
        { id: 2, title: "محاسب", department: "المالية", level: "تنفيذي" },
        { id: 3, title: "مبرمج", department: "التقنية", level: "متخصص" },
        { id: 4, title: "مسوق رقمي", department: "التسويق", level: "متخصص" }
    ];

    // ==================== السياسات (عنوان ووصف مثل السلوكيات) ====================
    let policiesList = JSON.parse(localStorage.getItem('hr_policies')) || [
        { id: 1, title: "سياسة الإجازة السنوية", category: "إجازات", description: "21 يوم عمل إجازة سنوية مدفوعة الأجر", content: "جميع الموظفين بدوام كامل يحق لهم 21 يوم عمل إجازة سنوية مدفوعة الأجر بعد إتمام 6 أشهر. يجب تقديم الطلب قبل أسبوعين من تاريخ الإجازة." },
        { id: 2, title: "سياسة سلفة الراتب", category: "مالية", description: "بعد 6 أشهر عمل، بحد أقصى 50% من الراتب", content: "بعد إتمام 6 أشهر عمل، يحق للموظف طلب سلفة راتب تصل إلى 50% من الراتب الشهري، تسدد على 6 دفعات شهرية متساوية." },
        { id: 3, title: "سياسة العمل عن بعد", category: "عام", description: "يومان عمل عن بعد أسبوعياً", content: "يحق للموظف العمل عن بعد يومين في الأسبوع (الإثنين والأربعاء) بعد موافقة المدير المباشر. يشترط توفر بيئة عمل مناسبة." }
    ];

    // ==================== السلوكيات ====================
    let behaviorsList = JSON.parse(localStorage.getItem('hr_behaviors')) || [
        { id: 1, title: "الاحترافية", desc: "الحفاظ على سلوك محترم مع جميع الزملاء والعملاء" },
        { id: 2, title: "الالتزام بالمواعيد", desc: "الحضور في الوقت المحدد وإخطار المدير عند التأخر" },
        { id: 3, title: "السرية", desc: "الحفاظ على سرية معلومات الشركة والموظفين" },
        { id: 4, title: "الابتكار", desc: "اقتراح التحسينات وتطوير أساليب العمل" }
    ];

    // ==================== الإجراءات ====================

    function calculateOverallScore(criteria) {
        if(!criteria) return 0;
        let total = criteria.reduce((sum, c) => sum + c.value, 0);
        let max = criteria.reduce((sum, c) => sum + c.max, 0);
        return Math.round((total / max) * 100);
    }

    // دوال تسجيل الدخول
    function login(email, password, remember) {
        let user = usersDatabase.find(u => u.email === email && u.password === password);
        if(user) {
            currentSession = { userId: user.id, email: user.email, role: user.role };
            sessionStorage.setItem('hr_session', JSON.stringify(currentSession));
            if(remember) localStorage.setItem('hr_remember', JSON.stringify({ email, password }));
            else localStorage.removeItem('hr_remember');
            renderApp();
            return true;
        }
        return false;
    }

        usersDatabase.push({ id: Date.now(), name, email, password, role: "employee", avatar, jobTitle: jobTitle || "موظف", department: dept || "غير محدد" });
        saveAll();
        return true;

    // المساعد الذكي
    let assistantChatHistory = [];
    let typingInterval = null;

    function stopTyping() { if(typingInterval) { clearInterval(typingInterval); typingInterval = null; } }

    function typeTextToElement(element, text, speed = 20) {
        return new Promise((resolve) => {
            let i = 0;
            element.innerHTML = '';
            function type() {
                if(i < text.length) {
                    element.innerHTML += text[i];
                    i++;
                    typingInterval = setTimeout(type, speed);
                } else {
                    clearTimeout(typingInterval);
                    typingInterval = null;
                    resolve();
                }
            }
            type();
        });
    }

    async function formatAndDisplayResponse(question, answer) {
        let chatArea = document.getElementById('assistantChatArea');
        if(!chatArea) return;
        
        let userBubble = document.createElement('div');
        userBubble.className = 'user-bubble';
        userBubble.innerText = question;
        chatArea.appendChild(userBubble);
        chatArea.scrollTop = chatArea.scrollHeight;
        
        let typingDiv = document.createElement('div');
        typingDiv.className = 'typing-indicator';
        typingDiv.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
        chatArea.appendChild(typingDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
        
        await new Promise(resolve => setTimeout(resolve, 1200));
        typingDiv.remove();
        
        let responseCard = document.createElement('div');
        responseCard.className = 'response-card';
        let title = question.replace("ما هي ", "").replace("كيف ", "").replace("؟", "");
        responseCard.innerHTML = `<div class="response-title">📌 ${title}</div><div class="response-content" id="responseContent-${Date.now()}"></div>`;
        chatArea.appendChild(responseCard);
        chatArea.scrollTop = chatArea.scrollHeight;
        
        let contentDiv = responseCard.querySelector('.response-content');
        await typeTextToElement(contentDiv, answer, 15);
    }

    async function quickAssistantQuestion(q) {
        let found = faqList.find(f => f.question === q);
        let answer = found ? found.answer : "❌ لم يتم العثور على إجابة. تواصل مع HR.";
        await formatAndDisplayResponse(q, answer);
    }

    async function sendManualAssistantMessage() {
        let input = document.getElementById('assistantInput');
        if(!input) return;
        let q = input.value.trim();
        if(!q) return;
        let found = faqList.find(f => f.question.includes(q.substring(0, 15)));
        let answer = found ? found.answer : getAssistantAnswer(q);
        await formatAndDisplayResponse(q, answer);
        input.value = '';
    }

    function getAssistantAnswer(q) {
        if(q.includes("إجازة")) return "21 يوم عمل إجازة سنوية مدفوعة الأجر بعد إتمام 6 أشهر.";
        if(q.includes("سلفة")) return "بعد 6 أشهر عمل، بحد أقصى 50% من الراتب، تسدد على 6 دفعات.";
        if(q.includes("ساعات")) return "من الأحد إلى الخميس 8ص-5م، استراحة ظهر ساعة.";
        return "❌ لم يتم العثور على إجابة.";
    }

    function saveUserProfile() {
        let user = getCurrentUser();
        user.name = document.getElementById('profileName').value;
        user.email = document.getElementById('profileEmail').value;
        user.jobTitle = document.getElementById('profileJob').value;
        user.department = document.getElementById('profileDept').value;
        let idx = usersDatabase.findIndex(u => u.id === user.id);
        if(idx !== -1) usersDatabase[idx] = user;
        saveAll();
        alert('تم حفظ البيانات ✅');
        renderApp();
    }

    function uploadProfileAvatar(input) {
        if(input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = e => {
                let user = getCurrentUser();
                user.avatar = e.target.result;
                let idx = usersDatabase.findIndex(u => u.id === user.id);
                if(idx !== -1) usersDatabase[idx] = user;
                saveAll();
                renderApp();
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function getPageTitle() {
        let titles = { home:"الرئيسية", employeeguide:"دليل الموظف", assistant:"المساعد الذكي", org:"الهيكل التنظيمي", company:"عن الشركة", performance:"تقييم الأداء", notifications:"الإشعارات", profile:"حسابي", admin:"لوحة التحكم" };
        return titles[currentPage] || "الرئيسية";
    }

    function renderPageContent() {
        if(currentPage === 'employeeguide') { document.getElementById('pageContent').innerHTML = `<div id="employeeGuideContent"></div>`; renderEmployeeGuidePage(); }
        else if(currentPage === 'assistant') document.getElementById('pageContent').innerHTML = renderAssistantPage();
        else if(currentPage === 'home') document.getElementById('pageContent').innerHTML = renderHome();
        else if(currentPage === 'org') document.getElementById('pageContent').innerHTML = renderOrg();
        else if(currentPage === 'company') document.getElementById('pageContent').innerHTML = renderCompany();
        else if(currentPage === 'performance') document.getElementById('pageContent').innerHTML = renderPerformance();
        else if(currentPage === 'notifications') document.getElementById('pageContent').innerHTML = renderNotifications();
        else if(currentPage === 'profile') document.getElementById('pageContent').innerHTML = renderProfile();
        else if(currentPage === 'admin') document.getElementById('pageContent').innerHTML = renderAdminPanel();
        else document.getElementById('pageContent').innerHTML = renderHome();
    }

    function attachEvents() {
        document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(el => {
            if(el.id === 'logoutBtn') return;
            let page = el.dataset.page;
            if(page) el.onclick = () => { currentPage = page; renderApp(); };
        });
        document.getElementById('logoutBtn')?.addEventListener('click', () => { logout(); });
    }

    window.sendManualAssistantMessage = sendManualAssistantMessage;
    window.quickAssistantQuestion = quickAssistantQuestion;
    window.showPolicyDetail = showPolicyDetail;

    renderApp();
    saveAll();
</script>
</body>
</html>
