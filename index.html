<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>HR System</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// 🔥 Firebase Config
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "YOUR_DB_URL",
  projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// =======================
// 🧠 بيانات التطبيق
// =======================
let users = [
  { id: "1", email: "admin@hr.com", password: "123456", name: "Admin", role: "admin" }
];

let currentUser = null;

let companyData = {
  name: "شركة افتراضية",
  vision: "رؤية الشركة",
  mission: "رسالة الشركة"
};

let jobs = [];
let policies = [];

// =======================
// ☁️ حفظ في Firebase
// =======================
async function saveAll() {
  await set(ref(db, "hr-data"), {
    users,
    companyData,
    jobs,
    policies
  });
}

// =======================
// 🔄 مزامنة فورية
// =======================
function startRealtime() {
  onValue(ref(db, "hr-data"), (snapshot) => {
    const data = snapshot.val();
    if (!data) return;

    users = data.users || [];
    companyData = data.companyData || {};
    jobs = data.jobs || [];
    policies = data.policies || [];

    renderApp();
  });
}

// =======================
// 🔐 تسجيل دخول
// =======================
function login(email, password) {
  const user = users.find(u => u.email === email && u.password === password);
  if (!user) {
    alert("❌ بيانات غلط");
    return;
  }

  currentUser = user;
  renderApp();
}

// =======================
// 📝 تسجيل مستخدم
// =======================
async function register(name, email, password) {
  if (users.find(u => u.email === email)) {
    alert("البريد مستخدم");
    return;
  }

  users.push({
    id: Date.now().toString(),
    name,
    email,
    password,
    role: "employee"
  });

  await saveAll();
  alert("✅ تم التسجيل");
}

// =======================
// 🎨 واجهات
// =======================
function renderLogin() {
  document.body.innerHTML = `
    <h2>تسجيل الدخول</h2>
    <input id="email" placeholder="email"><br><br>
    <input id="pass" placeholder="password"><br><br>
    <button onclick="doLogin()">دخول</button>

    <hr>

    <h3>تسجيل جديد</h3>
    <input id="name"><br><br>
    <input id="email2"><br><br>
    <input id="pass2"><br><br>
    <button onclick="doRegister()">تسجيل</button>
  `;
}

function renderApp() {
  if (!currentUser) {
    renderLogin();
    return;
  }

  document.body.innerHTML = `
    <h2>مرحباً ${currentUser.name}</h2>

    <h3>🏢 بيانات الشركة</h3>
    <input id="compName" value="${companyData.name}">
    <button onclick="updateCompany()">حفظ</button>

    <h3>💼 الوظائف</h3>
    ${jobs.map(j => `<div>${j.title}</div>`).join("")}
    <button onclick="addJob()">إضافة وظيفة</button>

    <h3>📜 السياسات</h3>
    ${policies.map(p => `<div>${p.title}</div>`).join("")}
    <button onclick="addPolicy()">إضافة سياسة</button>

    <br><br>
    <button onclick="logout()">خروج</button>
  `;
}

// =======================
// ⚙️ Actions
// =======================
window.doLogin = function () {
  login(
    document.getElementById("email").value,
    document.getElementById("pass").value
  );
};

window.doRegister = function () {
  register(
    document.getElementById("name").value,
    document.getElementById("email2").value,
    document.getElementById("pass2").value
  );
};

window.logout = function () {
  currentUser = null;
  renderApp();
};

window.addJob = async function () {
  const title = prompt("اسم الوظيفة");
  if (!title) return;

  jobs.push({ id: Date.now(), title });
  await saveAll();
};

window.addPolicy = async function () {
  const title = prompt("اسم السياسة");
  if (!title) return;

  policies.push({ id: Date.now(), title });
  await saveAll();
};

window.updateCompany = async function () {
  companyData.name = document.getElementById("compName").value;
  await saveAll();
};

// =======================
// 🚀 تشغيل
// =======================
startRealtime();
renderApp();

</script>
</head>
<body></body>
</html>
