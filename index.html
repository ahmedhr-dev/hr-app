<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HR System</title>

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.header{display:flex;justify-content:space-between;padding:15px;background:#020617}
.page{padding:15px}
.card{background:#1e293b;margin:10px 0;padding:15px;border-radius:14px;cursor:pointer}
button{padding:10px;border:none;border-radius:10px;margin-top:5px;width:100%;background:#facc15}
input{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:none}
</style>

</head>

<body>

<div id="app"></div>

<script>

// 🔥 ضع ID الشيت
const SHEET_ID = "1eSNFJPyK8Ak1ZtFuUrf0Zgwjbqrz-EUH";

// Firebase
firebase.initializeApp({
 apiKey:"AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
 authDomain:"hr-app-710f3.firebaseapp.com"
});

const auth = firebase.auth();
let user;

// ================= API =================
async function getSheet(name){
 let res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/${name}`);
 return await res.json();
}

// ================= LOGIN =================
function loginPage(){
 app.innerHTML=`
 <div class="page">
 <h2>تسجيل الدخول</h2>
 <input id="email" placeholder="Email">
 <input id="pass" type="password" placeholder="Password">
 <button onclick="login()">دخول</button>
 <button onclick="register()">إنشاء حساب</button>
 </div>`;
}

function login(){
 auth.signInWithEmailAndPassword(val("email"),val("pass"));
}

function register(){
 auth.createUserWithEmailAndPassword(val("email"),val("pass"));
}

// ================= HOME =================
function home(){
 app.innerHTML=`
 <div class="header">
 <div>HR System</div>
 <div onclick="logout()">🚪</div>
 </div>

 <div class="page">
 <div class="card" onclick="faqPage()">💬 سؤال وجواب</div>
 <div class="card" onclick="filesPage()">📂 الملفات</div>
 <div class="card" onclick="orgPage()">🏢 الهيكل التنظيمي</div>
 </div>`;
}

// ================= FAQ =================
async function faqPage(){
 let data = await getSheet("faq");

 let html=`
 <div class="header">
 <div onclick="home()">⬅</div>
 <div>الأسئلة</div>
 </div>

 <div class="page">`;

 data.forEach((q,i)=>{
  html+=`
  <div class="card" onclick="toggle(${i})">
   ❓ ${q.question}
   <div id="a${i}" style="display:none;margin-top:10px">
    ${q.answer}
   </div>
  </div>`;
 });

 html+=`</div>`;
 app.innerHTML=html;
}

function toggle(i){
 let el=document.getElementById("a"+i);
 el.style.display = el.style.display=="none"?"block":"none";
}

// ================= FILES =================
async function filesPage(){
 let data = await getSheet("files");

 let html=`
 <div class="header">
 <div onclick="home()">⬅</div>
 <div>الملفات</div>
 </div>

 <div class="page">`;

 data.forEach(f=>{
  html+=`
  <div class="card" onclick="window.open('${f.link}')">
   📄 ${f.name}
  </div>`;
 });

 html+=`</div>`;
 app.innerHTML=html;
}

// ================= ORG =================
async function orgPage(){
 let data = await getSheet("employees");

 let html=`
 <div class="header">
 <div onclick="home()">⬅</div>
 <div>الهيكل</div>
 </div>

 <div class="page">`;

 data.forEach(e=>{
  html+=`
  <div class="card">
   <img src="${e.img}" width="40">
   ${e.name}<br>
   ${e.job}<br>
   ${e.dept}
  </div>`;
 });

 html+=`</div>`;
 app.innerHTML=html;
}

// ================= HELP =================
function val(id){return document.getElementById(id).value}
function logout(){auth.signOut()}

// ================= AUTH =================
auth.onAuthStateChanged(u=>{
 if(u){user=u;home()}else{loginPage()}
});

</script>

</body>
</html>
