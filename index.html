<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Pro</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.header{
 display:flex;justify-content:space-between;
 padding:15px;background:#020617;font-size:14px
}
.page{padding:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{
 background:#1e293b;
 padding:20px;
 border-radius:15px;
 text-align:center;
 cursor:pointer;
 transition:.2s
}
.card:hover{transform:scale(1.05)}
button{
 background:#facc15;border:none;
 padding:10px;border-radius:10px;margin-top:10px;width:100%
}
input{
 width:100%;padding:10px;margin:5px 0;border-radius:10px;border:none
}
</style>

</head>

<body>

<div id="app"></div>

<script>

// Firebase
firebase.initializeApp({
 apiKey:"AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
 authDomain:"hr-app-710f3.firebaseapp.com",
 databaseURL:"https://hr-app-710f3-default-rtdb.firebaseio.com"
});

const auth = firebase.auth();
const db = firebase.database();

let user=null;
let role="user";
let allFAQ={};

// LOGIN
function loginPage(){
 app.innerHTML=`
 <div class="page">
 <h2>HR System</h2>
 <input id="email" placeholder="Email">
 <input id="pass" type="password">
 <button onclick="login()">دخول</button>
 </div>`;
}

function login(){
 auth.signInWithEmailAndPassword(email.value,pass.value)
 .catch(e=>alert(e.message));
}

// DASHBOARD
function dashboard(){
 app.innerHTML=`
 <div class="header">
 <div>👤 ${user.email}</div>
 <div onclick="logout()">🚪</div>
 </div>

 <div class="page">
 <div class="grid">
  <div class="card" onclick="openPage('guide')">📘 دليل</div>
  <div class="card" onclick="openPage('policies')">📄 سياسات</div>
  <div class="card" onclick="openPage('faq')">❓ FAQ</div>
  <div class="card" onclick="openPage('ai')">🤖 مساعد</div>
  <div class="card" onclick="openPage('profile')">👤 حسابي</div>
 </div>
 </div>`;
}

// NAV
function openPage(p){

 if(p==="profile"){
  app.innerHTML=back("حسابي")+`
  <div class="card">
  البريد: ${user.email}<br>
  الدور: ${role}
  </div>`;
 }

 if(p==="guide"){
  renderList("guide","guide");
 }

 if(p==="policies"){
  renderList("policies","policies");
 }

 if(p==="faq"){
  app.innerHTML=back("FAQ")+`
  <div id="faq"></div>
  ${role==="admin"?'<button onclick="addFAQ()">➕</button>':""}
  `;
  loadFAQ();
 }

 if(p==="ai"){
  app.innerHTML=back("المساعد")+`
  <input id="q" placeholder="اكتب سؤالك">
  <button onclick="ask()">اسأل</button>
  <div id="answer"></div>`;
 }

}

// UI
function back(title){
 return `<div class="header">
 <button onclick="dashboard()">⬅</button>
 <div>${title}</div>
 </div><div class="page">`;
}

function renderList(path,id){
 app.innerHTML=back(path)+`
 <div id="${id}"></div>
 ${role==="admin"?`<button onclick="add('${path}')">➕ إضافة</button>`:""}
 `;
 load(path,id);
}

// DATA
function load(path,el){
 db.ref(path).on("value",snap=>{
  let data=snap.val()||{};
  let html="";

  Object.keys(data).forEach(k=>{
   html+=`
   <div class="card">
   ${data[k].text}
   ${role==="admin"?`<button onclick="del('${path}','${k}')">🗑</button>`:""}
   </div>`;
  });

  document.getElementById(el).innerHTML=html||"لا يوجد";
 });
}

function add(type){
 let t=prompt("اكتب");
 if(!t)return;
 db.ref(type+"/"+Date.now()).set({text:t});
}

// FAQ
function loadFAQ(){
 db.ref("faq").on("value",snap=>{
  allFAQ=snap.val()||{};
  let html="";

  Object.values(allFAQ).forEach(f=>{
   html+=`
   <div class="card">
   <b>${f.q}</b><br>${f.a}
   ${role==="admin"?`<button onclick="del('faq','${f.id}')">🗑</button>`:""}
   </div>`;
  });

  faq.innerHTML=html||"لا يوجد";
 });
}

function addFAQ(){
 let q=prompt("السؤال");
 let a=prompt("الإجابة");
 db.ref("faq/"+Date.now()).set({q:q,a:a});
}

// AI
function ask(){
 let q=document.getElementById("q").value.toLowerCase();
 let best="❗ تواصل مع HR";

 Object.values(allFAQ).forEach(f=>{
  if(q.includes(f.q.toLowerCase())){
   best=f.a;
  }
 });

 answer.innerHTML=`<div class="card">${best}</div>`;
}

// DELETE
function del(type,id){
 db.ref(type+"/"+id).remove();
}

// AUTH
function logout(){auth.signOut();}

function loadRole(uid){
 db.ref("users/"+uid+"/role").once("value")
 .then(s=>{
  role=s.val()||"user";
  dashboard();
 });
}

auth.onAuthStateChanged(u=>{
 if(u){
  user=u;
  loadRole(u.uid);
 }else{
  loginPage();
 }
});

</script>

</body>
</html>
