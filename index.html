<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0a1a2f 0%, #061220 100%);

        }
        .login-container { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

            padding: 40px;
            width: 100%;

            border-radius: 30px;
            color: white;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border: none;

        .register-link { margin-top: 15px; font-size: 13px; }
        .register-link span { color: #d4af37; cursor: pointer; }
        .register-form { display: none; margin-top: 15px; }

        .sidebar {
            position: fixed;

            height: 100vh;

            border-left: 1px solid #d4af37;

        }
        .sidebar-header { text-align: center; padding: 20px; border-bottom: 1px solid rgba(212,175,55,0.3); }
        .logo { font-size: 22px; color: #d4af37; font-weight: bold; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            margin: 5px 15px;
            border-radius: 12px;
            cursor: pointer;
            color: #a0aec0;

        }
        .nav-item:hover { background: rgba(212,175,55,0.15); color: #d4af37; }
        .nav-item.active { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; }

        }
        .page-title { font-size: 20px; color: #d4af37; font-weight: bold; }
        .avatar {

            background: linear-gradient(135deg, #d4af37, #b8960c);

            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card {
            background: rgba(10, 26, 47, 0.9);
            border-radius: 15px;

            margin-bottom: 20px;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card {
            background: rgba(10, 26, 47, 0.9);
            border-radius: 15px;
            padding: 20px;

            border: 1px solid rgba(212,175,55,0.2);
        }
        .stat-number { font-size: 32px; font-weight: bold; color: #d4af37; }
        .stat-card i { font-size: 28px; margin-bottom: 8px; display: block; color: #d4af37; }
        
        .hero-section {
            background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(10,26,47,0.9));
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hero-image {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-image i { font-size: 35px; color: #0a1a2f; }
        
        .guide-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .guide-tab {
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            background: rgba(212,175,55,0.1);
            transition: 0.2s;
        }
        .guide-tab.active { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; }
        .guide-item {
            background: rgba(10, 26, 47, 0.7);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .guide-item:hover { border-color: #d4af37; }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #0a1a2f;
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #d4af37;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { color: #d4af37; display: block; margin-bottom: 5px; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 10px;
            color: white;
        }
        
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .admin-card {
            background: rgba(10, 26, 47, 0.7);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(212,175,55,0.2);
            transition: 0.2s;
        }
        .admin-card:hover { background: rgba(212,175,55,0.15); transform: translateY(-2px); }
        .admin-card i { font-size: 28px; color: #d4af37; margin-bottom: 8px; display: block; }
        
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(212,175,55,0.1);
        }
        .list-item:last-child { border-bottom: none; }
        .list-item-info { flex: 1; }
        .list-item-title { font-weight: bold; color: #d4af37; }
        .list-item-desc { font-size: 12px; opacity: 0.7; margin-top: 3px; }
        .list-item-actions { display: flex; gap: 5px; }
        
        .org-ceo {
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            color: #0a1a2f;
            cursor: pointer;
        }
        .org-departments { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
        .org-dept {
            background: rgba(10, 26, 47, 0.8);
            border-radius: 12px;
            padding: 15px;
            flex: 1;
            min-width: 140px;
            text-align: center;
            border: 1px solid rgba(212,175,55,0.3);
            cursor: pointer;
        }
        
        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            max-width: 350px;
            margin: 0 auto;
            background: #4caf50;
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            text-align: center;
            z-index: 10000;
            transform: translateY(100px);
            transition: 0.3s;
        }
        .toast.show { transform: translateY(0); }
        .toast.error { background: #ef4444; }
        
        .ai-fab {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 300;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .ai-fab:hover { transform: scale(1.1); }
        .ai-fab i { font-size: 28px; color: #0a1a2f; }
        .ai-chat {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 320px;
            background: rgba(10, 26, 47, 0.98);
            border-radius: 15px;
            border: 1px solid #d4af37;
            z-index: 301;
            transform: scale(0);
            transition: 0.3s;
            transform-origin: bottom left;
        }
        .ai-chat.open { transform: scale(1); }
        .ai-header {
            padding: 12px 15px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 15px 15px 0 0;
            color: #0a1a2f;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }
        .ai-messages { max-height: 300px; overflow-y: auto; padding: 10px; }
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 15px;
            max-width: 85%;
            font-size: 13px;
        }
        .user-message { background: rgba(212, 175, 55, 0.2); margin-right: auto; text-align: right; }
        .ai-message { background: rgba(255, 255, 255, 0.1); margin-left: auto; text-align: left; }
        .ai-input-area { display: flex; padding: 10px; gap: 10px; border-top: 1px solid rgba(212,175,55,0.2); }
        .ai-input-area input { flex: 1; padding: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(212,175,55,0.3); border-radius: 25px; color: white; }
        .ai-input-area button { width: auto; padding: 8px 15px; }
        .typing { color: #d4af37; font-size: 12px; padding: 5px 12px; }
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a1a2f;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            z-index: 100000;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(212,175,55,0.3);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; padding-bottom: 70px; }
            .menu-toggle { display: block; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .admin-grid { grid-template-columns: repeat(2, 1fr); }
            .ai-chat { width: 300px; left: 10px; bottom: 10px; }
            .ai-fab { bottom: 70px; left: 10px; }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div style="color: #d4af37;">جاري تحميل البيانات من السحابة...</div>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
        authDomain: "hr-app-710f3.firebaseapp.com",
        databaseURL: "https://hr-app-710f3-default-rtdb.firebaseio.com",
        projectId: "hr-app-710f3",
        storageBucket: "hr-app-710f3.appspot.com",
        messagingSenderId: "324936659395",
        appId: "1:324936659395:web:bb5d491b52be3013c00d76"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    window.db = db;
    window.ref = ref;
    window.set = set;
    window.get = get;
    window.onValue = onValue;

    setTimeout(() => {

</script>

<script>
    // ========================================
    // HR SYSTEM - نسخة سحابية كاملة مع صلاحيات التعديل والحذف
    // ========================================
    
    // -------------------- البيانات الأساسية --------------------
    let users = [{ id: 1, email: "admin@hr.com", password: "admin123", name: "أحمد المدير", role: "admin", jobTitle: "مدير" }];
    let currentUser = null;
    let currentPage = "home";
    let guideTab = "policies";
    let lastUpdated = 0;
    let isSyncing = false;
    
    let policies = [
        { id: 1, title: "سياسة الإجازة السنوية", description: "21 يوم إجازة مدفوعة", content: "يحق للموظف 21 يوم إجازة سنوية مدفوعة الأجر" },
        { id: 2, title: "سياسة سلفة الراتب", description: "سلفة تصل 50%", content: "بعد 6 أشهر يحق للموظف طلب سلفة" }
    ];
    
    let behaviors = [
        { id: 1, title: "الاحترافية", desc: "الحفاظ على سلوك محترم مع الزملاء" },
        { id: 2, title: "الالتزام بالمواعيد", desc: "الحضور في الوقت المحدد" }
    ];
    
    let procedures = [
        { id: 1, title: "تقديم إجازة", desc: "سجل الدخول واختر الإجازات" },
        { id: 2, title: "تقديم شكوى", desc: "اكتب الشكوى في قسم الشكاوى" }
    ];
    
    let faq = [
        { id: 1, question: "ما هي سياسة الإجازة؟", answer: "21 يوم إجازة سنوية" },
        { id: 2, question: "كيف أطلب سلفة؟", answer: "بعد 6 أشهر عمل" }
    ];
    
    let announcements = [
        { id: 1, title: "مرحباً", content: "مرحباً بكم في دليل الموظف", date: new Date().toLocaleDateString() }
    ];
    
    let companyData = {
        name: "شركة التميز للاستشارات",
        vision: "الريادة في تقديم الحلول المتميزة",
        mission: "تقديم خدمات مبتكرة لعملائنا"
    };
    
    let orgStructure = {
        ceo: { name: "مجلس الإدارة", head: "المدير التنفيذي", members: 5 },
        departments: [
            { id: 1, name: "الموارد البشرية", head: "مدير الموارد", members: 12 },
            { id: 2, name: "التقنية", head: "مدير التقنية", members: 20 }
        ]
    };
    
    let performance = {
        "مدير": { criteria: [{ name: "التخطيط", value: 88, max: 100, weight: 50 }, { name: "الإدارة", value: 92, max: 100, weight: 50 }] },
        "محاسب": { criteria: [{ name: "دقة التقارير", value: 98, max: 100, weight: 50 }, { name: "الالتزام", value: 95, max: 100, weight: 50 }] },
        "مبرمج": { criteria: [{ name: "جودة الكود", value: 88, max: 100, weight: 50 }, { name: "الالتزام", value: 90, max: 100, weight: 50 }] },
        "موظف": { criteria: [{ name: "الأداء العام", value: 85, max: 100, weight: 50 }, { name: "الالتزام", value: 90, max: 100, weight: 50 }] }
    };
    
    // -------------------- دوال Firebase --------------------
    async function saveToFirebase(data) {
        if (!window.db || !window.set || isSyncing) return false;
        try {
            await window.set(window.ref(window.db, 'hr-system-data'), { ...data, lastUpdated: Date.now() });
            return true;
        } catch(e) { return false; }
    }
    
    async function loadFromFirebase() {
        if (!window.db || !window.get) return null;
        try {
            const snapshot = await window.get(window.ref(window.db, 'hr-system-data'));
            return snapshot.exists() ? snapshot.val() : null;
        } catch(e) { return null; }
    }
    
    function listenToFirebase() {
        if (!window.db || !window.onValue) return;
        window.onValue(window.ref(window.db, 'hr-system-data'), (snapshot) => {
            if (snapshot.exists() && !isSyncing) {
                const data = snapshot.val();
                if (data.lastUpdated && data.lastUpdated > lastUpdated) {
                    isSyncing = true;
                    if (data.policies) policies = data.policies;
                    if (data.behaviors) behaviors = data.behaviors;
                    if (data.procedures) procedures = data.procedures;
                    if (data.faq) faq = data.faq;
                    if (data.announcements) announcements = data.announcements;
                    if (data.companyData) companyData = data.companyData;
                    if (data.orgStructure) orgStructure = data.orgStructure;
                    if (data.users) users = data.users;
                    lastUpdated = data.lastUpdated;
                    if (currentUser) {
                        const updatedUser = users.find(u => u.id === currentUser.id);
                        if (updatedUser) currentUser = updatedUser;
                        renderApp();
                        showToast("🔄 تم تحديث البيانات من جهاز آخر");
                    }
                    isSyncing = false;
                }
            }
        });
    }
    
    async function saveAll() {
        if (isSyncing) return;
        const data = { users, policies, behaviors, procedures, faq, announcements, companyData, orgStructure, performance };
        await saveToFirebase(data);
    }
    
    async function loadAllFromCloud() {
        const data = await loadFromFirebase();
        if (data) {
            users = data.users || users;
            policies = data.policies || policies;
            behaviors = data.behaviors || behaviors;
            procedures = data.procedures || procedures;
            faq = data.faq || faq;
            announcements = data.announcements || announcements;
            companyData = data.companyData || companyData;
            orgStructure = data.orgStructure || orgStructure;
            performance = data.performance || performance;
            lastUpdated = data.lastUpdated || 0;
            return true;
        } else {
            await saveAll();
            return true;
        }
    }
    
    // -------------------- دوال مساعدة --------------------
    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function showToast(msg, isError = false) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        if (isError) toast.classList.add('error');
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 100);
        setTimeout(() => toast.remove(), 3000);
    }
    
    // -------------------- المصادقة --------------------
    function login(email, pass) {
        let user = users.find(u => u.email === email && u.password === pass);
        if (user) {
            currentUser = user;
            sessionStorage.setItem('user', JSON.stringify(user));
            renderApp();
            return true;
        }
        return false;
    }
    
    async function register(name, email, pass, confirm) {
        if (pass !== confirm) { showToast("كلمة المرور غير متطابقة", true); return false; }
        if (users.find(u => u.email === email)) { showToast("البريد موجود", true); return false; }
        users.push({ id: Date.now(), name, email, password: pass, role: "employee", jobTitle: "موظف" });
        await saveAll();
        showToast("تم التسجيل");
        return true;
    }
    
    function logout() { currentUser = null; sessionStorage.removeItem('user'); renderApp(); }
    
    // -------------------- المساعد الذكي --------------------
    function getAIResponse(question) {
        const q = question.toLowerCase();
        const policy = policies.find(p => q.includes(p.title.toLowerCase()));
        if (policy) return policy.content;
        const behavior = behaviors.find(b => q.includes(b.title.toLowerCase()));
        if (behavior) return behavior.desc;
        const procedure = procedures.find(p => q.includes(p.title.toLowerCase()));
        if (procedure) return procedure.desc;
        const faqItem = faq.find(f => q.includes(f.question.toLowerCase()));
        if (faqItem) return faqItem.answer;
        if (q.includes('راتب') || q.includes('سلفة')) return "💰 يمكن طلب سلفة بعد 6 أشهر عمل، الحد الأقصى 50% من الراتب";
        if (q.includes('إجازة')) return "🌴 21 يوم إجازة سنوية مدفوعة الأجر";
        return "🙏 شكراً لسؤالك. يمكنك مراجعة دليل الموظف لمزيد من المعلومات.";
    }
    
    function askAI() {
        const input = document.getElementById('aiInput');
        if (!input) return;
        const question = input.value.trim();
        if (!question) return;
        const messagesDiv = document.getElementById('aiMessages');
        if (!messagesDiv) return;
        const userMsg = document.createElement('div');
        userMsg.className = 'message user-message';
        userMsg.innerHTML = `<i class="fas fa-user"></i> ${escapeHtml(question)}`;
        messagesDiv.appendChild(userMsg);
        input.value = '';
        const typingDiv = document.createElement('div');
        typingDiv.className = 'typing';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = '<i class="fas fa-robot"></i> المساعد يكتب...';
        messagesDiv.appendChild(typingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        setTimeout(() => {
            document.getElementById('typingIndicator')?.remove();
            const aiMsg = document.createElement('div');

        else if (type === 'behavior') { item = behaviors.find(i => i.id === id); html = `<div class="form-group"><label>العنوان</label><input id="title" value="${escapeHtml(item.title)}"></div><div class="form-group"><label>الوصف</label><textarea id="desc">${escapeHtml(item.desc)}</textarea></div>`; }
        else if (type === 'procedure') { item = procedures.find(i => i.id === id); html = `<div class="form-group"><label>العنوان</label><input id="title" value="${escapeHtml(item.title)}"></div><div class="form-group"><label>الوصف</label><textarea id="desc">${escapeHtml(item.desc)}</textarea></div>`; }
        else if (type === 'faq') { item = faq.find(i => i.id === id); html = `<div class="form-group"><label>السؤال</label><input id="q" value="${escapeHtml(item.question)}"></div><div class="form-group"><label>الإجابة</label><textarea id="a">${escapeHtml(item.answer)}</textarea></div>`; }
        else if (type === 'announcement') { item = announcements.find(i => i.id === id); html = `<div class="form-group"><label>العنوان</label><input id="title" value="${escapeHtml(item.title)}"></div><div class="form-group"><label>المحتوى</label><textarea id="content">${escapeHtml(item.content)}</textarea></div>`; }
        else if (type === 'dept') { item = orgStructure.departments.find(d => d.id === id); html = `<div class="form-group"><label>اسم القسم</label><input id="name" value="${escapeHtml(item.name)}"></div><div class="form-group"><label>رئيس القسم</label><input id="head" value="${escapeHtml(item.head)}"></div><div class="form-group"><label>عدد الأعضاء</label><input id="members" value="${item.members}" type="number"></div>`; }
        else return;

            if (type === 'policy') { item.title = document.getElementById('title').value; item.description = document.getElementById('desc').value; item.content = document.getElementById('content').value; }

        });

        if (!currentUser) { document.getElementById('app').innerHTML = renderLogin(); return; }
        let isAdmin = currentUser.role === 'admin';
        document.getElementById('app').innerHTML = `
        <div class="sidebar" id="sidebar"><div class="sidebar-header"><div class="logo"><i class="fas fa-cloud"></i> HR SYSTEM</div><div style="font-size:10px; opacity:0.7;">متزامن ☁️</div></div>
            <div class="nav-item ${currentPage==='home'?'active':''}" data-page="home"><i class="fas fa-home"></i> الرئيسية</div>
            <div class="nav-item ${currentPage==='guide'?'active':''}" data-page="guide"><i class="fas fa-book"></i> دليل الموظف</div>
            <div class="nav-item ${currentPage==='org'?'active':''}" data-page="org"><i class="fas fa-building"></i> الهيكل التنظيمي</div>
            <div class="nav-item ${currentPage==='company'?'active':''}" data-page="company"><i class="fas fa-flag-checkered"></i> عن الشركة</div>
            <div class="nav-item ${currentPage==='performance'?'active':''}" data-page="performance"><i class="fas fa-chart-line"></i> تقييم الأداء</div>
            <div class="nav-item ${currentPage==='notifications'?'active':''}" data-page="notifications"><i class="fas fa-bell"></i> الإشعارات</div>
            <div class="nav-item ${currentPage==='profile'?'active':''}" data-page="profile"><i class="fas fa-user"></i> حسابي</div>
            ${isAdmin ? `<div class="nav-item ${currentPage==='admin'?'active':''}" data-page="admin"><i class="fas fa-cog"></i> لوحة التحكم</div>` : ''}
            <div class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</div>
        </div>
        <div class="main-content"><div class="top-bar"><button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button><div class="page-title">${getTitle()}</div><div class="avatar"><i class="fas fa-user"></i></div></div><div id="pageContent"></div></div>
        <div class="ai-fab" id="aiFab" onclick="toggleAI()"><i class="fas fa-robot"></i></div>
        <div class="ai-chat" id="aiChat"><div class="ai-header" onclick="toggleAI()"><i class="fas fa-robot"></i> المساعد الذكي <i class="fas fa-times" style="margin-right:auto;"></i></div><div class="ai-messages" id="aiMessages"></div><div class="ai-input-area"><input type="text" id="aiInput" placeholder="اسألني..." onkeypress="if(event.key==='Enter') askAI()"><button class="btn" style="width:auto; padding:8px 15px;" onclick="askAI()"><i class="fas fa-paper-plane"></i></button></div></div>`;
        
        let pages = { home: renderHome, guide: renderGuide, org: renderOrg, company: renderCompany, performance: renderPerformance, notifications: renderNotifications, profile: renderProfile, admin: renderAdmin };
        document.getElementById('pageContent').innerHTML = (pages[currentPage] || renderHome)();
        
        document.querySelectorAll('.nav-item').forEach(el => { let page = el.dataset.page; if (page) el.onclick = () => { currentPage = page; renderApp(); }; });
        window.askAI = askAI; window.toggleAI = toggleAI;
    }
    
    function getTitle() { let t={home:"الرئيسية",guide:"دليل الموظف",org:"الهيكل التنظيمي",company:"عن الشركة",performance:"تقييم الأداء",notifications:"الإشعارات",profile:"حسابي",admin:"لوحة التحكم"}; return t[currentPage]||"الرئيسية"; }
    
    // -------------------- بدء التطبيق --------------------
    async function initApp() {
        await loadAllFromCloud();
        listenToFirebase();
        let savedUser = sessionStorage.getItem('user');
        if (savedUser) currentUser = JSON.parse(savedUser);
        renderApp();
    }
    
    initApp();
</script>
</body>
</html>
