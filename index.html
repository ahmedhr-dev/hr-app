<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR System</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<style>
body{margin:0;background:#0f172a;color:white;font-family:Arial;text-align:center}
.box{margin-top:100px}
input,button{padding:10px;margin:5px;width:80%}
button{background:#facc15;border:none}
</style>
</head>

<body>

<div id="app"></div>

<script>
const app = document.getElementById("app");

function showLogin(){
 app.innerHTML = `
 <div class="box">
 <h2>تسجيل الدخول</h2>
 <input placeholder="Email">
 <input type="password" placeholder="Password">
 <button onclick="showHome()">دخول</button>
 </div>`;
}

function showHome(){
 app.innerHTML = `
 <div class="box">
 <h2>🎉 التطبيق شغال</h2>
 </div>`;
}

showLogin();
</script>

<script>
if ('serviceWorker' in navigator) {
 navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
