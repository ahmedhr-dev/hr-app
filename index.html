<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>HR System | نظام الموارد البشرية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #0a1a2f, #061220);
            direction: rtl;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Login Page */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(145deg, #0a1a2f, #061220);
        }
        .login-card {
            background: rgba(10, 26, 47, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 35px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .quran-quote {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 20px;
        }
        .quote-arabic { font-size: 18px; font-family: 'Amiri', serif; }
        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }
        .login-card h2 { text-align: center; font-size: 22px; color: #d4af37; }
        .login-card input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 30px;
            color: white;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            color: #0a1a2f;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
        .register-link { text-align: center; margin-top: 15px; font-size: 13px; }
        .register-link span { color: #d4af37; cursor: pointer; }
        .register-form { display: none; margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(212,175,55,0.2); }
        .register-form.show { display: block; }
        .avatar-preview {
            width: 80px;
            height: 80px;
            background: rgba(212,175,55,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            cursor: pointer;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: #0a1a2f;
            border-left: 1px solid rgba(212,175,55,0.2);
            z-index: 200;
            transition: all 0.4s;
            overflow-y: auto;
        }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid rgba(212,175,55,0.2); }
        .logo-area { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .company-logo {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo { font-size: 20px; font-weight: 800; color: #d4af37; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            margin: 6px 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            color: #a0aec0;
        }
        .nav-item:hover { background: rgba(212,175,55,0.15); color: #d4af37; }
        .nav-item.active { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; }
        .nav-item i { width: 24px; }

        .main-content { margin-right: 280px; min-height: 100vh; padding: 0 25px 25px 25px; }
        .top-bar {
            background: rgba(10, 26, 47, 0.95);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 99;
            margin-bottom: 20px;
            border-radius: 0 0 25px 25px;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .page-title { font-size: 24px; font-weight: 800; color: #d4af37; }
        .avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }

        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0a1a2f;
            padding: 12px 16px 25px;
            justify-content: space-around;
            z-index: 150;
            border-top: 1px solid rgba(212,175,55,0.2);
        }
        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #94a3b8;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 30px;
        }
        .bottom-nav-item i { font-size: 24px; }
        .bottom-nav-item.active { color: #d4af37; background: rgba(212,175,55,0.15); }

        .card { background: rgba(10, 26, 47, 0.9); border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(212,175,55,0.2); transition: all 0.3s; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: rgba(10, 26, 47, 0.9); border-radius: 20px; padding: 18px; text-align: center; }
        .stat-number { font-size: 32px; font-weight: 800; color: #d4af37; }

        /* ============ مركز المعرفة ============ */
        .search-bar {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 50px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .search-bar i { color: #d4af37; font-size: 18px; }
        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 15px;
            outline: none;
        }
        .categories-tabs {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .category-tab {
            background: rgba(212,175,55,0.1);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 40px;
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .category-tab.active { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; }
        .policies-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .policy-item {
            background: rgba(10, 26, 47, 0.7);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 20px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .policy-info { flex: 1; }
        .policy-title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
        .policy-icon { width: 45px; height: 45px; background: rgba(212,175,55,0.15); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .policy-icon i { font-size: 22px; color: #d4af37; }
        .policy-title { font-size: 16px; font-weight: bold; }
        .policy-badge { background: rgba(212,175,55,0.2); border-radius: 30px; padding: 4px 12px; font-size: 11px; color: #d4af37; }
        .policy-description { font-size: 13px; opacity: 0.7; }
        .policy-arrow { color: #d4af37; font-size: 20px; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .assistant-modal {
            background: linear-gradient(145deg, #0f1a2e, #0a1220);
            border-radius: 32px;
            width: 90%;
            max-width: 550px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 22px;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .modal-header h3 { color: #d4af37; font-size: 18px; }
        .close-modal {
            width: 36px;
            height: 36px;
            background: rgba(212,175,55,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .modal-content { padding: 22px; }
        .response-section { margin-bottom: 25px; }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(212,175,55,0.2);
            padding-bottom: 8px;
        }
        .section-content { font-size: 14px; line-height: 1.7; color: #e2e8f0; }
        .bullets-list { list-style: none; padding-right: 20px; }
        .bullets-list li { margin-bottom: 8px; position: relative; }
        .bullets-list li::before { content: "•"; color: #d4af37; position: absolute; right: -15px; }

        /* ============ الهيكل التنظيمي ============ */
        .org-builder {
            background: rgba(0,0,0,0.2);
            border-radius: 30px;
            padding: 25px;
            overflow-x: auto;
        }
        .org-tree {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 700px;
        }
        .org-ceo-card {
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 20px;
            padding: 15px 35px;
            text-align: center;
            margin-bottom: 35px;
            color: #0a1a2f;
            cursor: pointer;
        }
        .org-level { display: flex; justify-content: center; gap: 25px; flex-wrap: wrap; }
        .org-dept-card {
            background: rgba(10, 26, 47, 0.9);
            border-radius: 18px;
            padding: 15px;
            min-width: 160px;
            text-align: center;
            border: 1px solid rgba(212,175,55,0.3);
            cursor: pointer;
        }

        /* ============ تقييم الأداء الاحترافي ============ */
        .performance-card {
            background: rgba(10, 26, 47, 0.7);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .performance-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .overall-score {
            font-size: 48px;
            font-weight: 800;
            color: #d4af37;
        }
        .score-bar {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin: 15px 0;
            overflow: hidden;
        }
        .score-fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #d4af37, #b8960c);
        }
        .criteria-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .criteria-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 18px;
            transition: all 0.2s;
        }
        .criteria-card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.08); }
        .criteria-name { font-size: 16px; font-weight: bold; color: #d4af37; margin-bottom: 10px; }
        .criteria-stats { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
        .criteria-progress { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 5px; overflow: hidden; }
        .criteria-progress-fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg, #d4af37, #b8960c); }

        /* ============ لوحة التحكم ============ */
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }
        .admin-card {
            background: rgba(10, 26, 47, 0.7);
            border-radius: 18px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .admin-card:hover { transform: translateY(-3px); background: rgba(212,175,55,0.15); }
        .admin-card i { font-size: 32px; color: #d4af37; margin-bottom: 8px; }
        .jobs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .job-card {
            background: rgba(10, 26, 47, 0.7);
            border-radius: 18px;
            padding: 15px;
            text-align: center;
        }
        .job-card i { font-size: 35px; color: #d4af37; margin-bottom: 8px; }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: linear-gradient(145deg, #0a1a2f, #061220);
            border-radius: 30px;
            padding: 25px;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #d4af37; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 15px;
            color: white;
        }

        .fab {
            position: fixed;
            bottom: 90px;
            left: 25px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 100;
        }
        .fab i { font-size: 24px; color: #0a1a2f; }

        .menu-toggle { display: none; background: none; border: none; font-size: 24px; color: white; cursor: pointer; }
        @media (max-width: 992px) {
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; }
            .bottom-nav { display: flex; }
            .menu-toggle { display: block; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .fab { bottom: 80px; left: 20px; width: 50px; height: 50px; }
            .bottom-nav-item { padding: 8px 8px; }
            .bottom-nav-item i { font-size: 22px; }
            .page-title { font-size: 20px; }
        }
    </style>
</head>

<div id="appRoot"></div>

<script>
    // ==================== بيانات النظام ====================
    const workQuotes = [
        { text: "خير الناس أنفعهم للناس", author: "الحديث الشريف" },

    // ==================== المستخدمين ====================

        { id: 1, email: "admin@hr.com", password: "admin123", name: "أحمد المدير", role: "admin", avatar: null, jobTitle: "مدير الموارد البشرية", department: "الموارد البشرية" }

        { id: 2, title: "محاسب", department: "المالية", level: "تنفيذي" },

    // ==================== السياسات ====================
    let policiesList = JSON.parse(localStorage.getItem('hr_policies')) || [
        { id: 1, title: "سياسة الإجازة السنوية", category: "إجازات", version: "2.0", description: "تنظيم الإجازات السنوية للموظفين",
          fullContent: { overview: "جميع الموظفين بدوام كامل يحق لهم 21 يوم عمل إجازة سنوية.", keyPoints: ["تقديم الطلب قبل 5 أيام", "الحد الأقصى 10 أيام متصلة"], additionalPolicies: ["ترحيل 5 أيام كحد أقصى"], approvalProcess: ["تقديم الطلب", "موافقة المدير", "تأكيد HR"] } },

    function saveAll() {
        localStorage.setItem('hr_users', JSON.stringify(usersDatabase));
        localStorage.setItem('hr_company', JSON.stringify(companyData));
        localStorage.setItem('hr_policies', JSON.stringify(policiesList));
        localStorage.setItem('hr_behaviors', JSON.stringify(behaviorsList));
        localStorage.setItem('hr_procedures', JSON.stringify(proceduresList));
        localStorage.setItem('hr_faq', JSON.stringify(faqList));
        localStorage.setItem('hr_announcements', JSON.stringify(announcementsList));

    function getCurrentUser() { return currentSession ? usersDatabase.find(u => u.id === currentSession.userId) : null; }
    function getAllJobs() { return globalJobsList; }

    function getPerformanceForJob(jobTitle) {
        if(performanceCriteria[jobTitle]) return performanceCriteria[jobTitle];
        return { criteria: [] };
    }

    function calculateOverallScore(criteria) {
        let total = criteria.reduce((sum, c) => sum + c.points, 0);
        let max = criteria.length * 100;
        return max > 0 ? Math.round((total / max) * 100) : 0;
    }

    function updateOrgDepartmentsFromJobs() {
        let deptMap = {};
        globalJobsList.forEach(job => {
            if(!deptMap[job.department]) deptMap[job.department] = [];
            deptMap[job.department].push(job.title);
        });
        for(let deptName in deptMap) {
            let existing = orgStructure.departments.find(d => d.name === deptName);
            if(existing) { existing.jobs = deptMap[deptName]; existing.members = deptMap[deptName].length; }
            else { orgStructure.departments.push({ id: "dept_" + Date.now(), name: deptName, head: "مدير القسم", members: deptMap[deptName].length, jobs: deptMap[deptName] }); }
        }
        saveAll();
    }

    // ==================== دوال تسجيل الدخول ====================
    function login(email, password, remember) {
        let user = usersDatabase.find(u => u.email === email && u.password === password);
        if(user) {
            currentSession = { userId: user.id, email: user.email, role: user.role };
            sessionStorage.setItem('hr_session', JSON.stringify(currentSession));
            if(remember) localStorage.setItem('hr_remember', JSON.stringify({ email, password }));
            else localStorage.removeItem('hr_remember');
            renderApp();
            return true;
        }
        return false;
    }

    function register(name, email, password, confirm, avatar, jobTitle, dept) {
        if(password !== confirm) { alert("كلمة المرور غير متطابقة"); return false; }
        if(usersDatabase.find(u => u.email === email)) { alert("البريد موجود بالفعل"); return false; }
        usersDatabase.push({ id: Date.now(), name, email, password, role: "employee", avatar, jobTitle: jobTitle || "موظف", department: dept || "غير محدد" });
        saveAll();
        updateOrgDepartmentsFromJobs();
        return true;
    }

    function logout() {
        sessionStorage.removeItem('hr_session');
        currentSession = null;
        renderApp();
    }

    window.doLogin = function() {
        let email = document.getElementById('loginEmail').value;
        let pass = document.getElementById('loginPassword').value;
        let remember = document.getElementById('rememberCheckbox').checked;
        if(login(email, pass, remember)) alert('تم تسجيل الدخول بنجاح ✅');
        else alert('البريد أو كلمة المرور غير صحيحة ❌');
    };
    window.doRegister = function() {
        let name = document.getElementById('regName').value;
        let email = document.getElementById('regEmail').value;
        let job = document.getElementById('regJob').value;
        let dept = document.getElementById('regDept').value;
        let pass = document.getElementById('regPassword').value;
        let confirm = document.getElementById('regConfirm').value;
        if(!name || !email || !pass) { alert("الرجاء ملء الحقول الأساسية"); return; }
        if(register(name, email, pass, confirm, tempAvatar, job, dept)) {
            alert('تم إنشاء الحساب بنجاح ✅');
            toggleRegister();
        }
    };
    window.toggleRegister = function() {
        let form = document.getElementById('registerForm');
        form.classList.toggle('show');

    };
    window.forgotPassword = function() {
        let email = prompt("أدخل بريدك الإلكتروني:");
        if(email) {
            let user = usersDatabase.find(u => u.email === email);
            if(user) {
                let newPass = prompt("أدخل كلمة المرور الجديدة:");
                if(newPass) { user.password = newPass; saveAll(); alert("تم تغيير كلمة المرور ✅"); }
            } else alert("لم يتم العثور على الحساب ❌");
        }
    };
    let tempAvatar = null;
    window.handleAvatarUpload = function(input) {
        if(input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = e => {
                document.getElementById('avatarPreview').innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;">`;
                tempAvatar = e.target.result;

        }
    };

    async function openAssistantModal(policy) {
        let modalHtml = `
            <div class="modal-overlay" id="assistantModalOverlay">
                <div class="assistant-modal">
                    <div class="modal-header">
                        <h3><i class="fas fa-robot"></i> مساعد الموارد البشرية</h3>
                        <div class="close-modal" onclick="closeAssistantModal()"><i class="fas fa-times"></i></div>
                    </div>
                    <div class="modal-content">
                        <div class="response-section"><div class="section-title"><i class="fas fa-info-circle"></i> ${policy.title}</div><div class="section-content" id="overviewContent"></div></div>
                        <div class="response-section" id="keyPointsSection" style="display:none;"><div class="section-title"><i class="fas fa-list-ul"></i> النقاط الأساسية</div><div class="section-content"><ul class="bullets-list" id="keyPointsList"></ul></div></div>
                        <div class="response-section" id="additionalSection" style="display:none;"><div class="section-title"><i class="fas fa-file-alt"></i> السياسات الإضافية</div><div class="section-content"><ul class="bullets-list" id="additionalList"></ul></div></div>
                        <div class="response-section" id="approvalSection" style="display:none;"><div class="section-title"><i class="fas fa-check-circle"></i> آلية الموافقة</div><div class="section-content"><ul class="bullets-list" id="approvalList"></ul></div></div>
                    </div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        let currentModal = document.getElementById('assistantModalOverlay');
        currentModal.addEventListener('click', (e) => { if(e.target === currentModal) currentModal.remove(); });
        document.getElementById('overviewContent').innerText = policy.fullContent.overview;
        let keyPointsList = document.getElementById('keyPointsList');
        policy.fullContent.keyPoints.forEach(p => { let li = document.createElement('li'); li.innerText = p; keyPointsList.appendChild(li); });
        document.getElementById('keyPointsSection').style.display = 'block';
        let additionalList = document.getElementById('additionalList');
        policy.fullContent.additionalPolicies.forEach(p => { let li = document.createElement('li'); li.innerText = p; additionalList.appendChild(li); });
        document.getElementById('additionalSection').style.display = 'block';
        let approvalList = document.getElementById('approvalList');
        policy.fullContent.approvalProcess.forEach(p => { let li = document.createElement('li'); li.innerText = p; approvalList.appendChild(li); });
        document.getElementById('approvalSection').style.display = 'block';
    }

        <div class="admin-section"><h4>📜 السياسات</h4><div class="jobs-grid">${policiesList.map(p => `<div class="job-card"><i class="fas fa-file-alt"></i><h4>${p.title}</h4><p>${p.category}</p><div><button class="btn" style="margin-top:8px; background:#f59e0b; padding:5px 12px;" onclick="editPolicy(${p.id})"><i class="fas fa-edit"></i> تعديل</button> <button class="btn" style="margin-top:8px; background:#ef4444; padding:5px 12px;" onclick="deletePolicy(${p.id})"><i class="fas fa-trash"></i> حذف</button></div></div>`).join('')}</div></div>
        <div class="admin-section"><h4>❓ الأسئلة الشائعة</h4><div class="jobs-grid">${faqList.map(f => `<div class="job-card"><i class="fas fa-question-circle"></i><h4>${f.question}</h4><p>${f.answer.substring(0,30)}...</p><div><button class="btn" style="margin-top:8px; background:#f59e0b; padding:5px 12px;" onclick="editFaq(${f.id})"><i class="fas fa-edit"></i> تعديل</button> <button class="btn" style="margin-top:8px; background:#ef4444; padding:5px 12px;" onclick="deleteFaq(${f.id})"><i class="fas fa-trash"></i> حذف</button></div></div>`).join('')}</div></div>
        <div class="admin-section"><h4>🤝 السلوكيات</h4><div class="jobs-grid">${behaviorsList.map(b => `<div class="job-card"><i class="fas fa-handshake"></i><h4>${b.title}</h4><p>${b.desc}</p><div><button class="btn" style="margin-top:8px; background:#f59e0b; padding:5px 12px;" onclick="editBehavior(${b.id})"><i class="fas fa-edit"></i> تعديل</button> <button class="btn" style="margin-top:8px; background:#ef4444; padding:5px 12px;" onclick="deleteBehavior(${b.id})"><i class="fas fa-trash"></i> حذف</button></div></div>`).join('')}</div></div>
        <div class="admin-section"><h4>📋 الإجراءات</h4><div class="jobs-grid">${proceduresList.map(p => `<div class="job-card"><i class="fas fa-list-ol"></i><h4>${p.title}</h4><p>${p.desc}</p><div><button class="btn" style="margin-top:8px; background:#f59e0b; padding:5px 12px;" onclick="editProcedure(${p.id})"><i class="fas fa-edit"></i> تعديل</button> <button class="btn" style="margin-top:8px; background:#ef4444; padding:5px 12px;" onclick="deleteProcedure(${p.id})"><i class="fas fa-trash"></i> حذف</button></div></div>`).join('')}</div></div>
        <div class="admin-section"><h4>🏢 الأقسام</h4><div class="jobs-grid">${orgStructure.departments.map(d => `<div class="job-card"><i class="fas fa-building"></i><h4>${d.name}</h4><p>المدير: ${d.head}</p><div><button class="btn" style="margin-top:8px; background:#f59e0b; padding:5px 12px;" onclick="editOrgDept('${d.id}')"><i class="fas fa-edit"></i> تعديل</button> <button class="btn" style="margin-top:8px; background:#ef4444; padding:5px 12px;" onclick="deleteOrgDept('${d.id}')"><i class="fas fa-trash"></i> حذف</button></div></div>`).join('')}</div></div>
        <div class="admin-section"><h4>🔔 الإعلانات</h4><div class="jobs-grid">${announcementsList.map(a => `<div class="job-card"><i class="fas fa-bell"></i><h4>${a.title}</h4><p>${a.content}</p><div><button class="btn" style="margin-top:8px; background:#f59e0b; padding:5px 12px;" onclick="editAnnouncement(${a.id})"><i class="fas fa-edit"></i> تعديل</button> <button class="btn" style="margin-top:8px; background:#ef4444; padding:5px 12px;" onclick="deleteAnnouncement(${a.id})"><i class="fas fa-trash"></i> حذف</button></div></div>`).join('')}</div></div>`;
    }

    // دوال الإدارة
    function showModal(title, html, onSave) {
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3>${title}</h3>${html}<div style="margin-top:15px;"><button class="btn" onclick="saveModal(this)">حفظ</button><button class="btn" style="background:#ef4444;" onclick="this.closest('.modal').remove()">إلغاء</button></div></div>`;
        document.body.appendChild(modal);
        window.saveModal = (btn) => { onSave(); btn.closest('.modal').remove(); };
    }

    window.showAddJobModal = () => showModal('إضافة مسمى وظيفي', `<div class="form-group"><label>المسمى</label><input id="title"></div><div class="form-group"><label>القسم</label><input id="dept"></div><div class="form-group"><label>المستوى</label><select id="level"><option>إداري</option><option>تنفيذي</option><option>متخصص</option></select></div>`, () => {
        globalJobsList.push({ id: Date.now(), title: document.getElementById('title').value, department: document.getElementById('dept').value, level: document.getElementById('level').value });
        updateOrgDepartmentsFromJobs(); saveAll(); renderApp(); alert('✅ تم الإضافة');
    });
    window.editJob = (id) => { let j = globalJobsList.find(j => j.id === id); showModal('تعديل', `<div class="form-group"><label>المسمى</label><input id="title" value="${j.title}"></div><div class="form-group"><label>القسم</label><input id="dept" value="${j.department}"></div>`, () => { j.title = document.getElementById('title').value; j.department = document.getElementById('dept').value; saveAll(); updateOrgDepartmentsFromJobs(); renderApp(); alert('✅ تم التحديث'); }); };
    window.deleteJob = (id) => { if(confirm('حذف؟')) { globalJobsList = globalJobsList.filter(j => j.id !== id); saveAll(); updateOrgDepartmentsFromJobs(); renderApp(); } };
    window.showAddPolicyModal = () => showModal('إضافة سياسة', `<div class="form-group"><label>العنوان</label><input id="title"></div><div class="form-group"><label>التصنيف</label><select id="cat"><option>إجازات</option><option>مالية</option><option>عام</option></select></div><div class="form-group"><label>الإصدار</label><input id="version" value="1.0"></div><div class="form-group"><label>الوصف</label><input id="desc"></div>`, () => {
        policiesList.push({ id: Date.now(), title: document.getElementById('title').value, category: document.getElementById('cat').value, version: document.getElementById('version').value, description: document.getElementById('desc').value, fullContent: { overview: "وصف السياسة", keyPoints: ["نقطة 1"], additionalPolicies: ["سياسة إضافية"], approvalProcess: ["خطوة 1"] } });
        saveAll(); renderApp(); alert('✅ تم الإضافة');
    });
    window.editPolicy = (id) => { let p = policiesList.find(p => p.id === id); showModal('تعديل', `<div class="form-group"><label>العنوان</label><input id="title" value="${p.title}"></div><div class="form-group"><label>التصنيف</label><select id="cat"><option ${p.category==='إجازات'?'selected':''}>إجازات</option><option ${p.category==='مالية'?'selected':''}>مالية</option><option ${p.category==='عام'?'selected':''}>عام</option></select></div>`, () => { p.title = document.getElementById('title').value; p.category = document.getElementById('cat').value; saveAll(); renderApp(); alert('✅ تم التحديث'); }); };
    window.deletePolicy = (id) => { if(confirm('حذف؟')) { policiesList = policiesList.filter(p => p.id !== id); saveAll(); renderApp(); } };
    window.showAddFaqModal = () => showModal('إضافة سؤال', `<div class="form-group"><label>السؤال</label><input id="q"></div><div class="form-group"><label>الإجابة</label><textarea id="a" rows="3"></textarea></div>`, () => { faqList.push({ id: Date.now(), question: document.getElementById('q').value, answer: document.getElementById('a').value }); saveAll(); renderApp(); alert('✅ تم الإضافة'); });
    window.editFaq = (id) => { let f = faqList.find(f => f.id === id); showModal('تعديل', `<div class="form-group"><label>السؤال</label><input id="q" value="${f.question}"></div><div class="form-group"><label>الإجابة</label><textarea id="a">${f.answer}</textarea></div>`, () => { f.question = document.getElementById('q').value; f.answer = document.getElementById('a').value; saveAll(); renderApp(); alert('✅ تم التحديث'); }); };
    window.deleteFaq = (id) => { if(confirm('حذف؟')) { faqList = faqList.filter(f => f.id !== id); saveAll(); renderApp(); } };
    window.showAddBehaviorModal = () => showModal('إضافة سلوك', `<div class="form-group"><label>العنوان</label><input id="title"></div><div class="form-group"><label>الوصف</label><textarea id="desc" rows="2"></textarea></div>`, () => { behaviorsList.push({ id: Date.now(), title: document.getElementById('title').value, desc: document.getElementById('desc').value }); saveAll(); renderApp(); alert('✅ تم الإضافة'); });
    window.editBehavior = (id) => { let b = behaviorsList.find(b => b.id === id); showModal('تعديل', `<div class="form-group"><label>العنوان</label><input id="title" value="${b.title}"></div><div class="form-group"><label>الوصف</label><textarea id="desc">${b.desc}</textarea></div>`, () => { b.title = document.getElementById('title').value; b.desc = document.getElementById('desc').value; saveAll(); renderApp(); alert('✅ تم التحديث'); }); };
    window.deleteBehavior = (id) => { if(confirm('حذف؟')) { behaviorsList = behaviorsList.filter(b => b.id !== id); saveAll(); renderApp(); } };
    window.showAddProcedureModal = () => showModal('إضافة إجراء', `<div class="form-group"><label>العنوان</label><input id="title"></div><div class="form-group"><label>الوصف</label><textarea id="desc" rows="2"></textarea></div>`, () => { proceduresList.push({ id: Date.now(), step: proceduresList.length+1, title: document.getElementById('title').value, desc: document.getElementById('desc').value }); saveAll(); renderApp(); alert('✅ تم الإضافة'); });
    window.editProcedure = (id) => { let p = proceduresList.find(p => p.id === id); showModal('تعديل', `<div class="form-group"><label>العنوان</label><input id="title" value="${p.title}"></div><div class="form-group"><label>الوصف</label><textarea id="desc">${p.desc}</textarea></div>`, () => { p.title = document.getElementById('title').value; p.desc = document.getElementById('desc').value; saveAll(); renderApp(); alert('✅ تم التحديث'); }); };
    window.deleteProcedure = (id) => { if(confirm('حذف؟')) { proceduresList = proceduresList.filter(p => p.id !== id); proceduresList.forEach((p,i)=>p.step=i+1); saveAll(); renderApp(); } };
    window.showAddAnnouncementModal = () => showModal('إضافة إعلان', `<div class="form-group"><label>العنوان</label><input id="title"></div><div class="form-group"><label>المحتوى</label><textarea id="content" rows="2"></textarea></div>`, () => { announcementsList.push({ id: Date.now(), title: document.getElementById('title').value, content: document.getElementById('content').value, date: new Date().toLocaleDateString('ar') }); saveAll(); renderApp(); alert('✅ تم الإضافة'); });
    window.editAnnouncement = (id) => { let a = announcementsList.find(a => a.id === id); showModal('تعديل', `<div class="form-group"><label>العنوان</label><input id="title" value="${a.title}"></div><div class="form-group"><label>المحتوى</label><textarea id="content">${a.content}</textarea></div>`, () => { a.title = document.getElementById('title').value; a.content = document.getElementById('content').value; saveAll(); renderApp(); alert('✅ تم التحديث'); }); };
    window.deleteAnnouncement = (id) => { if(confirm('حذف؟')) { announcementsList = announcementsList.filter(a => a.id !== id); saveAll(); renderApp(); } };
    window.deleteOrgDept = (id) => { if(confirm('حذف القسم؟')) { orgStructure.departments = orgStructure.departments.filter(d => d.id !== id); saveAll(); renderApp(); } };
    window.exportAllData = () => { let data = { usersDatabase, policiesList, behaviorsList, proceduresList, faqList, announcementsList, orgStructure, globalJobsList, performanceCriteria }; let blob = new Blob([JSON.stringify(data)], {type:"application/json"}); let url = URL.createObjectURL(blob); let a = document.createElement('a'); a.href = url; a.download = `hr_backup_${Date.now()}.json`; a.click(); URL.revokeObjectURL(url); alert('تم تصدير البيانات'); };
    window.resetAllData = () => { if(confirm('إعادة تعيين جميع البيانات؟')) { localStorage.clear(); sessionStorage.clear(); location.reload(); } };

    // دوال الهيكل التنظيمي
    window.showAddOrgDeptModal = function() {
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3>إضافة قسم جديد</h3><div class="form-group"><label>اسم القسم</label><input id="deptName"></div><div class="form-group"><label>رئيس القسم
        <div class="form-group"><label>رئيس القسم</label><input id="deptHead"></div>
<div class="form-group"><label>عدد الأعضاء</label><input id="deptMembers" type="number" value="1"></div>
<button class="btn" onclick="saveNewDept(this)">إضافة</button>
<button class="btn" style="background:#ef4444;" onclick="this.closest('.modal').remove()">إلغاء</button></div>`;
        document.body.appendChild(modal);
        window.saveNewDept = function(btn) {
            orgStructure.departments.push({ id: "dept_" + Date.now(), name: document.getElementById('deptName').value, head: document.getElementById('deptHead').value, members: parseInt(document.getElementById('deptMembers').value), jobs: [] });
            saveAll(); btn.closest('.modal').remove(); renderApp(); alert('✅ تم إضافة القسم');
        };
    };
    window.editOrgCEO = function() {
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3>تعديل الإدارة العليا</h3><div class="form-group"><label>الاسم</label><input id="ceoName" value="${orgStructure.ceo.name}"></div><div class="form-group"><label>رئيس الإدارة</label><input id="ceoHead" value="${orgStructure.ceo.head}"></div><div class="form-group"><label>عدد الأعضاء</label><input id="ceoMembers" value="${orgStructure.ceo.members}" type="number"></div><button class="btn" onclick="saveCEOEdit(this)">حفظ</button><button class="btn" style="background:#ef4444;" onclick="this.closest('.modal').remove()">إلغاء</button></div>`;
        document.body.appendChild(modal);
        window.saveCEOEdit = function(btn) {
            orgStructure.ceo.name = document.getElementById('ceoName').value;
            orgStructure.ceo.head = document.getElementById('ceoHead').value;
            orgStructure.ceo.members = parseInt(document.getElementById('ceoMembers').value);
            saveAll(); btn.closest('.modal').remove(); renderApp(); alert('✅ تم التحديث');
        };
    };
    window.editOrgDept = function(deptId) {
        let dept = orgStructure.departments.find(d => d.id === deptId);
        if(!dept) return;
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3>تعديل القسم</h3><div class="form-group"><label>اسم القسم</label><input id="deptName" value="${dept.name}"></div><div class="form-group"><label>رئيس القسم</label><input id="deptHead" value="${dept.head}"></div><div class="form-group"><label>عدد الأعضاء</label><input id="deptMembers" value="${dept.members}" type="number"></div><div style="display:flex; gap:10px;"><button class="btn" onclick="saveDeptEdit(this, '${deptId}')">حفظ</button><button class="btn" style="background:#ef4444;" onclick="deleteOrgDept('${deptId}')">حذف</button><button class="btn" style="background:#6b7280;" onclick="this.closest('.modal').remove()">إلغاء</button></div></div>`;
        document.body.appendChild(modal);
        window.saveDeptEdit = function(btn, id) {
            let d = orgStructure.departments.find(d => d.id === id);
            if(d) { d.name = document.getElementById('deptName').value; d.head = document.getElementById('deptHead').value; d.members = parseInt(document.getElementById('deptMembers').value); saveAll(); btn.closest('.modal').remove(); renderApp(); alert('✅ تم التحديث'); }
        };
    };

    // ============ التطبيق الرئيسي ============
    let currentPage = "home";

    function renderApp() {
        let user = getCurrentUser();
        let root = document.getElementById('appRoot');
        if(!user) { root.innerHTML = renderLoginRegister(); return; }
        let isAdmin = user.role === 'admin';
        root.innerHTML = `
        <div class="app-container">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header"><div class="logo-area"><div class="company-logo"><i class="fas fa-crown"></i></div><div class="logo">HR<span>SYSTEM</span></div></div></div>
                <div class="nav-item ${currentPage === 'home' ? 'active' : ''}" data-page="home"><i class="fas fa-home"></i> الرئيسية</div>
                <div class="nav-item ${currentPage === 'knowledge' ? 'active' : ''}" data-page="knowledge"><i class="fas fa-database"></i> مركز المعرفة</div>
                <div class="nav-item ${currentPage === 'org' ? 'active' : ''}" data-page="org"><i class="fas fa-project-diagram"></i> الهيكل التنظيمي</div>
                <div class="nav-item ${currentPage === 'company' ? 'active' : ''}" data-page="company"><i class="fas fa-flag-checkered"></i> عن الشركة</div>
                <div class="nav-item ${currentPage === 'performance' ? 'active' : ''}" data-page="performance"><i class="fas fa-chart-line"></i> تقييم الأداء</div>
                <div class="nav-item ${currentPage === 'notifications' ? 'active' : ''}" data-page="notifications"><i class="fas fa-bell"></i> الإشعارات</div>
                <div class="nav-item ${currentPage === 'profile' ? 'active' : ''}" data-page="profile"><i class="fas fa-user-circle"></i> حسابي</div>
                ${isAdmin ? `<div class="nav-item ${currentPage === 'admin' ? 'active' : ''}" data-page="admin"><i class="fas fa-crown"></i> لوحة التحكم</div>` : ''}
                <div style="margin-top:30px;"><div class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</div></div>
            </div>
            <div class="bottom-nav">
                <div class="bottom-nav-item ${currentPage === 'home' ? 'active' : ''}" data-page="home"><i class="fas fa-home"></i><span>الرئيسية</span></div>
                <div class="bottom-nav-item ${currentPage === 'knowledge' ? 'active' : ''}" data-page="knowledge"><i class="fas fa-database"></i><span>المعرفة</span></div>
                <div class="bottom-nav-item ${currentPage === 'profile' ? 'active' : ''}" data-page="profile"><i class="fas fa-user"></i><span>حسابي</span></div>
                <div class="bottom-nav-item ${currentPage === 'notifications' ? 'active' : ''}" data-page="notifications"><i class="fas fa-bell"></i><span>إشعارات</span></div>
                ${isAdmin ? `<div class="bottom-nav-item ${currentPage === 'admin' ? 'active' : ''}" data-page="admin"><i class="fas fa-cog"></i><span>تحكم</span></div>` : ''}
            </div>
            <div class="main-content">
                <div class="top-bar"><button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div class="page-title">${getPageTitle()}</div><div class="avatar">${user?.avatar ? `<img src="${user.avatar}">` : '<i class="fas fa-user"></i>'}</div></div>
                <div id="pageContent"></div>
            </div>
        </div>`;
        renderPageContent();
        attachEvents();
    }

    function getPageTitle() {
        let titles = { home:"الرئيسية", knowledge:"مركز المعرفة", org:"الهيكل التنظيمي", company:"عن الشركة", performance:"تقييم الأداء", notifications:"الإشعارات", profile:"حسابي", admin:"لوحة التحكم" };
        return titles[currentPage] || "الرئيسية";
    }

    function renderPageContent() {
        if(currentPage === 'knowledge') { document.getElementById('pageContent').innerHTML = `<div id="knowledgeContent"></div>`; renderKnowledgePage(); }
        else if(currentPage === 'home') document.getElementById('pageContent').innerHTML = renderHome();
        else if(currentPage === 'org') document.getElementById('pageContent').innerHTML = renderOrg();
        else if(currentPage === 'company') document.getElementById('pageContent').innerHTML = renderCompany();
        else if(currentPage === 'performance') document.getElementById('pageContent').innerHTML = renderPerformance();
        else if(currentPage === 'notifications') document.getElementById('pageContent').innerHTML = renderNotifications();
        else if(currentPage === 'profile') document.getElementById('pageContent').innerHTML = renderProfile();
        else if(currentPage === 'admin') document.getElementById('pageContent').innerHTML = renderAdminPanel();
        else document.getElementById('pageContent').innerHTML = renderHome();
    }

    function attachEvents() {
        document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(el => {
            if(el.id === 'logoutBtn') return;
            let page = el.dataset.page;
            if(page) el.onclick = () => { currentPage = page; renderApp(); };
        });
        document.getElementById('logoutBtn')?.addEventListener('click', () => { logout(); });
    }

    renderApp();
    saveAll();
</script>
</body>
</html>
