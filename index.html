<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR App</title>

<style>
body{
 margin:0;
 font-family:Arial;
 background:#0f172a;
 color:white;
}

.header{
 padding:15px;
 background:#020617;
 text-align:center;
 font-size:18px;
}

.page{
 padding:15px;
}

.card{
 background:#1e293b;
 padding:15px;
 margin:10px 0;
 border-radius:12px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

button{
 background:#facc15;
 border:none;
 padding:10px;
 border-radius:10px;
 cursor:pointer;
}

.add-btn{
 width:100%;
 padding:15px;
 margin-top:10px;
 font-size:16px;
}
</style>

</head>

<body>

<div class="header">HR System</div>

<div class="page">

<div id="list"></div>

<button class="add-btn" onclick="add()">➕ إضافة موظف</button>

</div>

<script>

// تحميل البيانات
function load(){
 let data = JSON.parse(localStorage.getItem("employees") || "{}");
 let html = "";

 if(Object.keys(data).length === 0){
  html = "<div class='card'>لا يوجد موظفين</div>";
 }

 Object.keys(data).forEach(id=>{
  let e = data[id];

  html += `
  <div class="card">
   <div>
    <b>${e.name}</b><br>
    ${e.job}
   </div>
   <button onclick="del('${id}')">🗑</button>
  </div>`;
 });

 document.getElementById("list").innerHTML = html;
}

// إضافة موظف
function add(){
 let name = prompt("اسم الموظف");
 let job = prompt("الوظيفة");

 if(!name) return;

 let data = JSON.parse(localStorage.getItem("employees") || "{}");

 let id = Date.now();

 data[id] = {
  name:name,
  job:job
 };

 localStorage.setItem("employees", JSON.stringify(data));

 load();
}

// حذف
function del(id){
 let data = JSON.parse(localStorage.getItem("employees") || "{}");

 delete data[id];

 localStorage.setItem("employees", JSON.stringify(data));

 load();
}

// تشغيل أول مرة
load();

</script>

</body>
</html>
