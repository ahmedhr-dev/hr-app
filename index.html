    // -------------------- دوال Firebase --------------------
    async function saveToFirebase(data) {
        if (!window.db || !window.set || isSyncing) return false;
        try {
            await window.set(window.ref(window.db, 'hr-system-data'), { ...data, lastUpdated: Date.now() });
            return true;
        } catch(e) { return false; }
    }
    
    async function loadFromFirebase() {
        if (!window.db || !window.get) return null;
        try {
            const snapshot = await window.get(window.ref(window.db, 'hr-system-data'));
            return snapshot.exists() ? snapshot.val() : null;
        } catch(e) { return null; }
    }
    
    function listenToFirebase() {
        if (!window.db || !window.onValue) return;
        window.onValue(window.ref(window.db, 'hr-system-data'), (snapshot) => {
            if (snapshot.exists() && !isSyncing) {
                const data = snapshot.val();
                if (data.lastUpdated && data.lastUpdated > lastUpdated) {
                    isSyncing = true;
                    if (data.policies) policies = data.policies;
                    if (data.behaviors) behaviors = data.behaviors;
                    if (data.procedures) procedures = data.procedures;
                    if (data.faq) faq = data.faq;
                    if (data.announcements) announcements = data.announcements;
                    if (data.companyData) companyData = data.companyData;
                    if (data.orgStructure) orgStructure = data.orgStructure;
                    if (data.users) users = data.users;
                    lastUpdated = data.lastUpdated;
                    if (currentUser) {
                        const updatedUser = users.find(u => u.id === currentUser.id);
                        if (updatedUser) currentUser = updatedUser;
                        renderApp();
                        showToast("🔄 تم تحديث البيانات من جهاز آخر");
                    }
                    isSyncing = false;
                }
            }
        });
    }
    
    async function saveAll() {
        if (isSyncing) { showToast('المزامنة جارية، أعد المحاولة', true); return false; }
        const data = { users, policies, behaviors, procedures, faq, announcements, companyData, orgStructure, performance };
        const saved = await saveToFirebase(data);
        if (!saved) showToast('لم يتم الحفظ في السحابة. تحقق من الاتصال والصلاحيات.', true);
        return saved;
    }
    
    async function loadAllFromCloud() {
        const data = await loadFromFirebase();
        if (data) {
            users = data.users || users;
            policies = data.policies || policies;
            behaviors = data.behaviors || behaviors;
            procedures = data.procedures || procedures;
            faq = data.faq || faq;
            announcements = data.announcements || announcements;
            companyData = data.companyData || companyData;
            orgStructure = data.orgStructure || orgStructure;
            performance = data.performance || performance;
            lastUpdated = data.lastUpdated || 0;
            return true;
        } else {
            // لا تكتب بيانات افتراضية عند انقطاع الاتصال أو عدم وجود بيانات.
            return false;
        }
    }
    
    // -------------------- دوال مساعدة --------------------
    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function showToast(msg, isError = false) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        if (isError) toast.classList.add('error');
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 100);
        setTimeout(() => toast.remove(), 3000);
    }

    // -------------------- المساعد الذكي --------------------
    function getAIResponse(question) {
        const q = question.toLowerCase();
        const policy = policies.find(p => q.includes(p.title.toLowerCase()));
        if (policy) return policy.content;
        const behavior = behaviors.find(b => q.includes(b.title.toLowerCase()));
        if (behavior) return behavior.desc;
        const procedure = procedures.find(p => q.includes(p.title.toLowerCase()));
        if (procedure) return procedure.desc;
        const faqItem = faq.find(f => q.includes(f.question.toLowerCase()));
        if (faqItem) return faqItem.answer;
        if (q.includes('راتب') || q.includes('سلفة')) return "💰 يمكن طلب سلفة بعد 6 أشهر عمل، الحد الأقصى 50% من الراتب";
        if (q.includes('إجازة')) return "🌴 21 يوم إجازة سنوية مدفوعة الأجر";
        return "🙏 شكراً لسؤالك. يمكنك مراجعة دليل الموظف لمزيد من المعلومات.";
    }
    
    function askAI() {
        const input = document.getElementById('aiInput');
        if (!input) return;
        const question = input.value.trim();
        if (!question) return;
        const messagesDiv = document.getElementById('aiMessages');
        if (!messagesDiv) return;
        const userMsg = document.createElement('div');
        userMsg.className = 'message user-message';
        userMsg.innerHTML = `<i class="fas fa-user"></i> ${escapeHtml(question)}`;
        messagesDiv.appendChild(userMsg);
        input.value = '';
        const typingDiv = document.createElement('div');
        typingDiv.className = 'typing';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = '<i class="fas fa-robot"></i> المساعد يكتب...';
        messagesDiv.appendChild(typingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        setTimeout(() => {
            document.getElementById('typingIndicator')?.remove();
            const aiMsg = document.createElement('div');
            aiMsg.className = 'message ai-message';
            aiMsg.innerHTML = `<i class="fas fa-robot"></i> ${escapeHtml(getAIResponse(question))}`;
            messagesDiv.appendChild(aiMsg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }, 500);
    }

        <div class="section-title">نظرة عامة <span style="font-size:11px;color:var(--muted);font-weight:400">ملخص الدليل الحالي</span></div>
        <div class="stats-grid">
          <div class="stat-card"><i class="fas fa-file-alt"></i><div class="stat-number">${policies.length}</div><div>السياسات</div></div>
          <div class="stat-card"><i class="fas fa-list-ol"></i><div class="stat-number">${procedures.length}</div><div>الإجراءات</div></div>
          <div class="stat-card"><i class="fas fa-handshake"></i><div class="stat-number">${behaviors.length}</div><div>السلوكيات</div></div>
          <div class="stat-card"><i class="fas fa-question-circle"></i><div class="stat-number">${faq.length}</div><div>الأسئلة الشائعة</div></div>
        </div>
        <div class="external-link-card">
          <div style="display:flex;align-items:center;gap:13px">
            <div class="brand-mark"><i class="fas fa-fingerprint"></i></div>
            <div><h3>منصة حضور الخزامى</h3><p>فتح منصة الحضور والانصراف في تبويب مستقل. لا يتم دمج البيانات تلقائيًا.</p></div>
          </div>
          <a href="${ATTENDANCE_URL}" target="_blank" rel="noopener noreferrer"><i class="fas fa-external-link-alt"></i> فتح المنصة</a>
        </div>
        <div class="card"><h3><i class="fas fa-bullhorn" style="color:var(--accent)"></i> آخر الإعلانات</h3>
        ${announcements.length?announcements.slice(-3).reverse().map(a=>`<div class="list-item"><div class="list-item-info"><div class="list-item-title">${escapeHtml(a.title)}</div><div class="list-item-desc">${escapeHtml(a.content)}</div></div><small>${escapeHtml(String(a.date||''))}</small></div>`).join(''):'<p>لا توجد إعلانات حاليًا.</p>'}</div>`;
    }

    function renderCompany() {
        return `<div class="card"><h2 style="color:var(--accent); text-align:center;">${escapeHtml(companyData.name)}</h2></div><div class="card"><h3><i class="fas fa-eye"></i> الرؤية</h3><p>${escapeHtml(companyData.vision)}</p></div><div class="card"><h3><i class="fas fa-bullseye"></i> الرسالة</h3><p>${escapeHtml(companyData.mission)}</p></div>`;
    }
    
    function renderOrg() {
        return `<div class="card"><h3><i class="fas fa-sitemap"></i> الهيكل التنظيمي</h3><div class="org-ceo" onclick="if(${currentUser?.role==='admin'}) editOrgItem('ceo')"><i class="fas fa-crown"></i><h3>${escapeHtml(orgStructure.ceo.name)}</h3><p>${escapeHtml(orgStructure.ceo.head)}</p><small>${orgStructure.ceo.members} أعضاء</small></div><div class="org-departments">${orgStructure.departments.map(d=>`<div class="org-dept" onclick="if(${currentUser?.role==='admin'}) editItem('dept',${d.id})"><i class="fas fa-building"></i><h4>${escapeHtml(d.name)}</h4><p>${escapeHtml(d.head)}</p><small>${d.members} عضو</small></div>`).join('')}</div></div>`;
    }
    
    function renderPerformance() {
        let perf = performance[currentUser?.jobTitle] || performance["موظف"];
        if (!perf) return `<div class="card"><h3>⭐ تقييم الأداء</h3><p>جاري تحميل البيانات...</p></div>`;
        let total = perf.criteria.reduce((s,c)=>s + c.value,0);
        let maxTotal = perf.criteria.reduce((s,c)=>s + c.max,0);
        let percent = Math.round((total/maxTotal)*100);
        return `<div class="card"><h3>⭐ تقييم الأداء - ${escapeHtml(currentUser?.jobTitle || 'موظف')}</h3><div style="font-size:48px; font-weight:bold; color:var(--accent); text-align:center;">${percent}%</div><div style="width:100%; height:10px; background:rgba(255,255,255,0.1); border-radius:10px; margin:15px 0;"><div style="width:${percent}%; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-deep)); border-radius:10px;"></div></div>${perf.criteria.map(c=>`<div style="margin-bottom:15px;"><div>${escapeHtml(c.name)}</div><div style="display:flex; justify-content:space-between;"><span>${c.value}/${c.max}</span><span>الوزن: ${c.weight}%</span></div><div style="width:100%; height:5px; background:rgba(255,255,255,0.1); border-radius:5px; margin-top:5px;"><div style="width:${(c.value/c.max)*100}%; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-deep)); border-radius:5px;"></div></div></div>`).join('')}</div>`;
    }
    
    function renderNotifications() {
        return `<div class="card"><h3><i class="fas fa-bell"></i> الإشعارات</h3>${announcements.map(a=>`<div style="padding:10px; border-bottom:1px solid rgba(181,133,221,0.1);"><strong>${escapeHtml(a.title)}</strong><br>${escapeHtml(a.content)}<br><small>${escapeHtml(a.date)}</small></div>`).join('')}</div>`;
    }
    
    function renderProfile() {
        return `<div class="card"><h3><i class="fas fa-user-circle"></i> حسابي</h3><div class="form-group"><label>الاسم</label><input id="pName" value="${escapeHtml(currentUser?.name || '')}"></div><div class="form-group"><label>البريد</label><input id="pEmail" value="${escapeHtml(currentUser?.email || '')}"></div><button class="btn" onclick="updateProfile()">حفظ</button><button class="btn" style="margin-top:10px; background:#ef4444;" onclick="logout()">تسجيل الخروج</button></div>`;
    }
    
    async function updateProfile() {
        currentUser.name = document.getElementById('pName')?.value || currentUser.name;
        currentUser.email = document.getElementById('pEmail')?.value || currentUser.email;
        let idx = users.findIndex(u => u.id === currentUser.id);
        if (idx !== -1) users[idx] = currentUser;
        if (!(await saveAll())) return;
        showToast("تم حفظ البيانات");
        renderApp();
    }
    
    function renderAdmin() {
        if (currentUser?.role !== 'admin') return '<div class="card">🔒 هذه الصفحة للمدير فقط</div>';
        return `
        <div class="card">
            <h3><i class="fas fa-cog"></i> لوحة التحكم</h3>
            <div class="admin-grid">
                <div class="admin-card" onclick="showAddModal('policy')"><i class="fas fa-file-alt"></i><div>إضافة سياسة</div></div>
                <div class="admin-card" onclick="showAddModal('behavior')"><i class="fas fa-handshake"></i><div>إضافة سلوك</div></div>
                <div class="admin-card" onclick="showAddModal('procedure')"><i class="fas fa-list-ol"></i><div>إضافة إجراء</div></div>
                <div class="admin-card" onclick="showAddModal('faq')"><i class="fas fa-question-circle"></i><div>إضافة سؤال</div></div>
                <div class="admin-card" onclick="showAddModal('announcement')"><i class="fas fa-bell"></i><div>إضافة إعلان</div></div>
                <div class="admin-card" onclick="showAddModal('dept')"><i class="fas fa-building"></i><div>إضافة قسم</div></div>
                <div class="admin-card" onclick="editCompanyData()"><i class="fas fa-building"></i><div>تعديل الشركة</div></div>
                <div class="admin-card" onclick="syncNow()"><i class="fas fa-sync-alt"></i><div>مزامنة</div></div>
            </div>
        </div>
        
        <div class="card"><h4><i class="fas fa-file-alt"></i> السياسات</h4>${policies.map(p=>`<div class="list-item"><div class="list-item-info"><div class="list-item-title">${escapeHtml(p.title)}</div><div class="list-item-desc">${escapeHtml(p.description.substring(0,60))}</div></div><div class="list-item-actions"><button class="btn btn-small" onclick="editItem('policy',${p.id})"><i class="fas fa-edit"></i></button><button class="btn btn-small" style="background:#ef4444;" onclick="deleteItem('policy',${p.id})"><i class="fas fa-trash"></i></button></div></div>`).join('')}</div>
        
        <div class="card"><h4><i class="fas fa-handshake"></i> السلوكيات</h4>${behaviors.map(b=>`<div class="list-item"><div class="list-item-info"><div class="list-item-title">${escapeHtml(b.title)}</div><div class="list-item-desc">${escapeHtml(b.desc.substring(0,60))}</div></div><div class="list-item-actions"><button class="btn btn-small" onclick="editItem('behavior',${b.id})"><i class="fas fa-edit"></i></button><button class="btn btn-small" style="background:#ef4444;" onclick="deleteItem('behavior',${b.id})"><i class="fas fa-trash"></i></button></div></div>`).join('')}</div>
        
        <div class="card"><h4><i class="fas fa-list-ol"></i> الإجراءات</h4>${procedures.map(p=>`<div class="list-item"><div class="list-item-info"><div class="list-item-title">${escapeHtml(p.title)}</div><div class="list-item-desc">${escapeHtml(p.desc.substring(0,60))}</div></div><div class="list-item-actions"><button class="btn btn-small" onclick="editItem('procedure',${p.id})"><i class="fas fa-edit"></i></button><button class="btn btn-small" style="background:#ef4444;" onclick="deleteItem('procedure',${p.id})"><i class="fas fa-trash"></i></button></div></div>`).join('')}</div>
        
        <div class="card"><h4><i class="fas fa-question-circle"></i> الأسئلة الشائعة</h4>${faq.map(f=>`<div class="list-item"><div class="list-item-info"><div class="list-item-title">${escapeHtml(f.question)}</div><div class="list-item-desc">${escapeHtml(f.answer.substring(0,60))}</div></div><div class="list-item-actions"><button class="btn btn-small" onclick="editItem('faq',${f.id})"><i class="fas fa-edit"></i></button><button class="btn btn-small" style="background:#ef4444;" onclick="deleteItem('faq',${f.id})"><i class="fas fa-trash"></i></button></div></div>`).join('')}</div>
        
        <div class="card"><h4><i class="fas fa-bell"></i> الإعلانات</h4>${announcements.map(a=>`<div class="list-item"><div class="list-item-info"><div class="list-item-title">${escapeHtml(a.title)}</div><div class="list-item-desc">${escapeHtml(a.content.substring(0,60))}</div></div><div class="list-item-actions"><button class="btn btn-small" onclick="editItem('announcement',${a.id})"><i class="fas fa-edit"></i></button><button class="btn btn-small" style="background:#ef4444;" onclick="deleteItem('announcement',${a.id})"><i class="fas fa-trash"></i></button></div></div>`).join('')}</div>
        
        <div class="card"><h4><i class="fas fa-building"></i> الأقسام</h4>${orgStructure.departments.map(d=>`<div class="list-item"><div class="list-item-info"><div class="list-item-title">${escapeHtml(d.name)}</div><div class="list-item-desc">المدير: ${escapeHtml(d.head)} | الأعضاء: ${d.members}</div></div><div class="list-item-actions"><button class="btn btn-small" onclick="editItem('dept',${d.id})"><i class="fas fa-edit"></i></button><button class="btn btn-small" style="background:#ef4444;" onclick="deleteItem('dept',${d.id})"><i class="fas fa-trash"></i></button></div></div>`).join('')}</div>`;
    }
    
    // -------------------- العرض الرئيسي --------------------
    function renderApp() {
        const root = document.getElementById('app');
        if (!currentUser) { root.innerHTML = renderLogin(); return; }
        let isAdmin = currentUser.role === 'admin';
        let navItems = [
          ['home','fa-home','الرئيسية'],['guide','fa-book-open','دليل الموظف'],
          ['org','fa-sitemap','الهيكل التنظيمي'],['company','fa-building','عن المجموعة'],
          ['performance','fa-chart-line','تقييم الأداء'],['notifications','fa-bell','الإشعارات'],
          ['profile','fa-user-circle','حسابي']
        ];
        if(isAdmin) navItems.push(['admin','fa-cog','لوحة التحكم']);
        let navHtml = navItems.map(([page,icon,label])=>`<div role="button" tabindex="0" class="nav-item ${currentPage===page?'active':''}" data-page="${page}"><i class="fas ${icon}"></i>${label}</div>`).join('');
        root.innerHTML = `
          <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
          <aside class="sidebar" id="sidebar" aria-label="القائمة الرئيسية">
            <div class="sidebar-header"><div class="brand"><div class="brand-mark"><i class="fas fa-spa"></i></div><div><div class="logo">مجموعة الخزامى</div><div class="brand-sub">بوابة الموارد البشرية</div></div></div></div>
            <div class="sidebar-section">القائمة الرئيسية</div>
            ${navHtml}
            <div class="nav-divider"></div>
            <a class="nav-item" href="${ATTENDANCE_URL}" target="_blank" rel="noopener noreferrer" style="text-decoration:none"><i class="fas fa-fingerprint"></i> منصة الحضور والانصراف <i class="fas fa-external-link-alt" style="font-size:9px;margin-right:auto"></i></a>
            <div class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</div>
            <div class="sidebar-foot"><i class="fas fa-info-circle"></i> الواجهة قيد التطوير. تتم إدارة بيانات الموارد البشرية في قاعدة التطبيق الحالية، ومنصة البصمة مستقلة.</div>
          </aside>
          <main class="main-content">
            <div class="top-bar">
              <div style="display:flex;align-items:center;gap:12px"><button class="menu-toggle" title="فتح القائمة" aria-label="فتح القائمة" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button><div><div class="page-title">${getTitle()}</div><div class="page-subtitle">مجموعة الخزامى / الموارد البشرية</div></div></div>
              <div class="top-actions"><span class="status-pill"><i class="fas fa-check-circle"></i> بوابة الموظف</span><button class="icon-btn" title="تغيير المظهر" aria-label="تغيير المظهر" onclick="toggleTheme()"><i class="theme-icon fas fa-adjust"></i></button><button class="icon-btn" title="الإشعارات" onclick="navigateTo('notifications')"><i class="fas fa-bell"></i></button><div class="avatar" title="${escapeHtml(currentUser?.name||'')}"><i class="fas fa-user"></i></div></div>
            </div>
            <div id="pageContent"></div>
          </main>
          <nav class="bottom-tabs" aria-label="التنقل السريع">
            ${[['home','fa-home','الرئيسية'],['guide','fa-book-open','الدليل'],['performance','fa-chart-line','التقييم'],['profile','fa-user','حسابي']].map(([p,i,l])=>`<button class="bottom-tab ${currentPage===p?'active':''}" onclick="navigateTo('${p}')"><i class="fas ${i}"></i><span>${l}</span></button>`).join('')}
            <button class="bottom-tab" onclick="toggleSidebar()"><i class="fas fa-th-large"></i><span>المزيد</span></button>
          </nav>
          <div class="ai-fab" id="aiFab" role="button" tabindex="0" title="المساعد" aria-label="فتح المساعد" onclick="toggleAI()"><i class="fas fa-robot"></i></div>
          <div class="ai-chat" id="aiChat" role="dialog" aria-label="المساعد الذكي">
            <div class="ai-header" onclick="toggleAI()"><i class="fas fa-robot"></i><span style="flex:1">مساعد الخزامى <small style="display:block;font-size:10px;font-weight:400;opacity:.85">مساعد معلومات الدليل</small></span><i class="fas fa-times"></i></div>
            <div class="ai-messages" id="aiMessages"><div class="ai-note"><i class="fas fa-lightbulb"></i> أهلًا بك! اسألني عن السياسات والإجراءات والأسئلة الشائعة. إجاباتي مبنية على محتويات الدليل، وليست استشارة قانونية أو اتصالًا بنموذج ذكاء اصطناعي خارجي.</div></div>
            <div class="ai-input-area"><input type="text" id="aiInput" placeholder="اكتب سؤالك هنا..." aria-label="سؤالك للمساعد" onkeypress="if(event.key==='Enter') askAI()"><button class="btn" aria-label="إرسال" onclick="askAI()"><i class="fas fa-paper-plane"></i></button></div>
          </div>`;
        let pages = { home: renderHome, guide: renderGuide, org: renderOrg, company: renderCompany, performance: renderPerformance, notifications: renderNotifications, profile: renderProfile, admin: renderAdmin };
        document.getElementById('pageContent').innerHTML = (pages[currentPage] || renderHome)();
        document.querySelectorAll('.nav-item[data-page]').forEach(el => {
          const page = el.dataset.page;
          el.onclick = () => navigateTo(page);
          el.onkeydown = e => {if(e.key==='Enter'||e.key===' '){e.preventDefault();navigateTo(page);}};
        });
        window.askAI = askAI; window.toggleAI = toggleAI;
    }

    function getTitle() { let t={home:"الرئيسية",guide:"دليل الموظف",org:"الهيكل التنظيمي",company:"عن المجموعة",performance:"تقييم الأداء",notifications:"الإشعارات",profile:"حسابي",admin:"لوحة التحكم"}; return t[currentPage]||"الرئيسية"; }
    
    // -------------------- بدء التطبيق --------------------
    async function initApp() {
        applyTheme();
        const loaded = await loadAllFromCloud();
        if(loaded) listenToFirebase();
        try {
            const savedId = sessionStorage.getItem('khozama-user-id');
            if(savedId) currentUser = users.find(u => String(u.id) === savedId) || null;
        } catch(e) { currentUser = null; }
        renderApp();
        if(!loaded) showToast('تعذر تحميل بيانات السحابة أو لا توجد بيانات؛ لم نُغيّر أي بيانات.', true);
    }
    applyTheme();
    let __started = false;
    function startAppOnce() {
        if (__started) return;
        __started = true;
        initApp().catch(e => {
            console.error('Khozama initialization error:', e);
            renderApp();
            showToast('حدث خطأ أثناء التحميل. لم يتم حفظ أو تغيير أي بيانات.',true);
        });
    }
    if (window.khozamaFirebaseReady) startAppOnce();
    else window.addEventListener('khozama:firebase-ready', startAppOnce, {once:true});
    // في حال تعطل تحميل مكتبات Firebase، اعرض صفحة الدخول بدل البقاء على شاشة التحميل.
    setTimeout(() => {
        if (!__started) {
            __started = true;
            renderApp();
            showToast('تعذر الاتصال بخدمة البيانات. تحقق من الشبكة والصلاحيات.',true);
        }
    }, 12000);
</script>
</body>
</html>
