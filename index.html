<!DOCTYPE html>

<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Pro</title>

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<!-- Icons -->

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.header{display:flex;justify-content:space-between;padding:15px;background:#020617}
.page{padding:15px;padding-bottom:80px}
.card{background:#1e293b;margin:10px 0;padding:15px;border-radius:12px;font-size:18px;cursor:pointer}
.nav{position:fixed;bottom:0;width:100%;display:flex;justify-content:space-around;background:#020617;padding:10px 0}
.nav button{background:none;border:none;color:white;font-size:20px}
button.main{width:100%;padding:12px;border:none;border-radius:10px;background:#facc15;margin-top:10px}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none}
</style>

</head>

<body>

<div id="app"></div>

<script>

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
  authDomain: "hr-app-710f3.firebaseapp.com",
  projectId: "hr-app-710f3",
  appId: "1:324936659395:web:bb5d491b52be3013c00d76"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let currentUser = null;
let role = "user";

// 🧠 تخزين الملفات محلي
let files = JSON.parse(localStorage.getItem("files") || "[]");

/* LOGIN */
function loginPage(){
 document.getElementById("app").innerHTML = `
 <div class="page">
 <h2>تسجيل الدخول</h2>
 <input id="email" placeholder="Email">
 <input id="pass" type="password" placeholder="Password">
 <button class="main" onclick="login()">دخول</button>
 <button class="main" onclick="register()">تسجيل حساب</button>
 </div>`;
}

/* REGISTER */
function register(){
 let email = emailVal();
 let pass = passVal();
 auth.createUserWithEmailAndPassword(email, pass)
 .then(()=>alert("تم إنشاء الحساب"))
 .catch(e=>alert(e.message));
}

/* LOGIN */
function login(){
 let email = emailVal();
 let pass = passVal();
 auth.signInWithEmailAndPassword(email, pass)
 .catch(e=>alert(e.message));
}

function emailVal(){ return document.getElementById("email").value }
function passVal(){ return document.getElementById("pass").value }

/* HOME */
function homePage(){
 document.getElementById("app").innerHTML = `
 <div class="header">
 <div>👋 ${currentUser.email}</div>
 <div onclick="logout()">🚪</div>
 </div>

 <div class="page">
 <div class="card" onclick="openSection('guide')"><i class="fa-solid fa-book"></i> دليل الموظف</div>
 <div class="card" onclick="openSection('policy')"><i class="fa-solid fa-file"></i> السياسات</div>
 <div class="card" onclick="openSection('faq')"><i class="fa-solid fa-circle-question"></i> الأسئلة</div>
 </div>

 <div class="nav">
 <button onclick="homePage()"><i class="fa-solid fa-house"></i></button>
 <button onclick="profile()"><i class="fa-solid fa-user"></i></button>
 ${role==="admin"?`<button onclick="admin()"><i class="fa-solid fa-crown"></i></button>`:""}
 </div>
 `;
}

/* OPEN SECTION */
function openSection(type){
 let list = files.filter(f=>f.type===type);

 let html = `
 <div class="header">
 <div>📂 الملفات</div>
 <div onclick="homePage()">⬅</div>
 </div>

 <div class="page">
 `;

 if(list.length===0){
  html += `<div class="card">لا يوجد ملفات</div>`;
 }

 list.forEach(f=>{
  html += `<div class="card" onclick="window.open('${f.link}')">
  📄 ${f.name}
  </div>`;
 });

 html += `</div>`;
 document.getElementById("app").innerHTML = html;
}

/* ADMIN */
function admin(){
 document.getElementById("app").innerHTML = `
 <div class="header">
 <div>👑 لوحة التحكم</div>
 <div onclick="homePage()">⬅</div>
 </div>

 <div class="page">
 <input id="name" placeholder="اسم الملف">
 <input id="link" placeholder="رابط الملف">

 <select id="type">
  <option value="guide">دليل الموظف</option>
  <option value="policy">السياسات</option>
  <option value="faq">الأسئلة</option>
 </select>

 <button class="main" onclick="addFile()">إضافة ملف</button>
 </div>
 `;
}

/* ADD FILE */
function addFile(){
 let name = document.getElementById("name").value;
 let link = document.getElementById("link").value;
 let type = document.getElementById("type").value;

 files.push({name,link,type});
 localStorage.setItem("files", JSON.stringify(files));

 alert("تم الإضافة");
}

/* PROFILE */
function profile(){
 document.getElementById("app").innerHTML = `
 <div class="header">
 <div>👤 الحساب</div>
 <div onclick="homePage()">⬅</div>
 </div>

 <div class="page">
 <div class="card">${currentUser.email}</div>
 <div class="card">الصلاحية: ${role}</div>
 </div>
 `;
}

/* LOGOUT */
function logout(){
 auth.signOut();
}

/* AUTH */
auth.onAuthStateChanged(user=>{
 if(user){
  currentUser = user;
  role = user.email==="ahmed.hr@alkuzama.com" ? "admin" : "user";
  homePage();
 }else{
  loginPage();
 }
});

</script>

</body>
</html>
