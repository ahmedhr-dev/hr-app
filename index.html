<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HR System | نظام الموارد البشرية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #0a1a2f, #061220);
            direction: rtl;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Login Page */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(145deg, #0a1a2f, #061220);
        }
        .login-card {
            background: rgba(10, 26, 47, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        
        /* Quran Quote */
        .quran-quote {
            text-align: center;
            margin-bottom: 25px;
            padding: 18px;
            background: rgba(212, 175, 55, 0.12);
            border-radius: 25px;
            border-right: 3px solid #d4af37;
        }
        .quote-icon {
            font-size: 28px;
            color: #d4af37;
            margin-bottom: 10px;
        }
        .quote-arabic {
            font-size: 18px;
            line-height: 1.8;
            color: #e2e8f0;
            font-family: 'Amiri', 'Traditional Arabic', serif;
        }
        .quote-translation {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 8px;
        }
        .quote-author {
            font-size: 11px;
            color: #d4af37;
            margin-top: 10px;
        }
        
        /* Logo Area */
        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }
        .logo-icon i {
            font-size: 45px;
            color: #0a1a2f;
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 5px;
            font-size: 24px;
            color: #d4af37;
        }
        .login-subtitle {
            text-align: center;
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 25px;
        }
        
        .login-card .form-group {
            margin-bottom: 18px;
        }
        .login-card input {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 30px;
            color: white;
            font-size: 16px;
        }
        .login-card input:focus {
            outline: none;
            border-color: #d4af37;
        }
        
        /* Remember me & Forgot password */
        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .remember-me input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            margin: 0;
        }
        .forgot-password {
            color: #d4af37;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }
        
        .login-card .btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            color: #0a1a2f;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .login-card .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(212,175,55,0.3);
        }
        
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #a0aec0;
        }
        .register-link span {
            color: #d4af37;
            cursor: pointer;
            font-weight: bold;
        }
        .register-link span:hover {
            text-decoration: underline;
        }
        
        /* Registration Form */
        .register-form {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(212,175,55,0.2);
            display: none;
        }
        .register-form.show {
            display: block;
        }
        
        .avatar-upload {
            text-align: center;
            margin-bottom: 20px;
        }
        .avatar-preview {
            width: 100px;
            height: 100px;
            background: rgba(212,175,55,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            cursor: pointer;
            overflow: hidden;
            border: 2px solid #d4af37;
        }
        .avatar-preview i {
            font-size: 45px;
            color: #d4af37;
        }
        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* باقي التصميم كما هو */
        /* Sidebar */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 290px;
            height: 100vh;
            background: #0a1a2f;
            border-left: 1px solid rgba(212,175,55,0.2);
            z-index: 200;
            transition: all 0.4s;
            overflow-y: auto;
        }

        .sidebar-header { padding: 25px 20px; text-align: center; border-bottom: 1px solid rgba(212,175,55,0.2); }
        .logo-area-sidebar { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .company-logo { width: 50px; height: 50px; background: linear-gradient(135deg, #d4af37, #b8960c); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; overflow: hidden; color: #0a1a2f; }
        .company-logo img { width: 100%; height: 100%; object-fit: cover; }
        .logo { font-size: 22px; font-weight: 800; color: #d4af37; }
        .logo span { color: #ffffff; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 14px 24px; margin: 8px 16px; border-radius: 18px; cursor: pointer; transition: all 0.3s; color: #a0aec0; }
        .nav-item:hover { background: rgba(212,175,55,0.15); color: #d4af37; transform: translateX(-5px); }
        .nav-item.active { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; box-shadow: 0 8px 20px rgba(212,175,55,0.3); }
        .nav-item.active i { color: #0a1a2f; }
        .nav-item i { width: 26px; color: #d4af37; }

        .main-content { margin-right: 290px; min-height: 100vh; padding: 0 30px 30px 30px; }
        .top-bar {
            background: rgba(10, 26, 47, 0.95);
            backdrop-filter: blur(15px);
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 99;
            margin-bottom: 25px;
            border-radius: 0 0 30px 30px;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .page-title { font-size: 26px; font-weight: 800; color: #d4af37; }
        .avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            color: #0a1a2f;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #0a1a2f; backdrop-filter: blur(20px); padding: 12px 16px 25px; justify-content: space-around; z-index: 150; border-top: 1px solid rgba(212,175,55,0.2); }
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; color: #94a3b8; cursor: pointer; padding: 8px 12px; border-radius: 30px; }
        .bottom-nav-item i { font-size: 22px; }
        .bottom-nav-item.active { color: #d4af37; background: rgba(212,175,55,0.15); }

        .card { background: rgba(10, 26, 47, 0.9); backdrop-filter: blur(12px); border-radius: 28px; padding: 24px; margin-bottom: 24px; border: 1px solid rgba(212,175,55,0.2); transition: all 0.3s; }
        .card:hover { transform: translateY(-3px); border-color: rgba(212,175,55,0.5); box-shadow: 0 10px 30px rgba(212,175,55,0.1); }

        .quote-card {
            background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(10,26,47,0.9));
            border-radius: 28px;
            padding: 30px;
            margin-bottom: 24px;
            text-align: center;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .quote-text { font-size: 20px; line-height: 1.6; margin-bottom: 15px; font-style: italic; }
        .quote-author { color: #d4af37; font-size: 14px; }
        .greeting { font-size: 24px; font-weight: bold; margin-bottom: 10px; color: #d4af37; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(10, 26, 47, 0.9); border-radius: 28px; padding: 22px; text-align: center; border: 1px solid rgba(212,175,55,0.2); }
        .stat-number { font-size: 38px; font-weight: 800; color: #d4af37; }

        .assistant-container { background: rgba(10, 26, 47, 0.9); border-radius: 28px; overflow: hidden; border: 1px solid rgba(212,175,55,0.2); }
        .chat-messages { height: 350px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .message-bot { background: rgba(212,175,55,0.1); padding: 12px 18px; border-radius: 22px; align-self: flex-start; max-width: 80%; }
        .message-user { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; padding: 12px 18px; border-radius: 22px; align-self: flex-end; max-width: 80%; }
        .chat-input-area { display: flex; padding: 16px; gap: 12px; border-top: 1px solid rgba(212,175,55,0.2); }
        .questions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; padding: 16px; max-height: 280px; overflow-y: auto; }
        .question-btn { background: rgba(212,175,55,0.1); padding: 10px 16px; border-radius: 40px; font-size: 13px; border: 1px solid rgba(212,175,55,0.2); cursor: pointer; display: flex; align-items: center; gap: 10px; color: #e2e8f0; }
        .question-btn:hover { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; }

        .profile-avatar { width: 120px; height: 120px; background: linear-gradient(135deg, #d4af37, #b8960c); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; cursor: pointer; overflow: hidden; color: #0a1a2f; }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-avatar i { font-size: 50px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #d4af37; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 20px;
            color: white;
            font-size: 14px;
        }

        .btn { padding: 12px 24px; border-radius: 40px; cursor: pointer; font-weight: 600; border: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 10px; }
        .btn-primary { background: linear-gradient(135deg, #d4af37, #b8960c); color: #0a1a2f; font-weight: bold; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }

        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: linear-gradient(145deg, #0a1a2f, #061220); border-radius: 40px; padding: 32px; width: 90%; max-width: 500px; border: 1px solid rgba(212,175,55,0.3); }

        .menu-toggle { display: none; background: none; border: none; font-size: 24px; color: white; cursor: pointer; }
        @media (max-width: 992px) {
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; }
            .bottom-nav { display: flex; }
            .menu-toggle { display: block; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div id="appRoot"></div>

<script>
    // ==================== آيات قرآنية متغيرة ====================
    const quranVerses = [
        { text: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ", translation: "بسم الله الرحمن الرحيم", surah: "الفاتحة 1" },
        { text: "وَإِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ ۖ لَّا إِلَٰهَ إِلَّا هُوَ الرَّحْمَٰنُ الرَّحِيمُ", translation: "وإلهكم إله واحد لا إله إلا هو الرحمن الرحيم", surah: "البقرة 163" },
        { text: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ", translation: "الله لا إله إلا هو الحي القيوم", surah: "الكرسي" },
        { text: "إِنَّ اللَّهَ مَعَ الصَّابِرِينَ", translation: "إن الله مع الصابرين", surah: "البقرة 153" },
        { text: "وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ", translation: "وأن ليس للإنسان إلا ما سعى", surah: "النجم 39" },
        { text: "وَقُل رَّبِّ زِدْنِي عِلْمًا", translation: "وقل رب زدني علماً", surah: "طه 114" },
        { text: "إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ", translation: "إن الله يحب المحسنين", surah: "البقرة 195" },
        { text: "وَلَا تَيْأَسُوا مِن رَّوْحِ اللَّهِ", translation: "ولا تيأسوا من روح الله", surah: "يوسف 87" },
        { text: "فَإِنَّ مَعَ الْعُسْرِ يُسْرًا", translation: "فإن مع العسر يسراً", surah: "الشرح 5" },
        { text: "رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي", translation: "رب اشرح لي صدري ويسر لي أمري", surah: "طه 25-26" }
    ];

    function getRandomVerse() {
        return quranVerses[Math.floor(Math.random() * quranVerses.length)];
    }

    // ==================== قاعدة المستخدمين ====================
    let usersDatabase = JSON.parse(localStorage.getItem('hr_users')) || [
        { id: 1, email: "admin@hr.com", password: "admin123", name: "أحمد المدير", role: "admin", avatar: null, phone: "0560798698", jobTitle: "مدير الموارد البشرية", department: "الموارد البشرية", birthDate: "1985-05-15" }

            { id: 2, name: "العمل الجماعي", icon: "fas fa-users", desc: "نتعاون وندعم بعضنا لتحقيق الأهداف" },

            { id: 4, name: "التميز", icon: "fas fa-trophy", desc: "نطمح لأعلى جودة في عملنا" }
        ]
    };

    let policiesList = JSON.parse(localStorage.getItem('hr_policies')) || [
        { id: 1, title: "سياسة الإجازة السنوية", category: "إجازات", content: "21 يوم عمل إجازة سنوية مدفوعة الأجر بعد إتمام 6 أشهر." },
        { id: 2, title: "سياسة سلفة الراتب", category: "مالية", content: "بعد 6 أشهر عمل، بحد أقصى 50% من الراتب، تسدد على 6 دفعات." }

    function getAnswer(question) {
        let found = faqList.find(f => question.includes(f.question.substring(0, 15)));
        return found ? found.answer : "❌ لم يتم العثور على إجابة. الرجاء التواصل مع قسم الموارد البشرية.";
    }

    let chatHistory = [{ sender: "bot", text: "مرحباً! أنا مساعد HR الذكي. كيف يمكنني مساعدتك؟" }];

    function sendMessage() {
        let input = document.getElementById('chatInput');
        if(!input) return;
        let q = input.value.trim();
        if(!q) return;
        chatHistory.push({ sender: "user", text: q });
        chatHistory.push({ sender: "bot", text: getAnswer(q) });
        input.value = '';
        renderChatMessages();
    }

    function quickQuestion(q) {
        chatHistory.push({ sender: "user", text: q });
        chatHistory.push({ sender: "bot", text: getAnswer(q) });
        renderChatMessages();
    }

    function renderChatMessages() {
        let container = document.getElementById('chatMessages');
        if(container) {
            container.innerHTML = chatHistory.map(m => `<div class="message-${m.sender}">${m.text}</div>`).join('');
            container.scrollTo(0, 999999);
        }
    }

    function calculatePerformanceScore(jobTitle) {
        let profile = performanceCriteria[jobTitle];
        if(!profile) return { total: 0, criteria: [] };
        let totalScore = 0;
        let updatedCriteria = profile.criteria.map(c => {
            let score = c.points || (parseFloat(c.current) / parseFloat(c.target)) * c.weight;
            if(isNaN(score)) score = c.weight * 0.75;
            totalScore += score;
            return { ...c, computedScore: Math.round(score * 100) / 100 };
        });
        return { total: Math.round(totalScore), criteria: updatedCriteria };
    }

    function login(email, password, remember) {
        let user = usersDatabase.find(u => u.email === email && u.password === password);
        if(user) {
            currentSession = { userId: user.id, email: user.email, role: user.role };
            sessionStorage.setItem('hr_session', JSON.stringify(currentSession));
            if(remember) {
                localStorage.setItem('hr_remember_me', 'true');
                localStorage.setItem('hr_remember_email', email);
                localStorage.setItem('hr_remember_pass', password);
            } else {
                localStorage.removeItem('hr_remember_me');
                localStorage.removeItem('hr_remember_email');
                localStorage.removeItem('hr_remember_pass');
            }
            renderApp();
            return true;
        }
        return false;
    }

        if(password !== confirmPassword) { alert("كلمة المرور غير متطابقة ❌"); return false; }

            id: Date.now(), name, email, password, role: "employee", avatar, phone, jobTitle: jobTitle || "موظف", department: department || "غير محدد", birthDate: ""
        });
        saveAll();
        return true;
    }

            <input type="file" id="avatarUpload" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
                <div><div class="form-group"><label>الاسم</label><input id="profileName" value="${user?.name || ''}"></div>
                <div class="form-group"><label>البريد</label><input id="profileEmail" value="${user?.email || ''}"></div>
                <div class="form-group"><label>الجوال</label><input id="profilePhone" value="${user?.phone || ''}"></div></div>
                <div><div class="form-group"><label>المسمى الوظيفي</label><select id="profileJobTitle">${allJobs.map(j => `<option ${user?.jobTitle === j.title ? 'selected' : ''}>${j.title}</option>`).join('')}</select></div>
                <div class="form-group"><label>القسم</label><input id="profileDept" value="${user?.department || ''}"></div>
                <div class="form-group"><label>تاريخ الميلاد</label><input type="date" id="profileBirth" value="${user?.birthDate || ''}"></div></div>
            </div>
            <button class="btn btn-primary" onclick="saveProfile()"><i class="fas fa-save"></i> حفظ التغييرات</button>
        </div>`;
    }

    function saveProfile() {
        let user = getCurrentUser();
        user.name = document.getElementById('profileName').value;
        user.email = document.getElementById('profileEmail').value;
        user.phone = document.getElementById('profilePhone').value;
        user.jobTitle = document.getElementById('profileJobTitle').value;
        user.department = document.getElementById('profileDept').value;
        user.birthDate = document.getElementById('profileBirth').value;
        let userIndex = usersDatabase.findIndex(u => u.id === user.id);
        if(userIndex !== -1) usersDatabase[userIndex] = user;
        saveAll();
        alert('✅ تم حفظ البيانات');
        renderApp();
    }

    function uploadAvatar(input) {
        if(input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = function(e) {
                let user = getCurrentUser();
                user.avatar = e.target.result;
                let userIndex = usersDatabase.findIndex(u => u.id === user.id);
                if(userIndex !== -1) usersDatabase[userIndex] = user;
                saveAll();
                renderApp();
                alert('تم تحديث الصورة');
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // ==================== لوحة التحكم ====================
    function renderAdminPanel() {
        let user = getCurrentUser();
        if(user?.role !== 'admin') return '<div class="card">🔒 هذه الصفحة للمدير فقط</div>';
        let allJobs = getAllJobs();
        return `
        <div class="card"><h3><i class="fas fa-crown" style="color:#d4af37;"></i> لوحة تحكم المدير</h3>
        <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px;">
            <button class="btn btn-primary" onclick="showAddJobModal()"><i class="fas fa-plus"></i> إضافة مسمى وظيفي</button>
            <button class="btn btn-primary" onclick="showEditCompanyModal()"><i class="fas fa-building"></i> تعديل بيانات الشركة</button>
            <button class="btn btn-primary" onclick="showAddFaqModal()"><i class="fas fa-plus"></i> إضافة سؤال</button>
            <button class="btn btn-primary" onclick="showAddPolicyModal()"><i class="fas fa-plus"></i> إضافة سياسة</button>
            <button class="btn btn-success" onclick="exportData()"><i class="fas fa-download"></i> تصدير البيانات</button>
            <button class="btn btn-danger" onclick="resetAllData()"><i class="fas fa-trash"></i> إعادة تعيين</button>
        </div></div>
        <div class="admin-section"><h4><i class="fas fa-briefcase"></i> المسميات الوظيفية (${allJobs.length})</h4>
        <div class="jobs-grid">${allJobs.map(job => `<div class="job-card"><i class="${job.icon}"></i><h4>${job.title}</h4><p>${job.department}</p><button class="btn btn-danger" style="margin-top:10px;" onclick="deleteGlobalJob(${job.id})"><i class="fas fa-trash"></i> حذف</button></div>`).join('')}</div></div>`;
    }

    // دوال تحكم بسيطة
    function showModal(title, html, onSave) {
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3 style="color:#d4af37;">${title}</h3>${html}<div style="margin-top:25px;"><button class="btn btn-primary" onclick="saveModal(this)">حفظ</button><button class="btn btn-outline" onclick="this.closest('.modal').remove()">إلغاء</button></div></div>`;
        document.body.appendChild(modal);
        window.saveModal = (btn) => { onSave(); btn.closest('.modal').remove(); };
    }

    window.showAddFaqModal = () => showModal('إضافة سؤال', `<input id="q" placeholder="السؤال" style="width:100%;padding:12px;margin-bottom:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(212,175,55,0.3);border-radius:20px;color:white;"><textarea id="a" rows="3" placeholder="الإجابة" style="width:100%;padding:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(212,175,55,0.3);border-radius:20px;color:white;"></textarea>`, () => { faqList.push({ id: Date.now(), question: document.getElementById('q').value, answer: document.getElementById('a').value }); saveAll(); renderApp(); });
    window.showAddPolicyModal = () => showModal('إضافة سياسة', `<input id="title" placeholder="العنوان" style="width:100%;padding:12px;margin-bottom:10px;"><select id="cat"><option>إجازات</option><option>مالية</option><option>عام</option></select><textarea id="content" rows="3" placeholder="المحتوى"></textarea>`, () => { policiesList.push({ id: Date.now(), title: document.getElementById('title').value, category: document.getElementById('cat').value, content: document.getElementById('content').value }); saveAll(); renderApp(); });
    window.exportData = function() {
        let data = { usersDatabase, companyData, policiesList, behaviorsList, proceduresList, faqList, announcementsList, orgDepts, globalJobsList, performanceCriteria };
        let blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url;
        a.download = `hr_backup_${new Date().toISOString().slice(0,19)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        alert('تم تصدير البيانات');
    };
    window.resetAllData = function() {
        if(confirm('⚠️ إعادة تعيين جميع البيانات؟')) {
            localStorage.clear();
            sessionStorage.clear();
            location.reload();
        }
    };

    // ==================== التطبيق الرئيسي ====================
    let currentPage = "home";

    function renderApp() {
        let user = getCurrentUser();
        let root = document.getElementById('appRoot');
        if(!user) {
            root.innerHTML = renderLoginRegister();
            return;
        }
        root.innerHTML = `
        <div class="app-container">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="logo-area-sidebar">
                        <div class="company-logo" id="companyLogoDisplay">${companyData.logo ? `<img src="${companyData.logo}">` : `<i class="fas fa-crown"></i>`}</div>
                        <div class="logo">${companyData.name.split(' ')[0] || 'HR'}<span>SYSTEM</span></div>
                    </div>
                    <div style="font-size: 11px; opacity: 0.6;">نظام متكامل</div>
                </div>
                <div class="nav-item ${currentPage === 'home' ? 'active' : ''}" data-page="home"><i class="fas fa-home"></i><span>الرئيسية</span></div>
                <div class="nav-item ${currentPage === 'assistant' ? 'active' : ''}" data-page="assistant"><i class="fas fa-robot"></i><span>المساعد الذكي</span></div>
                <div class="nav-item ${currentPage === 'employeeguide' ? 'active' : ''}" data-page="employeeguide"><i class="fas fa-book-open"></i><span>دليل الموظف</span></div>
                <div class="nav-item ${currentPage === 'org' ? 'active' : ''}" data-page="org"><i class="fas fa-project-diagram"></i><span>الهيكل التنظيمي</span></div>
                <div class="nav-item ${currentPage === 'company' ? 'active' : ''}" data-page="company"><i class="fas fa-flag-checkered"></i><span>عن الشركة</span></div>
                <div class="nav-item ${currentPage === 'performance' ? 'active' : ''}" data-page="performance"><i class="fas fa-chart-line"></i><span>تقييم الأداء</span></div>
                <div class="nav-item ${currentPage === 'notifications' ? 'active' : ''}" data-page="notifications"><i class="fas fa-bell"></i><span>الإشعارات</span></div>
                <div class="nav-item ${currentPage === 'profile' ? 'active' : ''}" data-page="profile"><i class="fas fa-user-circle"></i><span>حسابي</span></div>
                ${user.role === 'admin' ? `<div class="nav-item ${currentPage === 'admin' ? 'active' : ''}" data-page="admin"><i class="fas fa-crown"></i><span>لوحة التحكم</span></div>` : ''}
                <div style="margin-top: 30px; padding: 20px;">
                    <div class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>تسجيل الخروج</span></div>
                </div>
            </div>
            <div class="bottom-nav">
                <div class="bottom-nav-item ${currentPage === 'home' ? 'active' : ''}" data-page="home"><i class="fas fa-home"></i><span>الرئيسية</span></div>
                <div class="bottom-nav-item ${currentPage === 'assistant' ? 'active' : ''}" data-page="assistant"><i class="fas fa-robot"></i><span>المساعد</span></div>
                <div class="bottom-nav-item ${currentPage === 'profile' ? 'active' : ''}" data-page="profile"><i class="fas fa-user"></i><span>حسابي</span></div>
                <div class="bottom-nav-item ${currentPage === 'notifications' ? 'active' : ''}" data-page="notifications"><i class="fas fa-bell"></i><span>إشعارات</span></div>
                ${user.role === 'admin' ? `<div class="bottom-nav-item ${currentPage === 'admin' ? 'active' : ''}" data-page="admin"><i class="fas fa-cog"></i><span>تحكم</span></div>` : ''}
            </div>
            <div class="main-content">
                <div class="top-bar">
                    <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                    <div class="page-title" id="pageTitle">${getPageTitle()}</div>
                    <div class="avatar" id="userAvatar">${user?.avatar ? `<img src="${user.avatar}">` : `<i class="fas fa-user"></i>`}</div>
                </div>
                <div class="content-container" id="contentContainer"></div>
            </div>
        </div>`;
        
        renderPageContent();
        attachEvents();
    }

    function getPageTitle() {
        let titles = { home:"الرئيسية", assistant:"المساعد الذكي", employeeguide:"دليل الموظف", org:"الهيكل التنظيمي", company:"عن الشركة", performance:"تقييم الأداء", notifications:"الإشعارات", profile:"حسابي", admin:"لوحة التحكم" };
        return titles[currentPage] || "الرئيسية";
    }

    function renderPageContent() {
        const pages = { home: renderHome, assistant: renderAssistant, employeeguide: renderEmployeeGuide, org: renderOrg, company: renderCompany, performance: renderPerformance, notifications: renderNotifications, profile: renderProfile, admin: renderAdminPanel };
        document.getElementById('contentContainer').innerHTML = (pages[currentPage] || renderHome)();
        if(currentPage === 'assistant') setTimeout(() => { renderChatMessages(); let g = document.getElementById('questionsGrid'); if(g) g.innerHTML = faqList.map(f => `<div class="question-btn" onclick="quickQuestion('${f.question.replace(/'/g, "\\'")}')"><i class="fas fa-question-circle"></i> ${f.question}</div>`).join(''); }, 100);
    }

    function attachEvents() {
        document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(el => {
            if(el.id === 'logoutBtn') return;
            let page = el.dataset.page;
            if(page) el.onclick = () => { currentPage = page; renderApp(); };
        });
        document.getElementById('logoutBtn')?.addEventListener('click', () => { logout(); });
        document.getElementById('menuToggle')?.addEventListener('click', () => document.getElementById('sidebar')?.classList.toggle('open'));
    }

    window.sendMessage = sendMessage;
    window.quickQuestion = quickQuestion;
    window.saveProfile = saveProfile;
    window.uploadAvatar = uploadAvatar;
    window.deleteGlobalJob = deleteGlobalJob;
    window.showAddJobModal = showAddJobModal;
    window.showEditCompanyModal = showEditCompanyModal;

    renderApp();
    saveAll();
</script>
</body>
</html>
