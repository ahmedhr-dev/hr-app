<script>

const SHEET_ID = "1eSNFJPyK8Ak1ZtFuUrf0Zgwjbqrz-EUH";

// API قراءة الشيت
async function getSheet(name){
 let res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/${name}`);
 return await res.json();
}

// ================= HOME =================
function home(){
 app.innerHTML=`
 <div class="header">
 <div>HR System</div>
 <div onclick="profilePage()">👤</div>
 </div>

 <div class="page">
 <div class="card" onclick="faqPage()">💬 سؤال وجواب</div>
 <div class="card" onclick="orgPage()">🏢 الهيكل التنظيمي</div>
 <div class="card" onclick="filesPage()">📂 الملفات</div>
 </div>`;
}

// ================= FAQ =================
async function faqPage(){
 let data = await getSheet("faq");

 let html=`
 <div class="header">
 <div onclick="home()">⬅</div>
 <div>سؤال وجواب</div>
 </div>

 <div class="page">`;

 data.forEach((q,i)=>{
  html+=`
  <div class="card" onclick="toggle(${i})">
    ❓ ${q.question}
    <div id="a${i}" style="display:none;margin-top:10px">
      ${q.answer}
    </div>
  </div>`;
 });

 html+=`</div>`;
 app.innerHTML=html;
}

function toggle(i){
 let el=document.getElementById("a"+i);
 el.style.display = el.style.display=="none"?"block":"none";
}

// ================= FILES =================
async function filesPage(){
 let data = await getSheet("files");

 let html=`
 <div class="header">
 <div onclick="home()">⬅</div>
 <div>الملفات</div>
 </div>

 <div class="page">`;

 data.forEach(f=>{
  html+=`
  <div class="card" onclick="window.open('${f.link}')">
   📄 ${f.name}
  </div>`;
 });

 html+=`</div>`;
 app.innerHTML=html;
}

// ================= ORG =================
async function orgPage(){
 let data = await getSheet("employees");

 let html=`
 <div class="header">
 <div onclick="home()">⬅</div>
 <div>الهيكل التنظيمي</div>
 </div>

 <div class="page">`;

 data.forEach(e=>{
  html+=`
  <div class="card">
   <img src="${e.img}" style="width:40px;border-radius:50%">
   ${e.name} <br>
   ${e.job} <br>
   ${e.dept}
  </div>`;
 });

 html+=`</div>`;
 app.innerHTML=html;
}

</script>
