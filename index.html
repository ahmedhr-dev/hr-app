<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// 🔥 إعداد Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
  authDomain: "hr-app-710f3.firebaseapp.com",
  databaseURL: "https://hr-app-710f3-default-rtdb.firebaseio.com",
  projectId: "hr-app-710f3",
  storageBucket: "hr-app-710f3.firebasestorage.app",
  messagingSenderId: "324936659395",
  appId: "1:324936659395:web:bb5d491b52be3013c00d76"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ================= DATA =================
let appData = {
    users: [{ id: 1, email: "admin@hr.com", password: "admin123", name: "أحمد المدير", role: "admin", jobTitle: "مدير الموارد البشرية" }],
    company: { name: "شركة HR", logo: null },
    jobs: [],
    policies: [],
    behaviors: [],
    procedures: [],
    faq: [],
    announcements: []
};

// ================= FIREBASE =================

// تحميل البيانات مباشر
function loadData() {
    const dbRef = ref(db, "hr-system");
    onValue(dbRef, (snapshot) => {
        if(snapshot.exists()){
            appData = snapshot.val();
            console.log("🔥 تم التحديث من Firebase");
            renderApp();
        }
    });
}

// حفظ البيانات
function saveAll() {
    set(ref(db, "hr-system"), appData);
}

// ================= AUTH =================
let currentUser = null;

function login(email, pass) {
    let u = appData.users.find(u => u.email === email && u.password === pass);
    if(u){
        currentUser = u;
        sessionStorage.setItem('user', JSON.stringify(u));
        renderApp();
        return true;
    }
    return false;
}

function register(name, email, pass) {
    if(appData.users.find(u => u.email === email)) return false;
    appData.users.push({
        id: Date.now(),
        name, email, password: pass,
        role: "employee", jobTitle: "موظف"
    });
    saveAll();
    return true;
}

// ================= UI =================

function renderLogin(){
    return `
    <div style="text-align:center">
        <h2>HR SYSTEM</h2>
        <input id="email" placeholder="email"><br>
        <input id="pass" type="password" placeholder="password"><br>
        <button onclick="doLogin()">Login</button>
    </div>`;
}

window.doLogin = function(){
    let e = document.getElementById("email").value;
    let p = document.getElementById("pass").value;
    if(login(e,p)) alert("تم الدخول ✅");
    else alert("خطأ ❌");
}

function renderHome(){
    return `
    <h2>مرحبا ${currentUser.name}</h2>
    <button onclick="addAnnouncement()">➕ إضافة إعلان</button>
    <div>
        ${appData.announcements.map(a=>`
            <div style="border:1px solid #ccc;margin:10px;padding:10px">
                <b>${a.title}</b><br>${a.content}
            </div>
        `).join("")}
    </div>`;
}

window.addAnnouncement = function(){
    let title = prompt("العنوان");
    let content = prompt("المحتوى");
    appData.announcements.push({
        id: Date.now(),
        title, content
    });
    saveAll();
}

// ================= APP =================

function renderApp(){
    if(!currentUser){
        document.body.innerHTML = renderLogin();
        return;
    }
    document.body.innerHTML = renderHome();
}

// ================= INIT =================
let savedUser = sessionStorage.getItem('user');
if(savedUser) currentUser = JSON.parse(savedUser);

loadData();
renderApp();

</script>
