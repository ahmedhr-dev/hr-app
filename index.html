<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR App</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.header{padding:15px;background:#020617}
.page{padding:15px}
.card{background:#1e293b;padding:15px;margin:10px 0;border-radius:12px}
button{width:100%;padding:10px;margin-top:5px;background:#facc15;border:none;border-radius:10px}
input{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:none}
</style>

</head>

<body>
<div id="app"></div>

<script>

// 🔥 Firebase
firebase.initializeApp({
 apiKey:"AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
 authDomain:"hr-app-710f3.firebaseapp.com",
 databaseURL:"https://hr-app-710f3-default-rtdb.firebaseio.com"
});

const auth=firebase.auth();
const db=firebase.database();

// ================= LOGIN =================
function loginPage(){
 app.innerHTML=`
 <div class="page">
 <h2>تسجيل الدخول</h2>
 <input id="email" placeholder="Email">
 <input id="pass" type="password">
 <button onclick="login()">دخول</button>
 </div>`;
}

function login(){
 auth.signInWithEmailAndPassword(val("email"),val("pass"))
 .catch(e=>alert(e.message));
}

// ================= HOME =================
function home(){
 app.innerHTML=`
 <div class="header">HR App</div>
 <div class="page">

 <div class="card">👥 الموظفين</div>
 <div id="list"></div>

 <button onclick="add()">➕ إضافة موظف</button>

 </div>`;
 loadEmployees();
}

// ================= LOAD =================
function loadEmployees(){
 db.ref("employees").on("value",snap=>{
  let data=snap.val()||{};
  let html="";

  if(Object.keys(data).length==0){
   html="<div class='card'>لا يوجد بيانات</div>";
  }

  Object.keys(data).forEach(id=>{
   let e=data[id];
   html+=`
   <div class="card">
   ${e.name} - ${e.job}
   <button onclick="del('${id}')">حذف</button>
   </div>`;
  });

  document.getElementById("list").innerHTML=html;
 });
}

// ================= ADD =================
function add(){
 let name=prompt("اسم الموظف");
 let job=prompt("وظيفته");

 if(!name)return;

 db.ref("employees/"+Date.now()).set({
  name:name,
  job:job
 });
}

// ================= DELETE =================
function del(id){
 db.ref("employees/"+id).remove();
}

// ================= HELP =================
function val(id){return document.getElementById(id).value}

// ================= AUTH =================
auth.onAuthStateChanged(u=>{
 if(u){home()}else{loginPage()}
});

</script>

</body>
</html>
