<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR System</title>
<style>
body { font-family: Arial; background:#0a1a2f; color:#fff; text-align:center; padding:20px; }
input,button { padding:10px; margin:5px; border-radius:10px; border:none; }
button { background:#d4af37; cursor:pointer; }
.card { background:#111; margin:10px; padding:10px; border-radius:10px; }
</style>
</head>

<body>

<div id="app"></div>

<script type="module">

// 🔥 Firebase
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
  authDomain: "hr-app-710f3.firebaseapp.com",
  databaseURL: "https://hr-app-710f3-default-rtdb.firebaseio.com",
  projectId: "hr-app-710f3",
  storageBucket: "hr-app-710f3.firebasestorage.app",
  messagingSenderId: "324936659395",
  appId: "1:324936659395:web:bb5d491b52be3013c00d76"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ================= DATA =================
let data = {
  users: [
    { email: "admin@hr.com", password: "admin123", name: "Admin", role:"admin" }
  ],
  announcements: []
};

let currentUser = null;

// ================= FIREBASE =================

// تحميل البيانات مباشر
function loadData(){
  onValue(ref(db,"hr-system"), (snap)=>{
    if(snap.exists()){
      data = snap.val();
      renderApp();
    }
  });
}

// حفظ
function saveData(){
  set(ref(db,"hr-system"), data);
}

// ================= AUTH =================

function login(email,pass){
  let u = data.users.find(u=>u.email===email && u.password===pass);
  if(u){
    currentUser = u;
    renderApp();
    return true;
  }
  return false;
}

// ================= UI =================

function renderLogin(){
  return `
  <h2>تسجيل الدخول</h2>
  <input id="email" placeholder="email"><br>
  <input id="pass" type="password" placeholder="password"><br>
  <button onclick="doLogin()">دخول</button>
  `;
}

window.doLogin = function(){
  let e = document.getElementById("email").value;
  let p = document.getElementById("pass").value;
  if(login(e,p)) alert("تم الدخول ✅");
  else alert("خطأ ❌");
}

// ================= HOME =================

function renderHome(){
  return `
  <h2>مرحبا ${currentUser.name}</h2>

  ${currentUser.role==="admin" ? `
  <button onclick="addAnnouncement()">➕ إضافة إعلان</button>
  ` : ""}

  <div>
    ${data.announcements.map(a=>`
      <div class="card">
        <b>${a.title}</b><br>
        ${a.content}
      </div>
    `).join("")}
  </div>
  `;
}

// إضافة إعلان
window.addAnnouncement = function(){
  let title = prompt("العنوان");
  let content = prompt("المحتوى");

  data.announcements.push({
    id: Date.now(),
    title,
    content
  });

  saveData();
}

// ================= APP =================

function renderApp(){
  if(!currentUser){
    document.getElementById("app").innerHTML = renderLogin();
    return;
  }

  document.getElementById("app").innerHTML = renderHome();
}

// ================= START =================

loadData();
renderApp();

</script>

</body>
</html>
