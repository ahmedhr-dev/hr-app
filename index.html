<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white}
.header{display:flex;justify-content:space-between;padding:15px;background:#020617}
.page{padding:15px;padding-bottom:80px}

.card{
 background:#1e293b;
 margin:12px 0;
 padding:15px;
 border-radius:16px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 cursor:pointer;
 transition:.2s;
}
.card:hover{transform:scale(1.02)}

.nav{
 position:fixed;bottom:0;width:100%;
 display:flex;justify-content:space-around;
 background:#020617;padding:10px
}

.nav button{
 background:none;border:none;color:white;font-size:20px
}

img.avatar{
 width:45px;height:45px;border-radius:50%
}
</style>

</head>

<body>
<div id="app"></div>

<script>

// 🔥 Google Sheet ID
const SHEET_ID = "1eSNFJPyK8Ak1ZtFuUrf0Zgwjbqrz-EUH";

// Firebase
firebase.initializeApp({
 apiKey:"AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
 authDomain:"hr-app-710f3.firebaseapp.com"
});

const auth=firebase.auth();
let user;

// ================= API =================
async function getSheet(name){
 let res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/${name}`);
 return await res.json();
}

// ================= LOGIN =================
function loginPage(){
 app.innerHTML=`
 <div class="page">
 <h2>تسجيل الدخول</h2>
 <input id="email" placeholder="Email">
 <input id="pass" type="password" placeholder="Password">
 <button onclick="login()">دخول</button>
 </div>`;
}

function login(){
 auth.signInWithEmailAndPassword(val("email"),val("pass"));
}

// ================= HOME =================
function home(){
 app.innerHTML=`
 <div class="header">
 <div>👋 ${user.email}</div>
 <div onclick="profile()">👤</div>
 </div>

 <div class="page">

 <div class="card" onclick="faqPage()">
   <span>سؤال وجواب</span>
   <i class="fa-solid fa-comments"></i>
 </div>

 <div class="card" onclick="filesPage()">
   <span>الملفات</span>
   <i class="fa-solid fa-folder"></i>
 </div>

 <div class="card" onclick="orgPage()">
   <span>الهيكل التنظيمي</span>
   <i class="fa-solid fa-sitemap"></i>
 </div>

 </div>

 <div class="nav">
 <button onclick="home()">🏠</button>
 <button onclick="profile()">👤</button>
 </div>`;
}

// ================= FAQ =================
async function faqPage(){
 let data = await getSheet("faq");

 let html=`
 <div class="header">
 <div onclick="home()">⬅</div>
 <div>الأسئلة</div>
 </div>

 <div class="page">`;

 data.forEach((q,i)=>{
  html+=`
  <div class="card" onclick="toggle(${i})">
   <div>
    ❓ ${q.question}
    <div id="a${i}" style="display:none;margin-top:10px">
     ${q.answer}
    </div>
   </div>
   <i class="fa-solid fa-chevron-down"></i>
  </div>`;
 });

 html+=`</div>`;
 app.innerHTML=html;
}

function toggle(i){
 let el=document.getElementById("a"+i);
 el.style.display = el.style.display=="none"?"block":"none";
}

// ================= FILES =================
async function filesPage(){
 let data = await getSheet("files");

 let html=`
 <div class="header">
 <div onclick="home()">⬅</div>
 <div>الملفات</div>
 </div>

 <div class="page">`;

 data.forEach(f=>{
  html+=`
  <div class="card" onclick="window.open('${f.link}')">
   <span>${f.name}</span>
   <i class="fa-solid fa-file"></i>
  </div>`;
 });

 html+=`</div>`;
 app.innerHTML=html;
}

// ================= ORG =================
async function orgPage(){
 let data = await getSheet("employees");

 let html=`
 <div class="header">
 <div onclick="home()">⬅</div>
 <div>الهيكل التنظيمي</div>
 </div>

 <div class="page">`;

 data.forEach(e=>{
  html+=`
  <div class="card">
   <div>
    <b>${e.name}</b><br>
    ${e.job}<br>
    ${e.dept}
   </div>
   <img class="avatar" src="${e.img}">
  </div>`;
 });

 html+=`</div>`;
 app.innerHTML=html;
}

// ================= PROFILE =================
function profile(){
 app.innerHTML=`
 <div class="header">
 <div onclick="home()">⬅</div>
 <div>حسابي</div>
 </div>

 <div class="page">
 <div class="card">📧 ${user.email}</div>
 <button onclick="logout()">🚪 تسجيل خروج</button>
 </div>`;
}

// ================= HELP =================
function val(id){return document.getElementById(id).value}
function logout(){auth.signOut()}

// ================= AUTH =================
auth.onAuthStateChanged(u=>{
 if(u){user=u;home()}else{loginPage()}
});

</script>

</body>
</html>
