<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR System</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.header{padding:15px;background:#020617;text-align:center}
.page{padding:15px}
.card{background:#1e293b;padding:15px;margin:10px 0;border-radius:12px}
button{background:#facc15;border:none;padding:10px;border-radius:10px;width:100%;margin-top:10px}
input{padding:10px;width:100%;margin:5px 0;border-radius:10px;border:none}
</style>

</head>

<body>

<div id="app"></div>

<script>

// 🔥 Firebase
firebase.initializeApp({
 apiKey:"AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
 authDomain:"hr-app-710f3.firebaseapp.com",
 databaseURL:"https://hr-app-710f3-default-rtdb.firebaseio.com"
});

const auth = firebase.auth();
const db = firebase.database();

let user=null;
let allFAQ={};

// ================= LOGIN =================
function loginPage(){
 app.innerHTML=`
 <div class="page">
 <h2>تسجيل الدخول</h2>
 <input id="email" placeholder="Email">
 <input id="pass" type="password">
 <button onclick="login()">دخول</button>
 </div>`;
}

function login(){
 auth.signInWithEmailAndPassword(
  document.getElementById("email").value,
  document.getElementById("pass").value
 ).catch(e=>alert(e.message));
}

// ================= MAIN =================
function main(){
 app.innerHTML=`
 <div class="header">HR System - ${user.email}</div>

 <div class="page">

 <div class="card" onclick="goGuide()">📘 دليل الموظف</div>
 <div class="card" onclick="goPolicies()">📄 السياسات</div>
 <div class="card" onclick="goFAQ()">❓ سؤال وجواب</div>
 <div class="card" onclick="goAI()">🤖 مساعد HR</div>

 <button onclick="logout()">🚪 تسجيل خروج</button>

 </div>`;
}

// ================= GUIDE =================
function goGuide(){
 app.innerHTML=`
 <button onclick="main()">⬅ رجوع</button>
 <div id="guide"></div>
 <button onclick="add('guide')">➕ إضافة</button>`;
 load("guide","guide");
}

// ================= POLICIES =================
function goPolicies(){
 app.innerHTML=`
 <button onclick="main()">⬅ رجوع</button>
 <div id="policies"></div>
 <button onclick="add('policies')">➕ إضافة</button>`;
 load("policies","policies");
}

// ================= FAQ =================
function goFAQ(){
 app.innerHTML=`
 <button onclick="main()">⬅ رجوع</button>
 <div id="faq"></div>
 <button onclick="addFAQ()">➕ إضافة سؤال</button>`;
 loadFAQ();
}

// ================= AI =================
function goAI(){
 app.innerHTML=`
 <button onclick="main()">⬅ رجوع</button>
 <input id="q" placeholder="اسأل...">
 <button onclick="ask()">اسأل</button>
 <div id="answer"></div>`;
}

// ================= LOAD =================
function load(path,el){
 db.ref(path).on("value",snap=>{
  let data=snap.val()||{};
  let html="";

  Object.keys(data).forEach(id=>{
   html+=`
   <div class="card">
   ${data[id].text}
   <button onclick="del('${path}','${id}')">🗑</button>
   </div>`;
  });

  document.getElementById(el).innerHTML=html||"لا يوجد";
 });
}

// ================= ADD =================
function add(type){
 let t=prompt("اكتب المحتوى");
 if(!t) return;
 db.ref(type+"/"+Date.now()).set({text:t});
}

// ================= FAQ =================
function loadFAQ(){
 db.ref("faq").on("value",snap=>{
  allFAQ=snap.val()||{};
  let html="";

  Object.keys(allFAQ).forEach(id=>{
   let f=allFAQ[id];
   html+=`
   <div class="card">
   <b>${f.q}</b><br>${f.a}
   <button onclick="del('faq','${id}')">🗑</button>
   </div>`;
  });

  faq.innerHTML=html||"لا يوجد";
 });
}

function addFAQ(){
 let q=prompt("السؤال");
 let a=prompt("الإجابة");
 if(!q||!a) return;
 db.ref("faq/"+Date.now()).set({q:q,a:a});
}

// ================= AI =================
function ask(){
 let q=document.getElementById("q").value.toLowerCase();
 let answer="❗ لم أجد إجابة، تواصل مع HR";

 Object.values(allFAQ).forEach(f=>{
  if(q.includes(f.q.toLowerCase())){
   answer=f.a;
  }
 });

 document.getElementById("answer").innerHTML=
 `<div class="card">${answer}</div>`;
}

// ================= DELETE =================
function del(type,id){
 db.ref(type+"/"+id).remove();
}

// ================= LOGOUT =================
function logout(){
 auth.signOut();
}

// ================= AUTH =================
auth.onAuthStateChanged(u=>{
 if(u){
  user=u;
  main();
 }else{
  loginPage();
 }
});

</script>

</body>
</html>
