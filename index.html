<script type="module">
// =======================
// 🔥 Firebase Import
// =======================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// =======================
// ⚙️ Firebase Config (بتاعك)
// =======================
const firebaseConfig = {
  apiKey: "AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
  authDomain: "hr-app-710f3.firebaseapp.com",
  databaseURL: "https://hr-app-710f3-default-rtdb.firebaseio.com",
  projectId: "hr-app-710f3",
  storageBucket: "hr-app-710f3.firebasestorage.app",
  messagingSenderId: "324936659395",
  appId: "1:324936659395:web:bb5d491b52be3013c00d76"
};

// =======================
// 🚀 Initialize
// =======================
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// =======================
// 🧠 البيانات (Global)
// =======================
let users = [];
let companyData = {};
let jobs = [];
let policies = [];

// =======================
// ☁️ حفظ البيانات
// =======================
window.saveAll = async function () {
  await set(ref(db, "hr-data"), {
    users,
    companyData,
    jobs,
    policies
  });

  console.log("✅ تم الحفظ في Firebase");
};

// =======================
// 🔄 قراءة مباشرة (Realtime)
// =======================
window.startRealtime = function () {
  onValue(ref(db, "hr-data"), (snapshot) => {
    const data = snapshot.val();

    if (!data) {
      console.log("📭 لا توجد بيانات");
      return;
    }

    users = data.users || [];
    companyData = data.companyData || {};
    jobs = data.jobs || [];
    policies = data.policies || [];

    console.log("🔄 تم التحديث من Firebase", data);

    // 👇 مهم جدًا: يحدث الواجهة
    if (window.renderApp) {
      window.renderApp();
    }
  });
};

// =======================
// 🧪 تشغيل
// =======================
startRealtime();

</script>
