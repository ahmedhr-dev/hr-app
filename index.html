<!DOCTYPE html>

<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Pro</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}

/* HEADER */
.header{display:flex;justify-content:space-between;padding:15px;background:#020617}

/* PAGE */
.page{padding:15px;padding-bottom:80px}

/* CARD */
.card{
 background:#1e293b;
 margin:10px 0;
 padding:15px;
 border-radius:12px;
 font-size:18px;
}

/* NAV */
.nav{
 position:fixed;
 bottom:0;
 width:100%;
 display:flex;
 justify-content:space-around;
 background:#020617;
 padding:10px 0;
}

.nav button{
 background:none;
 border:none;
 color:white;
 font-size:18px;
}

/* BUTTON */
button.main{
 width:100%;
 padding:12px;
 border:none;
 border-radius:10px;
 background:#facc15;
 margin-top:10px;
}

/* INPUT */
input{
 width:100%;
 padding:12px;
 margin:6px 0;
 border-radius:10px;
 border:none;
}
</style>

</head>

<body>

<div id="app"></div>

<script>

// 🔥 Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
  authDomain: "hr-app-710f3.firebaseapp.com",
  projectId: "hr-app-710f3",
  appId: "1:324936659395:web:bb5d491b52be3013c00d76"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const app = document.getElementById("app");

let currentUser = null;
let role = "user";

/* LOGIN */
function loginPage(){
 app.innerHTML = `
 <div class="page">
 <h2>تسجيل الدخول</h2>
 <input id="email" placeholder="Email">
 <input id="pass" type="password" placeholder="Password">
 <button class="main" onclick="login()">دخول</button>
 <button class="main" onclick="register()">تسجيل حساب</button>
 </div>`;
}

/* REGISTER */
function register(){
 let email = document.getElementById("email").value;
 let pass = document.getElementById("pass").value;

 auth.createUserWithEmailAndPassword(email, pass)
 .then(()=>alert("تم إنشاء الحساب"))
 .catch(e=>alert(e.message));
}

/* LOGIN */
function login(){
 let email = document.getElementById("email").value;
 let pass = document.getElementById("pass").value;

 auth.signInWithEmailAndPassword(email, pass)
 .catch(e=>alert(e.message));
}

/* HOME */
function homePage(user){
 app.innerHTML = `
 <div class="header">
 <div>👋 ${user.email}</div>
 <div onclick="logout()">🚪</div>
 </div>

 <div class="page">

 <div class="card">
 ${role === "admin" ? "👑 أنت Admin" : "👤 مستخدم"}
 </div>

 <div class="card">📘 دليل الموظف</div>
 <div class="card">📄 السياسات</div>
 <div class="card">❓ الأسئلة الشائعة</div>
 <div class="card">⚙️ الإجراءات</div>

 </div>

 <div class="nav">
 <button onclick="homePage(currentUser)">🏠</button>
 <button onclick="profile()">👤</button>
 ${role === "admin" ? `<button onclick="admin()">👑</button>` : ""}
 </div>
 `;
}

/* PROFILE */
function profile(){
 app.innerHTML = `
 <div class="header">
 <div>👤 الحساب</div>
 <div onclick="logout()">🚪</div>
 </div>

 <div class="page">
 <div class="card">${currentUser.email}</div>
 <div class="card">الصلاحية: ${role}</div>
 </div>

 <div class="nav">
 <button onclick="homePage(currentUser)">🏠</button>
 <button onclick="profile()">👤</button>
 ${role === "admin" ? `<button onclick="admin()">👑</button>` : ""}
 </div>
 `;
}

/* ADMIN */
function admin(){
 app.innerHTML = `
 <div class="header">
 <div>👑 لوحة التحكم</div>
 <div onclick="logout()">🚪</div>
 </div>

 <div class="page">
 <div class="card">📤 رفع ملفات (قريبًا)</div>
 <div class="card">👥 إدارة المستخدمين (قريبًا)</div>
 </div>

 <div class="nav">
 <button onclick="homePage(currentUser)">🏠</button>
 <button onclick="profile()">👤</button>
 <button onclick="admin()">👑</button>
 </div>
 `;
}

/* LOGOUT */
function logout(){
 auth.signOut();
}

/* AUTH */
auth.onAuthStateChanged(user=>{
 if(user){
  currentUser = user;

  // 👑 تحديد الأدمن
  if(user.email === "ahmed.hr@alkuzama.com"){
   role = "admin";
  }else{
   role = "user";
  }

  homePage(user);
 }else{
  loginPage();
 }
});

</script>

</body>
</html>
