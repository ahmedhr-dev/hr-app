<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HR System Pro</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white}
.header{display:flex;justify-content:space-between;padding:15px;background:#020617}
.page{padding:15px}

.tabs{display:flex;gap:5px;margin-bottom:10px}
.tab{flex:1;padding:10px;text-align:center;background:#1e293b;border-radius:10px;cursor:pointer}
.active{background:#facc15;color:black}

.card{background:#1e293b;margin:10px 0;padding:15px;border-radius:12px}
button{width:100%;padding:10px;border:none;border-radius:10px;background:#facc15;margin-top:5px}
input{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:none}

.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#000000aa;display:flex;align-items:center;justify-content:center}
.modal-box{background:#1e293b;padding:20px;border-radius:12px;width:90%}

.stat{background:#111827;padding:10px;border-radius:10px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
</style>

</head>

<body>
<div id="app"></div>

<script>

firebase.initializeApp({
 apiKey:"AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
 authDomain:"hr-app-710f3.firebaseapp.com",
 databaseURL:"https://hr-app-710f3-default-rtdb.firebaseio.com"
});

const auth=firebase.auth();
const db=firebase.database();

let tab="employees";
let showModal=false;
let user;

// ================= LOGIN =================
function loginPage(){
 app.innerHTML=`
 <div class="page">
 <h2>Login</h2>
 <input id="email" placeholder="Email">
 <input id="pass" type="password">
 <button onclick="login()">Login</button>
 </div>`;
}

function login(){
 auth.signInWithEmailAndPassword(val("email"),val("pass"));
}

// ================= MAIN =================
function main(data){

 let employees=data.employees||{};
 let policies=data.policies||{};
 let requests=data.requests||{};

 app.innerHTML=`
 <div class="header">
 <div>HR Dashboard</div>
 <div onclick="logout()">🚪</div>
 </div>

 <div class="page">

 <div class="grid">
  <div class="stat">${Object.keys(employees).length}<br>Employees</div>
  <div class="stat">${Object.keys(requests).length}<br>Requests</div>
 </div>

 <div class="tabs">
  <div class="tab ${tab=="employees"?"active":""}" onclick="setTab('employees')">Employees</div>
  <div class="tab ${tab=="policies"?"active":""}" onclick="setTab('policies')">Policies</div>
  <div class="tab ${tab=="requests"?"active":""}" onclick="setTab('requests')">Requests</div>
 </div>

 ${renderTab(employees,policies,requests)}

 <button onclick="openModal()">➕ Add</button>

 </div>

 ${showModal?modal():""}
 `;
}

// ================= TABS =================
function renderTab(emp,pol,req){

 if(tab=="employees"){
  return Object.keys(emp).map(id=>{
   let e=emp[id];
   return `<div class="card">
   <b>${e.name}</b><br>${e.job}
   <button onclick="del('employees','${id}')">Delete</button>
   </div>`;
  }).join("");
 }

 if(tab=="policies"){
  return Object.keys(pol).map(id=>{
   let p=pol[id];
   return `<div class="card">
   <b>${p.title}</b><br>${p.content}
   </div>`;
  }).join("");
 }

 if(tab=="requests"){
  return Object.keys(req).map(id=>{
   let r=req[id];
   return `<div class="card">
   ${r.type}
   <button onclick="approve('${id}')">Approve</button>
   </div>`;
  }).join("");
 }

}

// ================= MODAL =================
function modal(){
 return `
 <div class="modal">
  <div class="modal-box">

  ${tab=="employees"?`
  <input id="name" placeholder="Name">
  <input id="job" placeholder="Job">
  <button onclick="addEmployee()">Save</button>`:""}

  ${tab=="policies"?`
  <input id="title" placeholder="Title">
  <input id="content" placeholder="Content">
  <button onclick="addPolicy()">Save</button>`:""}

  <button onclick="closeModal()">Close</button>
  </div>
 </div>`;
}

// ================= ACTIONS =================
function addEmployee(){
 let id=Date.now();
 db.ref("employees/"+id).set({
  name:val("name"),
  job:val("job")
 });
 closeModal();
}

function addPolicy(){
 let id=Date.now();
 db.ref("policies/"+id).set({
  title:val("title"),
  content:val("content")
 });
 closeModal();
}

function del(type,id){
 db.ref(type+"/"+id).remove();
}

function approve(id){
 db.ref("requests/"+id+"/status").set("approved");
}

// ================= STATE =================
function setTab(t){tab=t;load()}
function openModal(){showModal=true;load()}
function closeModal(){showModal=false;load()}

// ================= LOAD =================
function load(){
 db.ref("/").on("value",snap=>{
  main(snap.val()||{});
 });
}

// ================= HELP =================
function val(id){return document.getElementById(id).value}
function logout(){auth.signOut()}

// ================= AUTH =================
auth.onAuthStateChanged(u=>{
 if(u){user=u;load()}else{loginPage()}
});

</script>

</body>
</html>
