<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>نظام إدارة الموارد البشرية المتكامل</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Poppins', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(145deg, #0a1a2f, #061220);
            direction: rtl;
            color: #ffffff;
            min-height: 100vh;
        }

        /* ============ شاشة تسجيل الدخول ============ */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(145deg, #0a1a2f, #061220);
        }
        .login-card {
            background: rgba(10, 26, 47, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            color: #d4af37;
        }
        .login-card .form-group {
            margin-bottom: 20px;
        }
        .login-card input {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 30px;
            color: white;
            font-size: 16px;
        }
        .login-card input:focus {
            outline: none;
            border-color: #d4af37;
        }
        .login-card .btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            color: #0a1a2f;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .login-card .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(212,175,55,0.3);
        }
        .demo-users {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            opacity: 0.7;
            color: #a0aec0;
        }

        /* ============ القائمة الجانبية ============ */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 290px;
            height: 100vh;
            background: #0a1a2f;
            border-left: 1px solid rgba(212,175,55,0.2);
            z-index: 200;
            transition: all 0.4s;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .company-logo {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            overflow: hidden;
            color: #0a1a2f;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #d4af37;
        }
        .logo span {
            color: #ffffff;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 24px;
            margin: 8px 16px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s;
            color: #a0aec0;
        }
        .nav-item:hover {
            background: rgba(212,175,55,0.15);
            color: #d4af37;
            transform: translateX(-5px);
        }
        .nav-item.active {
            background: linear-gradient(135deg, #d4af37, #b8960c);
            color: #0a1a2f;
            box-shadow: 0 8px 20px rgba(212,175,55,0.3);
        }
        .nav-item.active i {
            color: #0a1a2f;
        }
        .nav-item i {
            width: 26px;
            color: #d4af37;
        }

        /* ============ المحتوى الرئيسي ============ */
        .main-content {
            margin-right: 290px;
            min-height: 100vh;
            padding: 0 30px 30px 30px;
        }

        .top-bar {
            background: rgba(10, 26, 47, 0.95);
            backdrop-filter: blur(15px);
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 99;
            margin-bottom: 25px;
            border-radius: 0 0 30px 30px;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }

        .page-title {
            font-size: 26px;
            font-weight: 800;
            color: #d4af37;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            color: #0a1a2f;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ============ التنقل السفلي للجوال ============ */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0a1a2f;
            backdrop-filter: blur(20px);
            padding: 12px 16px 25px;
            justify-content: space-around;
            z-index: 150;
            border-top: 1px solid rgba(212,175,55,0.2);
        }
        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #94a3b8;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 30px;
        }
        .bottom-nav-item i {
            font-size: 22px;
        }
        .bottom-nav-item.active {
            color: #d4af37;
            background: rgba(212,175,55,0.15);
        }

        /* ============ البطاقات والعناصر ============ */
        .card {
            background: rgba(10, 26, 47, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(212,175,55,0.2);
            transition: all 0.3s;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(212,175,55,0.5);
        }

        /* بطاقة الاقتباس */
        .quote-card {
            background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(10,26,47,0.9));
            border-radius: 28px;
            padding: 30px;
            margin-bottom: 24px;
            text-align: center;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .quote-text {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 15px;
            font-style: italic;
        }
        .quote-author {
            color: #d4af37;
            font-size: 14px;
        }
        .greeting {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #d4af37;
        }

        /* الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(10, 26, 47, 0.9);
            border-radius: 28px;
            padding: 22px;
            text-align: center;
            border: 1px solid rgba(212,175,55,0.2);
            transition: all 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: #d4af37;
        }
        .stat-number {
            font-size: 38px;
            font-weight: 800;
            color: #d4af37;
        }

        /* المساعد الذكي */
        .assistant-container {
            background: rgba(10, 26, 47, 0.9);
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .chat-messages {
            height: 350px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message-bot {
            background: rgba(212,175,55,0.1);
            padding: 12px 18px;
            border-radius: 22px;
            align-self: flex-start;
            max-width: 80%;
            border-right: 3px solid #d4af37;
        }
        .message-user {
            background: linear-gradient(135deg, #d4af37, #b8960c);
            color: #0a1a2f;
            padding: 12px 18px;
            border-radius: 22px;
            align-self: flex-end;
            max-width: 80%;
        }
        .chat-input-area {
            display: flex;
            padding: 16px;
            gap: 12px;
            border-top: 1px solid rgba(212,175,55,0.2);
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 40px;
            color: white;
        }
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 10px;
            padding: 16px;
            max-height: 280px;
            overflow-y: auto;
        }
        .question-btn {
            background: rgba(212,175,55,0.1);
            padding: 10px 16px;
            border-radius: 40px;
            font-size: 13px;
            border: 1px solid rgba(212,175,55,0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e2e8f0;
        }
        .question-btn:hover {
            background: linear-gradient(135deg, #d4af37, #b8960c);
            color: #0a1a2f;
        }

        /* الصورة الشخصية */
        .profile-avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #d4af37, #b8960c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            cursor: pointer;
            overflow: hidden;
            color: #0a1a2f;
        }
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-avatar i {
            font-size: 50px;
        }

        /* النماذج */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #d4af37;
            font-weight: 500;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 20px;
            color: white;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #d4af37;
        }

        /* الأزرار */
        .btn {
            padding: 12px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            border: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #d4af37, #b8960c);
            color: #0a1a2f;
            font-weight: bold;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(212,175,55,0.3);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(212,175,55,0.5);
            color: #d4af37;
        }

        /* المسميات الوظيفية */
        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .job-card {
            background: rgba(10, 26, 47, 0.9);
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(212,175,55,0.2);
            transition: all 0.3s;
        }
        .job-card:hover {
            transform: translateY(-5px);
            border-color: #d4af37;
        }
        .job-card i {
            font-size: 40px;
            margin-bottom: 12px;
            color: #d4af37;
        }

        /* معايير التقييم */
        .criteria-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .criteria-item {
            background: rgba(10, 26, 47, 0.9);
            border-radius: 20px;
            padding: 18px;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .criteria-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .criteria-name {
            font-size: 16px;
            font-weight: bold;
            color: #d4af37;
        }
        .criteria-weight {
            font-size: 14px;
            color: #a0aec0;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin: 10px 0;
        }
        .progress-fill {
            height: 10px;
            border-radius: 10px;
            background: linear-gradient(90deg, #d4af37, #b8960c);
        }
        .criteria-values {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #a0aec0;
        }

        /* الجداول */
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        th {
            color: #d4af37;
        }

        /* أقسام لوحة التحكم */
        .admin-section {
            margin-bottom: 35px;
            background: rgba(10, 26, 47, 0.7);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .admin-section h4 {
            margin-bottom: 20px;
            color: #d4af37;
            font-size: 18px;
            border-right: 3px solid #d4af37;
            padding-right: 12px;
        }

        /* النوافذ المنبثقة */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: linear-gradient(145deg, #0a1a2f, #061220);
            border-radius: 40px;
            padding: 32px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(212,175,55,0.3);
        }

        .badge {
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            background: rgba(212,175,55,0.2);
            color: #d4af37;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            color: white;
            cursor: pointer;
        }

        /* استجابة للشاشات الصغيرة */
        @media (max-width: 992px) {
            .sidebar {
                transform: translateX(100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-right: 0;
            }
            .bottom-nav {
                display: flex;
            }
            .menu-toggle {
                display: block;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
<div id="appRoot"></div>

<script>
    // ==================== الاقتباسات الإسلامية اليومية ====================
    const islamicQuotes = [
        { text: "وَقُل رَّبِّ زِدْنِي عِلْمًا", author: "سورة طه (114)" },
        { text: "إِنَّ اللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّى يُغَيِّرُوا مَا بِأَنفُسِهِمْ", author: "سورة الرعد (11)" },
        { text: "فَإِنَّ مَعَ الْعُسْرِ يُسْرًا * إِنَّ مَعَ الْعُسْرِ يُسْرًا", author: "سورة الشرح (5-6)" },
        { text: "وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ", author: "سورة النجم (39)" },
        { text: "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَقُولُوا قَوْلًا سَدِيدًا", author: "سورة الأحزاب (70)" },
        { text: "وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ", author: "سورة العصر (3)" },
        { text: "خَيْرُ النَّاسِ أَنْفَعُهُمْ لِلنَّاسِ", author: "الحديث الشريف" },
        { text: "اطْلُبُوا الْعِلْمَ مِنَ الْمَهْدِ إِلَى اللَّحْدِ", author: "الحديث الشريف" },
        { text: "مَنْ جَدَّ وَجَدَ وَمَنْ زَرَعَ حَصَدَ", author: "حكمة عربية" },
        { text: "وَأَحْسِنُوا إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ", author: "سورة البقرة (195)" }
    ];

    function getDailyQuote() {
        const today = new Date();
        const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
        const index = dayOfYear % islamicQuotes.length;
        return islamicQuotes[index];
    }

    // ==================== قاعدة بيانات المستخدمين ====================
    let usersDatabase = JSON.parse(localStorage.getItem('hr_users')) || [
        { id: 1, email: "admin@hr.com", password: "admin123", name: "أحمد المدير", role: "admin", avatar: null, phone: "0560798698", jobTitle: "مدير الموارد البشرية", department: "الموارد البشرية", birthDate: "1985-05-15" },
        { id: 2, email: "employee@hr.com", password: "employee123", name: "محمد الموظف", role: "employee", avatar: null, phone: "0555123456", jobTitle: "محاسب", department: "المالية", birthDate: "1990-03-10" }
    ];

    let currentSession = JSON.parse(sessionStorage.getItem('hr_session')) || null;

    // ==================== بيانات الشركة ====================
    let companyData = JSON.parse(localStorage.getItem('hr_company')) || {
        name: "شركة التميز للاستشارات",
        logo: null,
        vision: "نحن نطمح لأن نكون الشركة الرائدة في مجال الموارد البشرية والتقنية في المنطقة.",
        mission: "تقديم حلول وخدمات متكاملة تخلق قيمة حقيقية لعملائنا وموظفينا.",
        values: [
            { id: 1, name: "النزاهة", icon: "fas fa-handshake", desc: "نلتزم بأعلى المعايير الأخلاقية" },
            { id: 2, name: "العمل الجماعي", icon: "fas fa-users", desc: "نتعاون وندعم بعضنا لتحقيق الأهداف" },
            { id: 3, name: "الابتكار", icon: "fas fa-lightbulb", desc: "نتبنى الإبداع ونسعى لتطوير الحلول" },
            { id: 4, name: "التميز", icon: "fas fa-trophy", desc: "نطمح لأعلى جودة في عملنا" }
        ]
    };

    // ==================== البيانات الأساسية ====================
    let policiesList = JSON.parse(localStorage.getItem('hr_policies')) || [
        { id: 1, title: "سياسة الإجازة السنوية", category: "إجازات", content: "21 يوم عمل إجازة سنوية مدفوعة الأجر بعد إتمام 6 أشهر." },
        { id: 2, title: "سياسة سلفة الراتب", category: "مالية", content: "بعد 6 أشهر عمل، بحد أقصى 50% من الراتب، تسدد على 6 دفعات." },
        { id: 3, title: "سياسة العمل عن بعد", category: "عام", content: "يومان عمل عن بعد أسبوعياً بعد موافقة المدير المباشر." }
    ];

    let behaviorsList = JSON.parse(localStorage.getItem('hr_behaviors')) || [
        { id: 1, emoji: "🤝", title: "الاحترافية", desc: "الحفاظ على سلوك محترم مع جميع الزملاء والعملاء" },
        { id: 2, emoji: "⏰", title: "الالتزام بالمواعيد", desc: "الحضور في الوقت المحدد وإخطار المدير عند التأخر" },
        { id: 3, emoji: "🔒", title: "السرية", desc: "الحفاظ على سرية معلومات الشركة والموظفين" },

    function sendMessage() {
        let input = document.getElementById('chatInput');
        if(!input) return;
        let q = input.value.trim();
        if(!q) return;
        chatHistory.push({ sender: "user", text: q });
        chatHistory.push({ sender: "bot", text: getAnswer(q) });
        input.value = '';
        renderChatMessages();
    }

    function quickQuestion(q) {
        chatHistory.push({ sender: "user", text: q });
        chatHistory.push({ sender: "bot", text: getAnswer(q) });
        renderChatMessages();
    }

    function renderChatMessages() {
        let container = document.getElementById('chatMessages');
        if(container) {
            container.innerHTML = chatHistory.map(m => `<div class="message-${m.sender}">${m.text}</div>`).join('');
            container.scrollTo(0, 999999);
        }
    }

    // ==================== حساب تقييم الأداء ====================
    function calculatePerformanceScore(jobTitle) {
        let profile = performanceCriteria[jobTitle];
        if(!profile) return { total: 0, criteria: [] };
        
        let totalScore = 0;
        let updatedCriteria = profile.criteria.map(c => {
            let score = c.points || (parseFloat(c.current) / parseFloat(c.target)) * c.weight;
            if(isNaN(score)) score = c.weight * 0.75;
            totalScore += score;
            return { ...c, computedScore: Math.round(score * 100) / 100 };
        });
        return { total: Math.round(totalScore), criteria: updatedCriteria };
    }

    function editPerformanceCriteriaModal(jobTitle) {
        let profile = performanceCriteria[jobTitle] || { criteria: [

            { name: "الالتزام", weight: 20, target: "95%", current: "90%" }
        ] };
        
        let criteriaHtml = profile.criteria.map((c, idx) => `
            <div class="criteria-row" style="margin-bottom:15px; padding:15px; background:rgba(212,175,55,0.1); border-radius:16px;">
                <div class="form-group"><label>اسم المعيار</label><input id="cName${idx}" value="${c.name}" style="width:100%;"></div>

                    <div class="form-group" style="flex:1;"><label>الهدف</label><input id="cTarget${idx}" value="${c.target}"></div>
                    <div class="form-group" style="flex:1;"><label>الإنجاز الحالي</label><input id="cCurrent${idx}" value="${c.current}"></div>
                </div>
            </div>
        `).join('');
        
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h3 style="margin-bottom:20px;"><i class="fas fa-chart-line" style="color:#d4af37;"></i> تعديل معايير التقييم - ${jobTitle}</h3>
                <div id="criteriaContainer">${criteriaHtml}</div>
                <div style="display: flex; gap: 12px; margin-top: 20px;">
                    <button class="btn btn-primary" onclick="savePerformanceCriteria('${jobTitle}', this)">حفظ التغييرات</button>
                    <button class="btn btn-outline" onclick="this.closest('.modal').remove()">إلغاء</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        
        window.savePerformanceCriteria = function(title, btn) {
            let container = document.getElementById('criteriaContainer');
            let newCriteria = [];
            for(let i = 0; i < container.children.length; i++) {
                let nameInput = document.getElementById(`cName${i}`);
                let weightInput = document.getElementById(`cWeight${i}`);
                let targetInput = document.getElementById(`cTarget${i}`);
                let currentInput = document.getElementById(`cCurrent${i}`);
                if(nameInput && nameInput.value) {
                    let weight = parseInt(weightInput.value) || 10;
                    let current = currentInput.value;
                    let target = targetInput.value;
                    let points = (parseFloat(current) / parseFloat(target)) * weight;
                    if(isNaN(points)) points = weight * 0.75;
                    newCriteria.push({
                        name: nameInput.value,
                        weight: weight,
                        target: targetInput.value,
                        current: currentInput.value,
                        points: Math.round(points * 100) / 100
                    });
                }
            }
            performanceCriteria[title] = { criteria: newCriteria };
            localStorage.setItem('hr_performance_criteria', JSON.stringify(performanceCriteria));
            btn.closest('.modal').remove();
            renderApp();
            alert('✅ تم تحديث معايير التقييم');
        };
    }

        let ceo = orgDepts.find(d => d.name === "مجلس الإدارة") || orgDepts[0];
        let depts = orgDepts.filter(d => d.name !== "مجلس الإدارة");
        return `<div class="card"><h3><i class="fas fa-project-diagram" style="color:#d4af37;"></i> الهيكل التنظيمي</h3><div class="org-map" style="background:rgba(0,0,0,0.2); border-radius:40px; padding:30px; overflow-x:auto;"><div class="org-tree" style="display:flex; flex-direction:column; align-items:center; min-width:800px;"><div class="org-ceo" style="background:linear-gradient(135deg,#d4af37,#b8960c); border-radius:30px; padding:20px 40px; text-align:center; margin-bottom:40px; position:relative;"><i class="${ceo.icon}" style="font-size:36px;"></i><h3>${ceo.name}</h3><p>${ceo.head}</p><div>${ceo.members} عضو</div></div><div class="org-departments" style="display:flex; justify-content:center; gap:30px; flex-wrap:wrap;">${depts.map(d => `<div class="org-dept" style="background:rgba(10,26,47,0.9); border-radius:24px; padding:18px; min-width:180px; text-align:center; position:relative;"><i class="${d.icon}"></i><h4>${d.name}</h4><p>${d.head}</p><div>${d.members} عضو</div></div>`).join('')}</div></div></div></div>`;
    }

    function renderCompany() {
        let logoHtml = companyData.logo ? `<img src="${companyData.logo}" style="width:80px;height:80px;border-radius:20px;margin-bottom:15px;">` : `<i class="fas fa-building" style="font-size:60px;margin-bottom:15px; color:#d4af37;"></i>`;
        return `<div class="card" style="text-align:center;">${logoHtml}<h2 style="color:#d4af37;">${companyData.name}</h2></div>
        <div class="card"><h3><i class="fas fa-eye" style="color:#d4af37;"></i> رؤيتنا</h3><p>${companyData.vision}</p></div>
        <div class="card"><h3><i class="fas fa-bullseye" style="color:#d4af37;"></i> رسالتنا</h3><p>${companyData.mission}</p></div>
        <div class="card"><h3><i class="fas fa-gem" style="color:#d4af37;"></i> قيمنا</h3><div class="behaviors-grid" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px;">${companyData.values.map(v => `<div class="behavior-card" style="background:rgba(212,175,55,0.1); border-radius:20px; padding:20px; text-align:center;"><i class="${v.icon}" style="font-size:40px; color:#d4af37;"></i><h4>${v.name}</h4><p>${v.desc}</p></div>`).join('')}</div></div>`;
    }

    function renderPerformance() {
        let user = getCurrentUser();
        let allJobs = getAllJobs();
        let job = allJobs.find(j => j.title === user?.jobTitle);
        if(!job) return `<div class="card"><h3>تقييم الأداء</h3><p>الرجاء تحديث المسمى الوظيفي من صفحة حسابي</p></div>`;
        
        let perf = calculatePerformanceScore(job.title);
        let isAdmin = user?.role === 'admin';
        
        return `
        <div class="card"><h3><i class="fas fa-chart-line" style="color:#d4af37;"></i> تقييم الأداء - ${job.title}</h3>
        <div class="stat-number" style="font-size:48px;">${perf.total}%</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${perf.total}%"></div></div>
        </div>
        <div class="card"><h3><i class="fas fa-list-check" style="color:#d4af37;"></i> معايير التقييم (100 نقطة)</h3>
        <div class="criteria-container">
            ${perf.criteria.map(c => `
                <div class="criteria-item">
                    <div class="criteria-header">
                        <span class="criteria-name">${c.name}</span>
                        <span class="criteria-weight">الوزن: ${c.weight} نقطة</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${(c.computedScore / c.weight) * 100}%"></div></div>
                    <div class="criteria-values">
                        <span>🎯 الهدف: ${c.target}</span>
                        <span>📊 الإنجاز: ${c.current}</span>
                        <span>⭐ النقاط: ${c.computedScore}/${c.weight}</span>
                    </div>
                </div>
            `).join('')}
        </div>
        ${isAdmin ? `<div class="card"><button class="btn btn-primary" onclick="editPerformanceCriteriaModal('${job.title}')"><i class="fas fa-edit"></i> تعديل معايير التقييم</button></div>` : ''}
        </div>`;
    }

    function renderNotifications() {
        return `<div class="card"><h3><i class="fas fa-bell" style="color:#d4af37;"></i> الإشعارات</h3>${announcementsList.map(a => `<div class="behavior-card" style="text-align:right; padding:15px; margin-bottom:10px; background:rgba(212,175,55,0.1); border-radius:16px;"><i class="fas fa-bell"></i><h4>${a.title}</h4><p>${a.content}</p><small>📅 ${a.date}</small></div>`).join('')}</div>`;
    }

    function renderProfile() {
        let user = getCurrentUser();
        let allJobs = getAllJobs();
        return `
        <div class="card">
            <h3><i class="fas fa-user-circle" style="color:#d4af37;"></i> حسابي</h3>
            <div class="profile-avatar" onclick="document.getElementById('avatarUpload').click()">
                ${user?.avatar ? `<img src="${user.avatar}">` : `<i class="fas fa-user-circle"></i>`}
            </div>
            <input type="file" id="avatarUpload" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
                <div><div class="form-group"><label>الاسم</label><input id="profileName" value="${user?.name || ''}"></div>
                <div class="form-group"><label>البريد</label><input id="profileEmail" value="${user?.email || ''}"></div>
                <div class="form-group"><label>الجوال</label><input id="profilePhone" value="${user?.phone || ''}"></div></div>
                <div><div class="form-group"><label>المسمى الوظيفي</label><select id="profileJobTitle">${allJobs.map(j => `<option ${user?.jobTitle === j.title ? 'selected' : ''}>${j.title}</option>`).join('')}</select></div>
                <div class="form-group"><label>القسم</label><input id="profileDept" value="${user?.department || ''}"></div>
                <div class="form-group"><label>تاريخ الميلاد</label><input type="date" id="profileBirth" value="${user?.birthDate || ''}"></div></div>
            </div>
            <button class="btn btn-primary" onclick="saveProfile()"><i class="fas fa-save"></i> حفظ التغييرات</button>
        </div>`;
    }

    function saveProfile() {
        let user = getCurrentUser();
        user.name = document.getElementById('profileName').value;
        user.email = document.getElementById('profileEmail').value;
        user.phone = document.getElementById('profilePhone').value;
        user.jobTitle = document.getElementById('profileJobTitle').value;
        user.department = document.getElementById('profileDept').value;
        user.birthDate = document.getElementById('profileBirth').value;
        let userIndex = usersDatabase.findIndex(u => u.id === user.id);
        if(userIndex !== -1) usersDatabase[userIndex] = user;
        saveAll();
        alert('✅ تم حفظ البيانات');
        renderApp();
    }

    function uploadAvatar(input) {
        if(input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = function(e) {
                let user = getCurrentUser();
                user.avatar = e.target.result;
                let userIndex = usersDatabase.findIndex(u => u.id === user.id);
                if(userIndex !== -1) usersDatabase[userIndex] = user;
                saveAll();
                renderApp();
                alert('تم تحديث الصورة');
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // ==================== لوحة التحكم ====================
    function renderAdminPanel() {
        let user = getCurrentUser();
        if(user?.role !== 'admin') return '<div class="card">🔒 هذه الصفحة للمدير فقط</div>';
        let allJobs = getAllJobs();
        
        return `
        <div class="card"><h3><i class="fas fa-crown" style="color:#d4af37;"></i> لوحة تحكم المدير</h3>
        <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px;">
            <button class="btn btn-primary" onclick="showAddJobModal()"><i class="fas fa-plus"></i> إضافة مسمى وظيفي</button>
            <button class="btn btn-primary" onclick="showEditCompanyModal()"><i class="fas fa-building"></i> تعديل بيانات الشركة</button>
            <button class="btn btn-primary" onclick="showAddFaqModal()"><i class="fas fa-plus"></i> إضافة سؤال</button>
            <button class="btn btn-primary" onclick="showAddPolicyModal()"><i class="fas fa-plus"></i> إضافة سياسة</button>
            <button class="btn btn-primary" onclick="showAddBehaviorModal()"><i class="fas fa-plus"></i> إضافة سلوك</button>
            <button class="btn btn-primary" onclick="showAddProcedureModal()"><i class="fas fa-plus"></i> إضافة إجراء</button>
            <button class="btn btn-primary" onclick="showAddDepartmentModal()"><i class="fas fa-plus"></i> إضافة قسم</button>
            <button class="btn btn-success" onclick="exportData()"><i class="fas fa-download"></i> تصدير البيانات</button>
            <button class="btn btn-danger" onclick="resetAllData()"><i class="fas fa-trash"></i> إعادة تعيين</button>
        </div></div>
        
        <div class="admin-section"><h4><i class="fas fa-briefcase"></i> المسميات الوظيفية (${allJobs.length})</h4>
        <div class="jobs-grid">${allJobs.map(job => `
            <div class="job-card">
                <i class="${job.icon}"></i>
                <h4>${job.title}</h4>
                <p>${job.department}</p>
                <span class="badge">${job.level}</span>
                <div style="margin-top:12px;">
                    <button class="btn btn-warning" style="padding:6px 12px;" onclick="editPerformanceCriteriaModal('${job.title}')"><i class="fas fa-chart-line"></i> معايير</button>
                    <button class="btn btn-danger" style="padding:6px 12px;" onclick="deleteGlobalJob(${job.id})"><i class="fas fa-trash"></i> حذف</button>
                </div>
            </div>
        `).join('')}</div></div>
        
        <div class="admin-section"><h4>📋 الأسئلة الشائعة</h4>
        <table><thead><tr><th>السؤال</th><th>الإجابة</th><th>إجراءات</th></tr></thead><tbody>${faqList.map(f => `<tr><td style="max-width:250px;">${f.question}</td><td>${f.answer.substring(0,40)}...</td><td><button class="btn btn-warning" onclick="editFaq(${f.id})">✏️</button> <button class="btn btn-danger" onclick="deleteFaq(${f.id})">🗑️</button></td></tr>`).join('')}</tbody></table></div>
        
        <div class="admin-section"><h4>📜 السياسات</h4>
        <table><thead><tr><th>العنوان</th><th>التصنيف</th><th>إجراءات</th></tr></thead><tbody>${policiesList.map(p => `<tr><td>${p.title}</td><td>${p.category}</td><td><button class="btn btn-warning" onclick="editPolicy(${p.id})">✏️</button> <button class="btn btn-danger" onclick="deletePolicy(${p.id})">🗑️</button></td></tr>`).join('')}</tbody></table></div>`;
    }

    // ==================== دوال التحكم البسيطة ====================
    function showModal(title, html, onSave) {
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3 style="color:#d4af37;">${title}</h3>${html}<div style="margin-top:25px;"><button class="btn btn-primary" onclick="saveModal(this)">حفظ</button><button class="btn btn-outline" onclick="this.closest('.modal').remove()">إلغاء</button></div></div>`;
        document.body.appendChild(modal);
        window.saveModal = (btn) => { onSave(); btn.closest('.modal').remove(); };
    }

    window.showAddFaqModal = () => showModal('إضافة سؤال', `<input id="q" placeholder="السؤال" style="width:100%;padding:12px;margin-bottom:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(212,175,55,0.3);border-radius:20px;color:white;"><textarea id="a" rows="3" placeholder="الإجابة" style="width:100%;padding:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(212,175,55,0.3);border-radius:20px;color:white;"></textarea>`, () => { faqList.push({ id: Date.now(), question: document.getElementById('q').value, answer: document.getElementById('a').value }); saveAll(); renderApp(); });
    window.editFaq = (id) => { let f = faqList.find(f => f.id === id); showModal('تعديل', `<input id="q" value="${f.question}" style="width:100%;padding:12px;margin-bottom:10px;"><textarea id="a" rows="3">${f.answer}</textarea>`, () => { f.question = document.getElementById('q').value; f.answer = document.getElementById('a').value; saveAll(); renderApp(); }); };
    window.deleteFaq = (id) => { if(confirm('حذف؟')) { faqList = faqList.filter(f => f.id !== id); saveAll(); renderApp(); } };
    window.showAddPolicyModal = () => showModal('إضافة سياسة', `<input id="title" placeholder="العنوان"><select id="cat"><option>إجازات</option><option>مالية</option><option>عام</option></select><textarea id="content" rows="3" placeholder="المحتوى"></textarea>`, () => { policiesList.push({ id: Date.now(), title: document.getElementById('title').value, category: document.getElementById('cat').value, content: document.getElementById('content').value }); saveAll(); renderApp(); });
    window.editPolicy = (id) => { let p = policiesList.find(p => p.id === id); showModal('تعديل', `<input id="title" value="${p.title}"><select id="cat">${['إجازات','مالية','عام'].map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select><textarea id="content">${p.content}</textarea>`, () => { p.title = document.getElementById('title').value; p.category = document.getElementById('cat').value; p.content = document.getElementById('content').value; saveAll(); renderApp(); }); };
    window.deletePolicy = (id) => { if(confirm('حذف؟')) { policiesList = policiesList.filter(p => p.id !== id); saveAll(); renderApp(); } };
    window.showAddBehaviorModal = () => showModal('إضافة سلوك', `<input id="title" placeholder="العنوان"><textarea id="desc" rows="2" placeholder="الوصف"></textarea><input id="emoji" placeholder="الإيموجي" value="⭐">`, () => { behaviorsList.push({ id: Date.now(), title: document.getElementById('title').value, desc: document.getElementById('desc').value, emoji: document.getElementById('emoji').value }); saveAll(); renderApp(); });
    window.showAddProcedureModal = () => showModal('إضافة إجراء', `<input id="title" placeholder="العنوان"><textarea id="desc" rows="2" placeholder="الوصف"></textarea>`, () => { proceduresList.push({ id: Date.now(), step: proceduresList.length+1, title: document.getElementById('title').value, desc: document.getElementById('desc').value }); saveAll(); renderApp(); });
    window.showAddDepartmentModal = () => showModal('إضافة قسم', `<input id="name" placeholder="اسم القسم"><input id="head" placeholder="رئيس القسم"><input id="members" type="number" placeholder="عدد الأعضاء">`, () => { orgDepts.push({ id: Date.now(), name: document.getElementById('name').value, head: document.getElementById('head').value, members: parseInt(document.getElementById('members').value), icon: "fas fa-building" }); saveAll(); renderApp(); });

    window.exportData = function() {
        let data = { usersDatabase, companyData, policiesList, behaviorsList, proceduresList, faqList, announcementsList, orgDepts, globalJobsList, performanceCriteria };
        let blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url;
        a.download = `hr_backup_${new Date().toISOString().slice(0,19)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        alert('تم تصدير البيانات');
    };
    window.resetAllData = function() {
        if(confirm('⚠️ إعادة تعيين جميع البيانات؟')) {
            localStorage.clear();
            sessionStorage.clear();
            location.reload();
        }
    };

    // ==================== التطبيق الرئيسي ====================
    let currentPage = "home";

    function renderApp() {
        let user = getCurrentUser();
        let root = document.getElementById('appRoot');
        if(!user) {
            root.innerHTML = renderLogin();
            return;
        }
        root.innerHTML = `
        <div class="app-container">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="logo-area">
                        <div class="company-logo" id="companyLogoDisplay">${companyData.logo ? `<img src="${companyData.logo}">` : `<i class="fas fa-crown"></i>`}</div>
                        <div class="logo">${companyData.name.split(' ')[0] || 'HR'}<span>SYSTEM</span></div>
                    </div>
                    <div style="font-size: 11px; opacity: 0.6;">نظام متكامل</div>
                </div>
                <div class="nav-item ${currentPage === 'home' ? 'active' : ''}" data-page="home"><i class="fas fa-home"></i><span>الرئيسية</span></div>
                <div class="nav-item ${currentPage === 'assistant' ? 'active' : ''}" data-page="assistant"><i class="fas fa-robot"></i><span>المساعد الذكي</span></div>
                <div class="nav-item ${currentPage === 'employeeguide' ? 'active' : ''}" data-page="employeeguide"><i class="fas fa-book-open"></i><span>دليل الموظف</span></div>
                <div class="nav-item ${currentPage === 'org' ? 'active' : ''}" data-page="org"><i class="fas fa-project-diagram"></i><span>الهيكل التنظيمي</span></div>
                <div class="nav-item ${currentPage === 'company' ? 'active' : ''}" data-page="company"><i class="fas fa-flag-checkered"></i><span>عن الشركة</span></div>
                <div class="nav-item ${currentPage === 'performance' ? 'active' : ''}" data-page="performance"><i class="fas fa-chart-line"></i><span>تقييم الأداء</span></div>
                <div class="nav-item ${currentPage === 'notifications' ? 'active' : ''}" data-page="notifications"><i class="fas fa-bell"></i><span>الإشعارات</span></div>
                <div class="nav-item ${currentPage === 'profile' ? 'active' : ''}" data-page="profile"><i class="fas fa-user-circle"></i><span>حسابي</span></div>
                ${user.role === 'admin' ? `<div class="nav-item ${currentPage === 'admin' ? 'active' : ''}" data-page="admin"><i class="fas fa-crown"></i><span>لوحة التحكم</span></div>` : ''}
                <div style="margin-top: 30px; padding: 20px;">
                    <div class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>تسجيل الخروج</span></div>
                </div>
            </div>
            <div class="bottom-nav">
                <div class="bottom-nav-item ${currentPage === 'home' ? 'active' : ''}" data-page="home"><i class="fas fa-home"></i><span>الرئيسية</span></div>
                <div class="bottom-nav-item ${currentPage === 'assistant' ? 'active' : ''}" data-page="assistant"><i class="fas fa-robot"></i><span>المساعد</span></div>
                <div class="bottom-nav-item ${currentPage === 'profile' ? 'active' : ''}" data-page="profile"><i class="fas fa-user"></i><span>حسابي</span></div>
                <div class="bottom-nav-item ${currentPage === 'notifications' ? 'active' : ''}" data-page="notifications"><i class="fas fa-bell"></i><span>إشعارات</span></div>
                ${user.role === 'admin' ? `<div class="bottom-nav-item ${currentPage === 'admin' ? 'active' : ''}" data-page="admin"><i class="fas fa-cog"></i><span>تحكم</span></div>` : ''}
            </div>
            <div class="main-content">
                <div class="top-bar">
                    <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                    <div class="page-title" id="pageTitle">${getPageTitle()}</div>
                    <div class="avatar" id="userAvatar">${user?.avatar ? `<img src="${user.avatar}">` : `<i class="fas fa-user"></i>`}</div>
                </div>
                <div class="content-container" id="contentContainer"></div>
            </div>
        </div>`;
        
        renderPageContent();
        attachEvents();
    }

    function getPageTitle() {
        let titles = { home:"الرئيسية", assistant:"المساعد الذكي", employeeguide:"دليل الموظف", org:"الهيكل التنظيمي", company:"عن الشركة", performance:"تقييم الأداء", notifications:"الإشعارات", profile:"حسابي", admin:"لوحة التحكم" };
        return titles[currentPage] || "الرئيسية";
    }

    function renderPageContent() {
        const pages = { home: renderHome, assistant: renderAssistant, employeeguide: renderEmployeeGuide, org: renderOrg, company: renderCompany, performance: renderPerformance, notifications: renderNotifications, profile: renderProfile, admin: renderAdminPanel };
        document.getElementById('contentContainer').innerHTML = (pages[currentPage] || renderHome)();
        if(currentPage === 'assistant') setTimeout(() => { renderChatMessages(); let g = document.getElementById('questionsGrid'); if(g) g.innerHTML = faqList.map(f => `<div class="question-btn" onclick="quickQuestion('${f.question.replace(/'/g, "\\'")}')"><i class="fas fa-question-circle"></i> ${f.question}</div>`).join(''); }, 100);
    }

    function attachEvents() {
        document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(el => {
            if(el.id === 'logoutBtn') return;
            let page = el.dataset.page;
            if(page) el.onclick = () => { currentPage = page; renderApp(); };
        });
        document.getElementById('logoutBtn')?.addEventListener('click', () => { logout(); });
        document.getElementById('menuToggle')?.addEventListener('click', () => document.getElementById('sidebar')?.classList.toggle('open'));
    }

    window.sendMessage = sendMessage;
    window.quickQuestion = quickQuestion;
    window.saveProfile = saveProfile;
    window.uploadAvatar = uploadAvatar;
    window.deleteGlobalJob = deleteGlobalJob;
    window.showAddJobModal = showAddJobModal;
    window.showEditCompanyModal = showEditCompanyModal;
    window.editPerformanceCriteriaModal = editPerformanceCriteriaModal;

    renderApp();
    saveAll();
</script>
</body>
</html>
