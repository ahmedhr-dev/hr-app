<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HR System</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
.header{display:flex;justify-content:space-between;padding:15px;background:#020617}
.page{padding:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#1e293b;padding:15px;border-radius:12px;margin:5px 0}
button{background:#facc15;border:none;padding:10px;border-radius:10px;width:100%;margin-top:10px}
input{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:none}
.profile{text-align:center}
.profile img{width:80px;height:80px;border-radius:50%}
</style>

</head>

<body>
<div id="app"></div>

<script>

// 🔥 Firebase
firebase.initializeApp({
 apiKey:"AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
 authDomain:"hr-app-710f3.firebaseapp.com",
 databaseURL:"https://hr-app-710f3-default-rtdb.firebaseio.com"
});

const auth=firebase.auth();
const db=firebase.database();

let user=null;
let role="user";
let allFAQ={};

// LOGIN
function loginPage(){
 app.innerHTML=`
 <div class="page">
 <h2>HR System</h2>
 <input id="email" placeholder="Email">
 <input id="pass" type="password">
 <button onclick="login()">دخول</button>
 </div>`;
}

function login(){
 auth.signInWithEmailAndPassword(email.value,pass.value)
 .catch(e=>alert(e.message));
}

// DASHBOARD
function dashboard(){
 app.innerHTML=`
 <div class="header">
 <div>👤 ${user.email}</div>
 <div onclick="logout()">🚪</div>
 </div>

 <div class="page">
 <div class="grid">
  <div class="card" onclick="openPage('profile')">👤 حسابي</div>
  <div class="card" onclick="openPage('faq')">❓ الأسئلة</div>
  <div class="card" onclick="openPage('guide')">📘 دليل</div>
  <div class="card" onclick="openPage('policies')">📄 سياسات</div>
  <div class="card" onclick="openPage('org')">🏢 الهيكل</div>
  <div class="card" onclick="openPage('ai')">🤖 مساعد</div>
 </div>
 </div>`;
}

// NAV
function openPage(p){

if(p==="profile"){
 db.ref("profiles/"+user.uid).once("value").then(s=>{
 let p=s.val()||{};
 app.innerHTML=back("حسابي")+`
 <div class="profile">
 <img src="${p.img||'https://i.pravatar.cc/100'}">
 </div>
 <div class="card">
 الاسم: ${p.name||'---'}<br>
 الوظيفة: ${p.job||'---'}<br>
 البريد: ${user.email}
 </div>
 <button onclick="editProfile()">تعديل</button>`;
 });
}

if(p==="faq"){
 app.innerHTML=back("FAQ")+`
 <div id="faq"></div>
 ${role==="admin"?'<button onclick="addFAQ()">➕</button>':""}
 `;
 loadFAQ();
}

if(p==="guide"){renderList("guide","guide");}
if(p==="policies"){renderList("policies","policies");}

if(p==="org"){
 app.innerHTML=back("الهيكل")+`
 <div id="org"></div>
 ${role==="admin"?'<button onclick="addOrg()">➕</button>':""}
 `;
 loadOrg();
}

if(p==="ai"){
 app.innerHTML=back("المساعد")+`
 <input id="q" placeholder="اسأل">
 <button onclick="ask()">اسأل</button>
 <div id="answer"></div>`;
}

}

// UI
function back(title){
 return `<div class="header">
 <button onclick="dashboard()">⬅</button>
 <div>${title}</div>
 </div><div class="page">`;
}

// PROFILE
function editProfile(){
 let name=prompt("الاسم");
 let job=prompt("الوظيفة");
 let img=prompt("رابط الصورة");
 db.ref("profiles/"+user.uid).set({name,job,img});
}

// LIST
function renderList(path,id){
 app.innerHTML=back(path)+`
 <div id="${id}"></div>
 ${role==="admin"?`<button onclick="add('${path}')">➕</button>`:""}
 `;
 load(path,id);
}

function load(path,el){
 db.ref(path).on("value",snap=>{
 let data=snap.val()||{};
 let html="";
 Object.keys(data).forEach(k=>{
 html+=`
 <div class="card">
 ${data[k].text}
 ${role==="admin"?`<button onclick="del('${path}','${k}')">🗑</button>`:""}
 </div>`;
 });
 document.getElementById(el).innerHTML=html||"لا يوجد";
 });
}

function add(type){
 let t=prompt("اكتب");
 if(!t)return;
 db.ref(type+"/"+Date.now()).set({text:t});
 notify("تم إضافة جديد");
}

// FAQ
function loadFAQ(){
 db.ref("faq").on("value",snap=>{
 allFAQ=snap.val()||{};
 let html="";
 Object.keys(allFAQ).forEach(id=>{
 let f=allFAQ[id];
 html+=`
 <div class="card">
 <b>${f.q}</b><br>${f.a}
 ${role==="admin"?`<button onclick="del('faq','${id}')">🗑</button>`:""}
 </div>`;
 });
 faq.innerHTML=html||"لا يوجد";
 });
}

function addFAQ(){
 let q=prompt("السؤال");
 let a=prompt("الإجابة");
 db.ref("faq/"+Date.now()).set({q,a});
}

// AI
function ask(){
 let q=document.getElementById("q").value.toLowerCase();
 let best="❗ تواصل مع HR";
 Object.values(allFAQ).forEach(f=>{
 if(q.includes(f.q.toLowerCase())) best=f.a;
 });
 answer.innerHTML=`<div class="card">${best}</div>`;
}

// ORG
function loadOrg(){
 db.ref("org").on("value",snap=>{
 let data=snap.val()||{};
 let html="";
 Object.values(data).forEach(o=>{
 html+=`
 <div class="card">
 👤 ${o.name}<br>
 🏢 ${o.dep}<br>
 👔 ${o.manager}
 </div>`;
 });
 org.innerHTML=html||"لا يوجد";
 });
}

function addOrg(){
 let name=prompt("اسم الموظف");
 let dep=prompt("القسم");
 let manager=prompt("المدير");
 db.ref("org/"+Date.now()).set({name,dep,manager});
}

// NOTIFY
function notify(msg){
 db.ref("notifications/"+Date.now()).set({text:msg});
}

// DELETE
function del(type,id){db.ref(type+"/"+id).remove();}

// AUTH
function logout(){auth.signOut();}

function loadRole(uid){
 db.ref("users/"+uid+"/role").once("value")
 .then(s=>{
 role=s.val()||"user";
 dashboard();
 });
}

auth.onAuthStateChanged(u=>{
 if(u){user=u;loadRole(u.uid);}
 else{loginPage();}
});

</script>

</body>
</html>
