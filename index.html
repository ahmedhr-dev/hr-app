<!DOCTYPE html>

<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR App</title>

<style>
body{
 margin:0;
 font-family:Arial;
 background:#0f172a;
 color:white;
}

.header{
 display:flex;
 justify-content:space-between;
 padding:15px;
 background:#020617;
 font-size:18px;
}

.page{
 padding:15px;
 padding-bottom:80px;
}

.card{
 background:#1e293b;
 margin:10px 0;
 padding:15px;
 border-radius:12px;
}

.nav{
 position:fixed;
 bottom:0;
 width:100%;
 display:flex;
 justify-content:space-around;
 background:#020617;
 padding:10px 0;
}

.nav button{
 background:none;
 border:none;
 color:white;
 font-size:18px;
}

button.main{
 width:100%;
 padding:12px;
 border:none;
 border-radius:10px;
 background:#facc15;
 margin-top:10px;
}

input{
 width:100%;
 padding:12px;
 margin:6px 0;
 border-radius:10px;
 border:none;
}
</style>

</head>

<body>

<div id="app"></div>

<script>

const app = document.getElementById("app");

let userName = "";
let role = "user";

/* LOGIN */
function loginPage(){
 app.innerHTML = `
 <div class="page">
 <h2>تسجيل الدخول</h2>
 <input id="name" placeholder="اسمك">
 <button class="main" onclick="login()">دخول</button>
 </div>`;
}

/* LOGIN */
function login(){
 userName = document.getElementById("name").value || "مستخدم";

 if(userName.toLowerCase() === "admin"){
  role = "admin";
 } else {
  role = "user";
 }

 homePage();
}

/* HOME */
function homePage(){
 app.innerHTML = `
 <div class="header">
 <div>👋 ${userName}</div>
 <div onclick="logout()">🚪</div>
 </div>

 <div class="page">
 <div class="card">📘 دليل الموظف</div>
 <div class="card">📄 السياسات</div>
 <div class="card">❓ الأسئلة الشائعة</div>
 <div class="card">⚙️ الإجراءات</div>
 </div>

 <div class="nav">
 <button onclick="homePage()">🏠</button>
 <button onclick="profile()">👤</button>
 ${role === "admin" ? `<button onclick="admin()">👑</button>` : ""}
 </div>
 `;
}

/* PROFILE */
function profile(){
 app.innerHTML = `
 <div class="header">
 <div>👤 الملف الشخصي</div>
 <div onclick="logout()">🚪</div>
 </div>

 <div class="page">
 <div class="card">الاسم: ${userName}</div>
 <div class="card">الصلاحية: ${role}</div>
 </div>

 <div class="nav">
 <button onclick="homePage()">🏠</button>
 <button onclick="profile()">👤</button>
 ${role === "admin" ? `<button onclick="admin()">👑</button>` : ""}
 </div>
 `;
}

/* ADMIN */
function admin(){
 app.innerHTML = `
 <div class="header">
 <div>👑 لوحة التحكم</div>
 <div onclick="logout()">🚪</div>
 </div>

 <div class="page">
 <div class="card">📤 رفع ملفات (قريبًا)</div>
 <div class="card">👥 إدارة المستخدمين</div>
 </div>

 <div class="nav">
 <button onclick="homePage()">🏠</button>
 <button onclick="profile()">👤</button>
 <button onclick="admin()">👑</button>
 </div>
 `;
}

/* LOGOUT */
function logout(){
 loginPage();
}

loginPage();

</script>

</body>
</html>
