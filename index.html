<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HR System PRO</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white}
.header{display:flex;justify-content:space-between;padding:15px;background:#020617}
.page{padding:15px;padding-bottom:80px}
.card{background:#1e293b;margin:10px 0;padding:15px;border-radius:14px;display:flex;justify-content:space-between;align-items:center}
input{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:none}
button{width:100%;padding:10px;margin-top:5px;border:none;border-radius:10px;background:#facc15}
.nav{position:fixed;bottom:0;width:100%;display:flex;justify-content:space-around;background:#020617;padding:10px}
.avatar{width:45px;height:45px;border-radius:50%}
.admin{background:red;color:white;padding:5px;border-radius:6px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:green;padding:10px;border-radius:10px}
</style>

</head>

<body>
<div id="app"></div>

<script>

firebase.initializeApp({
 apiKey:"AIzaSyCU_SbahasitvYtx9lzgimkCyTb7wZ2DIs",
 authDomain:"hr-app-710f3.firebaseapp.com",
 databaseURL:"https://hr-app-710f3-default-rtdb.firebaseio.com"
});

const auth=firebase.auth();
const db=firebase.database();

let user;
let isAdmin=false;

// ================= LOGIN =================
function loginPage(){
 app.innerHTML=`
 <div class="page">
 <h2>تسجيل الدخول</h2>
 <input id="email" placeholder="Email">
 <input id="pass" type="password" placeholder="Password">
 <button onclick="login()">دخول</button>
 </div>`;
}

function login(){
 auth.signInWithEmailAndPassword(val("email"),val("pass"));
}

// ================= HOME =================
function home(){
 app.innerHTML=`
 <div class="header">
 <div>${user.email}</div>
 <div>${isAdmin?'<span class="admin">ADMIN</span>':''}</div>
 </div>

 <div class="page">

 <div class="card" onclick="orgPage()">
 <span>الهيكل التنظيمي</span>
 <i class="fa-solid fa-sitemap"></i>
 </div>

 ${isAdmin?`
 <div class="card" onclick="adminPage()">
 <span>لوحة التحكم</span>
 <i class="fa-solid fa-crown"></i>
 </div>`:''}

 </div>

 <div class="nav">
 <button onclick="home()">🏠</button>
 <button onclick="logout()">🚪</button>
 </div>`;
}

// ================= ORG =================
function orgPage(){
 db.ref("employees").on("value",snap=>{
  let data=snap.val()||{};
  let html=`
  <div class="header">
  <div onclick="home()">⬅</div>
  <div>الهيكل</div>
  </div>
  <div class="page">`;

  Object.keys(data).forEach(id=>{
   let e=data[id];

   html+=`
   <div class="card">
    <div>
     <b>${e.name}</b><br>
     ${e.job}<br>
     مدير: ${e.manager}
    </div>
    <div>
     <img class="avatar" src="${e.img||''}">
     ${isAdmin?`
     <button onclick="edit('${id}')">✏</button>
     <button onclick="removeEmp('${id}')">🗑</button>
     `:''}
    </div>
   </div>`;
  });

  html+=`</div>`;
  app.innerHTML=html;
 });
}

// ================= ADMIN =================
function adminPage(){
 app.innerHTML=`
 <div class="header">
 <div onclick="home()">⬅</div>
 <div>إضافة موظف</div>
 </div>

 <div class="page">
 <input id="name" placeholder="اسم">
 <input id="job" placeholder="وظيفة">
 <input id="manager" placeholder="مدير">
 <input id="img" placeholder="رابط صورة">
 <button onclick="add()">إضافة</button>
 </div>`;
}

function add(){
 let id=Date.now();

 db.ref("employees/"+id).set({
  name:val("name"),
  job:val("job"),
  manager:val("manager"),
  img:val("img")
 });

 notify("تم إضافة موظف");
 home();
}

// ================= EDIT =================
function edit(id){
 let name=prompt("اسم جديد");
 if(!name)return;

 db.ref("employees/"+id).update({
  name:name
 });

 notify("تم التعديل");
}

// ================= DELETE =================
function removeEmp(id){
 if(confirm("حذف؟")){
  db.ref("employees/"+id).remove();
  notify("تم الحذف");
 }
}

// ================= NOTIFY =================
function notify(msg){
 let div=document.createElement("div");
 div.className="toast";
 div.innerText=msg;
 document.body.appendChild(div);

 setTimeout(()=>div.remove(),2000);
}

// ================= HELP =================
function val(id){return document.getElementById(id).value}
function logout(){auth.signOut()}

// ================= AUTH =================
auth.onAuthStateChanged(u=>{
 if(u){
  user=u;

  // 🔥 admin email
  if(u.email=="ahmed.hr@alkuzama.com"){
   isAdmin=true;
  }

  home();
 }else{
  loginPage();
 }
});

</script>

</body>
</html>
